services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: bcm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bcm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bcm"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka-native:3.9.1
    # named volume은 최초 생성 시 root 소유다. 로컬 데이터 초기화와 재사용을 위해 쓰기 권한을 보장한다.
    user: "0:0"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      interval: 3s
      timeout: 5s
      retries: 40
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

volumes:
  postgres-data:
  kafka-data:
