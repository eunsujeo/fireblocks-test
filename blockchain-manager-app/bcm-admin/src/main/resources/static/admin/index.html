<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Blockchain Manager Admin</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <a class="skip-link" href="#app-content">본문으로 건너뛰기</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/admin/dashboard" data-link aria-label="Blockchain Manager Admin 대시보드">
        <span class="brand-mark" aria-hidden="true"></span><span class="brand-name">BCM ADMIN</span>
      </a>
      <form id="global-search" class="global-search" role="search">
        <label class="sr-only" for="global-query">통합 검색</label>
        <input id="global-query" name="q" minlength="2" maxlength="100" placeholder="거래 ID, 네트워크, 심볼 검색" autocomplete="off">
        <button type="submit">검색</button>
      </form>
      <span class="environment">LOCAL · READ ONLY</span>
    </header>
    <nav class="sidebar" aria-label="주 메뉴">
      <p class="nav-label">Operations ledger</p>
      <a class="nav-link" href="/admin/dashboard" data-link data-route="dashboard"><span class="nav-index">01</span><span class="nav-text">대시보드</span></a>
      <a class="nav-link" href="/admin/search?q=tx" data-link data-route="transaction"><span class="nav-index">02</span><span class="nav-text">거래 조사</span></a>
      <a class="nav-link" href="/admin/networks" data-link data-route="networks"><span class="nav-index">03</span><span class="nav-text">네트워크</span></a>
      <a class="nav-link" href="/admin/assets" data-link data-route="assets"><span class="nav-index">04</span><span class="nav-text">자산 매핑</span></a>
      <a class="nav-link" href="/admin/contracts" data-link data-route="contracts"><span class="nav-index">05</span><span class="nav-text">컨트랙트</span></a>
      <a class="nav-link" href="/admin/policies" data-link data-route="policies"><span class="nav-index">06</span><span class="nav-text">실행 정책</span></a>
      <a class="nav-link" href="/admin/band-s" data-link data-route="bandS"><span class="nav-index">07</span><span class="nav-text">밴드S</span></a>
      <a class="nav-link" href="/admin/emergency" data-link data-route="emergency"><span class="nav-index">08</span><span class="nav-text">비상 운영</span></a>
      <a class="nav-link" href="/admin/search?q=BASE" data-link data-route="search"><span class="nav-index">09</span><span class="nav-text">통합 검색</span></a>
      <p class="scope-note">기능 테스트용 조회 콘솔입니다. 상태 변경 API와 벤더 자격은 이 프로세스에 노출하지 않습니다.</p>
    </nav>
    <main id="app-content" tabindex="-1"><div class="content" aria-live="polite"></div></main>
  </div>
  <div id="live-region" class="sr-only" aria-live="polite"></div>
  <script type="module" src="/admin/app.js"></script>
</body>
</html>
