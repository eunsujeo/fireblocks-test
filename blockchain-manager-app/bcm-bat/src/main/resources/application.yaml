spring:
  threads:
    virtual:
      enabled: true

bcm:
  stall-check:
    enabled: false
    fixed-delay-millis: 300000
    automatic-boost-enabled-networks: []
    maximum-boost-attempts: 3
    boost-claim-ttl-seconds: 180
  submission-recovery:
    enabled: false
    fixed-delay-millis: 300000
  tx-reconciliation:
    enabled: false
    fixed-delay-millis: 600000
    initial-lookback-seconds: 600
    stabilization-delay-seconds: 300
    pending-stale-seconds: 600
    pending-max-lookups-per-run: 100
    pending-max-age-seconds: 604800
  raw-transaction-archive:
    enabled: false
    fixed-delay-millis: 86400000
    batch-size: 500
    max-batches-per-run: 20
  network-fee-quote-collection:
    enabled: false
    fixed-delay-millis: 300000
  sweep:
    enabled: false
    fixed-delay-millis: 60000
    reconciliation-batch-size: 50
    security:
      normal-approval-enabled: false
      emergency-revocation-enabled: false
      batch-submission-enabled: false
      tap-approval-policy-verified: false
      tap-revocation-policy-verified: false
      tap-batch-policy-verified: false
      callback-verified: false
      universal-gasless-verified: false
      sweep-contract-verified: false
