openapi: 3.1.0
info:
  title: Wallet API
  version: 0.0.0
tags:
  - name: Accounts
    description: 파트너사의 최종 사용자를 wallet 안에서 대리하는 계정. 삭제 없이 활성·비활성만 전환한다.
  - name: Account Wallets
    description: 계정에 귀속된 토큰별 입금 지갑. 온체인 주소가 여기 붙는다.
  - name: Tokens
    description: 네트워크 위의 자산. 유일성은 (workspace, network, 컨트랙트 주소)에서 성립한다.
  - name: Networks
    description: 블록체인 네트워크 카탈로그. 계열에 따라 주소 체계가 갈린다.
  - name: Deposits
    description: 온체인 관측으로 기록된 유입. 확정되면 기본 동결로 들어간다.
  - name: Sweeps
    description: 동결 유입 건을 지목해 집금 vault로 옮긴다. 해제와 이동이 원자적이다.
  - name: Workspace Vault Transfers
    description: workspace vault 사이의 자산 이동. 동결되지 않은 자산만 움직인다.
  - name: Withdrawals
    description: workspace vault에서 외부 주소로의 출금. 자금 귀속에 따라 표면이 갈린다.
  - name: Address Books
    description: 출금 목적지 등록. 등재 여부는 거절 사유가 아니라 정책 입력이다.
  - name: Travel Rules
    description: 트래블룰 정보 교환. 판단 주체는 wallet이고 상대 VASP에는 단일 boolean만 낸다.
paths:
  /api/v1/accounts:
    post:
      operationId: Accounts_create
      summary: 계정 생성
      description: |-
        referenceId에 매핑되는 계정을 생성한다. 요청 안에서 종결되며 승인을 거치지 않는다.

        referenceId는 같은 고객사(tenant) 안에서 유일하다. 이미 쓰인 값으로 생성하면 거부되며,
        그 경우 아래 referenceId 조회로 기존 계정을 찾는다.

        Errors:
        - 400 ACCOUNT_ALREADY_EXISTS: 같은 tenant에 그 referenceId의 계정이 이미 있음
        - 400 INVALID_REQUEST_BODY: referenceId가 비었거나 허용 길이를 넘음
      parameters: []
      responses:
        '201':
          description: 생성 성공 응답 (201 Created)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponseCreatedResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
    get:
      operationId: Accounts_getByReferenceId
      summary: 계정 referenceId 조회
      description: |-
        referenceId로 계정을 상세 조회한다.
        referenceId 쿼리 파라미터가 있을 때만 이 핸들러로 라우팅된다.
        referenceId는 같은 고객사(tenant) 안에서 유일하므로 단건을 반환한다.
        상태로 걸러내지 않으므로 비활성 계정도 status와 함께 반환한다.

        Errors:
        - 404 ACCOUNT_NOT_FOUND: referenceId로 매칭되는 계정 없음
      parameters:
        - name: referenceId
          in: query
          required: true
          description: 조회 대상 계정의 고객사 발급 참조 ID
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponseResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Accounts
  /api/v1/accounts/{accountId}:
    get:
      operationId: Accounts_get
      summary: 계정 상세 조회
      description: |-
        accountId로 계정을 상세 조회한다.
        상태로 걸러내지 않으므로 비활성 계정도 status와 함께 반환한다.

        Errors:
        - 404 ACCOUNT_NOT_FOUND: accountId로 매칭되는 계정 없음
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponseResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Accounts
  /api/v1/accounts/{accountId}/account-wallets:
    post:
      operationId: AccountWallets_create
      summary: 계정 지갑 생성
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          description: 고객사가 발급하는 멱등 키. 재시도 시 지갑 중복 생성을 방지
          schema:
            type: string
      responses:
        '201':
          description: 생성 성공 응답 (201 Created)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountWalletResponseCreatedResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Account Wallets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountWalletRequest'
    get:
      operationId: AccountWallets_list
      summary: 계정 지갑 목록 조회
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PaginationParams.limit'
        - $ref: '#/components/parameters/PaginationParams.cursor'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountWalletResponseListResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Account Wallets
  /api/v1/accounts/{accountId}/account-wallets/{accountWalletId}:
    get:
      operationId: AccountWallets_get
      summary: 계정 지갑 상세 조회
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: accountWalletId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountWalletResponseResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Account Wallets
  /api/v1/accounts/{accountId}/address-books:
    post:
      operationId: AddressBooks_create
      summary: 주소록 등록 (지갑 소유 증명 nonce 서명 포함)
      description: |-
        발급받은 nonce의 `message`에 대한 지갑 서명을 검증해 등재한다. 등록 자체가 소유 증명
        게이트라 별도 승인 절차가 없다.

        Errors:
        - 400 OWNERSHIP_PROOF_REJECTED: nonce가 없거나 만료·소비됐거나 서명이 대상 주소의 것이 아니다
        - 400 ADDRESS_ALREADY_REGISTERED: 같은 체인 좌표에 이미 등재된 주소다
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: 생성 성공 응답 (201 Created)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressBookResponseCreatedResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Address Books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressBookRequest'
    get:
      operationId: AddressBooks_list
      summary: 주소록 목록 조회
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PaginationParams.limit'
        - $ref: '#/components/parameters/PaginationParams.cursor'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressBookResponseListResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Address Books
  /api/v1/accounts/{accountId}/address-books/nonce:
    post:
      operationId: AddressBooks_createNonce
      summary: 주소록 등록용 지갑 소유 증명 nonce 발급
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: 생성 성공 응답 (201 Created)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressBookNonceResponseCreatedResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Address Books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressBookNonceRequest'
  /api/v1/accounts/{accountId}/address-books/{addressBookId}:
    get:
      operationId: AddressBooks_get
      summary: 주소록 상세 조회
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: addressBookId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressBookResponseResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Address Books
    delete:
      operationId: AddressBooks_delete
      summary: 주소록 삭제
      description: 등재를 회수한다. 행이 지워지는 것이 아니라 상태가 REVOKED가 되고 즉시 정책 판정에 반영된다
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: addressBookId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Address Books
  /api/v1/accounts/{accountId}/deposits:
    get:
      operationId: Deposits_list
      summary: 입금 내역 목록 조회
      description: |-
        `cursor`로 이어 읽는 동안 `status`·`from`·`to`를 바꾸지 않는다. 커서는 정렬 키만 담으므로 조건을 바꾸면
        새 조건에 맞으면서 커서보다 앞에 정렬되는 건이 그 순회에서 빠진다. 조건을 바꾸려면 `cursor` 없이 처음부터 조회한다.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PaginationParams.limit'
        - $ref: '#/components/parameters/PaginationParams.cursor'
        - name: status
          in: query
          required: false
          description: 입금 처리 상태. 미지정 시 모든 상태를 조회한다. 집금 대상은 FROZEN
          schema:
            $ref: '#/components/schemas/DepositStatus'
          explode: false
        - name: from
          in: query
          required: false
          description: 생성 시각 기준 시작 일시 (이 시각 포함)
          schema:
            type: string
            format: date-time
          explode: false
        - name: to
          in: query
          required: false
          description: 생성 시각 기준 종료 일시 (이 시각 포함)
          schema:
            type: string
            format: date-time
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositResponseListResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Deposits
  /api/v1/accounts/{accountId}/deposits/{depositId}:
    get:
      operationId: Deposits_get
      summary: 입금 내역 상세 조회
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: depositId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositResponseResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Deposits
  /api/v1/accounts/{accountId}/status:
    post:
      operationId: Accounts_changeStatus
      summary: 계정 상태 변경
      description: |-
        계정을 활성/비활성으로 전환한다. 요청 안에서 종결되며 승인을 거치지 않는다.

        이미 그 상태면 아무것도 바꾸지 않고 성공으로 종결한다.

        **비활성화는 그 계정의 주소록 등록을 전부 삭제한다.** 되돌릴 수 없다 — 다시 활성화해도
        주소록은 복구되지 않으므로, 최종 사용자가 지갑 소유 증명을 거쳐 다시 등록해야 한다.
        비활성 계정에는 새 지갑도 새 주소록도 만들 수 없다. 이미 만들어진 지갑으로 들어오는 입금은
        계속 기록되지만, 주소록 근거가 사라졌으므로 등록된 발신처로 판정되지 않는다.

        Errors:
        - 404 ACCOUNT_NOT_FOUND: accountId로 매칭되는 계정 없음
        - 400 INVALID_REQUEST_BODY: status가 비었거나 허용 값이 아님
        - 400 INVALID_PATH_VARIABLE: accountId 형식이 올바르지 않음
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponseResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountStatusChangeRequest'
  /api/v1/accounts/{accountId}/withdrawals:
    get:
      operationId: Withdrawals_list
      summary: 출금 내역 목록 조회
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: referenceId
          in: query
          required: false
          description: |-
            고객사가 발급한 참조 ID로 좁힌다. 생성 응답을 받지 못했을 때(타임아웃 등) 출금 id 없이
            상태를 확인하는 복구 경로다 — tenant 안에서 유일하므로 결과는 0건 또는 1건이다.
          schema:
            type: string
          explode: false
        - $ref: '#/components/parameters/PaginationParams.limit'
        - $ref: '#/components/parameters/PaginationParams.cursor'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponseListResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Withdrawals
    post:
      operationId: Withdrawals_create
      summary: 출금 요청
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          description: 고객사가 발급하는 멱등 키. 재시도 시 출금 중복 실행을 방지
          schema:
            type: string
      responses:
        '201':
          description: 생성 성공 응답 (201 Created)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponseCreatedResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Withdrawals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWithdrawalRequest'
  /api/v1/accounts/{accountId}/withdrawals/{withdrawalId}:
    get:
      operationId: Withdrawals_get
      summary: 출금 내역 상세 조회
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: withdrawalId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponseResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Withdrawals
  /api/v1/networks:
    get:
      operationId: Networks_list
      summary: 네트워크 목록 조회
      parameters:
        - $ref: '#/components/parameters/PaginationParams.limit'
        - $ref: '#/components/parameters/PaginationParams.cursor'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkResponseListResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Networks
  /api/v1/networks/{networkId}:
    get:
      operationId: Networks_get
      summary: 네트워크 상세 조회
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkResponseResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Networks
  /api/v1/sweeps:
    post:
      operationId: Sweeps_create
      summary: 스윕 요청 생성
      description: |-
        스윕 대상 입금에서 출발 좌표(vault·토큰·금액)를 유도해 집금 vault로의 이동을 요청한다.
        요청은 depositId와 목적지만 지정한다.

        Errors:
        - 400 INVALID_AMOUNT: 입금 금액이 토큰 decimals 정밀도와 불일치
        - 404 DEPOSIT_NOT_FOUND: depositId로 매칭되는 입금 없음 (타 고객사 소유 포함)
        - 404 TOKEN_NOT_FOUND: 입금 토큰이 카탈로그에 없음
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 고객사가 발급하는 멱등 키. 재시도 시 스윕 중복 실행을 방지
          schema:
            type: string
      responses:
        '201':
          description: 생성 성공 응답 (201 Created)
          content:
            application/json:
              schema:
