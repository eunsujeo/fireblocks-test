  /api/v1/workspace-vault-transfers:
    post:
      operationId: WorkspaceVaultTransfers_create
      summary: 워크스페이스 Vault 이체 요청 생성
      description: |-
        WorkspaceWallet 간 자산 이동을 요청한다.
        출발 vault의 가용 잔액(settled − in-flight)을 서명 이전에 검증해, 부족하면 400으로 즉시 거절한다.
        커스터디 실행 결과로 부족이 확인되면 FAILED (INSUFFICIENT_FUNDS) subStatus로 마킹된다.

        Errors:
        - 400 WORKSPACE_VAULT_INSUFFICIENT_BALANCE: 출발 vault의 가용 잔액이 요청 금액에 미치지 못함 (서명 이전 차단)
        - 400 WORKSPACE_VAULT_TRANSFER_SOURCE_DESTINATION_SAME: 출발과 도착 vault가 같음
        - 400 WORKSPACE_VAULT_TRANSFER_INVALID_AMOUNT: 금액 해석 불가·0 이하·token 정밀도 초과
        - 400 WORKSPACE_VAULT_TRANSFER_REFERENCE_CONFLICT: 같은 고객사가 동일 referenceId로 이미 이체를 생성
        - 400 WORKSPACE_VAULT_TRANSFER_POLICY_DENIED: 정책이 이체를 거부 (행은 FAILED로 남음)
        - 400 WORKSPACE_VAULT_INACTIVE: 비활성 vault
        - 404 TOKEN_NOT_FOUND / WORKSPACE_VAULT_NOT_FOUND: 대상 미존재 — 타 workspace 자원도 같은 응답 (존재 오라클 차단)
        - 404 WORKSPACE_WALLET_NOT_FOUND: 어느 한쪽 vault에 대상 token의 지갑이 없음
        - 503 WORKSPACE_VAULT_TRANSFER_PROVIDER_UNAVAILABLE: 제출 결과 불명 — 행은 PENDING으로 남아 대사가 정리
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 고객사가 발급하는 멱등 키. 재시도 시 이체 중복 실행을 방지
          schema:
            type: string
      responses:
        '201':
          description: 생성 성공 응답 (201 Created)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceVaultTransferResponseCreatedResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Workspace Vault Transfers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceVaultTransferRequest'
    get:
      operationId: WorkspaceVaultTransfers_getByReferenceId
      summary: 워크스페이스 Vault 이체 referenceId 조회
      description: |-
        referenceId로 이체를 상세 조회한다.
        referenceId 쿼리 파라미터가 있을 때만 이 핸들러로 라우팅된다.
      parameters:
        - name: referenceId
          in: query
          required: true
          description: 조회 대상 이체의 고객사 발급 참조 ID
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceVaultTransferResponseResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Workspace Vault Transfers
  /api/v1/workspace-vault-transfers/{workspaceVaultTransferId}:
    get:
      operationId: WorkspaceVaultTransfers_get
      summary: 워크스페이스 Vault 이체 상세 조회
      description: |-
        workspaceVaultTransferId로 이체를 상세 조회한다.

        Errors:
        - 404 WORKSPACE_VAULT_TRANSFER_NOT_FOUND: 미존재 — 타 workspace의 이체도 같은 응답
      parameters:
        - name: workspaceVaultTransferId
          in: path
          required: true
          description: 조회 대상 이체 식별자. TSID prefix wvt-
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceVaultTransferResponseResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Workspace Vault Transfers
security:
  - ApiKeyAuth: []
components:
  parameters:
    PaginationParams.cursor:
      name: cursor
      in: query
      required: false
      description: 다음 페이지 커서 (opaque). 최초 요청 시 생략
      schema:
        type: string
      explode: false
    PaginationParams.limit:
      name: limit
      in: query
      required: false
      description: 한 페이지당 조회 건수. 미지정 시 20, 최대 100
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      explode: false
  schemas:
    AccountResponse:
      type: object
      required:
        - id
        - referenceId
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: 계정 식별자. TSID prefix acc-
          examples:
            - acc-1234567890abcdef
        referenceId:
          type: string
          description: 고객사가 발급한 참조 ID. 개인정보를 담지 않는다 — 고객사 내부 식별자만 허용한다.
        status:
          $ref: '#/components/schemas/AccountStatus'
          description: 활성화 상태. 조회는 상태로 걸러내지 않으므로 비활성 계정도 반환된다.
        createdAt:
          type: string
          format: date-time
          description: 생성 일시
        updatedAt:
          type: string
          format: date-time
          description: 수정 일시
      description: 계정
    AccountResponseCreatedResult:
      type: object
      required:
        - result
      properties:
        result:
          $ref: '#/components/schemas/AccountResponse'
      description: 생성 성공 응답 (201 Created)
    AccountResponseResult:
      type: object
      required:
        - result
      properties:
        result:
          $ref: '#/components/schemas/AccountResponse'
      description: 단일 리소스 응답
    AccountStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
      description: 계정 활성화 상태
    AccountStatusChangeRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/AccountStatus'
    AccountWalletResponse:
      type: object
      required:
        - id
        - accountId
        - tokenId
        - walletAddress
        - balances
        - ens
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: 계정 지갑 식별자. TSID prefix aw-
          examples:
            - aw-1234567890abcdef
        accountId:
          type: string
          description: 계정 식별자. TSID prefix acc-
        tokenId:
          type: string
          description: 토큰 식별자. TSID prefix tok-. 상세 정보는 토큰 목록 조회 API 참조
          examples:
            - tok-1234567890abcdef
        walletAddress:
          type: string
          description: 계정 지갑 주소
        balances:
          type: object
          properties:
            depositAddressBalance:
              type: string
              description: 입금 주소 잔액. 토큰 decimals 적용된 표시값
            depositAddressBalanceRaw:
              type: string
              description: 입금 주소 잔액의 raw 값. 토큰 decimals 미적용
            availableBalance:
              type: string
              description: 사용 가능한 잔액. 토큰 decimals 적용된 표시값
            availableBalanceRaw:
              type: string
              description: 사용 가능한 잔액의 raw 값. 토큰 decimals 미적용
            blockedBalance:
              type: string
              description: 블록된 잔액. 토큰 decimals 적용된 표시값
            blockedBalanceRaw:
              type: string
              description: 블록된 잔액의 raw 값. 토큰 decimals 미적용
          required:
            - depositAddressBalance
            - depositAddressBalanceRaw
            - availableBalance
            - availableBalanceRaw
            - blockedBalance
            - blockedBalanceRaw
          description: 잔액 정보
        ens:
          anyOf:
            - type: object
              properties:
                fullName:
                  type: string
                  description: 소유 계정에 ENS subname 이 발급된 경우 <label>.<domainName> 전체 이름
              required:
                - fullName
            - type: 'null'
          description: ENS 정보. ENS subname 미발급 시 null
        createdAt:
          type: string
          format: date-time
          description: 생성 일시
        updatedAt:
          type: string
          format: date-time
          description: 수정 일시
      description: 계정 지갑
    AccountWalletResponseCreatedResult:
      type: object
      required:
        - result
      properties:
        result:
          $ref: '#/components/schemas/AccountWalletResponse'
      description: 생성 성공 응답 (201 Created)
    AccountWalletResponseListResult:
