      description: 주소록
    AddressBookResponseCreatedResult:
      type: object
      required:
        - result
      properties:
        result:
          $ref: '#/components/schemas/AddressBookResponse'
      description: 생성 성공 응답 (201 Created)
    AddressBookResponseListResult:
      type: object
      required:
        - result
      properties:
        result:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AddressBookResponse'
