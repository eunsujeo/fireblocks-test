        amount:
          type: string
          description: 이체 금액. 토큰 decimals 적용된 표시값
        amountRaw:
          type: string
          description: 이체 금액의 raw 값. 토큰 decimals 미적용
        status:
          $ref: '#/components/schemas/WorkspaceVaultTransferStatus'
          description: 이체 상태
          examples:
            - SCREENING
        subStatus:
          anyOf:
            - $ref: '#/components/schemas/WorkspaceVaultTransferSubStatus'
            - type: 'null'
          description: 이체 세부 상태. status가 PENDING일 때만 null
        txHash:
          anyOf:
            - type: string
            - type: 'null'
          description: 온체인 트랜잭션 해시. 브로드캐스트 전에는 null
        blockNumber:
          anyOf:
            - type: string
            - type: 'null'
          description: 트랜잭션이 포함된 블록 번호. 컨펌 전에는 null
        failureReason:
          anyOf:
            - type: string
            - type: 'null'
          pattern: ^[A-Z][A-Z0-9_]*$
          description: 이체 실패 사유(안정 사유 코드, FAILED 상태가 아니면 null). error.code 카탈로그가 아니라 이동 제출 실패의 별도 어휘다.
        createdAt:
          type: string
          format: date-time
          description: 생성 일시
        updatedAt:
          type: string
          format: date-time
          description: 수정 일시
      description: 워크스페이스 Vault 이체
    WorkspaceVaultTransferResponseCreatedResult:
      type: object
      required:
        - result
      properties:
        result:
          $ref: '#/components/schemas/WorkspaceVaultTransferResponse'
      description: 생성 성공 응답 (201 Created)
    WorkspaceVaultTransferResponseResult:
      type: object
      required:
        - result
      properties:
        result:
          $ref: '#/components/schemas/WorkspaceVaultTransferResponse'
      description: 단일 리소스 응답
    WorkspaceVaultTransferStatus:
      type: string
      enum:
        - PENDING
        - SCREENING
        - ON_CHAIN
        - COMPLETED
        - FAILED
      description: 워크스페이스 Vault 이체 상태
    WorkspaceVaultTransferSubStatus:
      type: string
      enum:
        - AML_CHECK
        - KYT_CHECK
        - BROADCASTING
        - SUBMITTED
        - CONFIRMING
        - COMPLETED
        - REQUEST_REJECTED
        - SCREENING_REJECTED
        - TX_FAILED
        - TX_REVERTED
        - TX_CANCELED
        - INSUFFICIENT_FUNDS
        - TIMEOUT
      description: 워크스페이스 Vault 이체 세부 상태
