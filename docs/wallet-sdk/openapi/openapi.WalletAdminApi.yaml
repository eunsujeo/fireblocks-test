openapi: 3.1.0
info:
  title: Wallet Admin API
  version: 0.0.0
tags:
  - name: Initialize
    description: 최초 어드민 부트스트랩. 한 번만 통과한다.
  - name: Auth
    description: 어드민 인증. 세션과 2FA를 다룬다.
  - name: Users
    description: 어드민 사용자 관리.
  - name: Roles
    description: 어드민 역할과 권한 부여.
  - name: Tenants
    description: 파트너사 단위 스코프. 파트너 대상 API의 격리 키다.
  - name: API Keys
    description: 파트너사 API 키 발급·회수. 스코프가 여기서 정해진다.
  - name: Networks
    description: 블록체인 네트워크 카탈로그. 계열에 따라 주소 체계가 갈린다.
  - name: Tokens
    description: 네트워크 위의 자산. 유일성은 (workspace, network, 컨트랙트 주소)에서 성립한다.
  - name: Workspace Vaults
    description: workspace에 귀속된 vault. 용도는 태그로 고객이 정의한다.
  - name: Approvals
    description: maker-checker 승인. 정족수 obligation의 이행 표면이고, 요청자와 승인자는 같을 수 없다.
  - name: Policies
    description: 정책 엔진 연동 표면.
paths:
  /admin/api/v1/approvals:
    get:
      operationId: Approvals_list
      summary: 승인 진행 내역 목록 조회
      parameters:
        - $ref: '#/components/parameters/PaginationParams.limit'
        - $ref: '#/components/parameters/PaginationParams.cursor'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncResponseListResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Approvals
  /admin/api/v1/approvals/{approvalId}:
    post:
      operationId: Approvals_approve
      summary: 단건 승인
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - approvalId
                  - requesterAdminId
                  - quorum
                  - result
                properties:
                  status:
                    $ref: '#/components/schemas/ApprovalStatus'
                    description: 승인 상태
                  approvalId:
                    anyOf:
                      - type: string
                      - type: 'null'
                    description: 승인 요청 식별자. TSID prefix apr-. 승인 절차 없이 즉시 확정되면 null
                    examples:
                      - apr-1234567890abcdef
                  requesterAdminId:
                    type: string
                    description: 요청을 생성한 어드민 유저 식별자. TSID prefix usr-
                  quorum:
                    anyOf:
                      - $ref: '#/components/schemas/ApprovalQuorum'
                      - type: 'null'
                    description: 정족수 정보. 승인 절차가 없으면 null
                  result:
                    anyOf:
                      - {}
                      - type: 'null'
                    description: 결과. status가 APPROVED가 아니면 null
                description: |-
                  승인 절차가 필요한 요청의 공통 응답.
                  요청은 즉시 실행되지 않고 승인 대기 상태로 생성되며,
                  approvalId로 Approvals API에서 진행 상태 조회와 승인을 처리한다.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Approvals
    get:
      operationId: Approvals_get
      summary: 승인 진행 내역 상세 조회
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - approvalId
                  - requesterAdminId
                  - quorum
                  - result
                properties:
                  status:
                    $ref: '#/components/schemas/ApprovalStatus'
                    description: 승인 상태
                  approvalId:
                    anyOf:
                      - type: string
                      - type: 'null'
                    description: 승인 요청 식별자. TSID prefix apr-. 승인 절차 없이 즉시 확정되면 null
                    examples:
                      - apr-1234567890abcdef
                  requesterAdminId:
                    type: string
                    description: 요청을 생성한 어드민 유저 식별자. TSID prefix usr-
                  quorum:
                    anyOf:
                      - $ref: '#/components/schemas/ApprovalQuorum'
                      - type: 'null'
                    description: 정족수 정보. 승인 절차가 없으면 null
                  result:
                    anyOf:
                      - {}
                      - type: 'null'
                    description: 결과. status가 APPROVED가 아니면 null
                description: |-
                  승인 절차가 필요한 요청의 공통 응답.
                  요청은 즉시 실행되지 않고 승인 대기 상태로 생성되며,
                  approvalId로 Approvals API에서 진행 상태 조회와 승인을 처리한다.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      tags:
        - Approvals
