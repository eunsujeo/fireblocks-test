components:
  parameters:
    PaginationParams.cursor:
      name: cursor
      in: query
      required: false
      description: 다음 페이지 커서 (opaque). 최초 요청 시 생략
      schema:
        type: string
      explode: false
    PaginationParams.limit:
      name: limit
      in: query
      required: false
      description: 한 페이지당 조회 건수. 미지정 시 20, 최대 100
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      explode: false
  schemas:
    ApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              anyOf:
                - type: object
                  unevaluatedProperties: {}
                - type: 'null'
              description: validation 실패 시 field → message 맵 등. 없으면 null
          required:
            - code
            - message
            - details
      description: 공통 에러 응답
    ApiKeyResponse:
      type: object
      required:
        - id
        - tenantId
        - name
        - maskedKey
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: API Key 식별자. TSID prefix ak-
          examples:
            - ak-1234567890abcdef
        tenantId:
          type: string
          description: 소속 테넌트 식별자. TSID prefix tnt-
        name:
          type: string
        maskedKey:
          type: string
          description: 마스킹된 API key
        status:
          $ref: '#/components/schemas/Status'
        createdAt:
          type: string
          format: date-time
          description: 생성 일시
        updatedAt:
          type: string
          format: date-time
          description: 수정 일시
    ApiKeyResponseListResult:
      type: object
      required:
        - result
      properties:
        result:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ApiKeyResponse'
              description: 현재 페이지의 아이템 목록
            cursor:
              anyOf:
                - type: string
                - type: 'null'
              description: 다음 페이지 조회용 cursor. 더 이상 페이지가 없으면 null
          required:
            - items
            - cursor
      description: 목록 응답
    ApiKeyResponseResult:
      type: object
      required:
        - result
      properties:
        result:
          $ref: '#/components/schemas/ApiKeyResponse'
      description: 단일 리소스 응답
    ApiKeyUnmaskedKeyResponse:
      type: object
      required:
        - id
        - key
      properties:
        id:
          type: string
          description: API Key 식별자. TSID prefix ak-
          examples:
            - ak-1234567890abcdef
        key:
          type: string
          description: API key 원문
    ApiKeyUnmaskedKeyResponseResult:
      type: object
      required:
        - result
      properties:
        result:
          $ref: '#/components/schemas/ApiKeyUnmaskedKeyResponse'
      description: 단일 리소스 응답
    ApprovalQuorum:
      type: object
      required:
        - threshold
        - approved
      properties:
        threshold:
          type: integer
          format: int32
          description: 정족 수
        approved:
          type: integer
          format: int32
          description: 승인 수
    ApprovalStatus:
      type: string
      enum:
        - PENDING_APPROVAL
        - APPROVED
        - DENIED
    AsyncResponseListResult:
      type: object
      required:
        - result
      properties:
        result:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                required:
                  - status
                  - approvalId
                  - requesterAdminId
                  - quorum
                  - result
                properties:
                  status:
                    $ref: '#/components/schemas/ApprovalStatus'
                    description: 승인 상태
                  approvalId:
                    anyOf:
                      - type: string
                      - type: 'null'
                    description: 승인 요청 식별자. TSID prefix apr-. 승인 절차 없이 즉시 확정되면 null
                    examples:
                      - apr-1234567890abcdef
                  requesterAdminId:
                    type: string
                    description: 요청을 생성한 어드민 유저 식별자. TSID prefix usr-
                  quorum:
                    anyOf:
                      - $ref: '#/components/schemas/ApprovalQuorum'
                      - type: 'null'
                    description: 정족수 정보. 승인 절차가 없으면 null
                  result:
                    anyOf:
                      - {}
                      - type: 'null'
                    description: 결과. status가 APPROVED가 아니면 null
                description: |-
                  승인 절차가 필요한 요청의 공통 응답.
                  요청은 즉시 실행되지 않고 승인 대기 상태로 생성되며,
                  approvalId로 Approvals API에서 진행 상태 조회와 승인을 처리한다.
              description: 현재 페이지의 아이템 목록
            cursor:
              anyOf:
                - type: string
                - type: 'null'
              description: 다음 페이지 조회용 cursor. 더 이상 페이지가 없으면 null
          required:
            - items
            - cursor
      description: 목록 응답
    Auth2FaRequest:
      type: object
      required:
        - code
        - requestId
      properties:
        code:
          type: string
          description: TOTP code
        requestId:
          type: string
          description: 인증 요청 ID
    Auth2FaResponse:
      type: object
      required:
        - status
        - requestId
      properties:
        status:
          $ref: '#/components/schemas/Auth2FaStatus'
          description: 2FA 챌린지 상태
        requestId:
          type: string
          description: 2FA 인증에 사용할 요청 ID
      description: 2FA 인증이 필요한 요청의 공통 응답. 로그인 등 2FA가 필요한 흐름에서 반환한다.
    Auth2FaResponseResult:
      type: object
      required:
        - result
      properties:
        result:
          $ref: '#/components/schemas/Auth2FaResponse'
      description: 단일 리소스 응답
    Auth2FaStatus:
      type: string
      enum:
        - REQUIRED_2FA
      description: 2FA 챌린지 상태
    CreateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    CreatePolicyRequest:
      type: object
      required:
        - name
        - rules
      properties:
        name:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRule'
          description: 룰 목록 (필드 정의 필요)
    CreateRoleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: 이름
    CreateTenantRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    CreateTokenRequest:
      type: object
      required:
        - networkId
        - symbol
        - name
        - contractAddress
      properties:
        networkId:
          type: string
          description: 네트워크 식별자. TSID prefix net-
        symbol:
          type: string
          description: 토큰 심볼
          examples:
            - USDC
        name:
          type: string
        contractAddress:
          type: string
          description: 토큰 컨트랙트 주소
        iconUrl:
          type: string
          description: 토큰 아이콘 URL
    CreateWorkspaceVaultRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    CreateWorkspaceWalletRequest:
      type: object
      required:
        - tokenId
      properties:
        tokenId:
          type: string
          description: 보관 대상 토큰 식별자. TSID prefix tok-
    ErrorCode:
      type: string
      enum:
        - WORKSPACE_NOT_INITIALIZED
        - TENANT_NOT_FOUND
        - TENANT_APPROVAL_STALE
        - NETWORK_NOT_FOUND
        - NETWORK_UNSUPPORTED
        - NETWORK_PROVIDER_UNAVAILABLE
        - TOKEN_NOT_FOUND
        - TOKEN_APPROVAL_STALE
        - TOKEN_NETWORK_INACTIVE
        - TOKEN_ALREADY_EXISTS
        - TOKEN_INVALID_CONTRACT_ADDRESS
        - TOKEN_UNSUPPORTED
        - TOKEN_PROVIDER_UNAVAILABLE
        - WORKSPACE_VAULT_NOT_FOUND
        - WORKSPACE_VAULT_APPROVAL_STALE
        - WORKSPACE_VAULT_PROVIDER_UNAVAILABLE
        - WORKSPACE_VAULT_INACTIVE
        - WORKSPACE_VAULT_TRANSFER_NOT_FOUND
        - WORKSPACE_VAULT_TRANSFER_SOURCE_DESTINATION_SAME
        - WORKSPACE_VAULT_TRANSFER_INVALID_AMOUNT
        - WORKSPACE_VAULT_TRANSFER_REFERENCE_CONFLICT
        - WORKSPACE_VAULT_TRANSFER_POLICY_DENIED
        - WORKSPACE_VAULT_TRANSFER_PROVIDER_UNAVAILABLE
        - WORKSPACE_VAULT_INSUFFICIENT_BALANCE
        - WORKSPACE_WALLET_NOT_FOUND
        - WORKSPACE_WALLET_ALREADY_EXISTS
        - WORKSPACE_WALLET_VAULT_INACTIVE
        - WORKSPACE_WALLET_TOKEN_INACTIVE
        - WORKSPACE_WALLET_ASSET_UNSUPPORTED
        - WORKSPACE_WALLET_PROVIDER_UNAVAILABLE
        - ACCOUNT_NOT_FOUND
        - ACCOUNT_ADDRESS_BOOK_NOT_FOUND
        - ACCOUNT_ADDRESS_BOOK_ALREADY_EXISTS
        - ACCOUNT_ADDRESS_BOOK_NETWORK_INACTIVE
        - ACCOUNT_ADDRESS_BOOK_ADDRESS_INVALID
        - ACCOUNT_ADDRESS_BOOK_NONCE_INVALID
        - ACCOUNT_ADDRESS_BOOK_NONCE_EXPIRED
        - ACCOUNT_ADDRESS_BOOK_PROOF_INVALID
        - ACCOUNT_WALLET_DEPOSIT_NOT_FOUND
        - ACCOUNT_WALLET_DEPOSIT_NOT_SWEEPABLE
        - SWEEP_NOT_FOUND
        - SWEEP_ALREADY_EXISTS
        - SWEEP_POLICY_DENIED
        - INVALID_CURSOR
        - INVALID_PATH_VARIABLE
        - INVALID_REQUEST_BODY
        - RESOURCE_CONTENTION
        - SERVICE_UNAVAILABLE
        - UNAUTHORIZED
        - INTERNAL_ERROR
      description: |-
        응답 error.code. 단일 출처는 backend `ErrorCode` 카탈로그이며 값 집합은 그와 일치한다.
        코드 추가는 additive지만 tsp enum도 함께 갱신해야 계약이 정합한다.
    InitializeNetwork:
      type: object
      required:
        - id
        - name
        - providerReferenceId
      properties:
        id:
          type: string
          description: 네트워크 식별자. TSID prefix net-
          examples:
            - net-1234567890abcdef
        name:
          type: string
        providerReferenceId:
          type: string
          description: 외부 provider가 부여한 네트워크 식별자 (provider-중립 명칭)
    InitializeRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    InitializeResponse:
      type: object
      required:
        - id
        - name
        - status
        - networks
        - created
      properties:
        id:
          type: string
          description: 워크스페이스 식별자. TSID prefix ws-
          examples:
            - ws-1234567890abcdef
        name:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        networks:
          type: array
