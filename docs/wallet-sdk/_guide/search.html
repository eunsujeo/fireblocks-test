유가 같은 자리다: 그쪽 포인터는 이름으로 서고 이쪽은 workspaceId 로 서므로, 한 경로에\n담으면 경로 변수의 의미가 표면 안에서 갈린다.\n\n활성 번들이 없으면 404 다. 빈 봉투를 200 으로 주면 \"기준선이 없다\" 와 \"기준선을 못\n읽었다\" 가 같은 자리에 섞인다 — 편집기 base 조회(draft.tsp)가 부재를 200 에 싣는 것과\n갈리는 지점이고, 근거도 그쪽 doc 이 적은 것과 같다.\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 PUBLICATION_FORBIDDEN: 워크스페이스 발행 권한이 없다 (platform 부여도 여기서 끝난다)\n- 404 WORKSPACE_BUNDLE_ACTIVE_ABSENT: 이 워크스페이스에 활성 번들이 없다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-workspace-bundle-active-view-view\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--workspace-bundle--policy-workspace-bundle-active-view-view.html", "reference": true}, {"title": "워크스페이스 번들 발행", "text": "---\nsearch:\n  tags:\n    - Workspace Bundle\n    - POST\nseo:\n  description: >-\n    워크스페이스 번들 발행(스테이징 + 검증).… Reference for the POST\n    /workspace-bundles/publications endpoint in the Wallet Policy Engine\n    Internal API API.\nsidebar:\n  label: 워크스페이스 번들 발행\n  badge: POST\ntitle: 워크스페이스 번들 발행\ntype: openapi-operation\n---\n워크스페이스 번들 발행(스테이징 + 검증). **활성화하지 않는다** — 응답의\n`bundleVersion`·`digest` 를 들고 활성화를 따로 부른다.\n\n인증: 어드민 세션. 인가: 발행 권한 role 의 `workspace:{workspaceId}` 부여이고, 그\n판정 축은 `approvalRef` 가 가리키는 승인 레코드의 스코프다.\n\n관문 순서는 승인 대조 → 도메인 축 확정 → 스냅샷 산출 → 컴파일 검사 → 승인 payload\n결속 → 구획 산출 → 채번이고, **위반은 전부 발행 이전에 접힌다.** 컴파일 검사를 승인\n결속보다 앞에 두는 것이 의도다 — 위반한 스냅샷은 승인이 무엇이든 발행되지 않아야 하고,\n실패 사유가 \"승인 불일치\" 로 바뀌면 저작자가 원인을 잘못 읽는다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 없거나 필수 필드가 비었거나 approvalRef 가 레코드 형태가 아니다\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 PUBLICATION_FORBIDDEN: 그 승인 스코프의 발행 권한이 없다\n- 404 PUBLICATION_APPROVAL_UNKNOWN: 발행 승인 레코드가 없다 (자격 밖 참조 포함)\n- 404 DRAFT_REVISION_UNKNOWN: 그런 revision 이 없다\n- 409 PUBLICATION_QUORUM_NOT_MET: 정족수가 채워지지 않았다\n- 409 PUBLICATION_PAYLOAD_NOT_APPROVED: 승인된 대상과 다르다 (platform 스코프 승인 포함)\n- 409 PUBLICATION_APPROVAL_ALREADY_USED: 이미 다른 다이제스트의 번들에 묶인 승인이다\n- 409 DRAFT_DISCARDED: 폐기된 draft 다\n- 422 DRAFT_REVISION_NOT_VALIDATED: 검증을 통과한 revision 이 아니다\n- 422 PUBLICATION_COMPILE_CHECK_FAILED: 스냅샷이 컴파일 검사를 통과하지 못했다\n- 422 WORKSPACE_BUNDLE_INVALID: 산출된 구획이 선언과 어긋난다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-workspace-bundle-publication-publish\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--workspace-bundle--policy-workspace-bundle-publication-publish.html", "reference": true}, {"title": "워크스페이스 매니저 지명", "text": "---\nsearch:\n  tags:\n    - Workspace Registration\n    - POST\nseo:\n  description: >-\n    매니저를 하나 더 지명하고 그 사람의… Reference for the POST\n    /platform/workspaces/{workspaceId}/managers endpoint in the Wallet Policy\n    Engine Internal API API.\nsidebar:\n  label: 워크스페이스 매니저 지명\n  badge: POST\ntitle: 워크스페이스 매니저 지명\ntype: openapi-operation\n---\n매니저를 하나 더 지명하고 그 사람의 1회용 등록 토큰을 낸다.\n\n등록 행 조회가 이 오퍼레이션의 유일한 관문이다 — 회수·재발급은 부여 조회에서 막히지만\n지명에는 대조할 부여가 아직 없다. 없으면 platform 매니저가 임의의 좌표에 소속과 부여를\n세우고, 그 계정은 사람을 더 들일 수 있으면서 그 좌표에는 시드가 없어 평가가 전부 거부다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 없거나 필수 필드가 비었거나 상한을 넘었다\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 401 WORKSPACE_CHALLENGE_INVALID: 건별 2FA 스텝업에 실패했다\n- 403 WORKSPACE_ADMIN_FORBIDDEN: 초대 권한의 platform 부여가 없다 (대상 계정의 소속 불변식 위반 포함)\n- 404 WORKSPACE_TARGET_UNKNOWN: 등록되지 않은 좌표다\n- 409 ADMIN_LOGIN_ID_TAKEN: 등록을 마친 계정이 그 loginId 를 쓴다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-workspace-managers-assign\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--workspace-registration--policy-workspace-managers-assign.html", "reference": true}, {"title": "워크스페이스 매니저 등록 토큰 재발급", "text": "---\nsearch:\n  tags:\n    - Workspace Registration\n    - POST\nseo:\n  description: >-\n    매니… Reference for the POST\n    /platform/workspaces/{workspaceId}/managers/{adminUserId}/enrollment-tokens\n    endpoint in the Wallet Policy Engine Internal API API.\nsidebar:\n  label: 워크스페이스 매니저 등록 토큰 재발급\n  badge: POST\ntitle: 워크스페이스 매니저 등록 토큰 재발급\ntype: openapi-operation\n---\n매니저의 등록 토큰을 다시 낸다. 이전 토큰은 통하지 않는다 — 만료된 토큰 하나가 그 계정을\n굳히지 않게 하는 자리다.\n\n**이미 2팩터를 등록한 계정이면 거부한다**(409). 허용하면 활동 중인 매니저의 자격을\n초기화해 그 사람 행세를 할 수 있다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 없거나 challengeId·challengeResponse 가 비었다\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 401 WORKSPACE_CHALLENGE_INVALID: 건별 2FA 스텝업에 실패했다\n- 403 WORKSPACE_ADMIN_FORBIDDEN: 초대 권한의 platform 부여가 없다 (대상 계정의 소속 불변식 위반 포함)\n- 404 WORKSPACE_TARGET_UNKNOWN: 그 워크스페이스의 매니저가 아니다\n- 409 ADMIN_LOGIN_ID_TAKEN: 그 계정이 이미 2팩터 등록까지 마쳤다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-workspace-managers-reissue-enrollment-token\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--workspace-registration--policy-workspace-managers-reissue-enrollment-token.html", "reference": true}, {"title": "워크스페이스 매니저 회수", "text": "---\nsearch:\n  tags:\n    - Workspace Registration\n    - POST\nseo:\n  description: >-\n    매니저 부여를… Reference for the POST\n    /platform/workspaces/{workspaceId}/managers/{adminUserId}/revoke endpoint in\n    the Wallet Policy Engine Internal API API.\nsidebar:\n  label: 워크스페이스 매니저 회수\n  badge: POST\ntitle: 워크스페이스 매니저 회수\ntype: openapi-operation\n---\n매니저 부여를 회수한다. 경로가 POST 인 것은 어드민 콘솔 CORS 가 GET·POST 만 허용하기\n때문이고, 본문이 필요한 이유는 스텝업이다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 없거나 challengeId·challengeResponse 가 비었다\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 401 WORKSPACE_CHALLENGE_INVALID: 건별 2FA 스텝업에 실패했다\n- 403 WORKSPACE_ADMIN_FORBIDDEN: 초대 권한의 platform 부여가 없다\n- 404 WORKSPACE_TARGET_UNKNOWN: 그 워크스페이스의 매니저가 아니다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-workspace-managers-revoke\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--workspace-registration--policy-workspace-managers-revoke.html", "reference": true}, {"title": "스텝업 챌린지 발급", "text": "---\nsearch:\n  tags:\n    - Workspace Registration\n    - POST\nseo:\n  description: >-\n    스텝업 챌린지 발급. 아무것도 저장하지 않는다 —… Reference for the POST\n    /platform/workspaces/challenges endpoint in the Wallet Policy Engine\n    Internal API API.\nsidebar:\n  label: 스텝업 챌린지 발급\n  badge: POST\ntitle: 스텝업 챌린지 발급\ntype: openapi-operation\n---\n스텝업 챌린지 발급. **아무것도 저장하지 않는다** — 본문을 정규화해 챌린지만 답한다.\n\nErrors:\n- 400 INVALID_REQUEST: action 이 등재된 값이 아니거나 그 행위의 필드가 없다\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 WORKSPACE_ADMIN_FORBIDDEN: 초대 권한의 platform 부여가 없다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-workspace-registration-challenge\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--workspace-registration--policy-workspace-registration-challenge.html", "reference": true}, {"title": "워크스페이스 목록 조회", "text": "---\nsearch:\n  tags:\n    - Workspace Registration\n    - GET\nseo:\n  description: >-\n    등록된 워크스페이스 목록. 쓰기가 아니라 스텝업 없이 부여만… Reference for the GET\n    /platform/workspaces endpoint in the Wallet Policy Engine Internal API API.\nsidebar:\n  label: 워크스페이스 목록 조회\n  badge: GET\ntitle: 워크스페이스 목록 조회\ntype: openapi-operation\n---\n등록된 워크스페이스 목록. **쓰기가 아니라 스텝업 없이 부여만 본다.**\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 WORKSPACE_ADMIN_FORBIDDEN: 초대 권한의 platform 부여가 없다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-workspace-registration-list\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--workspace-registration--policy-workspace-registration-list.html", "reference": true}, {"title": "워크스페이스 등록", "text": "---\nsearch:\n  tags:\n    - Workspace Registration\n    - POST\nseo:\n  description: >-\n    워크스페이스를 세우고 첫 매니저를 지명한다. Reference for the POST /platform/workspaces\n    endpoint in the Wallet Policy Engine Internal API API.\nsidebar:\n  label: 워크스페이스 등록\n  badge: POST\ntitle: 워크스페이스 등록\ntype: openapi-operation\n---\n워크스페이스를 세우고 첫 매니저를 지명한다.\n\n인증: 어드민 세션 + 건별 2FA 스텝업. 인가: 초대 권한 role 의 platform 부여.\n\n관문 순서는 좌표 형태 → 스텝업 → 등록 조회 → 시드 주입 → 등록·지명이다. **시드가 등록보다\n앞인 것이 요건이다** — 실패하면 등록부에 아무것도 남지 않아 재시도가 안전하고, 시드 없는\n워크스페이스가 default deny 로 죽는 상태가 생기지 않는다.\n\n새로 세우면 201, 이미 등록돼 있었으면 200 이고 본문의 `alreadyRegistered` 가 그것을 말한다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 없거나 필수 필드가 비었거나 상한을 넘었다\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 401 WORKSPACE_CHALLENGE_INVALID: 건별 2FA 스텝업에 실패했다\n- 403 WORKSPACE_ADMIN_FORBIDDEN: 초대 권한의 platform 부여가 없다 (매니저 계정의 소속 불변식 위반 포함)\n- 409 ADMIN_LOGIN_ID_TAKEN: 등록을 마친 계정이 그 loginId 를 쓴다\n- 500 WORKSPACE_SEED_FAILED: 시드 정책을 주입하지 못해 등록을 중단했다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-workspace-registration-register\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--workspace-registration--policy-workspace-registration-register.html", "reference": true}, {"title": "워크스페이스 상세 조회", "text": "---\nsearch:\n  tags:\n    - Workspace Registration\n    - GET\nseo:\n  description: >-\n    등록 상세와 매니저 목록. Reference for the GET /platform/workspaces/{workspaceId}\n    endpoint in the Wallet Policy Engine Internal API API.\nsidebar:\n  label: 워크스페이스 상세 조회\n  badge: GET\ntitle: 워크스페이스 상세 조회\ntype: openapi-operation\n---\n등록 상세와 매니저 목록.\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 WORKSPACE_ADMIN_FORBIDDEN: 초대 권한의 platform 부여가 없다\n- 404 WORKSPACE_TARGET_UNKNOWN: 등록되지 않은 좌표다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-workspace-registration-view\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--workspace-registration--policy-workspace-registration-view.html", "reference": true}, {"title": "Travel Rule Gateway API", "text": "---\nseo:\n  description: >-\n    travel-rule-gateway HTTP API. Gateway가 연동하고 있는 VV의 Enclave는 별도 MYSQL을 운영해야하며\n    이 DB에서는 통신한 데이터 전문을 기록하고 있다. 해당 전문은…\nsidebar:\n  label: Overview\ntitle: Travel Rule Gateway API\n---\ntravel-rule-gateway HTTP API.\nGateway가 연동하고 있는 VV의 Enclave는 별도 MYSQL을 운영해야하며 이 DB에서는 통신한 데이터 전문을 기록하고 있다.\n해당 전문은 모두 암호화되고 있으며 암호화의 키는 사용측에서 발행하고 관리한다. (API 구현을 통해 암호화키 전달)\n따라서 암호화 되어있다고는 하지만 개인정보에 해당하는 데이터이므로 적격기관에서 운용하고 관리해야한다.\n이 Gateway는 트래블룰 처리를 위한 인터페이스 통합역할을 할수있지만 데이터 보관권한은 없으므로 DB와 Enclave는 보유대상이 아닌 연동대상이다.\n\n\u003cApiOverview source=\"reference-travel-rule\" />\n\n## Service API\n\n트래블룰 게이트웨이 서비스 표면.\n\n\u003cApiTagOperations source=\"reference-travel-rule\" tag=\"service-api\" />\n\n## VerifyVASP Inbound\n\nVerifyVASP 인바운드 수신.\n\n\u003cApiTagOperations source=\"reference-travel-rule\" tag=\"verifyvasp-inbound\" />\n", "kind": "참고 문서", "path": "_reference/reference--travel-rule.html", "reference": true}, {"title": "주소 검증", "text": "---\nsearch:\n  tags:\n    - Service API\n    - POST\nseo:\n  description: >-\n    수취 주소(계좌) 검증. 이름 비교 없음. Reference for the POST\n    /api/v1/travel-rule/address-checks endpoint in the Travel Rule Gateway API\n    API.\nsidebar:\n  label: 주소 검증\n  badge: POST\ntitle: 주소 검증\ntype: openapi-operation\n---\n수취 주소(계좌) 검증. 이름 비교 없음.\n\n\u003cOperation source=\"reference-travel-rule\" id=\"travel-rule-address-check\" />\n", "kind": "참고 문서", "path": "_reference/reference--travel-rule--service-api--travel-rule-address-check.html", "reference": true}, {"title": "PII 교환&검증 요청", "text": "---\nsearch:\n  tags:\n    - Service API\n    - POST\nseo:\n  description: >-\n    travel-rule 검증 생성(user). enclave 로 요청하고… Reference for the POST\n    /api/v1/travel-rule/checks endpoint in the Travel Rule Gateway API API.\nsidebar:\n  label: PII 교환&검증 요청\n  badge: POST\ntitle: PII 교환&검증 요청\ntype: openapi-operation\n---\ntravel-rule 검증 생성(user). enclave 로 요청하고 verificationUuid 를 반환.\n\n\u003cOperation source=\"reference-travel-rule\" id=\"travel-rule-create-check\" />\n", "kind": "참고 문서", "path": "_reference/reference--travel-rule--service-api--travel-rule-create-check.html", "reference": true}, {"title": "PII 검증 결과 조회", "text": "---\nsearch:\n  tags:\n    - Service API\n    - GET\nseo:\n  description: >-\n    검증 결과 조회(uuid 기준). Reference for the GET /api/v1/travel-rule/checks/{trId}\n    endpoint in the Travel Rule Gateway API API.\nsidebar:\n  label: PII 검증 결과 조회\n  badge: GET\ntitle: PII 검증 결과 조회\ntype: openapi-operation\n---\n검증 결과 조회(uuid 기준).\n\n\u003cOperation source=\"reference-travel-rule\" id=\"travel-rule-get-check\" />\n", "kind": "참고 문서", "path": "_reference/reference--travel-rule--service-api--travel-rule-get-check.html", "reference": true}, {"title": "PII 검증에 대한 tx 업데이트", "text": "---\nsearch:\n  tags:\n    - Service API\n    - POST\nseo:\n  description: >-\n    검증에 대한 tx 보고. 성공 여부(boolean) 반환. Reference for the POST\n    /api/v1/travel-rule/checks/tx endpoint in the Travel Rule Gateway API API.\nsidebar:\n  label: PII 검증에 대한 tx 업데이트\n  badge: POST\ntitle: PII 검증에 대한 tx 업데이트\ntype: openapi-operation\n---\n검증에 대한 tx 보고. 성공 여부(boolean) 반환.\n\n\u003cOperation source=\"reference-travel-rule\" id=\"travel-rule-report-tx\" />\n", "kind": "참고 문서", "path": "_reference/reference--travel-rule--service-api--travel-rule-report-tx.html", "reference": true}, {"title": "자신의 VASP 정보 조회", "text": "---\nsearch:\n  tags:\n    - Service API\n    - GET\nseo:\n  description: >-\n    자기 VASP 식별자. Reference for the GET /api/v1/travel-rule/vasps/self endpoint\n    in the Travel Rule Gateway API API.\nsidebar:\n  label: 자신의 VASP 정보 조회\n  badge: GET\ntitle: 자신의 VASP 정보 조회\ntype: openapi-operation\n---\n자기 VASP 식별자.\n\n\u003cOperation source=\"reference-travel-rule\" id=\"vasps-get-self\" />\n", "kind": "참고 문서", "path": "_reference/reference--travel-rule--service-api--vasps-get-self.html", "reference": true}, {"title": "연동 VASP 리스트 조회", "text": "---\nsearch:\n  tags:\n    - Service API\n    - GET\nseo:\n  description: >-\n    VASP 목록. protocol 로 필터 가능. Reference for the GET /api/v1/travel-rule/vasps\n    endpoint in the Travel Rule Gateway API API.\nsidebar:\n  label: 연동 VASP 리스트 조회\n  badge: GET\ntitle: 연동 VASP 리스트 조회\ntype: openapi-operation\n---\nVASP 목록. protocol 로 필터 가능.\n\n\u003cOperation source=\"reference-travel-rule\" id=\"vasps-list\" />\n", "kind": "참고 문서", "path": "_reference/reference--travel-rule--service-api--vasps-list.html", "reference": true}, {"title": "verifyvasp enclave로부터 들어오는 Callback", "text": "---\nsearch:\n  tags:\n    - VerifyVASP Inbound\n    - POST\nseo:\n  description: >-\n    verifyvasp enclave로부터 들어오는 Callback Reference for the POST\n    /api/v1/verifyvasp/callback endpoint in the Travel Rule Gateway API API.\nsidebar:\n  label: verifyvasp enclave로부터 들어오는 Callback\n  badge: POST\ntitle: verifyvasp enclave로부터 들어오는 Callback\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-travel-rule\" id=\"verify-vasp-callback-receive\" />\n", "kind": "참고 문서", "path": "_reference/reference--travel-rule--verifyvasp-inbound--verify-vasp-callback-receive.html", "reference": true}, {"title": "타 VASP에서 주소 검증 요청", "text": "---\nsearch:\n  tags:\n    - VerifyVASP Inbound\n    - POST\nseo:\n  description: >-\n    수취 계좌 검증(inbound). 결과는 로그만 남기고… Reference for the POST\n    /api/v1/verifyvasp/verifications/account endpoint in the Travel Rule Gateway\n    API API.\nsidebar:\n  label: 타 VASP에서 주소 검증 요청\n  badge: POST\ntitle: 타 VASP에서 주소 검증 요청\ntype: openapi-operation\n---\n수취 계좌 검증(inbound). 결과는 로그만 남기고 저장하지 않는다.\n\n\u003cOperation source=\"reference-travel-rule\" id=\"verify-vasp-inbound-verifications-account\" />\n", "kind": "참고 문서", "path": "_reference/reference--travel-rule--verifyvasp-inbound--verify-vasp-inbound-verifications-account.html", "reference": true}, {"title": "타 VASP에서 PII 교환&검증 요청", "text": "---\nsearch:\n  tags:\n    - VerifyVASP Inbound\n    - POST\nseo:\n  description: >-\n    수취인 검증(inbound). 이름 완전 일치 대조. Reference for the POST\n    /api/v1/verifyvasp/verifications endpoint in the Travel Rule Gateway API\n    API.\nsidebar:\n  label: 타 VASP에서 PII 교환&검증 요청\n  badge: POST\ntitle: 타 VASP에서 PII 교환&검증 요청\ntype: openapi-operation\n---\n수취인 검증(inbound). 이름 완전 일치 대조.\n\n\u003cOperation source=\"reference-travel-rule\" id=\"verify-vasp-inbound-verifications-user\" />\n", "kind": "참고 문서", "path": "_reference/reference--travel-rule--verifyvasp-inbound--verify-vasp-inbound-verifications-user.html", "reference": true}, {"title": "Wallet API", "text": "---\nseo:\n  description: Wallet API API reference.\nsidebar:\n  label: Overview\ntitle: Wallet API\n---\n\u003cApiOverview source=\"reference-wallet\" />\n\n## Accounts\n\n파트너사의 최종 사용자를 wallet 안에서 대리하는 계정. 삭제 없이 활성·비활성만 전환한다.\n\n\u003cApiTagOperations source=\"reference-wallet\" tag=\"accounts\" />\n\n## Account Wallets\n\n계정에 귀속된 토큰별 입금 지갑. 온체인 주소가 여기 붙는다.\n\n\u003cApiTagOperations source=\"reference-wallet\" tag=\"account-wallets\" />\n\n## Address Books\n\n출금 목적지 등록. 등재 여부는 거절 사유가 아니라 정책 입력이다.\n\n\u003cApiTagOperations source=\"reference-wallet\" tag=\"address-books\" />\n\n## Deposits\n\n온체인 관측으로 기록된 유입. 확정되면 기본 동결로 들어간다.\n\n\u003cApiTagOperations source=\"reference-wallet\" tag=\"deposits\" />\n\n## Withdrawals\n\nworkspace vault에서 외부 주소로의 출금. 자금 귀속에 따라 표면이 갈린다.\n\n\u003cApiTagOperations source=\"reference-wallet\" tag=\"withdrawals\" />\n\n## Networks\n\n블록체인 네트워크 카탈로그. 계열에 따라 주소 체계가 갈린다.\n\n\u003cApiTagOperations source=\"reference-wallet\" tag=\"networks\" />\n\n## Sweeps\n\n동결 유입 건을 지목해 집금 vault로 옮긴다. 해제와 이동이 원자적이다.\n\n\u003cApiTagOperations source=\"reference-wallet\" tag=\"sweeps\" />\n\n## Tokens\n\n네트워크 위의 자산. 유일성은 (workspace, network, 컨트랙트 주소)에서 성립한다.\n\n\u003cApiTagOperations source=\"reference-wallet\" tag=\"tokens\" />\n\n## Travel Rules\n\n트래블룰 정보 교환. 판단 주체는 wallet이고 상대 VASP에는 단일 boolean만 낸다.\n\n\u003cApiTagOperations source=\"reference-wallet\" tag=\"travel-rules\" />\n\n## Workspace Vault Transfers\n\nworkspace vault 사이의 자산 이동. 동결되지 않은 자산만 움직인다.\n\n\u003cApiTagOperations source=\"reference-wallet\" tag=\"workspace-vault-transfers\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet.html", "reference": true}, {"title": "계정 지갑 생성", "text": "---\nsearch:\n  tags:\n    - Account Wallets\n    - POST\nseo:\n  description: >-\n    계정 지갑 생성 Reference for the POST /api/v1/accounts/{accountId}/account-wallets\n    endpoint in the Wallet API API.\nsidebar:\n  label: 계정 지갑 생성\n  badge: POST\ntitle: 계정 지갑 생성\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-wallet\" id=\"account-wallets-create\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--account-wallets--account-wallets-create.html", "reference": true}, {"title": "계정 지갑 상세 조회", "text": "---\nsearch:\n  tags:\n    - Account Wallets\n    - GET\nseo:\n  description: >-\n    계정 지갑 상세 조회 Reference for the GET\n    /api/v1/accounts/{accountId}/account-wallets/{accountWalletId} endpoint in\n    the Wallet API API.\nsidebar:\n  label: 계정 지갑 상세 조회\n  badge: GET\ntitle: 계정 지갑 상세 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-wallet\" id=\"account-wallets-get\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--account-wallets--account-wallets-get.html", "reference": true}, {"title": "계정 지갑 목록 조회", "text": "---\nsearch:\n  tags:\n    - Account Wallets\n    - GET\nseo:\n  description: >-\n    계정 지갑 목록 조회 Reference for the GET\n    /api/v1/accounts/{accountId}/account-wallets endpoint in the Wallet API API.\nsidebar:\n  label: 계정 지갑 목록 조회\n  badge: GET\ntitle: 계정 지갑 목록 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-wallet\" id=\"account-wallets-list\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--account-wallets--account-wallets-list.html", "reference": true}, {"title": "계정 상태 변경", "text": "---\nsearch:\n  tags:\n    - Accounts\n    - POST\nseo:\n  description: >-\n    계정을 활성/비활성으로 전환한다. 요청 안에서 종결되며 승인을 거치지… Reference for the POST\n    /api/v1/accounts/{accountId}/status endpoint in the Wallet API API.\nsidebar:\n  label: 계정 상태 변경\n  badge: POST\ntitle: 계정 상태 변경\ntype: openapi-operation\n---\n계정을 활성/비활성으로 전환한다. 요청 안에서 종결되며 승인을 거치지 않는다.\n\n이미 그 상태면 아무것도 바꾸지 않고 성공으로 종결한다.\n\n**비활성화는 그 계정의 주소록 등록을 전부 삭제한다.** 되돌릴 수 없다 — 다시 활성화해도\n주소록은 복구되지 않으므로, 최종 사용자가 지갑 소유 증명을 거쳐 다시 등록해야 한다.\n비활성 계정에는 새 지갑도 새 주소록도 만들 수 없다. 이미 만들어진 지갑으로 들어오는 입금은\n계속 기록되지만, 주소록 근거가 사라졌으므로 등록된 발신처로 판정되지 않는다.\n\nErrors:\n- 404 ACCOUNT_NOT_FOUND: accountId로 매칭되는 계정 없음\n- 400 INVALID_REQUEST_BODY: status가 비었거나 허용 값이 아님\n- 400 INVALID_PATH_VARIABLE: accountId 형식이 올바르지 않음\n\n\u003cOperation source=\"reference-wallet\" id=\"accounts-change-status\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--accounts--accounts-change-status.html", "reference": true}, {"title": "계정 생성", "text": "---\nsearch:\n  tags:\n    - Accounts\n    - POST\nseo:\n  description: >-\n    referenceId에 매핑되는 계정을 생성한다. 요청 안에서 종결되며 승인을 거치지 않는다. Reference for the POST\n    /api/v1/accounts endpoint in the Wallet API API.\nsidebar:\n  label: 계정 생성\n  badge: POST\ntitle: 계정 생성\ntype: openapi-operation\n---\nreferenceId에 매핑되는 계정을 생성한다. 요청 안에서 종결되며 승인을 거치지 않는다.\n\nreferenceId는 같은 고객사(tenant) 안에서 유일하다. 이미 쓰인 값으로 생성하면 거부되며,\n그 경우 아래 referenceId 조회로 기존 계정을 찾는다.\n\nErrors:\n- 400 ACCOUNT_ALREADY_EXISTS: 같은 tenant에 그 referenceId의 계정이 이미 있음\n- 400 INVALID_REQUEST_BODY: referenceId가 비었거나 허용 길이를 넘음\n\n\u003cOperation source=\"reference-wallet\" id=\"accounts-create\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--accounts--accounts-create.html", "reference": true}, {"title": "계정 상세 조회", "text": "---\nsearch:\n  tags:\n    - Accounts\n    - GET\nseo:\n  description: >-\n    accountId로 계정을 상세 조회한다. 상태로 걸러내지 않으므로 비활성 계정도… Reference for the GET\n    /api/v1/accounts/{accountId} endpoint in the Wallet API API.\nsidebar:\n  label: 계정 상세 조회\n  badge: GET\ntitle: 계정 상세 조회\ntype: openapi-operation\n---\naccountId로 계정을 상세 조회한다.\n상태로 걸러내지 않으므로 비활성 계정도 status와 함께 반환한다.\n\nErrors:\n- 404 ACCOUNT_NOT_FOUND: accountId로 매칭되는 계정 없음\n\n\u003cOperation source=\"reference-wallet\" id=\"accounts-get\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--accounts--accounts-get.html", "reference": true}, {"title": "계정 referenceId 조회", "text": "---\nsearch:\n  tags:\n    - Accounts\n    - GET\nseo:\n  description: >-\n    referenceId로 계정을 상세 조회한다. referenceId 쿼리 파라미터가 있을 때만 이 핸들러로… Reference for\n    the GET /api/v1/accounts endpoint in the Wallet API API.\nsidebar:\n  label: 계정 referenceId 조회\n  badge: GET\ntitle: 계정 referenceId 조회\ntype: openapi-operation\n---\nreferenceId로 계정을 상세 조회한다.\nreferenceId 쿼리 파라미터가 있을 때만 이 핸들러로 라우팅된다.\nreferenceId는 같은 고객사(tenant) 안에서 유일하므로 단건을 반환한다.\n상태로 걸러내지 않으므로 비활성 계정도 status와 함께 반환한다.\n\nErrors:\n- 404 ACCOUNT_NOT_FOUND: referenceId로 매칭되는 계정 없음\n\n\u003cOperation source=\"reference-wallet\" id=\"accounts-get-by-reference-id\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--accounts--accounts-get-by-reference-id.html", "reference": true}, {"title": "주소록 등록 (지갑 소유 증명 nonce 서명 포함)", "text": "---\nsearch:\n  tags:\n    - Address Books\n    - POST\nseo:\n  description: >-\n    발급받은 nonce의 message에 대한 지갑 서명을 검증해 등재한다.… Reference for the POST\n    /api/v1/accounts/{accountId}/address-books endpoint in the Wallet API API.\nsidebar:\n  label: 주소록 등록 (지갑 소유 증명 nonce 서명 포함)\n  badge: POST\ntitle: 주소록 등록 (지갑 소유 증명 nonce 서명 포함)\ntype: openapi-operation\n---\n발급받은 nonce의 `message`에 대한 지갑 서명을 검증해 등재한다. 등록 자체가 소유 증명\n게이트라 별도 승인 절차가 없다.\n\nErrors:\n- 400 OWNERSHIP_PROOF_REJECTED: nonce가 없거나 만료·소비됐거나 서명이 대상 주소의 것이 아니다\n- 400 ADDRESS_ALREADY_REGISTERED: 같은 체인 좌표에 이미 등재된 주소다\n\n\u003cOperation source=\"reference-wallet\" id=\"address-books-create\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--address-books--address-books-create.html", "reference": true}, {"title": "주소록 등록용 지갑 소유 증명 nonce 발급", "text": "---\nsearch:\n  tags:\n    - Address Books\n    - POST\nseo:\n  description: >-\n    주소록 등록용 지갑 소유 증명 nonce 발급 Reference for the POST\n    /api/v1/accounts/{accountId}/address-books/nonce endpoint in the Wallet API\n    API.\nsidebar:\n  label: 주소록 등록용 지갑 소유 증명 nonce 발급\n  badge: POST\ntitle: 주소록 등록용 지갑 소유 증명 nonce 발급\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-wallet\" id=\"address-books-create-nonce\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--address-books--address-books-create-nonce.html", "reference": true}, {"title": "주소록 삭제", "text": "---\nsearch:\n  tags:\n    - Address Books\n    - DELETE\nseo:\n  description: >-\n    등재를 회수한다. 행이 지워지는 것이 아니라… Reference for the DELETE\n    /api/v1/accounts/{accountId}/address-books/{addressBookId} endpoint in the\n    Wallet API API.\nsidebar:\n  label: 주소록 삭제\n  badge: DELETE\ntitle: 주소록 삭제\ntype: openapi-operation\n---\n등재를 회수한다. 행이 지워지는 것이 아니라 상태가 REVOKED가 되고 즉시 정책 판정에 반영된다\n\n\u003cOperation source=\"reference-wallet\" id=\"address-books-delete\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--address-books--address-books-delete.html", "reference": true}, {"title": "주소록 상세 조회", "text": "---\nsearch:\n  tags:\n    - Address Books\n    - GET\nseo:\n  description: >-\n    주소록 상세 조회 Reference for the GET\n    /api/v1/accounts/{accountId}/address-books/{addressBookId} endpoint in the\n    Wallet API API.\nsidebar:\n  label: 주소록 상세 조회\n  badge: GET\ntitle: 주소록 상세 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-wallet\" id=\"address-books-get\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--address-books--address-books-get.html", "reference": true}, {"title": "주소록 목록 조회", "text": "---\nsearch:\n  tags:\n    - Address Books\n    - GET\nseo:\n  description: >-\n    주소록 목록 조회 Reference for the GET /api/v1/accounts/{accountId}/address-books\n    endpoint in the Wallet API API.\nsidebar:\n  label: 주소록 목록 조회\n  badge: GET\ntitle: 주소록 목록 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-wallet\" id=\"address-books-list\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--address-books--address-books-list.html", "reference": true}, {"title": "입금 내역 상세 조회", "text": "---\nsearch:\n  tags:\n    - Deposits\n    - GET\nseo:\n  description: >-\n    입금 내역 상세 조회 Reference for the GET\n    /api/v1/accounts/{accountId}/deposits/{depositId} endpoint in the Wallet API\n    API.\nsidebar:\n  label: 입금 내역 상세 조회\n  badge: GET\ntitle: 입금 내역 상세 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-wallet\" id=\"deposits-get\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--deposits--deposits-get.html", "reference": true}, {"title": "입금 내역 목록 조회", "text": "---\nsearch:\n  tags:\n    - Deposits\n    - GET\nseo:\n  description: >-\n    cursor로 이어 읽는 동안 status·from·to를 바꾸지 않는다. 커서는… Reference for the GET\n    /api/v1/accounts/{accountId}/deposits endpoint in the Wallet API API.\nsidebar:\n  label: 입금 내역 목록 조회\n  badge: GET\ntitle: 입금 내역 목록 조회\ntype: openapi-operation\n---\n`cursor`로 이어 읽는 동안 `status`·`from`·`to`를 바꾸지 않는다. 커서는 정렬 키만 담으므로 조건을 바꾸면\n새 조건에 맞으면서 커서보다 앞에 정렬되는 건이 그 순회에서 빠진다. 조건을 바꾸려면 `cursor` 없이 처음부터 조회한다.\n\n\u003cOperation source=\"reference-wallet\" id=\"deposits-list\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--deposits--deposits-list.html", "reference": true}, {"title": "네트워크 상세 조회", "text": "---\nsearch:\n  tags:\n    - Networks\n    - GET\nseo:\n  description: >-\n    네트워크 상세 조회 Reference for the GET /api/v1/networks/{networkId} endpoint in\n    the Wallet API API.\nsidebar:\n  label: 네트워크 상세 조회\n  badge: GET\ntitle: 네트워크 상세 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-wallet\" id=\"networks-get\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--networks--networks-get.html", "reference": true}, {"title": "네트워크 목록 조회", "text": "---\nsearch:\n  tags:\n    - Networks\n    - GET\nseo:\n  description: >-\n    네트워크 목록 조회 Reference for the GET /api/v1/networks endpoint in the Wallet API\n    API.\nsidebar:\n  label: 네트워크 목록 조회\n  badge: GET\ntitle: 네트워크 목록 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-wallet\" id=\"networks-list\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--networks--networks-list.html", "reference": true}, {"title": "스윕 요청 생성", "text": "---\nsearch:\n  tags:\n    - Sweeps\n    - POST\nseo:\n  description: >-\n    스윕 대상 입금에서 출발 좌표(vault·토큰·금액)를 유도해 집금 vault로의 이동을 요청한다.… Reference for the\n    POST /api/v1/sweeps endpoint in the Wallet API API.\nsidebar:\n  label: 스윕 요청 생성\n  badge: POST\ntitle: 스윕 요청 생성\ntype: openapi-operation\n---\n스윕 대상 입금에서 출발 좌표(vault·토큰·금액)를 유도해 집금 vault로의 이동을 요청한다.\n요청은 depositId와 목적지만 지정한다.\n\nErrors:\n- 400 INVALID_AMOUNT: 입금 금액이 토큰 decimals 정밀도와 불일치\n- 404 DEPOSIT_NOT_FOUND: depositId로 매칭되는 입금 없음 (타 고객사 소유 포함)\n- 404 TOKEN_NOT_FOUND: 입금 토큰이 카탈로그에 없음\n\n\u003cOperation source=\"reference-wallet\" id=\"sweeps-create\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--sweeps--sweeps-create.html", "reference": true}, {"title": "스윕 상세 조회", "text": "---\nsearch:\n  tags:\n    - Sweeps\n    - GET\nseo:\n  description: >-\n    sweepId로 스윕을 상세 조회한다. Reference for the GET /api/v1/sweeps/{sweepId}\n    endpoint in the Wallet API API.\nsidebar:\n  label: 스윕 상세 조회\n  badge: GET\ntitle: 스윕 상세 조회\ntype: openapi-operation\n---\nsweepId로 스윕을 상세 조회한다.\n\nErrors:\n- 404 SWEEP_NOT_FOUND: sweepId로 매칭되는 스윕 없음\n\n\u003cOperation source=\"reference-wallet\" id=\"sweeps-get\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--sweeps--sweeps-get.html", "reference": true}, {"title": "스윕 referenceId 조회", "text": "---\nsearch:\n  tags:\n    - Sweeps\n    - GET\nseo:\n  description: >-\n    referenceId로 스윕을 상세 조회한다 — 생성 응답을 받지 못했을 때(타임아웃 등) 스윕 id 없이… Reference for\n    the GET /api/v1/sweeps endpoint in the Wallet API API.\nsidebar:\n  label: 스윕 referenceId 조회\n  badge: GET\ntitle: 스윕 referenceId 조회\ntype: openapi-operation\n---\nreferenceId로 스윕을 상세 조회한다 — 생성 응답을 받지 못했을 때(타임아웃 등) 스윕 id 없이\n상태를 확인하는 복구 경로다. referenceId는 tenant 안에서 유일하다.\nreferenceId 쿼리 파라미터가 있을 때만 이 핸들러로 라우팅된다.\n\n\u003cOperation source=\"reference-wallet\" id=\"sweeps-get-by-reference-id\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--sweeps--sweeps-get-by-reference-id.html", "reference": true}, {"title": "토큰 상세 조회", "text": "---\nsearch:\n  tags:\n    - Tokens\n    - GET\nseo:\n  description: >-\n    토큰 상세 조회 Reference for the GET /api/v1/tokens/{tokenId} endpoint in the\n    Wallet API API.\nsidebar:\n  label: 토큰 상세 조회\n  badge: GET\ntitle: 토큰 상세 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-wallet\" id=\"tokens-get\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--tokens--tokens-get.html", "reference": true}, {"title": "토큰 목록 조회", "text": "---\nsearch:\n  tags:\n    - Tokens\n    - GET\nseo:\n  description: >-\n    토큰 목록 조회 Reference for the GET /api/v1/tokens endpoint in the Wallet API\n    API.\nsidebar:\n  label: 토큰 목록 조회\n  badge: GET\ntitle: 토큰 목록 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-wallet\" id=\"tokens-list\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--tokens--tokens-list.html", "reference": true}, {"title": "트래블룰 대상 VASP 목록 조회", "text": "---\nsearch:\n  tags:\n    - Travel Rules\n    - GET\nseo:\n  description: >-\n    트래블룰 대상 VASP 목록 조회 Reference for the GET /api/v1/travel-rules/vasps endpoint\n    in the Wallet API API.\nsidebar:\n  label: 트래블룰 대상 VASP 목록 조회\n  badge: GET\ntitle: 트래블룰 대상 VASP 목록 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-wallet\" id=\"travel-rules-list-vasps\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--travel-rules--travel-rules-list-vasps.html", "reference": true}, {"title": "출금 요청", "text": "---\nsearch:\n  tags:\n    - Withdrawals\n    - POST\nseo:\n  description: >-\n    출금 요청 Reference for the POST /api/v1/accounts/{accountId}/withdrawals\n    endpoint in the Wallet API API.\nsidebar:\n  label: 출금 요청\n  badge: POST\ntitle: 출금 요청\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-wallet\" id=\"withdrawals-create\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--withdrawals--withdrawals-create.html", "reference": true}, {"title": "출금 내역 상세 조회", "text": "---\nsearch:\n  tags:\n    - Withdrawals\n    - GET\nseo:\n  description: >-\n    출금 내역 상세 조회 Reference for the GET\n    /api/v1/accounts/{accountId}/withdrawals/{withdrawalId} endpoint in the\n    Wallet API API.\nsidebar:\n  label: 출금 내역 상세 조회\n  badge: GET\ntitle: 출금 내역 상세 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-wallet\" id=\"withdrawals-get\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--withdrawals--withdrawals-get.html", "reference": true}, {"title": "출금 내역 목록 조회", "text": "---\nsearch:\n  tags:\n    - Withdrawals\n    - GET\nseo:\n  description: >-\n    출금 내역 목록 조회 Reference for the GET /api/v1/accounts/{accountId}/withdrawals\n    endpoint in the Wallet API API.\nsidebar:\n  label: 출금 내역 목록 조회\n  badge: GET\ntitle: 출금 내역 목록 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-wallet\" id=\"withdrawals-list\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--withdrawals--withdrawals-list.html", "reference": true}, {"title": "워크스페이스 Vault 이체 요청 생성", "text": "---\nsearch:\n  tags:\n    - Workspace Vault Transfers\n    - POST\nseo:\n  description: >-\n    WorkspaceWallet 간 자산 이동을 요청한다. 출발 vault의 가용… Reference for the POST\n    /api/v1/workspace-vault-transfers endpoint in the Wallet API API.\nsidebar:\n  label: 워크스페이스 Vault 이체 요청 생성\n  badge: POST\ntitle: 워크스페이스 Vault 이체 요청 생성\ntype: openapi-operation\n---\nWorkspaceWallet 간 자산 이동을 요청한다.\n출발 vault의 가용 잔액(settled − in-flight)을 서명 이전에 검증해, 부족하면 400으로 즉시 거절한다.\n커스터디 실행 결과로 부족이 확인되면 FAILED (INSUFFICIENT_FUNDS) subStatus로 마킹된다.\n\nErrors:\n- 400 WORKSPACE_VAULT_INSUFFICIENT_BALANCE: 출발 vault의 가용 잔액이 요청 금액에 미치지 못함 (서명 이전 차단)\n- 400 WORKSPACE_VAULT_TRANSFER_SOURCE_DESTINATION_SAME: 출발과 도착 vault가 같음\n- 400 WORKSPACE_VAULT_TRANSFER_INVALID_AMOUNT: 금액 해석 불가·0 이하·token 정밀도 초과\n- 400 WORKSPACE_VAULT_TRANSFER_REFERENCE_CONFLICT: 같은 고객사가 동일 referenceId로 이미 이체를 생성\n- 400 WORKSPACE_VAULT_TRANSFER_POLICY_DENIED: 정책이 이체를 거부 (행은 FAILED로 남음)\n- 400 WORKSPACE_VAULT_INACTIVE: 비활성 vault\n- 404 TOKEN_NOT_FOUND / WORKSPACE_VAULT_NOT_FOUND: 대상 미존재 — 타 workspace 자원도 같은 응답 (존재 오라클 차단)\n- 404 WORKSPACE_WALLET_NOT_FOUND: 어느 한쪽 vault에 대상 token의 지갑이 없음\n- 503 WORKSPACE_VAULT_TRANSFER_PROVIDER_UNAVAILABLE: 제출 결과 불명 — 행은 PENDING으로 남아 대사가 정리\n\n\u003cOperation source=\"reference-wallet\" id=\"workspace-vault-transfers-create\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--workspace-vault-transfers--workspace-vault-transfers-create.html", "reference": true}, {"title": "워크스페이스 Vault 이체 상세 조회", "text": "---\nsearch:\n  tags:\n    - Workspace Vault Transfers\n    - GET\nseo:\n  description: >-\n    workspaceVaultTransferId로 이체를 상세… Reference for the GET\n    /api/v1/workspace-vault-transfers/{workspaceVaultTransferId} endpoint in the\n    Wallet API API.\nsidebar:\n  label: 워크스페이스 Vault 이체 상세 조회\n  badge: GET\ntitle: 워크스페이스 Vault 이체 상세 조회\ntype: openapi-operation\n---\nworkspaceVaultTransferId로 이체를 상세 조회한다.\n\nErrors:\n- 404 WORKSPACE_VAULT_TRANSFER_NOT_FOUND: 미존재 — 타 workspace의 이체도 같은 응답\n\n\u003cOperation source=\"reference-wallet\" id=\"workspace-vault-transfers-get\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--workspace-vault-transfers--workspace-vault-transfers-get.html", "reference": true}, {"title": "워크스페이스 Vault 이체 referenceId 조회", "text": "---\nsearch:\n  tags:\n    - Workspace Vault Transfers\n    - GET\nseo:\n  description: >-\n    referenceId로 이체를 상세 조회한다. referenceId 쿼리 파라미터가 있을… Reference for the GET\n    /api/v1/workspace-vault-transfers endpoint in the Wallet API API.\nsidebar:\n  label: 워크스페이스 Vault 이체 referenceId 조회\n  badge: GET\ntitle: 워크스페이스 Vault 이체 referenceId 조회\ntype: openapi-operation\n---\nreferenceId로 이체를 상세 조회한다.\nreferenceId 쿼리 파라미터가 있을 때만 이 핸들러로 라우팅된다.\n\n\u003cOperation source=\"reference-wallet\" id=\"workspace-vault-transfers-get-by-reference-id\" />\n", "kind": "참고 문서", "path": "_reference/reference--wallet--workspace-vault-transfers--workspace-vault-transfers-get-by-reference-id.html", "reference": true}, {"title": "시작하기", "text": "---\ntitle: 시작하기\ndescription: 첫 요청에서 자금 이동까지, 파트너사 개발자가 읽는 순서\n---\n\n_읽는 사람: 파트너사 개발자. Wallet SDK 를 붙이는 순서와 그 순서마다 볼 페이지를 다룹니다._\n\nWallet SDK 는 파트너 대상 API 로 붙입니다. 이 탭은 그 API 를 처음 부르는 사람이 어느 순서로\n무엇을 읽으면 되는지를 안내하고, 어느 영역에도 속하지 않는 색인 둘을 함께 둡니다. Wallet SDK 가\n무엇을 맡고 무엇을 맡지 않는지는 [홈](/)에 있습니다.\n\n## 붙이는 순서\n\n이 탭의 페이지 둘을 위에서 아래 순서로 읽습니다.\n\n- **[첫 요청](/start/first-request)**: 계정 하나를 만들고 그 계정의 입금 주소를 받기까지입니다. 여기까지\n  오면 나머지는 자금이 움직이는 이야기입니다.\n- **[표면과 인증](/start/authentication)**: 어떤 API 를 누가 부르고, 격리 스코프가 인증에서 어떻게\n  나오는지입니다. 요청이 스코프를 싣지 않는 이유가 여기 있습니다.\n\n그다음은 계정과 지갑 탭으로 넘어갑니다. 탭 여섯의 전체 안내는 [홈](/)에 있습니다.\n\n## 색인 둘\n\n- **[용어](/start/terminology)** — 어느 말이 무엇을 가리키는지의 색인입니다. 낱말마다 한 줄 정의와\n  자세한 설명이 있는 페이지를 함께 알려 줍니다.\n- **[규제 대응](/start/compliance)** — 접속기록·개인정보·보존·암호키 통제가 어느 페이지에 있는지의\n  색인입니다.\n", "kind": "참고 문서", "path": "_reference/start.html", "reference": true}, {"title": "표면과 인증", "text": "---\ntitle: 표면과 인증\ndescription: 어떤 API를 누가 부르고, 무엇이 인증에서 나오는가\n---\n\n_읽는 사람: 파트너사 개발자. 표면 다섯과 각 표면에서 인증이 확정하는 것을 다룹니다._\n\n표면은 계약 소유자와 인증 방식이 하나로 정해지는 API 경로 묶음입니다. 표면이 다섯이고, 부르는\n주체와 인증 방식이 갈라서 나뉜 것이지 기능으로 나뉜 것이 아닙니다.\n\n| 표면 | 부르는 쪽 | 무엇을 하나 |\n|---|---|---|\n| [Wallet API](/reference/wallet) | 파트너사 서버 | 계정·지갑 발급, 입금 조회, 집금, 출금 |\n| [Admin API](/reference/admin) | 운영자 콘솔 | 카탈로그·테넌트·API 키·운영자 관리, 승인 게이팅 |\n| [Policy API](/reference/policy) | Wallet 서버 | 정책 판단 요청, 룰 저작·발행, 어드민 인증 |\n| [Travel Rule Gateway API](/reference/travel-rule) | Wallet 서버, 트래블룰 제공자 | 트래블룰 정보 교환 |\n| Internal API | 정책 엔진 | 평가에 필요한 사실 조회(PIP 원천) |\n\n## 파트너사가 부르는 표면\n\n일상적인 연동에서 부르는 것은 Wallet API 하나입니다. 나머지 넷은 운영자 콘솔이 쓰거나\n서비스끼리 부릅니다.\n\n그 하나로 무엇을 어떤 순서로 부르는지는 [첫 요청](/start/first-request)에 있습니다.\n\n**Internal API는 파트너사가 부르지 않습니다.** 정책 엔진은 자금을 움직이는 요청이 서명 인프라로\n가기 전에 그 요청을 심사하는 별도 시스템입니다([자세히](/policy)). 그 엔진이 판단에 필요한 사실을\n평가 시점에 읽어 오는 수집 경로가 PIP이고([자세히](/policy/runtime/pip)), Internal API가 그\n원천입니다. 호출자는 서비스 신원으로 인증합니다. 문서에 실려 있는 이유는 그 사실들이 무엇인지가\n정책 판단을 읽는 데 필요해서입니다.\n\n## Wallet 서버의 게이트웨이 역할\n\nWallet 서버가 게이트웨이를 겸합니다. Policy API와 Travel Rule Gateway API는 외부에 열려 있지\n않습니다. 파트너사는 Wallet API만 부르고, 그 뒤에서 Wallet 서버가 두 서비스를 호출합니다.\n\n**예외가 하나 있습니다.** 비동기 PIP 결과는 파트너가 서명해서 인바운드로 제출합니다. 인증 근거가\n다른 별도 경로입니다.\n\n운영자 콘솔도 Wallet 서버를 거칩니다. 정책 엔진에 직접 붙지 않고, 콘솔이 받은 어드민 세션 자격을\nWallet 서버가 그대로 실어 보냅니다.\n\n트래블룰 게이트웨이의 인바운드를 부르는 것은 상대 거래소가 아니라 트래블룰 제공자입니다. 상대\n거래소는 그 제공자를 거쳐 닿습니다.\n\n## 스코프의 출처\n\n스코프 키는 인증이 확정하는 격리 식별자이고, 요청이 싣지 않습니다. API 키는 파트너사가 파트너\n대상 API를 부를 때 제시하는 인증 수단입니다.\n\n파트너사는 그 키로 인증합니다. 그 키가 어느 workspace와 어느 tenant에 속하는지를 서버가\n알고 있고, 모든 조회와 쓰기가 그 값으로 스코프됩니다. workspace는 Wallet SDK를 도입한 회사\n하나이고, tenant는 workspace 아래에서 Account를 묶는 계정 체계\n하나입니다([계정 계층](/accounts-wallets/accounts)).\n\n**요청은 스코프 키를 싣지 않습니다.** `workspaceId`나 `tenantId`를 본문·경로·쿼리로 받지\n않습니다. 요청 값은 위조할 수 있어서, 그것을 격리 키로 쓰면 남의 테넌트 데이터를 지목하는\n요청이 그대로 통과합니다.\n\n## `accountId`의 성격\n\n`accountId`는 스코프 키가 아닙니다. Wallet SDK가 발급해 Account를 지칭하는 값이고, Account는\n그 서비스의 최종 사용자 한 명을 wallet 안에서 대리하는 virtual\n사용자입니다([계정 계층](/accounts-wallets/accounts)).\n\n같은 식별자라도 표면에 따라 성격이 갈립니다. `accountId`는 요청이 정하는 값이라 그 자체로는\n아무것도 보증하지 않습니다.\n\n```\nGET /api/v1/accounts/{accountId}/deposits\n```\n\n이 경로의 `accountId`는 리소스 식별자입니다. 서버는 이 조회를 **인증에서 확정된 `tenantId`와\n함께** 수행합니다. tenant 없이 accountId만으로 조회하면 그것이 곧 cross-tenant 유출입니다.\n\n계정 하위 자산도 같습니다. 입금·출금·주소록·지갑 전부 별도 기준을 만들지 않고 tenant 단위로\n묶어, 이 성질이 쿼리 형태로 강제됩니다.\n\n## 운영자 인증\n\n**운영자 표면은 API 키가 아니라 사람을 식별합니다.** 어드민 세션은 로그인과 2단계 인증을 거쳐\n받는 불투명 크리덴셜입니다. 그 세션에 워크스페이스와 역할이 묶여 있습니다.\n\n콘솔은 Wallet 서버를 거쳐 정책 엔진의 어드민 표면에 닿습니다. 가입·로그인·2단계 인증이 거치는\n경로는 [개통](/accounts-wallets/onboarding)에 있습니다.\n\n## 다음으로\n\n- [첫 요청](/start/first-request) — 계정을 만들고 입금 주소를 받기까지\n- [계정 계층](/accounts-wallets/accounts) — Workspace·Tenant·Account 세 계층과 `accountId`의 성격\n- [용어](/start/terminology) — 이 페이지가 쓰는 낱말의 한 줄 정의\n\n계약이 약속한 것과 지금 동작이 갈리는 지점은 내부 기록이 따로 모읍니다. 파트너사가 그중 만나는\n것은 `Idempotency-Key`가 아직 재시도 중복을 막지 못한다는 사실 하나이고, 그 서술은\n[첫 요청](/start/first-request)에 있습니다.\n", "kind": "참고 문서", "path": "_reference/start--authentication.html", "reference": true}, {"title": "규제 대응", "text": "---\ntitle: 규제 대응\ndescription: 접속기록·개인정보·보존·암호키가 어느 페이지에 있는가\n---\n\n_읽는 사람: 파트너사 개발자. 통제 항목별로 어느 페이지에 서술이 있는지를 모으고, 없는 항목도 적어 둡니다._\n\n규제 대응에 필요한 서술은 여러 페이지에 나뉘어 있습니다. 이 페이지는 그 서술을 통제 항목별로 모은\n색인입니다. 각 항목은 한두 문장 요약이고 기준 페이지는 링크한 쪽입니다.\n\n색인의 범위는 파트너사가 만나는 통제입니다. [용어](/start/terminology)가 낱말에 하는 일을 여기서는\n통제 항목에 합니다. 기준 서술이 구현팀의 내부 기록에만 있는 항목은 그 사실만 적고 링크를 걸지\n않습니다.\n\n**이 사이트에 서술이 없는 것은 없다고 적었습니다.** 맨 아래 절이 그 목록이고, 그것이 그대로 다음\n작업 목록입니다.\n\n## 접속기록과 감사 기록\n\n둘은 서로 다른 산출물입니다.\n\n- **접속기록**: 운영자 로그인 시도가 주체와 결과를 함께 남깁니다. 인증 통제의 증적이고, 서술은\n  [온보딩](/accounts-wallets/onboarding)에 있습니다.\n- **결정 기록**: 결정을 주체·행위·대상·시각·결과와 함께 남기는 추가 전용 해시 체인입니다. 정책\n  평가가 라운드마다 한 줄을 남기고, 번들 다이제스트·정규화기 버전·입력 전문·결정 전문이 들어갑니다.\n  저장소를 나눈 기준은 내부 기록이 다룹니다.\n- **통제 수행 기록**: 주기 대조는 불일치일 때만이 아니라 일치할 때도 남깁니다. 기록이 없으면\n  \"이상이 없었다\"와 \"돌지 않았다\"를 사후에 가를 수 없기 때문이고, 근거는\n  [운영과 관측](/policy/operations)에 있습니다.\n\n## 결정 기록의 불변성\n\n결정 기록은 갱신도 삭제도 되지 않습니다. 런타임 계정에는 조회와 추가 권한만 있습니다.\n\n앱이 잘못 짜여도 쿼리가 권한에서 막히므로, 이 성질을 코드가 아니라 DB가 집니다. 어느 계정에 어떤\n권한을 주는지는 내부 기록이 적습니다.\n\n각 줄의 해시가 앞줄을 물어, 이미 쓰인 줄을 고치면 뒤가 전부 깨집니다. **다만 이것이 막는 것은\n조작이지 위조 추가가 아닙니다.** 그 한계와 교차 대조 장치도 같은 내부 기록에 적혀 있습니다.\n\n보안 이상은 따로 표시됩니다. 심사 결과의 거래 바인딩이 어긋나면 수집 실패로 처리하되 결정 기록에\n보안 이상으로 남깁니다. 그 규칙은 판단에 필요한 사실을 평가 시점에 읽어 오는 수집 경로인\nPIP([자세히](/policy/runtime/pip))에 있습니다.\n\n## 개인정보가 거쳐 가는 곳\n\n개인정보는 거쳐 가되 저장되지 않습니다.\n\n- **트래블룰 원문**: 트래블룰은 가상자산 이전 시 송·수신 정보를 사업자끼리 교환하는 규제 의무입니다.\n  송수신자 정보는 통과만 시키고 저장소는 트래블룰 제공자 쪽입니다. 저장하는 것은 판정과 그\n  근거이며, 서술은 [에코시스템](/#함께-제공하는-모듈)에 있습니다.\n- **정책 평가 입력**: 심사는 개인정보를 쥔 쪽이 자기 영역 안에서 수행하고 엔진은 결과를 참조로\n  읽습니다. 와이어에 원문이 오가지 않고 스냅샷에도 판정값과 참조 식별자만 남으며, 그 계약은\n  [PIP](/policy/runtime/pip)에 있습니다.\n- **요청 원문**: 엔진은 정규화 전 수신 본문을 어디에도 보관하지 않습니다. 그래서 저장 계층에\n  개인정보가 구조적으로 없고, 그 계약은 내부 기록에 있습니다.\n- **알림 페이로드**: 개인정보·키·토큰·서명 대상 원문을 포함하지 않습니다. 해석해서 얻은 workspace와\n  tenant도 포함하지 않아 거부 응답이 열거 수단이 되지 않으며, 그 규율은\n  [운영과 관측](/policy/operations)에 있습니다.\n- **`referenceId`**: 파트너사가 발급한 사용자 식별자입니다. 내부 식별자만 담는다는 계약이 평문\n  저장의 근거이고, 계약이 바뀌면 저장 암호화와 마스킹을 다시 적용합니다. 자세한 것은\n  [계정 계층](/accounts-wallets/accounts)에 있습니다.\n\n## 파기 의무와 불변 보관\n\n둘이 부딪히지 않는 이유는 설계입니다. 결정 기록에 지워야 할 개인정보가 애초에 들어오지 않습니다.\n그래서 기록을 영구 보관해도 파기 의무와 충돌하지 않고, 그 논증은 내부 기록에 있습니다.\n\n파기 단위는 행이 아니라 파티션입니다. 런타임 계정에 삭제 권한이 없어 행 단위 아카이빙이 구조적으로\n불가능하고, 파기와 이동은 DBA가 파티션 단위로 수행합니다.\n\n## 항목별 보존 기간\n\n보존 기간은 항목마다 다르고 하나는 아직 확정 전입니다.\n\n- **트래블룰 판정 기록**: 특금법상 5년 보관 의무가 Wallet SDK에 있습니다. 의무의 대상은 개인정보가\n  아니라 판정 기록이고, 서술은 [에코시스템](/#함께-제공하는-모듈)에 있습니다.\n- **자금 이동 기록**: 입금은 행이 없는 토큰이라도 기록합니다. 막으면 오입금 반환의 출발지도 보관\n  의무 대상 기록도 사라지기 때문이며, 근거는 [지갑 계층](/accounts-wallets/wallets)입니다.\n- **정책 결정 기록**: 보존 기간 값이 아직 확정되지 않았습니다. 이 기록이 접속기록인지\n  전자금융거래기록인지 업무기록인지에 따라 기간과 점검 주기가 갈리고, 그 판정은 컴플라이언스 확인\n  게이트에 걸려 있습니다. 진행 상태는 내부 기록이 적어 둡니다.\n- **정규화기 구현**: 보존 기간이 서명 인가 TTL로 묶입니다. 재실행이 필요한 구간이 승인부터 콜백까지\n  뿐이고, 그 범위는 [정규화](/policy/runtime/normalization)에 있습니다.\n\n## 암호키 관리의 범위\n\n암호키 관리(key management)를 어디까지 맡는지가 제품 범위를 가릅니다.\n\n- **자산을 움직이는 키는 제품 범위 밖입니다**: 개인키를 관리하는 서버는 파트너사 측에 두고, SaaS\n  형태로 쓰더라도 이 원칙은 같습니다. 그 범위는 [제공 범위](/#무엇을-맡고-무엇을-맡지-않나)에\n  있습니다.\n- **서버 단독 서명을 두지 않습니다**: 키 전체가 한 곳에 온전히 존재하지 않고, 서명은 양쪽이 함께\n  만듭니다. 같은 페이지가 \"소유권이 어디 있는가\"와 \"키를 혼자 쥐는가\"를 갈라 씁니다.\n- **정책 엔진이 보유하는 키는 하나입니다**: 콜백 응답 서명키뿐이고 요청마다 필요해 상주가\n  불가피합니다. 방어가 격리가 아니라 사후 대조에 있다는 것과 로테이션이 구조적으로 어렵다는 것을\n  [운영과 관측](/policy/operations)이 함께 적습니다.\n- **서명 인가는 1회용이고 유효 시간이 있습니다**: 상한 60분에 기본값 20분이며, 대조를 통과하면 그\n  즉시 원자적으로 소비됩니다. 자세한 것은 [서명 게이트](/policy/signing-gate)에 있습니다.\n\n## 접근통제와 권한관리\n\n접근통제와 권한관리는 표면마다 갈립니다.\n\n- **스코프는 인증이 확정하고 요청이 싣지 않습니다**: 스코프 키는 인증이 확정하는 격리 식별자입니다.\n  요청 값은 위조할 수 있어 격리 키로 쓸 수 없고, 그 규율은\n  [표면과 인증](/start/authentication)에 있습니다.\n- **같은 형태의 값이라도 스코프 키와 리소스 식별자는 다릅니다**: 무엇이 스코프 키인지는 그 표면의\n  인증이 무엇을 확정하느냐가 정합니다. 표면별 판정은 내부 기록이 적습니다.\n- **권한을 올리는 변경에는 정족수가 필요합니다**: 정족수는 승인이 성립하는 데 필요한 최소 승인자\n  수입니다([자세히](/policy/rules)). 요청자와 승인자가 같을 수 없다는 조건에는 끄는 노브가\n  없고, 흐름은 [승인 게이트](/policy/sequences/approval-gate)에 있습니다.\n\n## 알려진 결함이 적힌 곳\n\n알려진 결함은 숨기지 않습니다. 계약이 약속한 것과 지금 동작이 갈리는 지점을 내부 기록이 모읍니다.\n\n계약에 있는데 아직 동작하지 않는 것의 전수는 빌드마다 다시 세고, 설계와 구현이 갈라진 지점은 따로\n쌓습니다. 둘 다 같은 내부 기록입니다.\n\n**통제 하나가 폐기된 것도 적혀 있습니다.** 서명 인프라의 인가 정책을 주기로 대조하던 항목을\n걷었고, 대체 절차가 생기기 전까지 그 구간은 수용된 미탐지입니다. 그 사실은\n[운영과 관측](/policy/operations)이 적습니다.\n\n## 사이트에 없는 서술\n\n아래는 **없다는 사실만 적습니다.** 근거가 사이트에 없어 요약할 수 없습니다.\n\n- **보안 이벤트의 전체 목록**: 무엇이 감사 대상이고 주체·행위·대상·시각·결과가 각각 어디에\n  기록되는지를 한 곳에서 답하는 서술이 없습니다. 위 항목은 항목별 조각입니다\n- **자금 이동의 감사 기록**: 정책 엔진 쪽 결정 기록은 서술이 있으나, 지갑 쪽 이동이 무엇을\n  감사로 남기는지의 서술이 없습니다\n- **개인정보 수집 항목과 처리 목적**: 무엇을 수집하고 어느 목적으로 쓰는지의 목록이 없습니다\n- **저장 시 암호화와 데이터 위치**: 암호화 대상·알고리즘·키 길이와 데이터 소재지·국외 이전\n  서술이 없습니다\n- **운영자 역할과 권한 목록**: 역할이 무엇 무엇이고 각각 무엇을 승인할 수 있는지의 표가 없습니다\n- **침해 대응과 사고 통지**: 절차 서술이 없습니다\n- **자금 이동 기록의 재현**: 정책 결정의 재현은 서술이 있으나, 지갑 쪽 기록을 어떻게 재현하는지가\n  없습니다\n", "kind": "참고 문서", "path": "_reference/start--compliance.html", "reference": true}, {"title": "첫 요청", "text": "---\ntitle: 첫 요청\ndescription: 계정을 만들고 입금 주소를 받기까지\n---\n\n_읽는 사람: 파트너사 개발자. Wallet API를 처음 부르는 데 필요한 순서만 다룹니다._\n\n계정 하나를 만들고 그 계정의 입금 주소를 받는 데까지가 이 페이지입니다. 여기까지 오면 나머지는\n자금이 움직이는 이야기입니다.\n\n**여섯 단계이고 그중 셋만 파트너사가 부릅니다.** 앞의 셋은 준비이고, 마지막 하나는 부르는 것이\n아니라 기다리는 것입니다.\n\n## 1. API 키는 받아서 시작합니다\n\n**파트너사가 첫 요청 전에 만드는 것은 없습니다.** 워크스페이스·테넌트·vault 순서로 먼저\n만들어지고, 파트너사는 그 끝에서 나온 API 키 원문 하나를 받습니다.\n\n워크스페이스는 Wallet SDK를 도입한 회사 하나이고 최상위 격리 컨테이너입니다. 테넌트는 Workspace\n아래에서 Account를 묶는 계정 체계 하나이고, 파트너 대상 API의 격리\n키입니다([계정 계층](/accounts-wallets/accounts)). vault는 Wallet의\n그룹입니다([지갑 계층](/accounts-wallets/wallets)).\n\n- **플랫폼이 등록합니다**: 워크스페이스와 네트워크. 워크스페이스는 플랫폼이 밖에서 등록하고,\n  네트워크도 플랫폼 수준에서 관리합니다.\n- **워크스페이스 운영자가 등록합니다**: 테넌트·API 키·토큰·워크스페이스 vault.\n  운영자 표면([Admin API](/reference/admin))으로 등록해야 쓸 수 있습니다.\n- **파트너사가 받습니다**: 등록된 테넌트의 API 키 원문.\n\n순서는 워크스페이스 개통 → 테넌트 등록 → 그 테넌트의 API 키 발급입니다. 자세한 흐름은\n[온보딩](/accounts-wallets/onboarding)에 있습니다.\n\n### 지금은 이 경로가 셀프서비스가 아닙니다\n\n어드민 권한과 정책 자체를 바꾸는 연산인 어드민 액션([자세히](/policy/rule/reference)) 카탈로그에\n온보딩 다섯 액션이 아직 등재돼 있지 않습니다. **그 경로로 보낸 판단 요청은 받지 않고, 그때까지\n온보딩은 플랫폼이 대행합니다.** 판단 요청은 한 업무 요청을 두고 엔진이 소유하는 판단\n기록입니다([자세히](/policy/signing-gate)).\n\n**대행 절차는 아직 이 사이트에 없습니다.** 누구에게 무엇을 요청하고 무엇을 돌려받는지가 문서로\n남아 있지 않습니다. 그때까지 키가 필요한 파트너사는 도입을 담당한 플랫폼 쪽에 직접 문의합니다.\n진행 상황은 [변경 이력](/changelog)에서 추적합니다.\n\n### 키 원문은 한 번만 볼 수 있습니다\n\n발급은 승인 게이팅을 거치므로 생성 응답에 원문이 들어가지 않습니다. 승인 게이팅은 어드민 액션이\n승인자의 확인을 거쳐야 실행되는 통제입니다([자세히](/policy/sequences/approval-gate)).\n\n승인이 끝난 뒤 원문 조회 오퍼레이션이 한 번 내주고, 그 조회로 값이 소멸합니다.\n\n**두 번째 조회는 실패합니다.** 보관 시한이 지나도 같습니다. 그 뒤에 원문을 얻는 길은 재발급뿐이라,\n파트너사는 받는 즉시 시크릿 매니저에 넣습니다.\n\n## 2. 부르는 표면은 Wallet API 하나입니다\n\n표면은 계약 소유자와 인증 방식이 하나로 정해지는 API 경로 묶음입니다. 표면이 다섯이지만\n파트너사가 부르는 것은 [Wallet API](/reference/wallet) 하나입니다. 경로는 전부 `/api/v1/`로\n시작합니다.\n다섯이 무엇이고 누가 부르는지는 [표면과 인증](/start/authentication)에 있습니다.\n\n**호스트는 이 사이트에 없습니다.** 환경마다 다르고 아직 확정 서술이 없어, 키를 받을 때 함께\n확인합니다. 아래 경로는 그 호스트 뒤에 붙는 부분입니다.\n\n## 3. 인증은 API 키 헤더 한 줄입니다\n\n받은 API 키 원문을 `X-API-KEY` 헤더에 넣습니다.\n\n```\nX-API-KEY: \u003cAPI 키 원문>\n```\n\n**스코프를 함께 보내지 않습니다.** `workspaceId`도 `tenantId`도 요청에 싣지 않습니다. 그 키가\n어느 테넌트인지를 서버가 알고 있습니다. 왜 그런지는 [표면과 인증](/start/authentication)에 있습니다.\n\n## 4. 계정을 만듭니다\n\n최종 사용자 한 명이 계정 하나입니다. 파트너사가 발급한 사용자 식별자인\n`referenceId`([자세히](/accounts-wallets/accounts))를 함께 보냅니다.\n\n```\nPOST /api/v1/accounts\n```\n\n```json\n{ \"referenceId\": \"user-8f21c0\" }\n```\n\n**개인정보는 이 값에 넣지 않습니다.** 파트너사 내부 식별자만 담는다는 것이 연동 계약이고, 그 계약이\n이 값을 평문으로 저장하는 근거입니다.\n\n응답 201이 계정 식별자(`acc-`로 시작)를 돌려줍니다. 이 호출은 승인을 거치지 않고 요청 안에서\n끝납니다. 계정 생성은 자금을 움직이지 않기 때문입니다.\n\n### 이미 있는 `referenceId`면 400입니다\n\n`referenceId`는 같은 테넌트 안에서 유일합니다. 이미 쓴 값으로 만들면 거부되고, 그때는 조회로\n기존 계정을 찾습니다.\n\n```\nGET /api/v1/accounts?referenceId=user-8f21c0\n```\n\n재시도 경로에서 이 조회가 필요합니다. 생성 응답을 놓쳤을 때 같은 계정에 도달하는 유일한 길입니다.\n\n## 5. 계정 지갑을 만들고 주소를 받습니다\n\n지갑은 토큰 하나를 담습니다. 토큰은 Network 위의 자산이고 Wallet이 담는\n단위입니다([카탈로그](/accounts-wallets/catalog)). 그래서 만들기 전에 어느 토큰인지를 정해야 합니다.\n\n```\nGET /api/v1/tokens\n```\n\n이 목록에는 토큰과 소속 네트워크가 모두 활성인 것만 나옵니다. 파트너 계약에 상태 필드가 없어,\n목록에 있다는 사실 자체가 \"쓸 수 있다\"는 신호입니다.\n\n거기서 고른 `tokenId`로 지갑을 만듭니다.\n\n```\nPOST /api/v1/accounts/{accountId}/account-wallets\nIdempotency-Key: \u003c파트너사가 만든 값>\n```\n\n```json\n{ \"tokenId\": \"tok-1234567890abcdef\" }\n```\n\n응답 201이 `walletAddress`를 돌려줍니다. **이 주소를 최종 사용자에게 건네면 준비가 끝납니다.**\n\n### 미리 알아 둘 것이 둘 있습니다\n\n**`Idempotency-Key`는 필수 헤더인데 아직 동작하지 않습니다.** 값을 보내야 요청이 통과하지만 서버가\n받아서 버립니다. 그래서 재시도 중복을 막지 못하고, 응답을 놓친 파트너사는 목록 조회로 확인합니다.\n\n```\nGET /api/v1/accounts/{accountId}/account-wallets\n```\n\n주소를 재발급해도 계정과의 연결은 끊기지 않습니다. 발급 단위는 주소가 아니라 지갑이고 주소는\n거기 붙는 값이라, 보안 사고나 지갑 분실 상황에서 서비스가 계속 동작합니다.\n\n## 6. 입금은 부르지 않고 기다립니다\n\n**입금 API는 없습니다.** 그 주소로 온체인 전송이 들어오면 시스템이 관측해 입금 기록을 만듭니다.\n파트너사가 부를 것이 없습니다.\n\n들어온 자금은 확정되면 동결 상태가 됩니다. 동결은 입금을 확정 시 fail-closed로 잡아 두는\n상태입니다([자금 동결](/fund-flows/release)). 온체인 입금은 거부할 수 없어서 모든 입금이 같은 경로를\n거치고, 그것을 푸는 것은 명시적인 해제 요청입니다.\n\n조회는 계정 단위입니다.\n\n```\nGET /api/v1/accounts/{accountId}/deposits\n```\n\n여기서부터는 [입금](/fund-flows/deposit)이 이어받습니다.\n\n## 다음으로\n\n- [입금](/fund-flows/deposit) — 관측에서 확정 통지까지\n- [자금 동결](/fund-flows/release) — 왜 동결로 들어오고 어떻게 푸나\n- [집금](/fund-flows/sweep) — 계정 지갑에 모인 자금을 옮기는 유일한 경로\n- [웹훅](/fund-flows/webhooks) — 무엇이 언제 오나\n- [Wallet API](/reference/wallet) — 위 오퍼레이션의 계약 기준 문서\n", "kind": "참고 문서", "path": "_reference/start--first-request.html", "reference": true}, {"title": "용어", "text": "---\ntitle: 용어\ndescription: 어느 말이 무엇을 가리키고 그 정의가 어디 있는지\n---\n\n_읽는 사람: 파트너사 개발자. 이 사이트에서 쓰는 도메인 용어의 색인입니다._\n\n이 페이지는 용어마다 한 줄 정의와 자세한 설명이 있는 페이지를 안내합니다. 다른 페이지가 용어를\n처음 쓸 때 붙이는 한 줄은 여기의 문구를 그대로 복사한 것입니다.\n\n색인의 범위는 파트너사가 이 사이트를 읽다가 만나는 용어입니다. 구현팀만 쓰는 항목도 표에는 두되,\n정의 위치를 「설계 기록(내부)」로만 적고 이 사이트에 페이지를 두지 않습니다.\n\n같은 말을 두 곳에서 정의하면 언젠가 갈립니다. 기준 문구를 여기 한 곳에 두고 다른 페이지가 그것을\n복사하는 것이 그것을 막는 방법입니다.\n\n## 미승격 표시\n\n정의 위치가 `미승격`인 용어는 그 정의가 아직 이 사이트에 없다는 뜻입니다. 페이지 자체가 없는 것도\n있고, 페이지는 있는데 그 용어를 아직 안 담은 것도 있습니다. 그때까지의 기준 문서는 저장소의 설계\n문서이고, 페이지가 생기는 대로 이 표를 채웁니다.\n\n## 격리 컨테이너\n\n격리 컨테이너는 세 계층입니다.\n\n| 용어 | 무엇인지 | 정의 위치 |\n|---|---|---|\n| JV | 플랫폼을 운영하는 합작 법인입니다. Workspace 생성과 시드 정책의 권한 뿌리입니다 | 미승격 |\n| Workspace | Wallet SDK를 도입한 회사 하나입니다. 최상위 격리 컨테이너입니다 | [계정 계층](/accounts-wallets/accounts) |\n| Tenant | Workspace 아래에서 Account를 묶는 계정 체계 하나입니다. 파트너 대상 API의 격리 키입니다 | [계정 계층](/accounts-wallets/accounts) |\n| 파트너사 | Wallet SDK를 도입한 회사, 곧 Workspace 하나입니다. 이 사이트에서 그 회사를 부르는 말은 이것 하나입니다 | [계정 계층](/accounts-wallets/accounts) |\n| Account | 그 서비스의 최종 사용자 한 명을 wallet 안에서 대리하는 virtual 사용자입니다 | [계정 계층](/accounts-wallets/accounts) |\n| `accountId` | Wallet SDK가 발급해 Account를 지칭하는 값입니다. 스코프 키가 아닙니다 | [표면과 인증](/start/authentication) |\n| `referenceId` | 파트너사가 발급한 사용자 식별자입니다. 유일성은 Tenant 안에서만 성립합니다 | [계정 계층](/accounts-wallets/accounts) |\n| 스코프 키 | 인증이 확정하는 격리 식별자입니다. 요청이 싣지 않습니다 | [표면과 인증](/start/authentication) |\n| 스코프 축 | 어떤 데이터가 어느 스코프 키로 격리되는지의 분류입니다 | 설계 기록(내부) |\n\n## 표면과 인증\n\n표면마다 인증이 확정하는 것이 다릅니다.\n\n| 용어 | 무엇인지 | 정의 위치 |\n|---|---|---|\n| 표면 | 계약 소유자와 인증 방식이 하나로 정해지는 API 경로 묶음입니다 | [표면과 인증](/start/authentication) |\n| API 키 | 파트너사가 파트너 대상 API를 부를 때 제시하는 인증 수단입니다 | [표면과 인증](/start/authentication) |\n| 어드민 세션 | 로그인과 2단계 인증을 지나 받는 불투명 크리덴셜입니다 | [표면과 인증](/start/authentication) |\n| AdminUser | 운영자 표면을 부르는 사람 주체입니다. API 키와 달리 사람을 식별합니다 | 미승격 |\n| Policy Server | 승인·정책 평가와 어드민 역할을 소유하는 별도 시스템입니다 | 미승격 |\n| 소속 스코프 | 어드민 계정이 속한 스코프 하나입니다. `platform` 또는 `workspace:{id}`이고, 계정의 모든 부여는 소속과 같아야 합니다 | 설계 기록(내부) |\n| 문 | 어드민 표면의 진입 경로 둘입니다. platform 문은 `/platform/**` 아래 표면이고 워크스페이스 문은 접두 없는 표면입니다. 세션의 소속과 어긋나면 거부합니다 | 설계 기록(내부) |\n| 릴레이 | WalletAdmin이 콘솔에서 받은 어드민 세션 자격을 저장하지 않고 그대로 Policy Server에 실어 보내는 것입니다 | 설계 기록(내부) |\n| introspection | 자격을 받은 쪽이 발급자에게 그 세션의 주체·소속·부여를 묻는 것입니다. 발급자가 답하지 않으면 그 표면은 닫힙니다 | 설계 기록(내부) |\n| 스텝업 | 어드민 세션 위에 행위 단위로 본인을 다시 증명하는 절차입니다. 챌린지와 TOTP로 이뤄지고 권한은 전후로 같습니다 | 설계 기록(내부) |\n\n## 자산과 지갑\n\n자산은 어느 네트워크의 어느 토큰인지로 구분하고 Vault와 Wallet에 담깁니다.\n\n| 용어 | 무엇인지 | 정의 위치 |\n|---|---|---|\n| Vault | Wallet의 그룹입니다 | [지갑 계층](/accounts-wallets/wallets) |\n| Wallet | 토큰 하나를 담습니다. 온체인 주소가 여기 붙습니다 | [지갑 계층](/accounts-wallets/wallets) |\n| WorkspaceVault · WorkspaceWallet | Workspace에 귀속된 vault와 토큰별 지갑입니다 | [지갑 계층](/accounts-wallets/wallets) |\n| AccountVault · AccountWallet | Account에 귀속된 vault와 토큰별 수취 지갑입니다 | [지갑 계층](/accounts-wallets/wallets) |\n| vault 태그 | 파트너사가 vault 용도를 정의하는 값입니다. 앱은 해석하지 않습니다 | [지갑 계층](/accounts-wallets/wallets) |\n| Network | 블록체인 네트워크입니다. 계열에 따라 주소 체계가 갈립니다 | [카탈로그](/accounts-wallets/catalog) |\n| Token | Network 위의 자산입니다. Wallet이 담는 단위입니다 | [카탈로그](/accounts-wallets/catalog) |\n| 회사 외부 지갑 | Workspace가 소유하나 이 시스템 밖에 있는 지갑입니다 | [이동 종류](/fund-flows/movements) |\n| 주소록 | 주소에 등재 근거를 붙이는 장부입니다. 계정 주소록과 워크스페이스 주소록으로 갈립니다 | [주소록](/fund-flows/address-book) |\n| 화이트리스트 | 출금 통제에서 부르는 주소록의 다른 이름입니다. 등재 여부는 정책 입력이지 거절 사유가 아닙니다 | [주소록](/fund-flows/address-book) |\n| 소유 증명 | 개인 지갑을 주소록에 올리기 전에 최종 사용자가 그 키로 서명해 보이는 절차입니다 | [주소록](/fund-flows/address-book) |\n| 소유 증명 챌린지 | 등록 직전에 서버가 발급하는 일회용 서명 대상입니다 | [주소록](/fund-flows/address-book) |\n| Vault 소유 해석 | vault 식별자 하나로 소유 workspace와 tenant를 확정하는 조회입니다 | [PIP](/policy/runtime/pip) |\n\n## 자금 이동\n\n자금 이동은 일곱 가지뿐입니다.\n\n| 용어 | 무엇인지 | 정의 위치 |\n|---|---|---|\n| 동결 | 입금을 확정 시 fail-closed로 잡아 두는 상태입니다 | [자금 동결](/fund-flows/release) |\n| 해제 | 동결을 푸는 것입니다. 언제나 명시적 요청입니다 | [자금 동결](/fund-flows/release) |\n| 입금 갱신 통지 (`DEPOSIT_UPDATED`) | 확정 뒤에 트래블룰 매핑이나 KYT 결과가 붙을 때마다 그 순간까지의 정보를 전부 실어 보내는 통지입니다 | [입금](/fund-flows/deposit) |\n| 사전 확인 · 사후 확인 | 동결 해제 판단 재료를 온체인 확정 이전에 얻는 것(트래블룰·주소록)과 이후에 얻는 것(AML·FDS·KYT)으로 나눈 구분입니다 | [입금](/fund-flows/deposit) |\n| 가용 잔액 | 온체인 잔액에서 동결분과 진행 중 출금 예약분을 뺀 값입니다 | [출금](/fund-flows/withdrawal) |\n| 자금 귀속 | 그 자금이 Account 것인지 Workspace 것인지입니다. 무엇이 격리되는지를 정합니다 | [이동 종류](/fund-flows/movements) |\n| 계정 지갑 입금 (`awd-`) | VASP·개인 지갑에서 계정 지갑으로 들어온 자금입니다. 거부할 수 없고 확정되면 동결로 받습니다 | [입금](/fund-flows/deposit) |\n| 워크스페이스 지갑 입금 (`wwd-`) | 회사 외부 지갑에서 워크스페이스 vault로 들어온 자금입니다. 거부할 수 없고 확정되면 동결로 받습니다. 해제는 운영자의 독립 요청입니다 | [이동 종류](/fund-flows/movements) · [자금 동결](/fund-flows/release) |\n| 집금 (`swp-`) | 계정 지갑 자산을 워크스페이스 vault로 모으는 이동입니다 | [집금](/fund-flows/sweep) |\n| Vault 이체 (`wvt-`) | 워크스페이스 vault 사이의 이동입니다 | [Vault 이체](/fund-flows/vault-transfer) |\n| 계정 귀속 출금 (`wwac-`) | 워크스페이스 vault에서 나가는 최종 사용자 귀속 출금입니다 | [출금](/fund-flows/withdrawal) |\n| 자기 귀속 출금 (`wwsf-`) | 회사 외부 지갑으로 나가는 회사 자기 자금 출금입니다 | [출금](/fund-flows/withdrawal) |\n| 계정 지갑 출금 (`aww-`) | 계정 지갑에서 직접 나가는 이동입니다. 알려진 용도는 오입금 반환입니다 | [출금](/fund-flows/withdrawal) |\n| 통지 | 온체인 이벤트를 파트너사에 보내는 아웃바운드 호출입니다. 웹훅에 실리는 내용물입니다 | [웹훅](/fund-flows/webhooks) |\n| 웹훅 | 통지를 나르는 채널입니다 — 파트너사가 등록한 URL로의 HTTP 호출입니다 | [웹훅](/fund-flows/webhooks) |\n| 대사 | 기록과 뒷단 플랫폼의 사실이 어긋난 것을 바로잡는 2차 방어입니다 | 미승격 |\n| 트래블룰 | 가상자산 이전 시 송·수신 정보를 사업자끼리 교환하는 규제 의무입니다 | [에코시스템](/#함께-제공하는-모듈) |\n\n## 정책 엔진의 역할\n\n| 용어 | 무엇인지 | 정의 위치 |\n|---|---|---|\n| 정책 엔진 | 자금을 움직이는 요청이 서명 인프라로 가기 전에 그 요청을 심사하는 별도 시스템입니다. 특정 컴포넌트가 아니라 아래 역할 전체를 가리킵니다 | [구조](/policy/architecture) |\n| Orchestrator | 판단 요청을 접수하고 입력 문서를 조립하고 PIP 수집과 obligation 루프를 조율하는 정책 엔진의 앞단입니다. 판정 자체는 하지 않습니다 | [구조](/policy/architecture) |\n| 평가기(PDP) | 완성된 입력 문서를 평가해 결정을 내는 역할입니다. 밖을 부르지 않습니다 | [구조](/policy/architecture) |\n| PIP | 판단에 필요한 사실을 평가 시점에 읽어 오는 수집 경로입니다. Orchestrator 안의 어댑터 계층입니다 | [PIP](/policy/runtime/pip) |\n| PAP | 룰을 저작·검증·발행하는 경로 전체를 부르는 이름입니다 | [저작과 발행](/policy/workflow) |\n| PEP | 서명 인프라 콜백을 받아 인가 대조를 Orchestrator에 넘기는 지점입니다 | [서명 게이트](/policy/signing-gate) |\n| Co-Signer | 서명 인프라 쪽에서 서명 직전에 정책 엔진 콜백으로 승인을 묻는 구성 요소입니다 | [서명 게이트](/policy/signing-gate) |\n| Wallet 서버 | 파트너 대상 API를 받아 정책 엔진에 판단을 묻고 서명 인프라에 제출하는 Wallet SDK의 서버 컴포넌트입니다 | [구조](/policy/architecture) |\n| 서명 인프라 | 키를 보관하고 트랜잭션에 서명하는 뒷단 플랫폼의 서명 부분입니다. Wallet SDK 단독으로는 서명이 성립하지 않습니다 | [시작하기](/start) |\n| 입력 문서 | Orchestrator가 요청·환경·PIP 결과를 모아 평가기에 넘기는 완성된 평가 입력입니다 | [평가의 순간](/policy/runtime/evaluation) |\n| 결과 스냅샷 | PIP가 돌려준 값을 참조 id·수집 시각·출처와 함께 고정한 기록입니다. PII를 담지 않습니다 | [PIP](/policy/runtime/pip) |\n| 서명 연산 | 정책 엔진이 심사하는 첫 영역입니다. `withdrawal`·`custody_transfer`·`sweep`·`contract_call`·`typed_signature` 다섯 연산의 허가 요청입니다 | [룰 명세](/policy/rule/reference) |\n| 어드민 액션 | `operation`이 `admin_action`인 요청입니다. 개별 액션은 `payload.action`으로 가르고, 워크스페이스 스코프 액션은 액션 카탈로그의 `domain`이 `\"2\"`입니다 | [룰 명세](/policy/rule/reference) |\n| 정책 변경 액션 | 플랫폼 스코프의 어드민 액션입니다. 로직 번들의 룰 모듈과 카탈로그를 바꾸는 액션이고, 액션 카탈로그의 `domain`이 `\"3\"`인 항목입니다 | [룰 명세](/policy/rule/reference) |\n\n## 시스템 밖의 배역\n\n시퀀스 다이어그램에 등장하는 Wallet SDK 밖의 주체와 저장소입니다. 배역 리스트가 이 표를 복사합니다.\n\n| 용어 | 무엇인지 | 정의 위치 |\n|---|---|---|\n| 최종 사용자 | 파트너사 서비스를 쓰는 사람입니다. Wallet SDK 안에서는 Account가 대리합니다 | [계정 계층](/accounts-wallets/accounts) |\n| 상대 거래소(VASP) | 최종 사용자가 자산을 보내거나 받는 상대편 가상자산사업자입니다 | [입금](/fund-flows/deposit) |\n| 뒷단 플랫폼 | 키 보관·서명과 온체인 관측을 맡는 외부 지갑 인프라입니다. Wallet SDK가 그 위에 구축됩니다 | [시작하기](/start) |\n| 온체인 | 블록체인 네트워크 위에서 일어나는 전송과 상태입니다. 온체인 전송은 되돌릴 수 없습니다 | [입금](/fund-flows/deposit) |\n| 지갑 원장 | Wallet SDK가 계정·지갑·이동 기록을 저장하는 자기 DB입니다. 파트너사 원장과는 다릅니다 | [도메인 모델](/accounts-wallets/domain-model) |\n| 트래블룰 게이트웨이 | 트래블룰 정보를 상대 거래소와 교환하는 중계 시스템입니다 | [입금](/fund-flows/deposit) |\n| 이벤트 스트림 | 정책 엔진이 판단 완료·거부 결과를 내보내고 Wallet 서버가 구독하는 비동기 채널입니다 | [서명 게이트](/policy/signing-gate) |\n| 인가 저장소 | 발급된 단회성 인가를 보관하고 소비를 기록하는 저장소입니다 | [서명 게이트](/policy/signing-gate) |\n| 승인 게이팅 | 어드민 액션이 승인자의 확인을 거쳐야 실행되는 통제입니다 | [승인 게이트](/policy/sequences/approval-gate) |\n| 활성 revision | 활성 포인터가 가리키는 번들 개정판입니다. 지금 서빙되는 것입니다 | 설계 기록(내부) |\n| TSID | 시간순으로 정렬되는 64비트 식별자입니다. 접두사를 붙여 종류를 드러냅니다 | 설계 기록(내부) |\n| 드리프트 | 설계와 구현이 어긋난 자리를 기록한 항목입니다 | 설계 기록(내부) |\n\n## 판단의 단계\n\n판단은 요청·평가·인가를 거칩니다.\n\n| 용어 | 무엇인지 | 정의 위치 |\n|---|---|---|\n| 업무 요청 | 소유 서비스가 자기 도메인에서 만든 요청입니다 | 설계 기록(내부) |\n| 판단 요청 | 한 업무 요청을 두고 엔진이 소유하는 판단 기록입니다 | [서명 게이트](/policy/signing-gate) |\n| 결정 | 커널이 내는 네 종류의 종결입니다 — `allow`·`deny`·`pending`·`need_more_data` | [결정과 결합](/policy/rule/decision) |\n| `effect` | 룰이 적을 수 있는 두 값입니다 — `allow`·`deny` | [룰 쓰기](/policy/rules) |\n| obligation | 통과로 확정되기 전에 이행해야 하는 조건입니다 | [룰 쓰기](/policy/rules) |\n| 정족수 | 승인이 성립하는 데 필요한 최소 승인자 수입니다 | [룰 쓰기](/policy/rules) |\n| 평가 라운드 | 한 판단 요청 안에서 평가가 몇 번째로 실행됐는지입니다 | [결정과 결합](/policy/rule/decision) |\n| 커널 | 조건 트리를 평가하고 결정을 결합하는 정책 무관 고정 부분입니다 | [결정과 결합](/policy/rule/decision) |\n| 룰 | `scope`와 조건을 갖고 `allow`·`deny`를 내는 단위입니다 | [룰 쓰기](/policy/rules) |\n| 값 이동 | 출금·vault 이체·집금처럼 자산을 실제로 움직이는 연산 셋입니다 | [결정과 결합](/policy/rule/decision) |\n| 룰 모듈 | 관심사 단위의 평가 경계입니다. 폴더가 아닙니다 | 설계 기록(내부) |\n| 슬롯 | 카탈로그에 선언되고 워크스페이스가 조정할 수 있는 값입니다 | [룰 쓰기](/policy/rules) |\n| 조건 트리 | `all`·`any`·`not`과 비교·멤버십 리프로 이루어진 룰의 조건식입니다 | [룰 쓰기](/policy/rules) |\n| PIP 소스 | 룰이 참조하는 외부 사실의 출처입니다 | [PIP](/policy/runtime/pip) |\n| 단회성 인가 | 승인된 판단 요청이 발급하는 한 번만 쓸 수 있는 서명 근거입니다 | [서명 게이트](/policy/signing-gate) |\n| `signingAuthorizationId` | 그 인가를 가리키는 식별자입니다. 지갑이 뒷단 플랫폼 제출의 외부 참조 id로 싣습니다 | 설계 기록(내부) |\n| 인가 TTL | 발급된 인가가 유효한 시간입니다. 인가에 붙는 값이지 식별자에 붙는 값이 아닙니다 | [서명 게이트](/policy/signing-gate) |\n| 승인 스탬프 | 승인할 때 정해져 소비 시점에 적용되는 유효값입니다 — 인가 TTL과 건당 자원 상한 | [정규화](/policy/runtime/normalization) |\n| canonical intent | 판단과 서명 대조의 기준이 되는 엔진 정규 표현입니다 | [정규화](/policy/runtime/normalization) |\n| 결정 전문 | 조회가 돌려주는 판단의 내용입니다 | 설계 기록(내부) |\n| 서명 권한 바인딩 값 | 콜백 서명 주체가 인가된 주체인지 대조하는 값입니다. 출발 온체인 주소와 provider vault 식별자입니다 | [정규화](/policy/runtime/normalization) |\n| TAP | 뒷단 플랫폼이 트랜잭션을 인가할 때 적용하는 정책입니다 | 미승격 |\n| 백스톱 상한 | TAP에 설정하는 건당·일일 총액 상한입니다. 정책 엔진이 장애일 때도 따로 동작하는 방어선입니다 | 미승격 |\n\n**`signingAuthorizationId`와 인가 TTL은 붙어 다녀 헷갈립니다.** 수명은 인가에 붙고 식별자는\n그것을 가리킬 뿐이라, 지갑 쪽에서 그 값은 외부 참조 id로만 쓰입니다.\n\n## 정책 산출물\n\n정책 산출물은 두 계열로 갈립니다.\n\n| 용어 | 무엇인지 | 정의 위치 |\n|---|---|---|\n| 저작 세트 | 룰 모듈과 카탈로그·레지스트리 파일이 놓이는 묶음입니다 | [구조](/policy/architecture) |\n| 채점 | 컴파일된 룰이 의도대로 판정하는지 테스트 벡터로 재는 검사입니다 | [구조](/policy/architecture) |\n| 정책 로직 번들 | 룰과 선언 데이터를 커널과 함께 담아 발행한 배포 산출물입니다 | 설계 기록(내부) |\n| 워크스페이스 번들 | 한 워크스페이스가 소유하는 값 이동 룰과 슬롯 값입니다 | 설계 기록(내부) |\n| draft | 콘솔에서 편집 중인 저작물의 머리입니다. 편집은 언제나 새 revision을 쌓습니다 | [룰 저작과 발행](/policy/workflow) |\n| revision | draft에 쌓이는 편집 한 판입니다. 지난 revision은 고쳐지지 않고 주소로 되찾을 수 있습니다 | [룰 저작과 발행](/policy/workflow) |\n| 기준선 | 활성 번들에서 유도해 편집기가 처음 보여 주는 내용입니다 | [룰 저작과 발행](/policy/workflow) |\n| 내용 해시 | 검증을 통과한 revision의 내용에서 계산한 해시입니다. 승인은 이 값에 묶입니다 | [저장과 이동](/policy/runtime/storage) |\n| 정책 콘솔 | 룰을 저작하고 승인하고 발행하는 사람의 화면입니다 | [룰 저작과 발행](/policy/workflow) |\n| maker-checker | 제안자와 승인자를 갈라 두는 정책 변경 거버넌스입니다 | [정책 엔진](/policy) |\n| 시드 정책 | 워크스페이스 등록이 심는 첫 번들입니다. 저작의 출발점이지 결과가 아닙니다 | [개통](/accounts-wallets/onboarding) |\n| 활성 포인터 | 지금 무엇이 서빙되는지를 정하는 단일 기록입니다 | 설계 기록(내부) |\n| 결정 기록 | 결정을 주체·행위·대상·시각·결과와 함께 남기는 추가 전용 해시 체인입니다 | 설계 기록(내부) |\n| 어드민 액션 | 어드민 권한과 정책 자체를 바꾸는 연산들입니다 | [룰 명세](/policy/rule/reference) |\n| escalation surface | 어드민 액션 중 권한을 올리는 성격의 것들입니다 | 미승격 |\n| 발행 가능 어드민 | 활성 신원·활성 2팩터 자격증명·발행 역할 셋을 갖춘 사람입니다 | 미승격 |\n| 어드민 초대 | 어드민이 자기 세션으로 다른 어드민 계정과 등록 토큰을 만드는 행위입니다 | [개통](/accounts-wallets/onboarding) |\n| 발행 자격 부여 | 워크스페이스 매니저가 자기가 갖지 않은 발행 역할을 주는 것입니다 | 미승격 |\n| 부트스트랩 root | 빈 환경에서 어드민 계정을 만들기 위해서만 성립하는 일회성 자격입니다 | 미승격 |\n| 2팩터 소유 증명 | 서버가 낸 TOTP 시드를 그 시드로 만든 코드로 보이는 것입니다 | [개통](/accounts-wallets/onboarding) |\n\n## 쓰지 않는 이름\n\n같은 것을 두 이름으로 부르지 않습니다. 아래 왼쪽은 쓰지 않습니다. 이름이 바뀐 것도 있고 개념\n자체가 폐기된 것도 있습니다.\n\n| 쓰지 않는 표현 | 대신 | 근거 |\n|---|---|---|\n| Asset을 카탈로그 3층으로 | Token과 `symbol` | `D19`·`D-219` — 별도 엔티티를 두지 않습니다 |\n| Omnibus Wallet · Deposit Wallet | WorkspaceVault · AccountVault | `D43` — 용도를 앱이 정의하지 않습니다. 다만 우리말 \"집금 지갑\"은 제품 쪽에서 씁니다 — 바로 아래 절 |\n| CustodyVault · CustodyWallet · DepositVault · DepositWallet | WorkspaceVault · WorkspaceWallet · AccountVault · AccountWallet | `D43`·`D48` — 자금 귀속을 이름에 드러냅니다 |\n| Withdrawal 한 종류 | 계정 귀속 출금 · 자기 귀속 출금 · 계정 지갑 출금 | `D48`·`D49` — 귀속이 다르면 격리 기준이 갈립니다 |\n| `asset.id` · vault×asset 좌표 | 토큰 식별자 · vault×token 좌표 | `D-219` — 체인 무관 자산 키를 채울 기준 문서가 없습니다 |\n| 정책 번들 · 로직 번들 · 중앙 서명 번들 | 정책 로직 번들 | 용어 통일 |\n| 파라미터 번들 · 워크스페이스 파라미터 번들 | 워크스페이스 번들 | `D-57` — 룰 선언까지 담게 되어 이름이 내용을 못 따라갔습니다. \"파라미터 슬롯\"은 그대로 씁니다 |\n| 번들 서명자 | (없습니다) | `D-95` — 별도 배포 단위와 번들 서명 개념이 함께 사라졌습니다 |\n| \"Policy Engine\"을 평가 컴포넌트 뜻으로 | 평가기(PDP) | 시스템 전체 이름과 컴포넌트 이름을 갈라 씁니다 |\n| 룰 모듈을 Policy · PolicySet으로 | 룰 모듈 | 표기 통일 |\n| Advice | obligation | 도입하지 않습니다 |\n| 슬롯 cap · 고정 슬롯 | 하한(floor)만 | `D-64` — 상한은 커널 상수이고, 조정 불허 값은 룰에 직접 씁니다 |\n| degraded 모드 · fail-open · PIP class 구분 | (없습니다) | `D-70` — 모든 소스 장애는 fail-closed입니다 |\n| `wallet_ownership` | `vault_ownership` | `D-49`·`D-50` |\n| 내부 목적지의 온체인 주소 | 목적지 vault 식별자 | `D-49`·`D-50` — 주소는 엔진이 해석합니다 |\n| `requestId` 단독 | 업무 요청 식별자 · 판단 요청 식별자 · 서명 인가 식별자 중 명시 | 셋은 수명이 다릅니다 |\n| `referenceId`류를 접수 중복 거부 키로 | 업무 요청 식별자 | `D-49`·`D-78` |\n| `seq` 단독 | 발행 순번 · 평가 라운드 중 명시 | `D-77` — 둘은 대응하지 않습니다 |\n| 비동기 PIP를 \"webhook\"이라 부르기 | 아웃바운드 트리거 뒤 인증된 인바운드 제출 | 이 문서군에서 통지는 아웃바운드 한 방향입니다 |\n| 맨 \"요청\" | 업무 요청 · 판단 요청 중 명시 | 식별자가 다릅니다 |\n| 맨 \"번들\" | 정책 로직 번들 · 워크스페이스 번들 중 명시 | 발행 경로·거버넌스·수명이 다릅니다 |\n| \"거부\"로 `pending`·`need_more_data`를 가리키기 | 거부는 `deny`만 | 둘은 거부도 통과도 아닙니다 |\n| \"활성\"을 버전 체인의 최신으로 | 활성 포인터가 가리키는 것 | 해석으로 만들면 되돌리기를 표현할 수 없습니다 |\n| \"해시\" 단독 | payload 해시 · 수신 바디 해시 중 명시 | 대상이 다릅니다 |\n| 정책 문맥의 계열 단독 | 룰이 참조하는 경로 `chain.family` (카탈로그 응답에서는 `protocol`) | 정책 번들 revision 계열과 겹칩니다. 카탈로그 서술의 「계열」은 네트워크 주소 체계를 뜻합니다 |\n\n## 제품의 말과 도메인의 말\n\n제품에서 쓰는 말을 도메인에서 그대로 쓰지 않습니다. 같은 대상을 [홈](/)과 [계정과\n지갑](/accounts-wallets)이 다른 말로 부릅니다. 앞은 Wallet SDK가 시장에서 무엇을 대상으로 하는지를\n말하고, 뒤는 시스템이 무엇을 강제하는지를 말하기 때문입니다.\n\n### 집금 지갑\n\n집금 지갑은 제품에서 쓰는 말입니다. [홈](/)이 \"규제 준수형 집금 지갑\"을 포지셔닝 어휘로 씁니다.\n개별 지갑(segregated wallet)·내장형 지갑(embedded wallet)과 대비되는 시장 범주입니다. Wallet\nSDK가 어느 쪽을 대상으로 하는지가 그 대비에서 나옵니다.\n\n도메인에서는 쓰지 않습니다. 도메인 이름은 `WorkspaceVault`·`WorkspaceWallet`과\n`AccountVault`·`AccountWallet`이고, `Omnibus Wallet`·`Deposit Wallet`은 쓰지 않습니다.\n\n가르는 근거는 `D43`입니다. 지갑의 용도를 시스템이 정의하지 않기로 정했습니다. 고객이 태그로\n정하고 앱은 그 태그를 해석하지 않습니다. 용도를 이름에 박으면 그 결정이 그 자리에서 깨집니다.\n집금이 아닌 용도로 쓰는 vault를 `Omnibus Wallet`이라 부를 수 없기 때문입니다.\n\n**그래서 둘이 부딪히지 않습니다.** 제품의 \"집금 지갑\"은 파트너사 대다수가 그렇게 쓴다는\n시장 사실입니다. 도메인이 그 말을 쓰지 않는 것은 시스템이 그 용도를 강제하지 않는다는 설계 사실입니다.\n\n### 주소와 발급 단위\n\n주소는 발급 단위가 아니라 속성입니다. 제품에서는 주소를 발급 단위로 말합니다. [홈](/)이\n\"사용자별 입금 주소를 발급한다\"고 씁니다. 파트너사가 사는 것이 그 주소이기 때문입니다.\n\n**도메인에서 발급 단위는 `AccountWallet`이고 주소는 거기 붙는 값입니다.** 주소가 바뀌어도 그\n행은 남고, 그래서 재발급이 사용자와의 연결을 끊지 않습니다. 주소를 발급 단위로 두면 이 성질을\n말할 자리가 없습니다.\n\n## 설계 문서와의 어휘 대조\n\n설계 문서와 이 사이트는 어휘가 갈립니다. 읽는 사람이 다르기 때문입니다. 저장소의 설계 문서는\n내부 컴포넌트 이름을 그대로 쓰고, 이 사이트는 대외 어휘로 바꿉니다.\n\n| 설계 문서 | 이 사이트 |\n|---|---|\n| Sweep | 집금 |\n| 제휴사 | 파트너사 |\n| custody provider | 뒷단 플랫폼 |\n| Admin User | 운영자 |\n| 회사외부지갑 | 회사 외부 지갑 |\n| 이동 type | 이동 종류 |\n| WalletAccount | Account |\n| WorkspaceVaultTransfer | Vault 이체 |\n| 결정 로그 | 결정 기록 |\n\n**흐름 자체는 바꾸지 않습니다.** 이름만 갈아 끼우고 판정·순서·조건은 설계 문서 그대로 옮깁니다.\n\n## 이름공간과 표기 규칙\n\n이름공간은 둘이고 경계에서 이름이 바뀝니다. API 표면은 camelCase를 쓰고, 엔진 내부 정규 표현의\n경로는 snake_case를 씁니다. 두 이름공간의 매핑은 케이스 변환 규칙이 아니라 연산별 명시 선언이고,\n정규화기가 그것을 소유합니다(`D-52`).\n\nenum 값의 기준 문서는 TypeSpec입니다. 문서에는 값 목록을 복사하지 않고 원칙만 둡니다. 값 자체는\n[API 레퍼런스](/reference)에 있습니다.\n\n판단 입력의 최상위는 룰이 참조하는 값과 `_engine` 예약 키로 나뉩니다(`D-71`). `_engine`은\n커널 전용이라 룰이 참조할 수 없고, 카탈로그 필드와 PIP 소스명은 `_`로 시작할 수 없습니다.\n컴파일이 이것을 검사합니다.\n\n표시명과 안정 식별자를 구분합니다. 사람이 읽는 이름을 시스템의 신뢰 근거로 올리지 않고, 인증된\ncaller 신원과 매핑되는 안정 식별자를 씁니다.\n\n식별자는 경계에서 불투명 문자열입니다(`D-105`). 접두사가 붙어 있어도 소비자는 그 포맷에\n의존하지 않습니다.\n\n**룰 식별자는 불변이고 은퇴한 것도 재사용하지 않습니다.** 재사용하면 과거 결정 기록이 어느 룰을\n가리키는지 판정할 수 없게 됩니다.\n", "kind": "참고 문서", "path": "_reference/start--terminology.html", "reference": true}]</script><script>parent.postMessage({kind:"wallet-readable-search-v1",records:JSON.parse(document.getElementById("data").textContent)},"*");</script></html>
