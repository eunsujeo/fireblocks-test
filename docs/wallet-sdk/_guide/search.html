널 장애가\n곧 서비스 장애입니다.\n\n같은 항목의 반복은 키별 최소 발송 간격으로 억제합니다. 다만 억제는 인스턴스 안에서만 성립합니다.\n중앙 저장소 기반 중복 제거는 실채널 연결과 함께 볼 미결입니다.\n\nWallet 서버는 이 포트를 쓰지 않습니다. 별개 배포 단위이고 공유 모듈을 두지 않아, 그쪽은 감사\n스트림 분리까지만 하고 알림은 로그 수집기 쪽이 맡습니다.\n\n## 폐기한 게이트 ①\n\n서명 인프라의 트랜잭션 인가 정책이 지정 서명자를 강제하는지 Wallet SDK가 주기로 대조하던 항목이\n있었습니다. 그 항목을 걷었습니다. 조회 어댑터, 판정, 알림 두 종, mock, 설정값을 전부\n없앴습니다.\n\n번호는 다시 매기지 않고 ①을 비워 둡니다. 재번호가 문서·코드·알림 전반의 연쇄 수정이 되기\n때문입니다. 그 번호가 비어 있다는 사실 자체가 기록입니다.\n\n남는 것은 그대로 씁니다. **강제가 풀려도 요청이 줄지 않고 거부가 늘지도 않습니다.** 콘솔 경유\n우회가 열린 순간에 Wallet SDK 쪽 자국이 하나도 없습니다. TAP에 거는 건당·일일 총액 상한인 백스톱\n상한이 풀리는 것도 같은 모양입니다.\n\n강제의 생존 확인은 provider 콘솔 쪽 운영 절차로 나갑니다. 그 절차가 마련되기 전까지 이 항목은\n수용된 미탐지입니다.\n\n## 콜백의 30초 예산\n\n콜백 경로만 동기이고 예산은 30초입니다. 예산을 쓰는 구간은 순서대로 콜백 엔드포인트의 검증과\n서명 대상 추출, 요청 레코드 조회, [정규화](/policy/runtime/normalization) 재구성과 전체 대조, 소비 갱신,\n응답 서명입니다.\n\n서명은 로컬이라 병목이 아닙니다. 구간별 배분은 실측 대상입니다.\n\n**이 경로에서 외부 시스템을 호출하지 않습니다.** 예산이 30초인데 밖을 부르면 남의 지연이 곧\nWallet SDK의 서명 실패가 됩니다.\n\n## 무응답과 최소 배포 요건\n\n30초 안에 답하지 못하면 서명 인프라는 재시도하지 않고 서명 요청을 실패 처리합니다.\n\n**응답 안의 재시도와 무응답은 다릅니다.** 재시도로 답하면 창을 얻지만 무응답에는 그 창이\n없습니다. 그래서 콜백 엔드포인트의 재시작·배포·장기 정지가 곧 서명 유실입니다.\n\n최소 요건은 레플리카 둘 이상과 롤링 배포입니다. 소비가 조건부 단일행 갱신이라 레플리카를 늘려도\n1회용이 유지됩니다.\n\n어드민 인증의 TOTP 단회성은 인스턴스 하나에서 성립합니다. 레플리카를 늘리는 배포는 어드민 표면을\n`policy.admin.enabled`로 어드민 전용 배포에 두거나, 소비 기록을 공유 저장소로 옮깁니다.\n\n프로세스를 따로 떼는 것은 이 요건과 별개 문제이고, 근거는 sweep 실측 처리량입니다.\n\n## 종료 시의 드레인\n\n인스턴스가 종료에 들어가면 접수를 503으로 막고, 평가 대기 바디 버퍼가 비기를 기다립니다. 상한은\n60초입니다.\n\n**막는 것은 접수뿐입니다.** 조회·콜백·PIP 제출·어드민 표면은 그대로 받습니다. 그것들까지 막으면\n이미 접수된 요청의 결과를 읽지 못하고, 인스턴스가 빠지는 동안이 그대로 장애입니다.\n\n인프로세스 버퍼가 이 장치의 근거입니다. wire 원문을 저장하지 않으므로 종료 순간 버퍼에 남은 요청은\n재기동 뒤 되찾을 수 없습니다.\n\n상한을 넘겨 남은 바디는 버리고 건수만 남깁니다. 남아 있는 요청을 정리하는 작업이 그 요청을\n실패로 종결하고, 회복 경로는 호출자의 재제출뿐입니다.\n\n대기하는 동안 오케스트레이터 스케줄러는 그대로 동작합니다. 버퍼를 비우는 주체가 그것이라, 함께\n세우면 드레인이 상한 시간을 다 쓰고도 아무것도 비우지 못합니다.\n\n접수 거부의 사유는 둘로 갈립니다. 드레인은 이 인스턴스가 곧 빠진다는 뜻이라 다시 오라는 힌트를\n주지 않고, 버퍼 포화는 잠시 뒤 같은 곳에 다시 오라는 뜻이라 `Retry-After`를 함께 보냅니다.\n\n## 정규화기 버전의 하위 호환\n\n재구성형 콜백은 요청에 기록된 버전으로 정규화기를 고릅니다. **새 배포가 직전 활성 버전 구현을\n지우면 진행 중인 인가의 콜백이 재구성할 수단을 잃습니다.**\n\n없는 버전을 만난 콜백은 `CALLBACK_NORMALIZER_UNAVAILABLE`로 거부합니다. 방향은 fail-closed라\n안전합니다. 다만 창은 발급된 인가가 유효한 시간인 인가\nTTL([자세히](/policy/signing-gate))만큼 실재합니다.\n\n이 항목에는 전용 알림 코드가 없습니다. 남는 것은 구조화 로그의 `alert` 태그이고, 알림 포트로\n나가는 코드 상수가 아닙니다. 그래서 이 상태의 관측은 로그 검색에 달려 있습니다.\n\n## sweep 피크\n\nsweep은 입금 지갑 수에 비례해 발생합니다. **평가와 콜백과 기록 쓰기와 이벤트 발행이 모두 같은\n시점에 몰립니다.**\n\n이 경로의 용량 산정 기준이 평균이 아니라 sweep 피크인 이유입니다.\n\n## 이벤트 발행과 릴레이\n\n이벤트 발행 자체는 상태 전이와 한 트랜잭션이라 유실되지 않습니다. **릴레이가 멈추면 조용히\n밀립니다.** 그래서 적체와 릴레이 지연, 소비 지연을 봅니다.\n\n릴레이는 폴링으로 확정했습니다. 변경 데이터 캡처는 기각했습니다. 그 권한이 인스턴스 전체 바이너리\n로그를 읽어 논리 DB 계정 격리를 우회하기 때문입니다.\n\n소비자가 요청 식별자와 발행 순번으로 중복과 역순을 걸러 냅니다. 버스의 순서 보장에 기대지\n않습니다.\n\n## 실패 이벤트 큐 부재와 적체\n\n영구 실패한 이벤트를 따로 빼는 실패 이벤트 큐(dead-letter queue)가 없습니다. 릴레이는 이벤트를\n점유(claim)해 발행합니다.\n\n점유 시한이 지나면 같은 건이 다시 잡히고, 그 사이 뒤 이벤트가 배치 뒤로 밀립니다.\n\n**지금 두지 않은 이유는 격리가 보호할 실트래픽이 아직 없기 때문입니다.** 대신 발행 시점에\n페이로드 크기 상한을 겁니다. 한 건이 영구히 실패하는 경로를 그것으로 막습니다.\n\n밀림은 두 구간으로 갈립니다. 실패 건수가 배치 크기보다 적으면 신규 이벤트가 그만큼 뒤로 밀리는 데\n그칩니다. 배치 크기에 이르면 다시 점유된 구건이 배치를 전부 채워 후속이 통째로 막힙니다.\n\n실패 건수에 상한을 두는 장치가 없어 그 한도 자체가 관측 대상입니다.\n\n재검토 계기는 셋입니다 — 같은 건이 다시 점유됐다는 경고가 30분 지속될 때, 이벤트 수신을 실행\n게이트로 삼는 소비자가 실제로 생길 때, 첫 기관 온보딩의 운영 준비 점검입니다.\n\n## 보유 키 셋\n\n번들 서명키 둘이 서명 개념과 함께 사라졌습니다. 남은 것은 셋이고 전부 설정 주입입니다.\n\n- **콜백 응답 서명키**: RS256 개인키 PEM입니다 — `policy.callback.response-signing-key-pem`\n- **어드민 세션 서명키**: HMAC-SHA256 키의 base64입니다 — `policy.admin.session.signing-key-base64`\n- **2FA 암호화 키**: AES-256 암호화 키의 base64입니다 — `policy.admin.second-factor.key-base64`\n\n셋 다 환경에서만 오고 코드에 기본 키가 없습니다. 값이 비는 것은 정상 상태입니다. 그 표면을\n받지 않는 프로세스에는 해당 키를 주지 않고, 부재가 기동을 깨뜨리는 것은 콜백을 받는\n모드뿐입니다.\n\n셋을 담은 설정 객체는 모두 `toString`을 덮어 키 값을 출력하지 않습니다. 주입 여부와 라벨만\n남습니다. 설정 객체는 바인딩 실패 메시지·`/actuator` 계열·디버그 로그에 통째로 찍힐 경로가\n실재합니다.\n\n**콜백 응답 서명키는 요청마다 필요해 상주가 불가피합니다.** 방어가 격리가 아니라 사후 대조에\n있습니다. 위조된 응답에는 대응하는 인가가 없습니다.\n\n구현 상태를 함께 적습니다. 키 매니저에서 인출하는 경로는 지금 코드에 없습니다. 셋 다 설정과\n환경변수로 들어오므로, 관측 대상은 인출 감사가 아니라 배포 시크릿의 주입 경로입니다. 키 매니저로\n옮기면 인출 단위 감사밖에 없어 예상 밖 인출을 즉시 알리는 항목이 그때 따라옵니다.\n\n## 콜백 응답 키의 로테이션\n\n콜백 응답 키는 상대가 신뢰하는 공개키를 Wallet SDK가 바꿀 수 없습니다. provider가 설치·설정 시점에\n한 번 등록받는 구조라, 겹침 기간에 공개키 두 개를 동시에 신뢰하는지가 확인 대상입니다.\n\n확인이 불가하면 교체 창의 인플라이트 서명이 재시도 없이 취소됩니다. **키를 어디에 보관하든 이\n문제는 남습니다.** 보관 위치의 문제가 아니라 등록 모델의 문제입니다.\n\n## 결정의 재현\n\n결정 기록의 입력 문서와 번들 해시로 같은 결정을 다시 만듭니다. 번들 바이트는 내용 해시로\n보관됩니다.\n\n용도가 둘입니다.\n\n- **규제 대응**: 특정 결정 하나를 재현하는 일입니다\n- **회귀 검출**: 과거 결정 표본을 새 번들로 다시 평가해 차이를 보는 일입니다\n\n회귀 쪽을 정례로 실행할지와 표본 크기는 미정입니다.\n\n룰 테스트와 골든 스위트는 저작·배포 파이프라인이 강제하므로 별도 운영 절차가 필요 없습니다.\n\n## 실측에 달린 값\n\n- **콜백 30초 예산의 구간별 배분**: 어디에 얼마를 줄지는 실측 뒤에 정합니다\n- **sweep 피크 처리량**: 평가·쓰기·발행 용량 산정의 입력입니다\n- **알림 임계값 전반**: 만료 스케줄러 지연, 이벤트 적체, 수집 실패율의 임계입니다\n- **드리프트 대조 주기와 연속 임계**: 지금 60초와 3회입니다. 임계가 3인 것은 sidecar 폴링 설정값의\n  의미를 저장소 근거로 판정할 수 없어 여유를 한 칸 더 둔 것이고, 오탐 0은 증명되지\n  않았습니다. 하한은 주기가 폴링 상한보다 커야 한다는 것이고 기동 시 강제됩니다\n- **콜백 응답 키의 무중단 로테이션 가능 여부**: provider에 문의할 사항입니다\n\n## 다음으로\n\n- [서명 게이트](/policy/signing-gate) — 30초 예산이 적용되는 경로\n- [구조](/policy/architecture) — 이 항목들이 적용되는 배포 단위와 역할\n- [룰 저작과 발행](/policy/workflow) — 발행 대조가 지키는 검사\n", "kind": "참고 문서", "path": "_reference/policy--operations.html", "reference": true}, {"title": "결과 읽기", "text": "---\ntitle: 결과 읽기\ndescription: 정책 판단의 결과가 API 응답의 어느 자리에 나타나는지\n---\n\n_읽는 사람: 파트너사 개발자. 정책이 요청을 거절하거나 붙잡았을 때 그 사실이 어느 응답 필드에 나타나는지를 다룹니다._\n\n정책 엔진은 요청마다 결정 하나를 냅니다. 결정은 커널이 내는 네 종류의 종결이고, 커널은 조건\n트리를 평가하고 결정을 결합하는 정책 무관 고정 부분입니다([자세히](/policy/rule/decision)).\n이 페이지는 그 결정이 Wallet API·Admin API·Policy API의 응답에서 각각 어느 자리에 실리는지를\n씁니다.\n\n## 결정은 네 값 중 하나입니다\n\n| 값 | 파트너사가 읽는 뜻 |\n|---|---|\n| `allow` | 통과입니다. 서명 인가가 발급되고 집행으로 넘어갑니다 |\n| `deny` | 거부입니다. 서명은 일어나지 않습니다 |\n| `pending` | obligation 이행을 기다립니다. 승인 정족수가 대표적인 예입니다 |\n| `need_more_data` | 판단에 필요한 사실을 아직 못 읽었습니다. 수집이 끝나면 다시 평가합니다 |\n\n룰이 적는 것은 `allow`와 `deny` 둘뿐이고 나머지 둘은 커널이 산출합니다. 여러 룰과 여러 모듈의\n답을 하나로 모으는 규칙은 [결정과 결합](/policy/rule/decision)에 있습니다.\n\n아래 세 절은 이 네 값이 실제 응답의 어느 필드로 번역되는지를 표면별로 씁니다. 표면마다 번역\n방식이 다릅니다.\n\n## 출금은 상태와 세부 상태에 실립니다\n\nWallet 서버와 실 정책 서버의 연결은 아직 없습니다. 지금은 요청을 처리하는 그 자리에서 동기로\n자동 승인되고, 아래 대응은 계약과 코드에 자리만 잡혀 있습니다.\n\n출금 조회 응답은 `status`와 `subStatus`를 함께 냅니다. 정책이 거절하면 `status`는 `FAILED`가\n되고 `subStatus`는 `SCREENING_REJECTED`가 됩니다. 이 조합이 출금에서 정책 거절을 읽는 자리입니다.\n\n**출금에는 정책 거절 전용 에러 코드가 없습니다.** 요청 자체도 에러 응답으로 끝나지만, 그 자리에\n쓰이는 코드가 계약의 `ErrorCode` 목록에 아직 없습니다. 그래서 출금의 정책 거절은 에러 코드가\n아니라 상태로 분기합니다.\n\n같은 `FAILED` 안에서 세부 상태가 원인을 가릅니다. `REQUEST_REJECTED`는 정책이 아니라 뒷단\n플랫폼이 제출을 거절했을 때입니다. `TR_DENIED`는 계약에 있으나 아직 어느 코드도 이 값을 쓰지\n않습니다.\n\n## 집금과 vault 이체는 에러 코드로 거절을 알립니다\n\n이 둘은 거절이 에러 응답에 실립니다. 집금은 `SWEEP_POLICY_DENIED`, 워크스페이스 vault 이체는\n`WORKSPACE_VAULT_TRANSFER_POLICY_DENIED`입니다.\n\n남는 기록은 서로 다릅니다. 집금은 인가를 받기 전에 행을 만들지 않아 거절되면 조회할 기록이\n없습니다. vault 이체는 접수 행을 먼저 만들기 때문에 `status`가 `FAILED`, `subStatus`가\n`SCREENING_REJECTED`로 마감됩니다.\n\n**두 코드 모두 지금은 응답에 나오지 않습니다.** 정책 인가가 자동 승인이라 거절 분기에 도달하지\n않습니다. 연동을 만들 때는 코드를 받는 쪽 처리를 미리 넣어 둡니다.\n\n## 승인이 필요한 요청은 멈추고 승인을 기다립니다\n\n승인 게이팅은 어드민 액션이 승인자의 확인을 거쳐야 실행되는\n통제입니다([자세히](/policy/sequences/approval-gate)). 승인 절차가 붙는 Admin API 요청은 즉시\n실행되지 않고 공통 응답 하나로 돌아옵니다.\n\n그 응답은 `status`·`approvalId`·`requesterAdminId`·`quorum`·`result` 다섯을 냅니다. `status`는\n`PENDING_APPROVAL`·`APPROVED`·`DENIED` 중 하나이고, `result`는 `APPROVED`가 아니면 `null`입니다.\n`requesterAdminId`는 그 요청을 만든 어드민 유저 식별자입니다. `quorum`은 정족수 현황이고, 정족수는\n승인이 성립하는 데 필요한 최소 승인자 수입니다. `quorum.threshold`가 필요한 표 수,\n`quorum.approved`가 지금까지 모인 표 수입니다.\n\n`PENDING_APPROVAL`로 돌아온 요청은 Approvals API에서 이어 갑니다. 엔드포인트는 셋입니다.\n\n- `GET /admin/api/v1/approvals` — 승인 진행 내역 목록\n- `GET /admin/api/v1/approvals/{approvalId}` — 승인 진행 내역 상세\n- `POST /admin/api/v1/approvals/{approvalId}` — 단건 승인\n\n**Approvals API는 지금 고정 응답을 냅니다.** 세 엔드포인트가 요청 내용과 무관하게 같은 값을\n돌려줍니다. 승인 게이팅을 실제로 거치는 어드민 엔드포인트는 `APPROVED`와 `DENIED` 둘만 내고\n`quorum`은 `null`입니다. 정족수가 모여 승인이 성립하는 흐름은\n[승인 게이트](/policy/sequences/approval-gate)에 있고, 콘솔에서 승인 요청이 만들어지는 자리는\n[룰 저작과 발행](/policy/workflow)이 씁니다.\n\n## 판단 요청을 직접 조회하면 결정 전문이 보입니다\n\n판단 요청은 한 업무 요청을 두고 엔진이 소유하는 판단 기록입니다. Policy API의\n`GET /request/{policyRequestId}`가 그 기록 전문을 냅니다. 부르는 주체는 Wallet 서버입니다.\nWallet 서버는 파트너 대상 API를 받아 정책 엔진에 판단을 묻고 서명 인프라에 제출하는 Wallet SDK의\n서버 컴포넌트입니다([자세히](/policy/architecture)).\n\n응답의 `status`는 판단 요청이 지금 어느 단계인지입니다. 값은\n`RECEIVED`·`NORMALIZING`·`EVALUATING`·`PENDING_DATA`·`PENDING_OBLIGATION`·`APPROVED`·`CONSUMED`·`DENIED`·`EXPIRED`·`FAILED`입니다.\n`CONSUMED`는 발급된 인가가 실제로 쓰였다는 뜻이고, `APPROVED`에서 멈춰 있으면 아직 집행되지\n않은 것입니다.\n\n**결정 전문은 `decision` 안에 있습니다.** 다섯 필드를 함께 읽습니다.\n\n- **`decision.decision`**: 위 표의 결정값 넷 중 하나입니다\n- **`decision.reasons`**: 판단 사유입니다. 발동한 룰과 소스 이름이 여기 실립니다\n- **`decision.unevaluatedRules`**: deny가 나와 평가가 중단되는 바람에 판정하지 않은 룰입니다. 룰\n  이름과 `effect`가 함께 옵니다([자세히](/policy/rule/decision))\n- **`decision.obligations`**: `pending`일 때 이행해야 할 obligation과 충족 현황입니다.\n  obligation은 통과로 확정되기 전에 이행해야 하는 조건입니다([자세히](/policy/rules)). 정족수\n  obligation이면 `quorumRequired`와 `quorumApproved`가 함께 옵니다\n- **`decision.required`**: `need_more_data`일 때 더 읽어야 할 PIP 소스 이름입니다. PIP 소스는\n  룰이 참조하는 외부 사실의 출처입니다([자세히](/policy/runtime/pip))\n\n엔드포인트 전수와 필드 계약은 [Policy API](/reference/policy)에 있습니다.\n\n## 다음으로\n\n- [룰 저작과 발행](/policy/workflow) — draft에서 활성까지 사람이 거치는 절차\n- [승인 게이트](/policy/sequences/approval-gate) — 정족수가 모여 승인이 성립하는 흐름\n- [Wallet API](/reference/wallet) — 출금·집금·vault 이체 엔드포인트 전수\n- [Admin API](/reference/admin) — 승인 게이팅과 Approvals 엔드포인트 전수\n", "kind": "참고 문서", "path": "_reference/policy--results.html", "reference": true}, {"title": "결정과 결합", "text": "---\ntitle: 결정과 결합\ndescription: 여러 룰이 다른 답을 낼 때\n---\n\n_읽는 사람: 구현팀. 여러 룰과 여러 모듈의 답이 하나의 결정으로 모이는 규칙을 다룹니다._\n\n커널은 조건 트리를 평가하고 결정을 결합하는 정책 무관 고정 부분입니다. 룰 여럿과 모듈 여럿이\n각자 답을 낼 때 그것을 하나의 결정으로 모으는 일을 커널이 합니다. 이 페이지는 커널이 낼 수 있는\n결정 넷과 그 결합 규칙을 씁니다.\n\n## 결정값 넷\n\n| 값 | 뜻 |\n|---|---|\n| `allow` | 통과. 서명 인가가 발급됩니다 |\n| `deny` | 거부 |\n| `pending` | obligation 이행을 기다립니다 |\n| `need_more_data` | 판단에 필요한 사실을 아직 못 읽었습니다 |\n\n룰이 적는 것은 `allow`와 `deny` 둘뿐이고, 나머지 둘은 커널이 산출합니다. 표의 obligation은\n통과로 확정되기 전에 이행해야 하는 조건입니다([룰 쓰기](/policy/rules)).\n\n## 결합 규칙\n\n결합 규칙은 커널이 고정하고 정책이 바꿀 수 없습니다.\n\n**우선순위는 `deny` > `need_more_data` > `pending` > `allow`입니다.** 하나라도 deny면\ndeny이고, 전 모듈이 allow일 때만 allow입니다.\n\n적용되는 룰이 하나도 없으면 deny입니다. 룰의 부재를 통과로 쓰지 않습니다. \"통과\"는 언제나\n명시적인 allow 룰이어야 합니다.\n\ndeny 면제 메커니즘은 두지 않습니다. 감사 관점에서 가장 위험한 기능이라 도입하지 않습니다.\n\n## 룰 모듈\n\n룰 모듈은 관심사 단위로 평가를 나누는 구분이지 폴더 이름이 아닙니다. 어느 도메인·어느 연산에\n적용되는지는 모듈이 아니라 룰의 발동 조건이 정합니다.\n\n지금은 연산마다 한 모듈입니다. 값 이동 쪽이 출금·vault 이체·집금 셋이고, 어드민 쪽이 역할과\nescalation 둘입니다. escalation은 어드민 액션 중 권한을 올리는 성격의 것들입니다.\n\n**모듈 사이는 AND입니다.** 발동한 룰이 있는 모든 모듈이 각자 allow를 하나씩 내야 통과합니다. 한도\n룰이 판정에서 실패하면 그 자체로 차단이고, 다른 관심사의 allow가 그것을 우회할 수 없습니다.\n\n다만 값 이동 세 모듈은 발동 조건이 서로 배타라 한 요청이 둘에 걸리지 않습니다. AND가 지금은\n대가 없이 유지되고, 한 연산 안에서 관심사를 나누는 시점에 발화합니다.\n\n모듈 안은 OR입니다. 한 모듈에서는 판정이 참인 allow가 하나면 됩니다. 허용 경로를 나란히\n적는 곳입니다.\n\n## deny 시의 중단\n\n한 모듈이 deny를 내면 다른 모듈이 요청한 비싼 조회를 중단합니다.\n\n다만 **무엇이 평가되지 않았는지를 결정 기록에 남깁니다.** 미평가 룰에는 effect를 함께 적어,\n차단될 수도 있었던 룰을 나중에 식별할 수 있게 합니다. 결정 기록은 결정을 주체·행위·대상·시각·결과와\n함께 남기는 추가 전용 해시 체인입니다.\n\n## obligation의 병합\n\n서로 다른 obligation은 모두 이행해야 합니다. 같은 타입이 겹치면 **더 강한 쪽을 적용합니다.**\n승인이 성립하는 데 필요한 최소 승인자 수인 정족수가 2와 3으로 겹치면 3이고, 2단계 인증 요구가\n겹치면 하나로 합칩니다.\n\n승인 가능 역할은 교집합으로 좁힙니다. 각자 역할을 좁힌 룰 둘이 함께 발동하면 남는 것은 두\n집합의 교집합입니다.\n\n그 교집합이 공집합이면 커널이 그 즉시 deny하고 사유 코드는 `APPROVER_SET_EMPTY`입니다. 어떤\n어드민도 승인할 수 없는 pending을 남기지 않기 위해서입니다.\n\n## 재평가 라운드 캡\n\n사실을 더 읽어야 하면 여러 모듈의 요구를 합쳐 한 번에 수집하고 다시 평가합니다. 비동기 소스는\n결과 제출을 기다립니다.\n\n**평가 라운드의 캡은 5입니다.** 최초 평가가 라운드 1이고, 그 수를 넘기는 평가는 하지 않고\n거부합니다. 라운드 카운터는 요청 단위로 단조 증가하며 리셋하지 않습니다. obligation 이행 후\n재개도 라운드를 소모합니다.\n\n## 인가 TTL\n\n발급된 서명 인가는 승인된 판단 요청이 발급하는 한 번만 쓸 수 있는 서명 근거입니다. 그 인가는\nTTL까지 유효하고, 상한은 3600초(60분)이고 기본값은 1200초(20분)입니다.\n\n**기본값이 곧 하한이라 워크스페이스가 더 짧게 줄일 수 없습니다.** 1200초는 서명 어댑터의 재시도\n총 시간과 도착 지연 예산, 여유를 더한 값입니다. 그보다 짧으면 정상 콜백이 TTL 뒤에 도착합니다.\n\n정책을 새로 배포해도 이미 발급된 인가를 무효화하지 않습니다. 그 노출 창을 왜 받아들이는지는\n[서명 게이트](/policy/signing-gate)에 있습니다.\n", "kind": "참고 문서", "path": "_reference/policy--rule--decision.html", "reference": true}, {"title": "룰 명세", "text": "---\ntitle: 룰 명세\ndescription: 룰이 무엇을 가리킬 수 있고 무엇이 그것을 검사하는가\n---\n\n_읽는 사람: 구현팀. 룰이 가리킬 수 있는 표면과 그것을 검사하는 절차를 담고, 룰 자체의 조각은 [룰 쓰기](/policy/rules)에 있습니다._\n\n[룰 쓰기](/policy/rules)가 룰이 무엇으로 이루어지는지를 씁니다. 이 페이지는 그 룰이\n무엇을 가리킬 수 있는지와 누가 그것을 검사하는지를 씁니다. 가리킬 수 있는 경로는 카탈로그와\n레지스트리가 정하고, 검사는 메타스키마와 컴파일러가 나눠 맡습니다.\n\n## 카탈로그\n\n카탈로그가 참조 가능한 경로의 기준입니다. 연산별로 룰이 가리킬 수 있는 필드를 열거한 목록이고,\n같은 목록이 두 일을 합니다 — 컴파일러의 타입체크 기준이고, 빌더 화면이 고르게 내놓는 필드\n목록입니다.\n\n카탈로그는 서명 연산 다섯과 어드민 액션을 함께 덮습니다. 값 이동 세 연산은 출금·vault 이체·집금이고, payload가\n없어 정책 판단에 쓰는 필드가 전부 공통 필드에 있습니다. 컨트랙트 호출과 구조화 서명만 자기 payload를 엽니다.\n\n두 종류가 서로 다른 곳에 있습니다. 서명 연산의 필드는 컴파일러의 코드 상수이고, 저작 파일로\n있는 카탈로그는 어드민 액션 것 하나입니다. 어드민 액션 카탈로그가 저작 파일인 이유는 등재된 action마다\n게이트 룰을 요구하는 컴파일 검사가 그 목록을 읽기 때문입니다.\n\n**필드 전수를 여기 나열하지 않습니다.** 목록은 카탈로그와 요청 계약이 기준이라 사본을 두면\n갈립니다. 요청 표면은 [Policy API](/reference/policy)에 있습니다.\n\n## 등록제 연산과 레지스트리\n\n컨트랙트 호출과 구조화 서명은 대상을 레지스트리에 등록해야 씁니다. 등록이 곧 카탈로그 확장이고,\n컴파일러는 번들에 들어간 레지스트리 스냅샷을 기준으로 타입을 봅니다.\n\n**등록 대상을 담는 레지스트리는 아직 없습니다.** 저작 파일로 있는 레지스트리는 PIP 소스와 서명\n어댑터 둘이고, 서명 어댑터 쪽은 어댑터별 재시도 값과 도착 지연·여유 예산만 받습니다. 컨트랙트\n주소나 구조화 서명 타입을 실을 필드가 그 구조에 없습니다.\n\n그래서 두 연산의 룰은 지금 공통 필드만 가리킬 수 있습니다. 미등록 대상 참조를 잡는 컴파일 검사도\n대조할 상대가 없어 비어 있습니다.\n\n## PIP 경로\n\n세상의 상태를 읽는 경로는 카탈로그가 아니라 **소스 레지스트리의 스냅샷 스키마**가 정합니다. 소스를\n등록하는 것이 곧 참조 표면을 넓히는 것이고, 선언되지 않은 필드를 가리키면 컴파일이 실패합니다.\n\n변하는 속성은 요청에 없습니다. 어드민의 역할과 권한, 주소가 주소록에 있는지가 그런 값입니다.\n이런 값은 평가 시점에 읽고, 읽어 오는 수집 경로가 PIP입니다. 그 규율은\n[PIP](/policy/runtime/pip)에 있습니다.\n\n## 조건 평가의 세 값\n\n조건은 참·거짓·미지 셋으로 평가합니다. 미지는 입력에 없는 PIP 소스를 가리켰을 때만 나옵니다.\n`all`은 하나라도 거짓이면 거짓이고 전부 참이면 참이며 그 밖은 미지입니다. `any`가 그 대칭이고,\n`not`은 미지를 미지로 넘깁니다.\n\n**요청의 빈 필드를 비교한 것은 거짓이지 미지가 아닙니다.** 요청은 완전한 문서라 \"아직 못 읽었다\"는\n상태가 없기 때문입니다.\n\n발동 조건에는 미지가 없습니다. 거기서는 PIP를 가릴 수 없고, 카탈로그에 선언되고 워크스페이스가\n조정할 수 있는 값인 슬롯([룰 쓰기](/policy/rules))은 평가에 들어갈 때 이미 채워져\n있습니다. 그래서 항상 참이나 거짓으로 떨어집니다.\n\n## 어드민 액션의 두 겹\n\n어드민 쪽은 연산이 `admin_action` 하나이고 개별 연산이 그 안의 `payload.action`입니다. 두 겹이라\n막는 지점도 둘이고, 등재되지 않은 action은 두 지점에서 막힙니다.\n\n- **접수에서**: 요청이 받는 값 집합이 닫힌 목록이라 큐에 들어가기 전에 거부됩니다.\n- **컴파일에서**: 카탈로그의 모든 action은 `payload.action`을 명시적으로 제약하는 allow 룰을 최소\n  하나 가져야 합니다.\n\n**두 번째가 이 구조의 핵심입니다.** 연산만 제약한 넓은 allow 룰은 새로 등재된 action까지 함께\n매치하므로, 커널의 기본 거부가 여기서는 성립하지 않습니다. 그 컴파일 검사가 유일한 대체 장치입니다.\n\ndeny 룰과 obligation은 반대로 넓을수록 안전합니다. obligation은 통과로 확정되기 전에 이행해야\n하는 조건이고([룰 쓰기](/policy/rules)), 강한 쪽을 적용하는 병합이라 넓게 덮을수록\n강해집니다.\n\n## 값 이동 allow 룰의 지갑 종류 지목\n\n값을 옮기는 allow 룰은 출발 vault의 종류를 `eq`나 `in`으로 지목해야 합니다. Vault는 Wallet의\n그룹입니다([지갑 계층](/accounts-wallets/wallets)). 목적지 vault 종류도 같은 의무이고, 발동 조건이 목적지\n유형을 내부 vault 없는 닫힌 집합으로 이미 좁혔으면 면제됩니다.\n\n지목하지 않으면 컴파일이 실패합니다. 출발지와 목적지의 종류 구분은\n[이동 종류](/fund-flows/movements)에 있습니다.\n\n부정이 아니라 긍정으로 지목하게 한 이유는 값 집합이 늘어날 때 방향이 반대이기 때문입니다. `eq`·`in`으로 지목한\n룰은 새 종류에 매치되지 않아 기본 거부로 떨어지고, `ne`·`not_in`으로 좁힌 룰은 여집합이라 새 종류까지\n자동으로 매치합니다.\n\n판정 조건(`when`)은 이 역할을 대신하지 못합니다. 매치된 뒤에 불허하는 것이라 칸막이가 아닙니다.\n\n**칸막이 기준을 vault 태그로 두는 안은 두지 않기로 했습니다.** 태그는 워크스페이스가 붙이고 떼는\n값이라, 막으려는 쪽이 칸막이를 통제하게 됩니다. 태그를 다는 권한이 곧 정책 편집 권한이 됩니다.\n\nvault 종류는 그 반대입니다. 엔티티 타입이 다르고 소유자가 다르며 종류를 바꾸는 표면이 없어,\n요청 단위로 움직이지 않는 값입니다.\n\n태그를 쓰려면 태그 변경 자체를 어드민 액션으로 올려 거버넌스를 태워야 합니다. 그 시점에 태그가\n주던 단순함이 사라져, 이 용도에는 과한 수단이라고 봤습니다.\n\n이 판정이 덮는 것은 칸막이 기준 하나입니다. 태그를 읽어 오는 소스는 [PIP](/policy/runtime/pip)가\n따로 소유하고, 그 선언은 아직 없습니다.\n\n## 슬롯 타입 다섯과 안전 조건\n\n슬롯 타입은 다섯이고 안전 조건이 각각 다릅니다.\n\n| 타입 | 발행 시점의 안전 조건 |\n|---|---|\n| 금액 | 토큰별 엔트리 맵. 엔트리마다 하한 |\n| 정수 | 하한 |\n| 불리언 | 없음 |\n| 문자열 | 허용 값 목록 필수 |\n| 문자열 목록 | 허용 값 목록의 부분집합 |\n\n금액 슬롯은 요청 토큰으로 맵에서 값을 고릅니다. 자릿수를 요청 토큰 기준으로 맞춘 뒤 큰 수\n비교를 하고, 맵에 없는 토큰은 조건 불성립입니다. allow 룰에 안전한 방향입니다.\n\n표의 조건은 발행 시점의 것입니다. 커널이 평가 시점에 다시 보는 것은 하한과 타입까지이고, 그\n범위와 이유는 [룰 쓰기](/policy/rules)에 있습니다.\n\n커널은 조건 트리를 평가하고 결정을 결합하는 정책 무관 고정\n부분입니다([결정과 결합](/policy/rule/decision)). 여기서 더할 것은 그 재확인에 걸린 값의\n취급입니다. **커널까지 온 하한 위반은 침해 신호로 다룹니다.** 정상 경로라면 발행 시점 검증이 이미\n막았을 값이기 때문입니다.\n\n## 금액의 순서 비교\n\n금액의 순서 비교는 슬롯 참조로만 씁니다. 커널의 리터럴 경로는 순서 비교를 문자열 비교로 보냅니다.\n최소 단위 정수는 자릿수가 다르면 사전순이 정수 순과 어긋납니다.\n\n`\"1000000000000000000\"`(1 ETH)이 `\"500000000000000000\"`(0.5 ETH)보다 작다고 판정됩니다. 선두\n자릿수만 작으면 우회 폭에 상한이 없습니다. allow 룰이면 한도가 조용히 무력화되고 deny 룰이면 금지가\n침묵합니다. 그래서 **금액을 리터럴로 순서 비교하는 룰은 컴파일이 막습니다.**\n\n자릿수를 맞춰 비교하는 경로는 금액 슬롯 참조 하나뿐입니다. 자릿수 정보를 실을 필드가 슬롯\n엔트리에만 있고, 리터럴은 스칼라 하나라 자기 자릿수를 선언할 수 없기 때문입니다.\n\n동등 비교는 이 검사의 대상이 아닙니다. 접수단이 요청 쪽 표기를 앞자리 0 없는 하나로 고정해 사전순과\n정수 순이 갈리지 않습니다. 커널도 문자열끼리의 순서 비교를 미지로 종결하는 백스톱을 따로 둡니다.\n\n## 슬롯의 역할 표시\n\n슬롯의 역할 표시가 승인 스탬프를 고릅니다. 슬롯 엔트리는 선택 필드로 역할을 답니다. 값은 둘이고,\n각각 타입이 강제됩니다 — 인가 유효 시간은 정수, 자원 상한은 금액입니다.\n\n승인 스탬프는 승인 시점에 찍히는 소비 시점 유효값이고, 인가 TTL과 건당 자원 상한\n둘입니다([정규화](/policy/runtime/normalization)). 역할 값 둘이 그 스탬프 둘과 1:1입니다. 커널은\n이 표시로 어느 슬롯을 스탬프로 낼지 고릅니다. 스탬프 없는 allow는 커널 불변식 위반이라, 식별\n수단이 없으면 그 불변식을 지킬 수 없습니다.\n\n**이름 규약으로 고르지 않은 이유는 역할과 어휘가 별개 개념이기 때문입니다.** 슬롯 이름은 룰이\n가리키는 어휘라 바뀔 수 있어야 하는데, 이름에 역할을 실으면 리네임이 곧 기능 파손이 됩니다.\n\n각 역할 값은 카탈로그에 정확히 하나입니다. 둘도 위반이고 0개도 위반이며, 이 유일성은 구조가\n아니라 컴파일러가 봅니다.\n\n## 자원 상한이 지목하는 체인\n\n자원 상한은 체인 계열과 네트워크 식별자로 엔트리 하나만 스탬프합니다. 자원 상한 슬롯의 엔트리는\n체인 키로 갈리고, 엔트리마다 그 둘을 함께 적습니다.\n\n이 병기가 요청의 체인 계열·네트워크 식별자와 카탈로그 키를 잇는 유일한 연결입니다.\n\n커널은 그 쌍으로 엔트리 하나를 역인덱스해 그것만 스탬프합니다. 선언 전량을 실으면 승인받은\n체인 밖 상한이 함께 나가므로, 이 좁힘이 상한 우회를 승인 시점에 막습니다. 체인을 지목하지 않는\n어드민 요청에서는 선언 전량을 냅니다.\n\n병기가 없거나 같은 쌍이 둘이면 컴파일이 실패합니다. 요청 체인이 카탈로그에 없으면 커널이\n거부하는데, **스탬프 슬롯이 아예 없을 때와 표식이 다릅니다.** 앞은 정책적 거부이고 뒤는 번들\n결함입니다.\n\n## 메타스키마와 컴파일러의 분담\n\n메타스키마는 구조만 보고 의미는 컴파일러가 봅니다. 구조 검증을 받는 저작 파일은 열 종류입니다 —\n룰 모듈, 슬롯 카탈로그, 슬롯 값, 어드민 액션 카탈로그, 테스트 벡터, 번들 결합 스위트, 스위트\n커버리지, retire 목록, 그리고 레지스트리 둘(PIP 소스·서명 어댑터). 각각에 JSON Schema 2020-12\n메타스키마가 하나씩 붙고, 컴파일 산출물인 선언 데이터에도 같은 방식으로 하나가 붙습니다. 룰 모듈은\n관심사 단위로 평가를 나누는 구분입니다([결정과 결합](/policy/rule/decision)).\n\n레지스트리 둘을 저작 파일로 둔 이유는 그 선언값이 보안 방어선이기 때문입니다. 소스의 최대 나이,\n인증키 바인딩, 재시도 값이 곧 컴파일 부등식의 피연산자라, 코드 상수나 앱 설정에 두면 거버넌스와\n재현 밖으로 빠집니다.\n\n| | 무엇을 봅니까 |\n|---|---|\n| 메타스키마 | 필수 필드, 타입, 값 목록, 조건 트리의 재귀 구조 |\n| 컴파일러 | 카탈로그 대조 타입체크와 발동 조건의 PIP 참조 금지 · 슬롯과 레지스트리의 존재 · 기본값의 하한 위반 · 금액 맵의 미등재 토큰과 자릿수 불일치 · 조건 트리 깊이 · 룰 ID 중복과 retire 재사용 · 테스트 벡터 실행 |\n\n조건 트리는 메타스키마 안에 재귀로 정의됩니다. 노드 다섯이 자기 자신을 다시 품는 형태입니다.\n\n## 테스트 벡터\n\n테스트 벡터가 룰 의도의 증거입니다. 벡터 파일은 룰 모듈과 1:1이고 같은 저장소·같은 파이프라인에\n들어가, 룰 의도의 증거가 룰과 같은 커밋에 남습니다.\n\n룰마다 최소 두 케이스가 의무입니다. 통과 하나와 불허 또는 미발동 하나이고, 누락은 컴파일\n실패입니다.\n\n입력은 완전한 문서로 적습니다. fixture나 부분 생략을 두지 않아, 벡터 하나가 그 자체로 읽힙니다.\n기대값은 결정이 필수이고, 통과나 대기면 병합된 obligation까지 필수이며, 사유와 미평가 룰은 적으면\n집합 일치로 검사합니다.\n\n워크스페이스 룰은 빌더가 벡터를 유도합니다. 조건 트리가 구조화된 노드라 경계 벡터를 선언에서\n자동으로 뽑아낼 수 있고, 발행 검증이 그것을 실행합니다. 실패는 발행 거부입니다.\n\n그래서 승인 화면이 벡터 결과를 미리 보여 줍니다. **승인자가 JSON diff가 아니라 행동 변화를\n봅니다.**\n\n## 결합 스위트\n\n결합 스위트는 룰셋의 회귀를 봅니다. 번들 결합 스위트는 정책 로직 번들당 하나이고, 정책 로직\n번들은 룰과 선언 데이터를 커널과 함께 담아 발행한 배포 산출물입니다.\n\n커널 골든 스위트가 결합 의미를 일반적으로 검증한다면, 이쪽은 **이 룰셋**이 실제로 어떻게\n맞물리는지를 봅니다.\n\n최소 요건은 결합 의미 네 가지에 각 한 케이스입니다 — 모듈 간 AND 실패, 모듈 내 OR, deny 우선,\nobligation 병합. 누락도 실패도 컴파일 실패입니다.\n", "kind": "참고 문서", "path": "_reference/policy--rule--reference.html", "reference": true}, {"title": "룰 쓰기", "text": "---\ntitle: 룰 쓰기\ndescription: 룰 하나가 무엇으로 이루어지고 무엇을 참조할 수 있는지\n---\n\n_읽는 사람: 파트너사 개발자. 룰 하나의 JSON이 어떤 조각으로 이루어지고 그 조각이 무엇을 가리킬 수 있는지를 설명합니다._\n\n룰은 `scope`와 조건을 갖고 `allow`·`deny`를 내는 단위입니다. 정책 엔진이 요청 하나를 심사할 때\n쓰는 최소 단위이고, 파트너사가 JSON으로 적습니다. 이 페이지는 그 JSON의 네 조각과, 룰이 참조할 수\n있는 필드를 설명합니다.\n\n## 룰의 네 조각\n\n룰은 `effect`·`scope`·`when`·`obligations` 네 조각입니다. 아래는 워크스페이스 시드에 들어 있는\n외부 주소 출금 허가 룰입니다. 워크스페이스는 Wallet SDK를 도입한 회사 하나이고 최상위 격리\n컨테이너입니다([계정 계층](/accounts-wallets/accounts)).\n\n이 룰에는 통과로 확정되기 전에 이행해야 하는 조건인 obligation이 없습니다.\n\n```json\n{\n  \"id\": \"withdrawal/allow-evm-external-address\",\n  \"effect\": \"allow\",\n  \"scope\": {\n    \"all\": [\n      { \"field\": \"operation\", \"op\": \"eq\", \"value\": \"value_transfer\" },\n      { \"field\": \"chain.family\", \"op\": \"eq\", \"value\": \"evm\" },\n      { \"field\": \"destination.type\", \"op\": \"eq\", \"value\": \"external_address\" },\n      { \"field\": \"source_vault.kind\", \"op\": \"eq\", \"value\": \"custody\" }\n    ]\n  },\n  \"when\": { \"field\": \"address_ownership.status\", \"op\": \"eq\", \"value\": \"active\" }\n}\n```\n\n**`scope`가 이 룰이 발동하는 범위를 정하고 `when`이 그 안에서 판정합니다.** scope에 걸리지 않는\n요청에 이 룰은 없는 것과 같습니다.\n\n`effect`에 적을 수 있는 값은 `allow`와 `deny` 둘뿐입니다. `pending`과 `need_more_data`는 조건\n트리를 평가하고 결정을 결합하는 [커널](/policy/rule/decision)이 내는 결정값이고, 파트너사가 고르는\n값이 아닙니다.\n\n`operation`에 적는 값은 정규화된 연산 값입니다. 출금·vault 이체·집금 셋을\n[정규화](/policy/runtime/normalization)가 `value_transfer` 하나로 합칩니다. 그래서 룰이 그 셋을\n가르는 것은 `destination.type`과 `source_vault.kind`입니다.\n\n요청 표면의 값인 `withdrawal`을 여기 적으면 어떤 요청에도 매치되지 않습니다. 거부는 나므로 아무것도\n깨지지 않고, 요청이 끝까지 통과하는지 재본 뒤에야 그 룰이 죽어 있었다는 것이 드러납니다.\n\n## 조건 노드\n\n`scope`와 `when`은 같은 문법을 씁니다. 둘 다 조건 트리이고, 조건 트리는 `all`·`any`·`not`과\n비교·멤버십 리프로 이루어진 룰의 조건식입니다.\n\n노드는 다섯입니다 — 비교(`eq`·`ne`·`lt`·`lte`·`gt`·`gte`), 멤버십(`in`·`not_in`), 그리고\n`all`·`any`·`not`입니다. 중첩할 수 있고 깊이 상한은 컴파일러가 봅니다.\n\n**카탈로그에 없는 필드는 참조할 수 없습니다.** 참조하면 컴파일이 실패합니다. 값이 채워지지 않은\n필드를 비교하면 불성립(거짓)으로 봅니다. allow 룰에 안전한 방향입니다.\n\n## 요청 필드와 수집 필드\n\n룰이 참조할 수 있는 경로는 두 갈래로 나뉩니다. 요청에서 나오는 필드와, 평가 중에 밖에서 읽어 오는\n필드입니다.\n\n요청 필드는 정규화가 요청에서 뽑은 값입니다. 요청이 접수되는 순간 값이 정해지므로 `scope`와 `when`\n어디서든 쓸 수 있습니다.\n\n\u003cFieldCatalog only=\"request\" />\n\n수집 필드는 평가 도중 PIP 소스가 채우는 값입니다. PIP 소스는 룰이 참조하는 외부 사실의\n출처입니다([자세히](/policy/runtime/pip)). 수집 이전에 `scope`가 판정되기 때문에 수집 필드는\n`when`에서만 쓸 수 있습니다. 시드 출금 룰이 `address_ownership.status`를 `when`에 적는 것이 그\n예입니다.\n\n아래 목록은 그 워크스페이스에 등재된 PIP 소스에 따릅니다. 소스를 더하면 참조할 수 있는 경로도 함께\n늘어납니다.\n\n\u003cFieldCatalog only=\"pip\" />\n\n어드민 액션의 `payload.*` 필드는 플랫폼이 저작하는 표면이라 이 표에 없습니다. 그 계약은\n[룰 명세](/policy/rule/reference)에 있습니다.\n\n## 리터럴과 슬롯\n\n값은 리터럴이거나 슬롯입니다. 슬롯은 카탈로그에 선언되고 워크스페이스가 조정할 수 있는 값입니다.\n\n플랫폼이 하한(floor)이나 허용 값 목록을 정하고 파트너사가 그 안에서 값을 골라 발행합니다. 시드\n카탈로그에 있는 슬롯은 다섯입니다.\n\n- **`grantable_roles`**: 권한 부여 액션으로 줄 수 있는 role 목록입니다\n- **`approval_quorum`**: 권한 부여를 승인하는 데 필요한 최소 승인자 수입니다\n- **`escalation_quorum`**: 어드민 액션 중 권한을 올리는 성격의 것들인 escalation surface에서 요구하는\n  최소 승인자 수의 하한이고, 기본값이 `approval_quorum`보다 높습니다\n- **`approved_intent_ttl_seconds`**: 승인된 요청이 서명까지 유효한 시간(초)입니다\n- **`resource_limit_per_tx`**: 건당 수수료 총액 상한이고, 체인별 값을 각각 선언합니다\n\n**금액 상한은 리터럴로 적을 수 없습니다.** 금액 리터럴의 순서 비교는 컴파일 시점에 거부되므로,\n상한은 금액 슬롯을 참조해서만 씁니다.\n\n커널이 평가 시점에 다시 보는 것은 하한과 타입까지이고, 허용 값 목록은 발행 시점에만 대조합니다. 그\n차이가 왜 생기는지는 [결정과 결합](/policy/rule/decision)에서 설명합니다.\n\n## obligation 세 종류\n\nobligation은 \"통과시키되 이것을 이행하라\"는 요구입니다. 종류는 셋이고, 룰이 그중 하나를 골라\n답니다.\n\n| 타입 | 무엇을 요구하나 |\n|---|---|\n| `require_2fa` | 요청자의 2단계 인증 |\n| `require_quorum` | 승인이 성립하는 데 필요한 최소 승인자 수인 정족수. 인원수·승인 가능 역할·본인 승인 허용 여부를 정합니다 |\n| `attach_travel_rule_payload` | 트래블룰 정보 첨부 |\n\n`require_quorum`의 본인 승인 허용은 생략하면 불허입니다. 요청자와 승인자가 같으면 정족수가 통제가\n아니라 형식이 되기 때문입니다.\n\n**`deny` 룰에는 obligation을 달 수 없습니다.** 거부하면서 이행을 요구하는 것은 뜻이 성립하지\n않습니다.\n\nobligation은 배열이라 둘 이상을 함께 답니다. 플랫폼이 발행하는 역할 부여 허가 룰이 그 사례입니다.\n\n```json\n\"obligations\": [\n  { \"type\": \"require_2fa\" },\n  { \"type\": \"require_quorum\", \"params\": { \"n\": { \"slot\": \"approval_quorum\" } } }\n]\n```\n\n## 번들 두 종류\n\n저작 결과가 들어가는 번들은 둘입니다. 누가 발행하고 무엇을 담는지가 갈립니다.\n\n정책 로직 번들은 룰과 선언 데이터를 커널과 함께 담아 발행한 배포 산출물입니다. 플랫폼 거버넌스가\n관리하고, 배포 단위당 하나이며, 변경은 제안자와 승인자를 갈라 두는 maker-checker 승인을 거칩니다.\n\n워크스페이스 번들은 한 워크스페이스가 소유하는 값 이동 룰과 슬롯 값입니다. 값 이동은 출금·vault\n이체·집금처럼 자산을 실제로 움직이는 연산 셋입니다. 파트너사가 쓰는 룰과 슬롯 값이 여기 들어갑니다.\n\n하한만 두고 상한을 두지 않습니다. 인가 TTL의 상한은 슬롯 선언이 아니라 검사 둘이 강제합니다. 발행\n시점의 컴파일 검사와, 승인 스탬프를 찍는 절차입니다.\n\n**조정을 불허할 값은 슬롯이 아니라 룰에 직접 씁니다.** 커널이 평가 시점에 허용 값 목록을 다시 보지\n않기 때문입니다.\n\n## 다음으로\n\n- [예시 정책](/policy/examples) — 시드에 들어 있는 룰 셋과, 통과하는 요청과 거절되는 요청\n- [룰 저작과 발행](/policy/workflow) — draft에서 활성까지 사람이 거치는 절차\n- [룰 명세](/policy/rule/reference) — 참조 가능 경로와 어드민 액션 표면의 전수 계약\n- [결정과 결합](/policy/rule/decision) — 커널이 룰의 결정을 결합하는 규칙\n", "kind": "참고 문서", "path": "_reference/policy--rules.html", "reference": true}, {"title": "평가의 순간", "text": "---\ntitle: 평가의 순간\ndescription: 입력 문서가 조립되고 커널이 슬롯을 풀어 결정을 내리기까지\n---\n\nexport const base = import.meta.env.BASE_URL.replace(/\\/$/, \"\");\n\n{/* 뷰어는 1440×900 데스크톱 기준의 자체 완결형 HTML이라 본문 칸(약 720px)에 그대로 넣으면 잘린다.\n    iframe을 1440×900으로 고정하고 칸 폭에 맞춰 축소한다 — 상호작용은 전체 화면·새 탭에서 한다. */}\n\u003cscript is:inline data-astro-rerun>{`\n(function () {\n  var W = 1440, H = 900;\n  function fit(w) {\n    var f = w.querySelector(\"iframe\");\n    var fs = document.fullscreenElement === w;\n    var s = fs ? Math.min(innerWidth / W, innerHeight / H) : w.clientWidth / W;\n    f.style.transform = \"scale(\" + s + \")\";\n    w.style.height = fs ? \"100%\" : Math.round(H * s) + \"px\";\n    f.style.left = fs ? Math.round((innerWidth - W * s) / 2) + \"px\" : \"0\";\n    f.style.top = fs ? Math.round((innerHeight - H * s) / 2) + \"px\" : \"0\";\n  }\n  function fitAll() { document.querySelectorAll(\".dg-wrap\").forEach(fit); }\n  window.__dgFit = fit;\n  window.__dgFull = function (btn) {\n    var w = btn.closest(\"figure\").querySelector(\".dg-wrap\");\n    (w.requestFullscreen || w.webkitRequestFullscreen).call(w);\n  };\n  addEventListener(\"resize\", fitAll);\n  addEventListener(\"fullscreenchange\", fitAll);\n  if (document.readyState !== \"loading\") fitAll(); else addEventListener(\"DOMContentLoaded\", fitAll);\n})();\n`}\u003c/script>\n\nexport function Diagram({ name, title }) {\n  const src = `${base}/diagrams/${name}.html`;\n  return (\n    \u003cfigure class=\"dg\" style=\"display:grid;gap:0;margin:.75rem 0 2.5rem 0\">\n      \u003cdiv class=\"dg-wrap\" style=\"margin:0;position:relative;overflow:hidden;width:100%;height:450px;border:1px solid var(--color-border,#e5e7eb);border-radius:8px 8px 0 0;background:#fff\">\n        \u003ciframe\n          src={src}\n          title={title}\n          loading=\"lazy\"\n          onload=\"window.__dgFit && window.__dgFit(this.parentElement)\"\n          style=\"position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0\"\n        >\u003c/iframe>\n      \u003c/div>\n      \u003cfigcaption style=\"margin:0;display:flex;gap:.6rem;justify-content:flex-end;align-items:center;padding:.55rem .75rem;border:1px solid var(--color-border,#e5e7eb);border-top:0;border-radius:0 0 8px 8px;font-size:.95rem\">\n        \u003cspan style=\"margin-right:auto;opacity:.6;font-size:.85rem\">축소 미리보기 — 상호작용은 전체 화면에서\u003c/span>\n        \u003cbutton type=\"button\" onclick=\"window.__dgFull(this)\" style=\"display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;background:transparent;font:inherit;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M8 3H5a2 2 0 0 0-2 2v3\"/>\u003cpath d=\"M21 8V5a2 2 0 0 0-2-2h-3\"/>\u003cpath d=\"M3 16v3a2 2 0 0 0 2 2h3\"/>\u003cpath d=\"M16 21h3a2 2 0 0 0 2-2v-3\"/>\u003c/svg>\n          전체 화면\n        \u003c/button>\n        \u003ca href={src} target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;text-decoration:none;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 3h6v6\"/>\u003cpath d=\"M10 14 21 3\"/>\u003cpath d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"/>\u003c/svg>\n          새 탭에서 열기\n        \u003c/a>\n      \u003c/figcaption>\n    \u003c/figure>\n  );\n}\n\n_읽는 사람: 구현팀. 입력 문서가 조립되고 커널이 결정을 내기까지의 순서를 다룹니다._\n\n평가의 순간은 발행된 번들이 실제 요청 하나를 판정하는 지점입니다. Orchestrator는 판단 요청을\n접수하고 입력 문서를 조립하는 정책 엔진의 앞단입니다([자세히](/policy/architecture)). 그것이\n요청·환경·PIP 결과를 모아 입력 문서 하나를 만듭니다. 완성된 입력 문서를 평가해 결정을 내는\n평가기(PDP)가 그 문서를 받아 룰을 적용하고 슬롯을 풀어 결정을 냅니다.\n\n결정값의 뜻과 결합 우선순위는 [결정과 결합](/policy/rule/decision)에 있습니다. 사실 수집의 규율은\n판단에 필요한 사실을 평가 시점에 읽어 오는 수집 경로인 PIP([자세히](/policy/runtime/pip))에\n있습니다.\n\n\u003cDiagram name=\"evaluation-input-flow\" title=\"평가 입력의 조립 — 무엇이 어디서 오는가\" />\n\n## 입력 문서의 세 구획\n\n평가기에 들어가는 것은 완성된 입력 문서 하나입니다. Orchestrator가 세 구획을 모아 조립합니다.\n\n```json\n{\n  \"operation\": \"value_transfer\",\n  \"principal\": { \"...\": \"정규화가 확정한 요청 사실\" },\n  \"chain\": { \"...\": \"...\" },\n  \"token\": { \"...\": \"...\" },\n  \"amount\": \"...\",\n  \"source_vault\": { \"...\": \"...\" },\n  \"destination\": { \"...\": \"...\" },\n  \"payload\": { \"...\": \"연산별 상세 — value_transfer v1은 sweep의 deposit_id 하나\" },\n\n  \"address_ownership\": { \"...\": \"PIP 스냅샷 — 소스명이 최상위 키\" },\n\n  \"_engine\": {\n    \"tenant_id\": \"tnt-…\",\n    \"obligations\": { \"...\": \"이행 맥락\" },\n    \"workspace_bundle\": { \"rules\": [], \"slots\": {} }\n  }\n}\n```\n\n- **정규화된 본문**: 요청이 주장한 사실을 대조 가능한 형태로 고정한 것입니다. `operation`과 그\n  형제 키들이 여기에 해당하고, `payload`는 연산별 상세만 담습니다. 자세한 것은\n  [정규화](/policy/runtime/normalization)에 있습니다.\n- **PIP 스냅샷**: 소스명을 최상위 키로 나열합니다. 본문 키와 겹치면 조립을 실패로 종결합니다.\n  수집한 사실이 요청 사실을 덮어쓰는 길을 막기 위해서입니다.\n- **엔진 구획(`_engine`)**: 워크스페이스 번들, obligation 이행 맥락, 테넌트 식별자처럼 엔진이\n  확정한 값이 들어가는 구획입니다. 요청이 이 구획을 채울 수 없습니다.\n\n여기서 obligation은 통과로 확정되기 전에 이행해야 하는\n조건입니다([룰 쓰기](/policy/rules)).\n\n값 이동 세 연산은 canonical에서 `value_transfer` 하나로 모입니다. 그래서 `operation`은 파트너\n대상 API의 연산 이름과 1:1이 아닙니다. 최상위 키로 나열되는 PIP 스냅샷은 평가 루프에서 수집하는\n소스이고, 지금 그것은 `address_ownership` 하나입니다.\n\n**워크스페이스 구획은 빠뜨릴 수 없는 키입니다.** 구획이 없거나 모양이 어긋나면 커널은 평가에\n진입하지 않고 `WORKSPACE_BUNDLE_INVALID`로 종결합니다. 커널이 런타임 기본값을 갖지 않기\n때문입니다.\n\n그래서 조정할 값이 없는 워크스페이스도 빈 구획 `{\"rules\": [], \"slots\": {}}`을 명시적으로 담아야\n합니다. 룰 배열을 빼면 전송 중 사라진 구획이 \"룰 없는 워크스페이스\"로 읽히므로, 빈 룰 세트도\n`\"rules\": []`로 적습니다. 조립하는 쪽이 키를 빼면 그 워크스페이스의 모든 요청이 막힙니다.\n\n## 두 층의 룰 병합\n\n룰은 `scope`와 조건을 갖고 `allow`·`deny`를 내는 단위입니다([룰 쓰기](/policy/rules)).\n커널은 조건 트리를 평가하고 결정을 결합하는 정책 무관 고정\n부분입니다([결정과 결합](/policy/rule/decision)).\n\n커널은 적재된 선언 트리의 플랫폼 룰과, 입력 문서에 담겨 온 워크스페이스 룰을 이어 붙여 하나의 룰\n목록으로 평가합니다. 워크스페이스 번들은 한 워크스페이스가 소유하는 값 이동 룰과 슬롯 값입니다.\n두 층은 같은 문법과 같은 해석기를 씁니다.\n\n`scope`에 해당하지 않는 룰은 이 요청에 없는 것과 같고, 남은 룰만 `when` 판정에 들어갑니다.\n\n**두 출처의 룰 ID가 하나라도 겹치면 그것만으로 종결합니다.** 결정은\n`WORKSPACE_BUNDLE_INVALID`이고, 평가는 실행되지 않습니다. 이어 붙인 목록에서 같은 ID가 둘이면 룰별\n판정을 담을 항목이 충돌하기 때문입니다.\n\n컴파일은 번들 하나 안의 ID 유일성만 보증합니다. 두 층에 걸친 유일성은 커널이 봅니다. 그래서\n워크스페이스 저작자가 플랫폼 룰 ID를 재사용하면 그 워크스페이스 전체가 막힙니다.\n\n## 3치 조건 판정\n\n조건 리프의 판정은 참·거짓·미지 셋이고, 미지는 입력에 없는 PIP 소스를 가리켰을 때만 나옵니다. 3치\n규칙 전체는 [룰 명세](/policy/rule/reference)에 있습니다.\n\n평가 흐름에서 중요한 것은 미지의 결과입니다. **미지는 allow를 세우지 못하고**, 그 소스를 수집해\n오라는 요구가 되어 다음 평가 라운드로 이어집니다. 평가 라운드는 한 판단 요청 안에서 평가가 몇\n번째로 실행됐는지입니다([결정과 결합](/policy/rule/decision)).\n\n## 슬롯 해석 우선순위 세 단계\n\n슬롯은 카탈로그에 선언되고 워크스페이스가 조정할 수 있는 값입니다([룰 쓰기](/policy/rules)).\n`{\"slot\": \"이름\"}` 참조를 만나면 커널이 그 시점에 값을 찾습니다. 우선순위는 세 단계입니다.\n\n1. 입력의 워크스페이스 번들에 있는 테넌트별 값\n2. 워크스페이스 번들의 기본값\n3. 선언 트리의 슬롯 카탈로그에 있는 플랫폼 기본값\n\n**조건의 비교값과 obligation의 파라미터가 같은 해석을 거칩니다.** 그래서 승인에 필요한 최소\n인원인 정족수도, 허용 목록도 워크스페이스가 조정한 값이 같은 규칙으로 적용됩니다. 하한을 평가 시점에 한 번 더\n확인하는 이유는 [룰 쓰기](/policy/rules)에 있습니다.\n\n## 결정값 산출\n\n커널은 [결정과 결합](/policy/rule/decision)이 정한 우선순위를 정해진 검사 순서로 집행합니다. 그\n우선순위는 기본 거부, deny 최우선, 수집 요구, 모듈 AND, obligation입니다. 미평가 룰이 기록에 남는\n규칙도 그 페이지에 있습니다.\n\n## 채점과의 공통 계약\n\n채점도 같은 커널과 같은 입력 계약을 씁니다. 테스트 벡터 케이스의 `input`이 완전한 문서를 요구하는\n이유가 여기 있습니다. **채점이 넣는 입력과 평가기가 받는 입력이 같은 모양**이라, 벡터로 고정한\n판정이 운영의 판정과 같은 코드 경로를 거칩니다.\n\n## 다음으로\n\n이 흐름의 각 조각이 어디에 저장되고 무엇이 네트워크를 오가는지는\n[저장과 이동](/policy/runtime/storage)에 있습니다.\n", "kind": "참고 문서", "path": "_reference/policy--runtime--evaluation.html", "reference": true}, {"title": "정규화", "text": "---\ntitle: 정규화\ndescription: 승인한 것과 서명될 것이 같은가\n---\n\n_읽는 사람: 구현팀. 승인된 서명 대상과 실제로 서명될 것을 무엇으로 대조하는지 다룹니다._\n\n정규화는 요청을 대조할 수 있는 형태로 옮기는 단계입니다. 평가에 들어가기 전에 서명 대상의 고정\n부분을 산출해 요청 레코드에 새기고, 서명 직전의 콜백이 그것과 지금 서명되려는 것을 맞춰 봅니다.\n그 대조가 [서명 게이트](/policy/signing-gate) 2단계의 판정 근거입니다. 정규화기 구현은 주소\n체계가 같은 네트워크 묶음인 체인 계열마다 갈리고, 계열과 무관한 계약이 그 위에 있습니다.\n\n## 대조가 일어나는 지점\n\n서명 게이트의 2단계는 \"승인된 것과 지금 서명되려는 것이 같은가\"를 판정합니다. 정규화가 그 판정의\n근거를 정합니다.\n\n정규화기는 체인 계열마다 구현이 갈립니다. 계열과 무관한 계약이 먼저 있고, 각 계열이 그 계약을\n구현합니다.\n\n**정규화 실패는 언제나 fail-closed입니다.** 읽어내지 못한 산출물을 통과시키는 경로를 두지\n않습니다.\n\n## 두 모드\n\n산출물은 두 모드로 나뉩니다. 가르는 기준은 서명 시점 환경값을 담는가 하나입니다.\n\n| 모드 | 언제 이 모드인가 | 무엇으로 대조하나 |\n|---|---|---|\n| 예약형 | 승인 시점에 서명 대상이 완결됩니다 | 승인 시 저장한 다이제스트와 콜백 다이제스트를 맞춥니다 |\n| 재구성형 | 순번·수수료 같은 서명 시점 값을 담습니다 | 고정 필드와 보고된 환경값으로 서명 대상을 재구성합니다 |\n\nEVM에서는 트랜잭션이 재구성형이고 EIP-712 서명이 예약형입니다.\n\n## 재구성 검증\n\n재구성형에서 콜백이 보고한 환경값을 그대로 믿지 않습니다. 그 값으로 재구성한 서명 대상이 실제로\n서명되려는 것과 같아야만 통과합니다.\n\n**이 한 번의 일치가 \"보고된 값이 실제 서명에 들어갔다\"까지 증명합니다.** 그래서 환경값을\n검증하는 단계를 따로 두지 않습니다.\n\n## 스탬프의 두 시점\n\n요청 레코드에 새기는 값은 한 번에 들어가지 않습니다. 서명 대상의 고정 부분은 평가 이전의 정규화\n단계가 새기고, 인가에 딸린 값은 승인 시점에 새깁니다.\n\n정규화 단계가 새기는 것이 넷입니다. 상태는 이때 `RECEIVED`에서 `NORMALIZING`을 거쳐\n`EVALUATING`으로 갑니다.\n\n- **서명 대상의 고정 부분**: 예약형은 완결된 다이제스트를, 재구성형은 고정 필드와 그 해시를 남깁니다\n- **정규형 의도 전문**: 결정 기록의 입력 문서와 바이트로 대조되는 사본입니다\n- **정규화기 버전**: 콜백이 어느 구현을 고를지 정하는 버전 식별자입니다\n- **해석된 워크스페이스와 테넌트**: 요청이 신고한 값이 아니라 출발 지갑 소유에서 해석한 값입니다\n\n승인 시점에 새기는 것은 셋입니다.\n\n- **인가 TTL**: 발급된 인가가 유효한 시간입니다. 만료 시각을 여기서 유도합니다\n- **자원 상한**: 수수료의 최댓값입니다. 콜백이 정책을 읽지 않고도 대조하게 합니다\n- **서명 권한 바인딩**: 출발 온체인 주소와 provider vault 식별자를 함께 담습니다\n\n셋은 함께 있거나 함께 없습니다. 셋 중 일부만 새겨진 상태는 승인 후 최대 TTL만큼 지난 뒤에야\n드러납니다.\n\n**번들 다이제스트는 요청 레코드에 없습니다.** 평가에 실제로 쓴 번들 식별자는 결정 기록의 평가\n항목에만 남습니다.\n\n저장 형태는 값마다 다릅니다. 크기 상한이 없는 필드는 원값이 아니라 해시로 나르고, 콜백이 그\n해시를 먼저 맞춘 뒤 재구성으로 넘어갑니다. 어느 값이 어느 컬럼에 어떤 형태로 저장되는지는 정책 엔진\n내부의 영속 구조 문서가 다룹니다.\n\n## 정규화기 버전과 보존\n\n정규화기를 새로 배포해도 이미 발급된 인가는 흔들리지 않습니다. 콜백이 현행 버전이 아니라 요청에\n새겨진 버전으로 정규화기를 고르기 때문입니다.\n\n정규화기는 순수 함수 모듈이라 버전별 구현이 앱 안에 함께 들어 있습니다. 외부에서 코드를\n불러오지 않습니다.\n\n**보존 의무의 기간은 인가 TTL이 정합니다.** 인가 TTL은 발급된 인가가 유효한 시간입니다([서명\n게이트](/policy/signing-gate)). 재실행이 필요한 구간은 승인부터 콜백까지뿐이라, 배포 규율의\n하한은 \"직전 활성 버전 구현을 남긴다\"입니다. 없는 버전을 만난 콜백은 거부하고 운영 알림을\n냅니다.\n\n규제 대응 재현은 이 보존과 무관합니다. 결정 기록은 결정을 주체·행위·대상·시각·결과와 함께 남기는\n추가 전용 해시 체인입니다. 그 입력과 번들 해시만으로, 완성된 입력 문서를 평가해 결정을 내는\n평가기(PDP)를 다시 돌립니다.\n\n## 서명 주체 대조\n\n서명 대상 바이트에 서명 주체가 담기지 않는 계열이 있습니다. EVM 트랜잭션에는 `from`이\n없습니다.\n\n**그래서 콜백이 보고한 출발 식별자를 승인 시점의 출발 지갑 주소와 따로 대조합니다.** 이 단계가\n없으면 낮은 권한으로 받은 승인이 다른 서명키의 서명을 인가하게 됩니다.\n\n## 자원 상한\n\n수수료는 요청이 정의하는 값이 아니라 서명 시점에 붙는 값입니다. 대조 대상이 아니므로 자원\n상한이라는 별도 기준으로 검사합니다.\n\n상한은 승인 시점에 새기고 콜백이 그것과 비교합니다. 콜백은 정책을 읽지 않습니다.\n\n**상한이 새겨지지 않았으면 콜백은 거부합니다.** 값이 없으면 멈춘다는 원칙이 여기에도 그대로\n적용됩니다. 아직 값을 선언하지 않은 체인은 그래서 자동으로 막힙니다.\n\n비교하는 피연산자는 콜백이 신고한 총액이 아닙니다. 재구성 대조를 통과한 서명 대상 전체의\n환경값에서 총액을 유도해 비교합니다. 신고값을 보면 정상적인 트랜잭션을 서명해 놓고 수수료만 낮게\n신고하는 방법으로 상한 검사를 피할 수 있습니다.\n\nEVM에서는 `gasLimit × maxFeePerGas`로 유도하고 척도는 wei입니다. 이 값은 실제로 낼 수수료가\n아니라 낼 수 있는 최댓값입니다. 자원 상한이 제한하는 것도 이 서명으로 나갈 수 있는 최대라서\n기준이 맞습니다.\n\n## 실패의 최종 상태\n\n전부 fail-closed이되 최종 상태가 다릅니다. 소비자와 운영이 다르게 반응해야 하기 때문입니다.\n\n| 무슨 일이 있었나 | 결과 |\n|---|---|\n| 미등록 조합·미지 산출물 타입·불투명 blob·레지스트리 불일치 | 거부(DENIED) — 정책적 거부입니다 |\n| 인식한 입력을 처리하다 난 내부 예외 | 실패(FAILED) — 엔진 내부 오류 전용입니다 |\n| 콜백에서 대조 불일치·추출 불가·상한 초과 | 콜백 거부(REJECT) |\n\n사유 코드 전수의 기준 문서는 API 스펙입니다. [API 레퍼런스](/reference)에서 봅니다.\n\n## 요청 필드 매핑\n\n요청 필드를 canonical intent로 옮기는 매핑은 이름 규칙이 아닙니다. **연산마다 명시적으로 선언하고\n정규화기가 그 선언을 소유합니다.**\n\n이름 규칙에 기대면 새로 생긴 필드가 검증 없이 들어옵니다. 실제로 이름만으로 옮겨지는 필드도 거의\n없습니다.\n\n매핑에는 검증이 함께 붙습니다. 목적지 필드가 어느 것이냐가 목적지 종류를 결정하고, 요청자가 종류를\n주장하지 않습니다. 미등재 토큰과 미등재 서명 타입은 그 단계에서 거부됩니다.\n\n요청 스키마는 정책에 의존하지 않습니다. 룰이 카탈로그 밖을 참조하면 컴파일이 실패하고, 요청\n필드를 늘리려면 스키마 버전을 올려야 합니다. 정책이 더 필요로 하는 사실은 요청이 아니라, 판단에\n필요한 사실을 평가 시점에 읽어 오는 수집 경로인 PIP([자세히](/policy/runtime/pip))로 들어옵니다.\n\n## 레지스트리 등록\n\n컨트랙트 호출과 EIP-712 서명은 등록제입니다. 레지스트리는 구조와 타입만 정의합니다. 화이트리스트나\n한도 같은 제약은 `scope`와 조건을 갖고 `allow`·`deny`를 내는 단위인\n룰([자세히](/policy/rules))에서 정합니다.\n\n레지스트리는 룰과 선언 데이터를 커널과 함께 담아 발행한 배포 산출물인 정책 로직 번들에\n포함됩니다. 등록은 승인을 거치는 번들 변경입니다. 컴파일러가 번들 스냅샷을 기준으로 타입을 검사합니다.\n\n**하위 호출을 담아 전달하는 인자는 등록을 거부합니다.** 바이트가 일치해도 무엇을 하는지 모르는\n호출은 \"승인한 것이 곧 서명된 것\"이라는 전제를 깹니다.\n\n## EVM 구현\n\nEVM이 이 계약의 첫 구현입니다. 트랜잭션에서 고정하는 것은 `chainId`·`to`·`value`·`data`\n넷입니다. 나머지는 콜백이 보고하고 재구성으로 검증됩니다.\n\n`to`와 `data`는 자산 등록 정보에서 도출합니다. 네이티브 자산이면 목적지로 바로 보내고, 토큰이면\n컨트랙트 주소로 표준 전송 호출을 인코딩합니다.\n\n트랜잭션 타입은 허용목록으로 좁힙니다. `0x00`·`0x01`·`0x02`만 처리하고 **EIP-7702는\n거부합니다.** 위임 목록이 고정 필드에 드러나지 않아 계정 위임 탈취 경로가 되기 때문입니다. replay\n보호가 없는 구형 legacy도 거부합니다.\n\nEIP-712는 domain에 `chainId`와 `verifyingContract`를 필수로 요구합니다. 둘 중 하나라도 없는\n타입은 등록 자체를 거부합니다. 고정할 수 없는 값이 있으면 다른 체인·다른 컨트랙트로 재사용이\n가능해지기 때문입니다.\n\n메시지는 범위가 아니라 정확값으로 고정합니다. 다이제스트를 다시 도출하려면 완전한 메시지가 있어야\n하기 때문입니다.\n\n## ABI 인코딩\n\nABI 인코딩은 정규형이 아닙니다. 같은 뜻이라도 잔여 상위 비트나 후행 바이트에 따라 다른 바이트가\n나옵니다.\n\n**재구성형이 이 문제를 해결합니다.** 어떤 인코딩으로 만들었든 재구성 결과가 실제 서명 해시와\n같아야 통과하므로, 비정규 인코딩은 불일치로 거부됩니다.\n\n## 프록시 컨트랙트\n\n레지스트리 키가 프록시 컨트랙트를 가리키면 구현이 Wallet SDK 거버넌스 밖에서 교체됩니다. 바이트\n일치는 \"서명된 것 = 승인된 것\"만 보장하고 \"승인한 것이 여전히 같은 일을 한다\"는 보장하지\n않습니다.\n\n컨트랙트 호출은 v1에 사용처가 없어 범위만 확보해 둔 상태입니다. 구현 고정을 강제할지는 사용처가\n정해질 때 결정하고, **그전까지 프록시 쪽 업그레이드 거버넌스는 신뢰 가정입니다.**\n\n## 다른 체인 계열\n\n뼈대는 그대로 재사용하고 계열 구현만 갈아끼웁니다. 두 모드, 승인 스탬프, 재구성 검증, 자원 상한,\nfail-closed, 레지스트리가 전부 계열과 무관합니다.\n\n| 체인별 계약 항목 | EVM | 예: Solana |\n|---|---|---|\n| 주소 정규화 | 20바이트 hex 소문자 | base58 32바이트 공개키 |\n| 금액 단위 | wei | lamports |\n| 서명 대상 | 트랜잭션 전체의 해시 | 직렬화된 message 바이트 |\n| 환경값 | nonce·gas·fee | recent blockhash·fee payer·compute budget |\n\n지금은 대응만 예약하고 구현하지 않습니다.\n\n## 다음으로\n\n- [서명 게이트](/policy/signing-gate) — 이 대조가 어느 단계에서 일어나는지\n- [저장과 이동](/policy/runtime/storage) — 스탬프한 값이 어느 저장소에 남는지\n- [룰 쓰기](/policy/rules) — 레지스트리가 정의한 것을 룰이 어떻게 제약하는지\n", "kind": "참고 문서", "path": "_reference/policy--runtime--normalization.html", "reference": true}, {"title": "PIP", "text": "---\ntitle: PIP\ndescription: 세상의 상태를 언제 어떻게 읽는가\n---\n\n_읽는 사람: 구현팀. 소스를 선언하고 결과를 인증·검증해 입력에 싣는 계약을 다룹니다._\n\nPIP는 판단에 필요한 사실을 평가 시점에 읽어 오는 수집 경로입니다. 판단 요청을 접수하고 입력\n문서를 조립하는 정책 엔진의 앞단인 Orchestrator([자세히](/policy/architecture)) 안의 어댑터\n계층입니다. 소스마다 선언 하나를 두고, 그 선언이 룰이 볼 수 있는 표면과 신선도·인증 규율을\n정합니다.\n\n## 평가 시점에 읽는 이유\n\n룰이 참조하는 값 중 변하는 것이 있습니다. 주소록 등재 여부, 잔액, AML·KYT 심사 결과, 트래블룰,\n어드민 역할 같은 것들입니다.\n\n이것들을 요청에 담으면 요청 시점의 값이 굳습니다. 주소를 회수해도 이미 접수된 요청은 옛 값으로\n판단합니다. 그래서 요청에 담지 않고 **평가 시점에 읽습니다.** 그 읽는 경로가 PIP입니다.\n\n## 소스 선언\n\n새 소스를 붙이는 일은 코드를 짜는 일이 아니라 선언을 쓰는 일입니다. 소스명, 수집 시점, 동기·비동기,\n최대 나이, 타임아웃, 재사용 범위, 스냅샷 스키마, 목적지, 인증키를 한곳에 적습니다.\n\n이 선언은 룰과 선언 데이터를 커널과 함께 담아 발행한 배포 산출물인 정책 로직 번들에 포함되고,\n변경은 승인에 필요한 최소 인원인 정족수의 승인을 거칩니다. 최대 나이와 인증키가 보안 경계라,\n운영값까지 같은 경로로 묶어 통제합니다. 어드민 화면은 그 변경을 작성해 승인 경로로 넘기는\n창구이지 승인을 건너뛰는 토글이 아닙니다.\n\n**소스의 종류는 코드가 정의하고 선언은 그 종류의 인스턴스입니다.** 같은 종류의 제공자가 둘이면\n소스명이 갈린 선언이 둘입니다.\n\n## 스냅샷 스키마\n\n스냅샷 스키마는 파트너 소스에만 붙는 것이 아닙니다. 내부 소스를 포함한 모든 소스의 룰 참조 표면이\n이 선언 하나로 정해집니다.\n\n컴파일 타입 검사도, 도착한 결과의 검증도 같은 선언을 읽습니다. 선언에 없는 필드를 참조한 룰은\n컴파일되지 않고, 스키마 변경은 승인을 거치는 레지스트리 변경입니다.\n\n**모든 스냅샷은 입력에 들어가기 전에 이 스키마로 검증됩니다.** 부합하지 않으면 그대로 막히므로,\n스키마 밖의 값이 룰에 도달하는 경로가 구조적으로 없습니다.\n\n내부 코드 어댑터는 반환 타입을 이 스키마에서 생성해 씁니다. 앱이 뜰 때와 번들이 활성화될 때\n\"어댑터가 구현한 스키마 버전과 활성 번들이 선언한 버전이 같은가\"를 스스로 점검하고, 어긋나면 그\n소스의 수집을 거부하며 알림을 냅니다.\n\n원천이 조용히 바뀌는 것은 탐지가 아니라 계약으로 막습니다. 내부 소스가 부르는 API는 TypeSpec의\n1급 스펙으로 계약화합니다. 어댑터가 그 스펙에서 생성한 클라이언트만 쓰도록 하는 것은 아직 남은\n일입니다.\n\n## 동기와 비동기\n\n동기 소스는 일반적인 HTTP 요청·응답입니다. 비동기 소스는 아웃바운드 트리거를 보낸 뒤 결과 제출을\n기다립니다. 제출은 인증된 인바운드 호출이고, 엔진도 아웃바운드 요청에 서명해서 파트너가 호출자를\n검증할 수 있게 합니다.\n\n어느 쪽인지는 엔진이 고르는 값이 아니라 파트너의 통합 역량이 정하는 사실입니다. 엔진은 양쪽을\n다 지원하고 파트너가 선언한 것을 기록해 집행합니다.\n\n**재개 판정은 두 모드에서 같습니다.** 필요한 소스가 전부 입력에 있고 신선할 때만 다시 평가에\n들어갑니다. 동기면 어댑터가 즉시 채우고 비동기면 도착 시 채울 뿐입니다.\n\n모든 데이터가 모이면 다시 평가합니다. 평가 라운드는 한 판단 요청 안에서 평가가 몇 번째로\n실행됐는지이고, 라운드 상한은 [결정과 결합](/policy/rule/decision)에 있습니다.\n\n## 심사 결과 참조와 개인정보\n\n트래블룰은 가상자산 이전 시 송·수신 정보를 사업자끼리 교환하는 규제\n의무입니다([에코시스템](/#함께-제공하는-모듈)). AML과 트래블룰 심사는 개인정보를 쥔 파트너나 소유\n시스템이 자기 경계에서 수행합니다. 엔진의 PIP는 그 결과를 참조로 읽어 확인합니다.\n\n**그래서 네트워크 전송 구간에 원본 개인정보가 오가지 않습니다.** 주체는 참조 식별자로 넘기고, 심사\n파라미터는 이미 요청에 있는 비-개인정보 값(목적지·금액·토큰)입니다.\n\n저장되는 스냅샷에도 판정값과 참조 식별자만 남습니다. 원본은 소유 시스템이 자기 보존정책으로\n관리합니다.\n\n이 두 소스는 종류만 있고 선언이 아직 없습니다. 코드가 AML 심사와 거래상대 확인을 소스 종류로\n정의해 두었지만, 선언 레지스트리에 등록된 인스턴스는 지갑 소유·토큰 카탈로그·주소 등재 셋입니다.\n아래 계약은 그 셋에 이미 적용되고 있고, 두 소스가 생길 때 선언만 더하면 됩니다.\n\n## 거래 바인딩\n\n\"심사가 끝났고 통과였다\"만으로는 부족합니다. 그 결과가 **지금 승인하려는 이 거래의 것**임을\n엔진이 검증합니다.\n\n파트너가 목적지 A에 100으로 통과를 냈는데 엔진이 목적지 B에 500을 승인하면, 심사받지 않은 거래가\n통과합니다. 묶는 데 쓰는 파라미터는 전부 비-개인정보입니다.\n\n## 파트너의 정의\n\n파트너는 **신뢰 경계 밖의 조직으로서 서명된 제출로 엔진에 데이터를 넣는 주체**입니다. 적격기관과\n사용자 2단계 인증 증거를 제출하는 파트너사 인증 서버가 여기 해당합니다.\n\n트래블룰과 KYT는 이 정의에 들지 않습니다. 바깥 경계와의 통신을 자기 쪽에서 끝내는 내부\n컴포넌트라, 어댑터가 서비스 신원으로 직접 조회합니다.\n\n내부 소스도 같은 선언 필드를 씁니다. 다른 것은 인증키 항목뿐이라, 분류가 바뀌는 일이 코드 변경이\n아니라 선언 차이가 됩니다. 내부 소스를 외부 제공자로 옮기면 인증키를 선언에 더하는 것으로 아래\n제출 계약을 적용받게 됩니다.\n\n## 제출 인증\n\n인바운드 제출은 서명된 페이로드(JWS)입니다. 권위 있는 신원은 서명키에서 등록된 파트너로\n가는 매핑이고, 요청 본문이 주장하는 신원은 신뢰하지 않습니다.\n\n서명이라서 프록시 구간을 넘어도 그대로 유지됩니다. 판정에 서명이 함께 남아 파트너가 나중에\n제출을 부인할 수 없습니다. 감사에서 다시 확인할 때도 그 서명을 근거로 씁니다.\n\n**mTLS 같은 채널 보안은 인프라 계층에 둡니다.** 애플리케이션 계약에 섞으면 게이트웨이 구성이\n계약의 일부가 됩니다.\n\n검증키는 하나가 아니라 목록입니다. 키를 하나만 실을 수 있으면 교체하는 순간 수집 중이던 요청의\n도착이 전부 거부되므로, 두 키를 함께 실은 선언을 먼저 내고 구 키를 나중에 뺍니다.\n\n## 요청과 제출을 잇는 식별자\n\n비동기 수집을 낼 때마다 엔진이 1회용 식별자를 만들고, 서버 쪽에서 요청·소스·평가 라운드에\n묶습니다. 이 값을 상관 식별자라고 부릅니다. 파트너는 그 식별자를 서명된 제출에 그대로 담아\n보냅니다.\n\n**원 요청 식별자는 신뢰 경계 밖으로 내보내지 않습니다.** 서명 인가와 같은 패턴입니다. 서버가\n만들고, 한 번만 쓰이고, 서버가 쥔 사실에 묶입니다.\n\n## 도착 검사 아홉 단계\n\n검사 순서는 싼 것부터가 아니라 좁은 것부터입니다. 앞 검사를 통과하지 못한 제출에는 뒤 검사의\n결과를 알려 주지 않습니다.\n\n| 순서 | 무엇을 봅니다 | 통과하지 못하면 |\n|---|---|---|\n| 1 | 상관 식별자가 발행된 미결인가 | `UNKNOWN_ID` |\n| 2 | 이미 소비되지 않았고 대기 상한 안이며 인증 신원이 기대 파트너와 같은가 | `ALREADY_SETTLED` · `TIMED_OUT` · `PARTNER_MISMATCH` |\n| 3 | 그 소스의 선언이 남아 있는가 | `SOURCE_REFUSED` |\n| 4 | 그 소스의 스키마 자가 점검이 거부 상태가 아닌가 | `SOURCE_REFUSED` |\n| 5 | 발행 시점에 새긴 스키마 버전이 지금 선언과 같은가 | `SCHEMA_MISMATCH` |\n| 6 | 부모 요청의 재개 맥락을 읽을 수 있는가 | `UNKNOWN_ID` |\n| 7 | 정규형 의도 해시가 이 수집에 새긴 바인딩과 같은가 | `BINDING_MISMATCH` |\n| 8 | 스냅샷이 선언 스키마에 부합하는가 | `SCHEMA_MISMATCH` |\n| 9 | 엔진 통제 시각 기준으로 신선한가 | `STALE` |\n\n아홉을 통과한 제출만 마지막 단일 행 소비로 갑니다. 그 소비의 갱신 행 수가 판정이라, 경합에서도\n한쪽만 성공합니다. 같은 결과가 두 번 오면 멱등하게 받고 아무것도 바꾸지 않습니다.\n\n거절은 전부 미적용이라 그 소스는 미수집으로 남습니다. 그러면 대기 상한이 요청을 거부로\n종결합니다.\n\n평가 라운드는 별도 검사가 아닙니다. 라운드는 미결이 0건일 때만 올라가므로, 라운드가 넘어간\n뒤 도착한 옛 식별자는 그 시점에 이미 소비되었거나 시한이 지난 상태입니다.\n\n**거래 바인딩 불일치는 잡음이 아닙니다.** 인증된 파트너가 형식이 맞는 결과를 냈는데 묶인 대상이\n다르다는 뜻입니다. 수집 실패로 처리하되 보안 이상 표식을 붙인 구조화 로그를 남깁니다. 이\n단계에서 결정 기록 항목은 남지 않습니다. 다음 항목이 대기 상한 종결이라, 그 사이에 남는 기록은\n이 로그 하나입니다.\n\n## 어댑터 등록의 두 방식\n\n**파트너 응답을 엔진 포맷으로 바꾸는 매핑 로직을 두지 않습니다.** 파트너가 엔진 스냅샷 스키마에\n맞춰 제출하기 때문입니다.\n\n매핑을 설정으로 허용하면 표현식과 조건분기가 설정에 들어옵니다. 그것은 사실상 코드를 설정 파일에 두는\n일이라, 그 표면 자체를 만들지 않습니다. 동기 소스도 같아서, 파트너가 엔진 스키마로 답하는\n엔드포인트를 노출합니다.\n\n그래서 어댑터는 두 방식으로 등록됩니다.\n\n- **선언 등록**: 전송이 HTTPS 요청·응답에 서명 제출이면 선언만으로 등록됩니다. 코드 배포 없이\n  승인을 거치는 번들 변경으로 소스가 늘어납니다\n- **코드 등록**: 비표준 인증이나 다단계 핸드셰이크는 선언으로 표현되지 않아 코드 어댑터로\n  대응합니다. 이쪽도 등록과 배포 파이프라인을 똑같이 거칩니다\n\n선언으로 등록한 소스가 룰에 내놓는 것은 판정값 하나입니다. 여러 필드나 수치 비교, 집계가\n필요하면 선언으로 흉내 내지 않고 코드 등록으로 올립니다. 심사의 세부 기준은 심사 주체가 자기 경계\n안에서 판정으로 요약해 보냅니다.\n\n## 소스 장애\n\n소스를 \"중요\"와 \"보조\"로 나누지 않습니다. 어느 소스든 읽지 못하면 판단하지 않습니다.\n\n종결은 원인으로 갈립니다. 심사 결과가 차단이나 판정 유보로 왔으면 그것은 정상적인 값이라 룰이\n판정합니다. 상한 안에 도착하지 않았으면 거부하고, 재제출할 수 있는 사유로 표시합니다.\n\n유효하지 않은 결과는 아예 반영하지 않습니다. 소스가 수집되지 않은 상태로 남아 타임아웃 경로로\n거부에 이릅니다.\n\n**실패로 마감하는 것은 어댑터 내부 오류뿐입니다.** 파트너 쪽 문제에는 쓰지 않습니다. 엔진 내부\n오류 전용 상태라, 여기에 남의 실패를 섞으면 운영이 무엇을 봐야 할지 알 수 없게 됩니다.\n\n## 신선도\n\n읽은 값에는 최대 나이(`max_age`)가 붙고, 그보다 오래된 스냅샷은 없는 것으로 봅니다.\n\n기준 시각은 엔진이 그 사실을 획득한 시각입니다. 파트너가 함께 보낸 심사 시각은 감사\n메타데이터로만 기록하고 신선도 권위로 쓰지 않습니다.\n\n**신뢰 경계 밖의 값이 보안 속성을 좌우하게 두지 않습니다.** 파트너가 시각을 늘려 적으면 만료된\n사실이 신선한 것으로 통과합니다.\n\n도착할 때와 재개할 때 신선도를 매번 다시 봅니다. 한 번 통과한 값이 그대로 유효한 것으로 남지\n않습니다.\n\n## 재사용 범위\n\n재사용 범위는 소스가 선언합니다. 거래 바인딩은 결과가 이 요청에 묶입니다. 다른 요청에 쓸 수\n없으니 사실상 요청마다 다시 읽습니다.\n\n주체 바인딩은 거래가 아니라 주체에 묶입니다. 같은 주체라면 최대 나이 안에서 다시 쓸 수\n있습니다.\n\n주소에 등재 근거를 붙이는 장부인 주소록([자세히](/fund-flows/address-book))의 등재 여부는 거래\n바인딩입니다. **회수가 즉시 반영되어야 하기 때문입니다.** 재사용을 허용하면 그 기간이 그대로\n회수된 주소의 승인 기간이 됩니다.\n\n등재와 회수 자체는 [주소록](/fund-flows/address-book)에서 정합니다.\n\n## 조회 순서와 격리\n\n소스 선언은 소스마다 독립이라 \"이 소스의 조회 범위가 저 소스의 해석 결과에서 온다\"를 적을 곳이\n없습니다. 그래서 수집 순서는 코드가 소유합니다.\n\nworkspace는 Wallet SDK를 도입한 회사 하나이고 최상위 격리\n컨테이너입니다([계정 계층](/accounts-wallets/accounts)). vault 소유 해석은 vault 식별자 하나로\n소유 workspace와 tenant를 확정하는 조회입니다.\n\n예를 들어 토큰 카탈로그 조회는 **요청이 신고한 workspace가 아니라 vault 소유 해석에서 얻은\nworkspace로** 스코프합니다. 신고값으로 조회하면 그것이 곧 cross-tenant 유출입니다.\n\n주소 등재 조회도 같습니다. 조회 범위를 정하는 키는 요청이 싣지 않고 앞선 해석에서 나옵니다.\n\n## 등재 상태의 세 값\n\n주소가 등재되어 있지 않다는 사실을 \"필드가 없음\"이나 \"수집을 건너뜀\"으로 표현하지 않습니다. 등재\n상태라는 필드 하나에 **활성·회수·미등재** 세 값을 모두 담습니다.\n\n부재로 두면 평가기가 그 룰을 판정 불가로 남기고 같은 소스를 또 요구합니다. 수집을 건너뛰면 정상적인\n거부가 대기 상한만큼 요청을 묶어 원천 장애와 구분되지 않습니다.\n\n세 값이 한 필드에 모이므로 \"상태가 활성인가\"라는 조건 하나가 미등재와 회수를 함께 막습니다.\n\n## vault 태그 소스\n\nvault에는 고객이 용도 태그를 붙이고 앱은 그 뜻을 해석하지 않습니다. 그 태그가 룰의 참조 대상이면\n**엔진이 그것을 읽어 올 소스가 있어야 합니다.**\n\n지금 선언에는 그런 소스가 없습니다. 그래서 `vault_tags`를 새 소스로 두기로 했습니다. 룰은\n`vault_tags.\u003c필드>`로 참조하고, 원천이 지갑 도메인이라 어댑터가 서비스 신원으로 직접 조회합니다.\n목적지와 인증키 바인딩은 비어 있습니다.\n\n주소 라벨 소스에 얹지 않습니다. 라벨은 주소에 붙고 태그는 vault에 붙어 조회 키가 다릅니다.\n한 소스가 두 키를 답하면 스냅샷 스키마 하나가 두 대상의 룰 참조 표면을 함께 지게 됩니다.\n\n신선도와 재사용 규율은 다른 소스와 같은 얼개를 씁니다. 최대 나이는 엔진이 획득한 시각으로 재고,\n도착할 때와 재개할 때 매번 다시 봅니다. 태그가 무엇인지는 [지갑 계층](/accounts-wallets/wallets)에\n있습니다.\n\n## 미정 항목\n\n**정해진 것은 소스를 신설한다는 것 하나입니다.** 선언에 들어갈 값은 아직 없고, 구현은 그 뒤입니다.\n\n- **스냅샷 필드와 값 종류**: 태그는 vault 하나에 여럿 붙는데 스냅샷 필드의 값 종류에 목록형이 없습니다\n- **수집 시점**: 룰이 태그를 직접 참조하면 평가 루프이고, 번들 선택·정규화의 전제면 평가 진입 전입니다\n- **재사용 범위**: 태그 변경이 즉시 반영되어야 하면 거래 바인딩이고, 아니면 주체 바인딩입니다\n- **최대 나이·타임아웃·재시도**: 위 셋이 정해진 뒤에 값이 붙습니다\n\n출발 vault와 목적지 vault를 한 선언으로 다루는지도 아직입니다. vault 이체는 양쪽 태그를 함께\n보는데, 소스 하나가 두 vault를 답하는지 선언을 둘로 가르는지가 정해지지 않았습니다.\n\n## obligation 이행 증거\n\nobligation은 통과로 확정되기 전에 이행해야 하는\n조건입니다([룰 쓰기](/policy/rules)). 사용자에게 2단계 인증을 요구하는 obligation의 이행\n증거도 이 인바운드 계약을 그대로 씁니다. 표면과 인증, 상관 식별자와 도착 규칙이 한 세트이기\n때문입니다.\n\n엔진이 1회용 식별자를 만들어 통지에 담고, 파트너가 검증 결과를 서명해 되돌려 보냅니다. 증거에 담기는\n것은 검증 수단과 참조 식별자이고 개인정보는 들어가지 않습니다.\n\n트래블룰 정보 첨부는 별도 증거 표면이 없습니다. **해당 소스를 다시 읽어 이행을 확인합니다.**\n교환이 끝났다는 사실이 PIP로 도착하면 재개 재평가가 그것을 봅니다.\n\n어드민의 정족수와 2단계 인증은 이 계약이 아니라 어드민 표면을 씁니다.\n\n## 다음으로\n\n- [서명 게이트](/policy/signing-gate) — 수집이 어느 단계에서 일어나는지\n- [결정과 결합](/policy/rule/decision) — 수집 요구가 어떻게 결정값으로 나오는지\n- [저장과 이동](/policy/runtime/storage) — 수집 레코드와 결정 기록이 어느 저장소에 남는지\n", "kind": "참고 문서", "path": "_reference/policy--runtime--pip.html", "reference": true}, {"title": "저장과 이동", "text": "---\ntitle: 저장과 이동\ndescription: 각 산출물이 어디에 저장되고 무엇이 네트워크를 오가는가\n---\n\nexport const base = import.meta.env.BASE_URL.replace(/\\/$/, \"\");\n\n{/* 뷰어는 1440×900 데스크톱 기준의 자체 완결형 HTML이라 본문 칸(약 720px)에 그대로 넣으면 잘린다.\n    iframe을 1440×900으로 고정하고 칸 폭에 맞춰 축소한다 — 상호작용은 전체 화면·새 탭에서 한다. */}\n\u003cscript is:inline data-astro-rerun>{`\n(function () {\n  var W = 1440, H = 900;\n  function fit(w) {\n    var f = w.querySelector(\"iframe\");\n    var fs = document.fullscreenElement === w;\n    var s = fs ? Math.min(innerWidth / W, innerHeight / H) : w.clientWidth / W;\n    f.style.transform = \"scale(\" + s + \")\";\n    w.style.height = fs ? \"100%\" : Math.round(H * s) + \"px\";\n    f.style.left = fs ? Math.round((innerWidth - W * s) / 2) + \"px\" : \"0\";\n    f.style.top = fs ? Math.round((innerHeight - H * s) / 2) + \"px\" : \"0\";\n  }\n  function fitAll() { document.querySelectorAll(\".dg-wrap\").forEach(fit); }\n  window.__dgFit = fit;\n  window.__dgFull = function (btn) {\n    var w = btn.closest(\"figure\").querySelector(\".dg-wrap\");\n    (w.requestFullscreen || w.webkitRequestFullscreen).call(w);\n  };\n  addEventListener(\"resize\", fitAll);\n  addEventListener(\"fullscreenchange\", fitAll);\n  if (document.readyState !== \"loading\") fitAll(); else addEventListener(\"DOMContentLoaded\", fitAll);\n})();\n`}\u003c/script>\n\nexport function Diagram({ name, title }) {\n  const src = `${base}/diagrams/${name}.html`;\n  return (\n    \u003cfigure class=\"dg\" style=\"display:grid;gap:0;margin:.75rem 0 2.5rem 0\">\n      \u003cdiv class=\"dg-wrap\" style=\"margin:0;position:relative;overflow:hidden;width:100%;height:450px;border:1px solid var(--color-border,#e5e7eb);border-radius:8px 8px 0 0;background:#fff\">\n        \u003ciframe\n          src={src}\n          title={title}\n          loading=\"lazy\"\n          onload=\"window.__dgFit && window.__dgFit(this.parentElement)\"\n          style=\"position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0\"\n        >\u003c/iframe>\n      \u003c/div>\n      \u003cfigcaption style=\"margin:0;display:flex;gap:.6rem;justify-content:flex-end;align-items:center;padding:.55rem .75rem;border:1px solid var(--color-border,#e5e7eb);border-top:0;border-radius:0 0 8px 8px;font-size:.95rem\">\n        \u003cspan style=\"margin-right:auto;opacity:.6;font-size:.85rem\">축소 미리보기 — 상호작용은 전체 화면에서\u003c/span>\n        \u003cbutton type=\"button\" onclick=\"window.__dgFull(this)\" style=\"display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;background:transparent;font:inherit;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M8 3H5a2 2 0 0 0-2 2v3\"/>\u003cpath d=\"M21 8V5a2 2 0 0 0-2-2h-3\"/>\u003cpath d=\"M3 16v3a2 2 0 0 0 2 2h3\"/>\u003cpath d=\"M16 21h3a2 2 0 0 0 2-2v-3\"/>\u003c/svg>\n          전체 화면\n        \u003c/button>\n        \u003ca href={src} target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;text-decoration:none;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 3h6v6\"/>\u003cpath d=\"M10 14 21 3\"/>\u003cpath d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"/>\u003c/svg>\n          새 탭에서 열기\n        \u003c/a>\n      \u003c/figcaption>\n    \u003c/figure>\n  );\n}\n\n_읽는 사람: 구현팀. 각 산출물이 어느 저장소에 저장되는지와 컴포넌트 사이의 네 가지 경로를 다룹니다._\n\n이 페이지는 저작부터 판정까지의 과정에서 만난 산출물이 어디에 저장되고 어떤 길로 이동하는지를\n한곳에 모은 지도입니다. 바이트는 전부 관계형 저장소에 저장되고, 컴포넌트 사이의 경로는 네\n가지입니다. 캐시를 두지 않는 곳도 함께 적습니다.\n\n저장소를 어떻게 나눴는지는 정책 엔진 내부의 영속 구조 문서가 다룹니다. 여기서는 어느 산출물이 어느\n저장소에 저장되는지만 봅니다.\n\n\u003cDiagram name=\"artifact-homes\" title=\"산출물 저장 위치 — 무엇이 어디에 저장되고 어떻게 오가는가\" />\n\n## 산출물별 저장 위치\n\n저작 원문도, 번들 tarball도, 워크스페이스 번들도 파일 시스템이나 오브젝트 스토리지가 아니라\n관계형 저장소의 바이트 컬럼에 저장됩니다. 저장소를 앱 뒤에 두는 구조는\n[구조](/policy/architecture)에 있습니다.\n\n| 산출물 | 저장 위치 | 성질 |\n|---|---|---|\n| 저작 revision 원문 | 룰 저장소 | 추가 전용 체인 — 편집은 새 행 |\n| 검증 결과 | 룰 저장소 | revision과 1:1 |\n| 승인 기록과 표 | 서비스 저장소 | 내용 해시에 결속 |\n| 로직 번들 tarball | 룰 저장소 | revision마다 하나 |\n| 활성 포인터 | 룰 저장소 | 가변 단일 행 — 유일한 \"지금\" |\n| 워크스페이스 번들 | 룰 저장소 | 발행본 바이트 |\n| 결정 기록 | 서비스 저장소 | 추가 전용 해시 체인 |\n| 정규형 의도 | 서비스 저장소 | 요청 레코드의 JCS 전문 |\n| PIP 스냅샷 | 서비스 저장소 | 검증을 통과한 것만 수집 레코드에 |\n| 조립된 입력 문서 | 서비스 저장소 | 자기 컬럼 없이 결정 기록 전문 안에 |\n\n## 네 가지 경로\n\n- **콘솔 ↔ 정책 서버**: REST입니다. 조회 범위는 요청 파라미터가 아니라 세션에서 옵니다.\n  [인증과 스코프](/start/authentication)의 규율입니다.\n- **평가기 ← 정책 서버**: 정책 로직 번들은 룰과 선언 데이터를 커널과 함께 담아 발행한 배포\n  산출물입니다. 그 번들은 평가기가 당겨 갑니다(pull). 짧은 주기로 폴링하되 내용 해시가 그대로면\n  전송이 없습니다. 활성 포인터가 없으면 빈 번들이 아니라 실패로 답합니다.\n- **정책 서버 → 평가기**: 판정 질의는 같은 파드 안의 localhost 호출입니다. 트랜잭션 안에서는\n  부를 수 없게 기계로 막습니다. 판정 대기가 저장소 락을 쥔 채 늘어지는 길을 없애기 위해서입니다.\n- **정책 서버 → 지갑 서비스**: PIP는 판단에 필요한 사실을 평가 시점에 읽어 오는 수집\n  경로입니다([자세히](/policy/runtime/pip)). 그 조회는 요청마다의 HTTP 호출이고, 결과를 저장해\n  두지 않습니다. 재사용 규율도 그 페이지에 있습니다.\n\n## 발행과 활성화의 대조\n\n저작 revision은 추가 전용 체인입니다. 편집이 앞 행을 고치지 않고 새 행을 쓰므로, 폐기된 draft의\n체인도 그대로 남고 지난 내용을 revision 번호로 다시 읽습니다.\n\n검증 결과는 그 revision에 1:1로 남습니다. 통과 여부, 위반 목록, 실행된 케이스 수, 그리고 통과\n시점의 내용 해시입니다.\n\n승인은 draft가 아니라 그 내용 해시에 묶입니다. 승인 뒤에 revision을 더 쌓으면 새 revision의 해시가\n달라, 모아 둔 표가 새 내용으로 넘어가지 않습니다.\n\n**발행은 승인된 revision을 다시 컴파일해 내용 해시를 새로 계산하고 승인이 묶인 해시와\n대조합니다.** 같아야 번들이 만들어지고, 승인과 발행 사이에 내용이 바뀌는 경로가 여기서 막힙니다.\n\n발행 시점에 채점을 되풀이하지 않습니다. 채점은 검증 시점에 끝났고, 해시가 같다는 것은 채점받은\n바이트와 발행되는 바이트가 같다는 뜻이기 때문입니다.\n\n활성 포인터 전환은 경합에 안전한 조건부 갱신입니다. 지금 값이 전환 요청이 전제한 revision일 때만\n바뀌므로, 두 전환이 겹쳐도 하나만 성립합니다.\n\n전환 이력은 추가 전용으로 남습니다. 그래서 되돌림이 재발행이 아니라 포인터 재전환이고, 이전\nrevision의 바이트는 룰 저장소에 그대로 있습니다.\n\n## 두 평가기\n\n평가기는 완성된 입력 문서를 평가해 결정을 내는 역할입니다([구조](/policy/architecture)). 서빙\n평가기는 **활성 번들만 읽습니다.** draft를 적재하지 않으므로, 검증 중인 저작물이 운영 판정에\n섞이는 경로가 구조적으로 없습니다.\n\ndraft 채점은 채점 전용 평가기가 맡습니다. 검증 요청마다 커널과 선언 데이터를 새로 적재해 케이스를\n돌립니다. 적재 위치가 고정 이름이라 다음 검증의 적재가 앞선 것을 덮습니다. 한 번에 하나의 검증만\n처리하도록 직렬화되어, 두 draft의 데이터가 한 평가기 안에서 섞이지 않습니다.\n\n## 캐시를 두지 않는 곳\n\n캐시가 없는 것은 의도입니다. 셋 다 값이 늦게 반영되면 곧바로 통제가 실패하는 지점입니다.\n\n- **활성 포인터**는 매번 조회합니다. 지금 무엇이 서빙되는지를 정하는 단일 기록이라, 캐시를 두면\n  레플리카마다 \"지금\"이 갈립니다. 자세한 것은 [구조](/policy/architecture)에 있습니다.\n- **PIP 결과**는 캐시하지 않습니다. 주소 회수처럼 즉시 반영돼야 하는 사실이 캐시 유효 시간만큼\n  남아 있는 것을 막기 위해서입니다. [PIP](/policy/runtime/pip)의 재사용 범위가 그 기준입니다.\n- **워크스페이스 번들**은 평가마다 다시 읽습니다. 저장 바이트를 그때마다 정규화해 해시를 셈하고\n  발행 시점에 고정한 값과 맞춥니다. 한 번 통과한 구획을 들고 있으면 그 뒤의 내용 변조가 프로세스가\n  실행되는 동안 관측되지 않기 때문입니다.\n\n## 다음으로\n\n- [저작과 발행](/policy/workflow) — 이 과정의 처음으로\n- [다이어그램](/policy/diagrams) — 배포 토폴로지와 코드 수준 호출 경로\n", "kind": "참고 문서", "path": "_reference/policy--runtime--storage.html", "reference": true}, {"title": "승인 게이트", "text": "---\ntitle: 승인 게이트\ndescription: 어드민 액션과 정책 변경이 거치는 maker-checker\n---\n\n_읽는 사람: 구현팀. 어드민 조작과 정책 변경이 승인을 받아 집행되는 경로를 다룹니다._\n\n승인 게이트는 어드민 조작과 정책 변경이 거치는 승인 경로입니다. 자금 이동 쪽의 2단계는\n[서명 게이트](/policy/signing-gate)에 있습니다.\n\n어드민 조작과 정책 변경도 자금 이동과 같은 커널을 거칩니다. 커널은 조건 트리를 평가하고 결정을\n결합하는 정책 무관 고정 부분입니다([자세히](/policy/rule/decision)). 다만 결정을 강제하는 지점이\n다릅니다.\n\n## 이 전체 흐름은 지금 시작되지 않습니다\n\n계약 소유자와 인증 방식이 하나로 정해지는 API 경로 묶음인 접수 표면이 어드민 액션 연산을 403으로\n거부합니다([표면과 인증](/start/authentication)). 그래서 이 페이지가 그리는 흐름은 설계이고, 아래\n다이어그램의 2번 단계부터가 아직 코드가 아닙니다.\n\n**없는 것은 요청을 만들 표면이고 판정하는 쪽은 있습니다.** 커널과 룰 모듈, 테스트 벡터는\n`admin_action`을 그대로 지원합니다. 저작 세트에 역할 부여 게이트와 룰 변경 게이트가 실제로 있습니다.\n\n승인 뒤의 집행도 마찬가지입니다. 승인 전이는 출발 온체인 주소와 provider vault 식별자로 이루어진\n서명 권한 바인딩 값을 요구하는데, 어드민 액션에는 그 값이 없습니다. 승인된 요청에서 권한 적용이나\n발행을 실행하는 경로도 없습니다.\n\n## 지금 실제로 동작하는 승인 경로는 둘입니다\n\n위 흐름 대신 두 경로가 각자 승인을 받습니다. 둘 다 어드민 콘솔에서 부르고, 둘 다 커널 평가를\n거치지 않습니다.\n\n- **룰 변경**: 번들 발행의 maker-checker입니다. 검증을 통과한 초안 revision에만 승인을 열고, 표는\n  그 revision의 내용 해시에 결속됩니다. 승인에 필요한 최소 인원인 정족수가 차면 발행을 따로\n  호출하고 활성화를 또 따로 호출합니다.\n- **역할 부여**: 초대 표면의 직접 인가입니다. 부여할 역할의 스코프를 요청자의 세션에서 유도해\n  즉시 판정합니다. 제안자와 승인자를 가르는 단계가 없습니다.\n\n정족수 집계와 자격 재검증의 규율은 두 경로가 같은 도메인 함수를 씁니다. 갈리는 것은 자격 재검증이\n대상 번들의 스코프까지 보는지 여부입니다.\n\n## 이 경로에는 코시너가 없습니다\n\n온체인 트랜잭션이 아니라서 서명 인프라가 개입할 여지가 없습니다. 코시너는 서명 인프라 쪽에서\n서명 직전에 정책 엔진 콜백으로 승인을 묻는 구성 요소입니다([자세히](/policy/signing-gate)).\n강제 지점은 정책 엔진의 maker-checker 워크플로우 하나입니다. maker-checker는 제안자와 승인자를\n갈라 두는 정책 변경 거버넌스입니다([자세히](/policy)).\n\n**집행자도 정책 엔진 자신입니다.** 어드민 권한이든 번들이든 산출물의 소유자가 정책 엔진이라,\n결정을 내린 쪽과 적용하는 쪽이 같은 프로세스 안에 있습니다.\n\n## 접수 시점에는 아무것도 쓰지 않습니다\n\n요청을 받아도 어드민 저장소에 임시 레코드를 만들지 않습니다. 쓰기는 집행 시점 한 번뿐입니다.\n\n**그래서 거부로 끝나도 지울 것이 없습니다.** 접수 때 무언가를 써 두면 거부·만료마다 되돌리는\n경로가 생기고, 그 되돌리기가 실패하는 경우를 또 다뤄야 합니다.\n\n## 전체 흐름\n\n아래는 설계 흐름입니다. 지금 실행되는 경로는 위 절의 둘입니다.\n\n다이어그램의 배역은 여덟입니다.\n\n- **어드민 (요청자) · 어드민 (승인자)**: 운영자 표면을 부르는 사람 주체입니다. API 키와 달리 사람을 식별합니다\n- **어드민 콘솔**: 정책 엔진의 API를 부르는 표면입니다. 자체 저장소가 없습니다\n- **어드민 저장소**: 어드민 역할과 권한이 적용되는 저장소입니다. 평가 경로에서는 읽기 전용입니다\n- **정책 엔진 (Orchestrator)**: 판단 요청을 접수하고 입력 문서를 조립하고 PIP 수집과 obligation 루프를 조율하는 정책 엔진의 앞단입니다. 판정 자체는 하지 않습니다\n- **평가기 (PDP)**: 완성된 입력 문서를 평가해 결정을 내는 역할입니다. 밖을 부르지 않습니다\n- **발행 파이프라인 (PAP)**: 룰을 저작·검증·발행하는 경로 전체를 부르는 이름입니다\n- **이벤트 스트림**: 승인 완료·거부·소비 이벤트가 흐르는 채널입니다\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant au as 어드민 (요청자)\n    participant au2 as 어드민 (승인자)\n    participant con as 어드민 콘솔\n    participant adb as 어드민 저장소\n    participant orc as 정책 엔진 (Orchestrator)\n    participant pdp as 평가기 (PDP)\n    participant pap as 발행 파이프라인 (PAP)\n    participant evt as 이벤트 스트림\n\n    au ->> con : 생성/변경 액션 (어드민 조작 또는 정책 파라미터 변경)\n    con ->> +orc : 판단 요청 (업무 식별자 · 인증된 요청자)\n    orc -->> -con : 202 접수 (요청 식별자)\n    Note over orc : 어드민 저장소 쓰기는 집행 시점뿐이다\n    orc ->> adb : 요청자 역할·권한 조회 (평가 경로는 읽기 전용)\n    orc ->> pdp : 평가 (허용 여부 + obligation)\n    alt 승인 불요 (명시적 allow)\n        pdp -->> orc : allow\n        orc ->> evt : 승인 완료 이벤트\n        evt ->> con : 구독 수신 (표시)\n        alt 산출물 = 어드민 권한\n            orc ->> adb : 권한 멱등 적용 (쓰기 계정)\n        else 산출물 = 번들\n            orc ->> pap : 발행 요청\n            pap ->> pap : 하한 검증 · 컴파일 · 발행\n        end\n        orc ->> evt : 소비 이벤트 (집행 완료)\n    else obligation 발생 (2단계 인증 + 정족수)\n        pdp -->> orc : pending (obligations)\n        Note over au2 : 권한 부여·승인자 변경은 요청자≠승인자 · 높은 정족수 · 2단계 인증을 함께 받는다\n        au2 ->> con : 승인 표 제출\n        con ->> orc : 표 접수 (인증된 승인자)\n        orc ->> orc : 건별 2단계 인증 챌린지 검증 · 정족수 집계\n        opt 정족수 충족\n            orc ->> adb : 전체 표 자격 재검증 + 오래된 스냅샷 재조회\n            orc ->> pdp : 전체 재평가 (재개 시점의 활성 정책)\n            alt 재평가 allow\n                orc ->> evt : 승인 완료 이벤트\n                evt ->> con : 구독 수신 (표시)\n                alt 산출물 = 어드민 권한\n                    orc ->> adb : 권한 멱등 적용 (쓰기 계정)\n                else 산출물 = 번들\n                    orc ->> pap : 발행 요청\n                    pap ->> pap : 하한 검증 · 컴파일 · 발행\n                end\n                orc ->> evt : 소비 이벤트 (집행 완료)\n            else 재평가 deny\n                orc ->> evt : 거부 이벤트\n                evt ->> con : 구독 수신 (표시)\n            end\n        end\n    end\n```\n\n## 콘솔은 저장소를 갖지 않습니다\n\n어드민 콘솔은 정책 엔진의 API를 부르는 표면입니다. 자체 저장소가 없어 여기에 남는 상태가\n없습니다.\n\n**콘솔이 받는 이벤트는 표시 목적입니다.** 집행이 엔진 안에서 끝나므로 콘솔이 결과를 받아 무엇을\n실행할 일이 없습니다.\n\n## 정족수가 차면 그때 다시 봅니다\n\n표가 다 모여도 바로 통과가 아닙니다. **오래된 스냅샷을 다시 읽고 전체를 재평가한 뒤에야** 승인이\n완료됩니다.\n\n정족수는 며칠씩 걸릴 수 있습니다. 첫 평가 때 참이던 사실이 마지막 표를 받는 시점에도 참이라는\n보장이 없습니다.\n\n재개 시점의 활성 정책으로 평가합니다. 대기 중에 정책이 바뀌었어도 옛 정책을 적용하지 않습니다.\n재평가가 거부를 내면 거부로 끝납니다.\n\n## 표의 자격을 두 번 검증합니다\n\n표를 받을 때 한 번 보고, 정족수가 찼을 때 **모아 둔 표 전체를 다시** 봅니다.\n\n승인자의 역할이 표를 던진 뒤에 회수될 수 있기 때문입니다. 접수 시점 검증만 두면 이미 회수된\n권한으로 던진 표가 정족수에 남습니다.\n\n## 산출물이 둘이라 집행 경로가 둘입니다\n\n어드민 권한은 어드민 저장소에 멱등하게 적용합니다. 역할 부여와 정책 편집 권한 부여가 여기에\n해당합니다.\n\n번들은 발행 파이프라인으로 넘어갑니다. 하한 검증과 컴파일을 통과해야 발행되고, 검증 통과가 곧\n발행입니다.\n\n어느 쪽이든 **적용을 끝낸 뒤에 소비 상태로 옮깁니다.** 승인된 레코드 자체가 집행 지시라 별도\n지시 기록을 만들지 않습니다.\n\n## 집행 직전 재확인은 집행자가 밖에 있을 때만 붙습니다\n\n승인된 요청을 집행하기 직전에 저장소를 다시 읽어 그 승인이 아직 유효한지 보는 절차입니다.\n**이 경로에는 붙지 않습니다.**\n\n승인 상태 자체가 집행 지시이고 그 전이가 집행과 원자적이라, 조회와 전이 사이에 재확인이 들어갈\n여지가 없습니다. 중복 집행은 멱등 적용이 막습니다.\n\n밖에 있는 집행자는 반대입니다. 자금 이동 쪽은 요청을 소유한 서비스가 집행하므로, 이벤트만 믿으면\n중복·지연 도착으로 이미 취소된 승인을 집행합니다. 그래서 그쪽은 실행 전에 조회로 다시 확인하고,\n그 규율은 정책 엔진의 내부 인터페이스 명세가 정합니다.\n\n## 권한을 올리는 표면이 가장 강한 게이트를 받습니다\n\n역할 부여, 정책 편집 권한 부여, 승인자 집합 변경입니다. 셋은 통제 자체를 바꾸는 연산이라 다른\n액션과 같은 문턱에 둘 수 없습니다.\n\n**요청자와 승인자가 달라야 하고, 정족수는 둘 이상이며, 2단계 인증이 함께 붙습니다.** 필요하면\n플랫폼을 운영하는 합작 법인인 JV의 어드민 공동승인까지 받습니다.\n\n정족수를 낮추는 변경 자체도 이 하한 아래로 내려갈 수 없습니다. 먼저 정족수를 내린 뒤 낮아진\n정족수로 권한을 올리는 자기참조 경로를 컴파일이 막습니다.\n\n## 워크스페이스 룰 저작도 이 경로입니다\n\n파트너사가 자기 도메인의 룰과 슬롯 값을 고치는 것도 승인 게이트를 거칩니다. 플랫폼 구조를 바꾸는\n변경보다는 낮은 문턱이지만 maker-checker는 같습니다.\n\n**정책 변경 자체가 엔진의 피통제 연산입니다.** 룰·카탈로그·소스 선언·하한을 바꾸는 일이 전부\n판단 요청으로 접수돼 같은 obligation을 받습니다. 판단 요청은 한 업무 요청을 두고 엔진이 소유하는\n판단 기록이고([자세히](/policy/signing-gate)), obligation은 통과로 확정되기 전에 이행해야 하는\n조건입니다([자세히](/policy/rules)).\n\n지금은 그 접수 경로가 없어 룰 변경이 번들 발행의 maker-checker로 갑니다. 두 경로는 정족수\n집계와 자격 재검증에 같은 도메인 함수를 쓰고, 갈리는 것은 그 판정을 커널이 하는지입니다.\n\n요구하는 정족수 값 자체는 두 경로가 다릅니다. 번들 발행 승인은 코드에 고정된 상수 2를 쓰고, 커널\n경로는 `escalation_quorum` 슬롯을 읽습니다. 그 슬롯의 기본값은 3이고 하한은 2입니다.\n\n## 다음으로\n\n- [서명 게이트](/policy/signing-gate) — 자금 이동 쪽의 2단계\n- [obligation 수집](/policy/sequences/obligations) — 2단계 인증과 정족수를 어떻게 모으나\n- [결정과 결합](/policy/rule/decision) — 재평가 라운드와 obligation 병합\n- [구조](/policy/architecture) — 두 집행 형태의 비교\n", "kind": "참고 문서", "path": "_reference/policy--sequences--approval-gate.html", "reference": true}, {"title": "obligation 수집", "text": "---\ntitle: obligation 수집\ndescription: 통과 조건으로 붙은 이행을 어디서 모으나\n---\n\n_읽는 사람: 구현팀. 통과 조건으로 붙은 이행을 어느 채널에서 모으는지를 다룹니다._\n\nobligation은 통과로 확정되기 전에 이행해야 하는 조건입니다([자세히](/policy/rules)). 이\n페이지는 그 이행을 어느 채널에서 모으고, 모으는 동안 요청이 어디에 머무는지를 씁니다.\n\nobligation은 **\"통과시키되 이것을 이행하라\"**는 요구입니다. 이행이 끝날 때까지 요청은\n`PENDING_OBLIGATION`에 머뭅니다.\n\n## 셋의 수집 채널이 다릅니다\n\n타입은 커널이 고정한 어휘 셋입니다. 저작자가 새 타입을 만들 수 없습니다. 타입마다 이행을 모으는\n코드가 실제로 있어야 하기 때문입니다.\n\n| 타입 | 누가 검증하나 | 어디로 들어오나 | 구현 상태 |\n|---|---|---|---|\n| `require_2fa` (어드민) | 정책 엔진 | 어드민 표면의 챌린지 검증 | 이행을 기록하는 경로가 없습니다 |\n| `require_2fa` (유저) | 파트너 인증 서버 | 파트너의 서명된 이행 증거 | 증거를 접수하는 엔드포인트가 없습니다 |\n| `require_quorum` | 정책 엔진 | 어드민 표면의 표 접수 | 이행 기록 경로가 있습니다 |\n| `attach_travel_rule_payload` | 트래블룰 게이트웨이 | 별도 제출 없이 소스 재수집 | 타입 값만 있습니다 |\n\n표의 「표면」은 계약 소유자와 인증 방식이 하나로 정해지는 API 경로\n묶음입니다([자세히](/start/authentication)).\n\n**같은 `require_2fa`인데 채널이 갈립니다.** 요청자가 어드민이면 정책 엔진에 자격증명이 있고\n유저면 없기 때문입니다.\n\n## 이행 경로가 코드로 있는 타입은 정족수 하나입니다\n\n이 페이지의 나머지는 설계입니다. 넷 중 이행이 실제로 기록되는 것은 `require_quorum`이고, 그\n기록은 표 집계가 승인에 필요한 최소 인원인 정족수의 충족을 판정할 때 일어납니다. 나머지 셋에는 그\n기록을 만드는 코드가 없습니다.\n\n- **`require_2fa` (어드민)**: 어드민 표면의 챌린지 검증은 있으나 그 결과를 obligation 이행으로\n  기록하지 않습니다. 정족수와 함께 부과되면 정족수만 이행되고 요청은 2단계 인증 데드라인에서\n  만료됩니다. 그 데드라인의 기본값은 5분입니다.\n- **`require_2fa` (유저)**: 파트너가 부르는 제출 엔드포인트는 PIP 결과 수집으로만 갑니다. 이행\n  증거를 받는 엔드포인트가 따로 없습니다.\n- **`attach_travel_rule_payload`**: 타입 값은 커널 어휘에 있으나 데드라인 기본값이 선언돼 있지\n  않습니다. 부과되면 데드라인을 만들지 못해 그 시점에 요청이 `FAILED`로 종결합니다. 재수집\n  대상인 트래블룰 소스도 선언되지 않았습니다.\n\n**그 앞에 obligation을 부과하는 절차 자체가 지금 없습니다.** obligation을 다는 룰은 저작 세트의\n어드민 쪽에만 있고, 어드민 액션을 판단 요청으로 접수하는 표면이 아직\n없습니다([승인 게이트](/policy/sequences/approval-gate)). 값 이동 세 모듈의 allow 룰에는\nobligation이 없습니다.\n\n## 유저의 2단계 인증은 정책 엔진이 검증하지 않습니다\n\n유저 대면 표면과 인증 수단은 파트너 쪽에 있습니다. 정책 엔진에는 유저의 팩터가 등록돼 있지\n않습니다.\n\n**그래서 검증은 파트너가 하고 엔진은 이행 증거를 접수합니다.** 수단을 특정하지도 않습니다. 2단계\n인증이든 FIDO든 파트너가 자기 최고 보안 존에서 고릅니다.\n\n## 유저 2단계 인증의 흐름\n\n아래는 설계 흐름입니다. 6번 단계의 제출을 받는 엔드포인트가 아직 없어 이 흐름은 지금 성립하지 않습니다.\n\n다이어그램의 배역은 여섯입니다.\n\n- **유저**: 파트너사 서비스의 최종 사용자입니다\n- **적격기관 (파트너)**: 유저 대면 표면을 갖고 이행 증거를 엔진에 제출하는 쪽입니다\n- **파트너 인증 서버**: 파트너사가 운영하는 인증 수단의 검증 서버입니다\n- **정책 엔진 (Orchestrator)**: 판단 요청을 접수하고 입력 문서를 조립하고 PIP 수집과 obligation 루프를 조율하는 정책 엔진의 앞단입니다. 판정 자체는 하지 않습니다\n- **평가기 (PDP)**: 완성된 입력 문서를 평가해 결정을 내는 역할입니다. 밖을 부르지 않습니다\n- **이벤트 스트림**: 대기·승인·거부 이벤트가 흐르는 채널입니다\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant u as 유저\n    participant p as 적격기관 (파트너)\n    participant auth as 파트너 인증 서버\n    participant orc as 정책 엔진 (Orchestrator)\n    participant pdp as 평가기 (PDP)\n    participant evt as 이벤트 스트림\n\n    Note over orc : PENDING_OBLIGATION (require_2fa, 대상 = 유저) —\u003cbr/>1회용 수집 식별자를 민팅한다\n    evt ->> p : 대기 이벤트 수신 (요청 소유 서비스 경유, 수집 식별자 포함)\n    p ->> u : 인증 요구\n    u ->> auth : 2단계 인증\n    auth -->> p : 검증 결과\n    p ->> orc : 이행 증거 제출 (서명 · 수집 식별자 에코 — 개인정보 불포함)\n    orc ->> orc : 수집 식별자 상관 · 제출자 인증 · 만료 검사\n    orc ->> pdp : 재개 — 오래된 스냅샷 재수집 + 전체 재평가\n    orc ->> evt : 승인 또는 거부 이벤트\n```\n\n## 제출 계약은 PIP와 같은 것을 씁니다\n\n이행 증거를 위한 별도 프로토콜을 만들지 않았습니다. 판단에 필요한 사실을 평가 시점에 읽어 오는\n수집 경로인 PIP([자세히](/policy/runtime/pip))에서 파트너가 데이터를 넣는 인바운드 계약을 그대로\n씁니다.\n\n그 계약을 공유한다는 것이 설계이고, 지금 그 엔드포인트가 받는 것은 PIP 결과 하나입니다. 제출을\n이행 증거로 가르는 경로가 아직 없습니다.\n\n**서명과 1회용 수집 식별자, 도착 규칙이 전부 같습니다.** 파트너 입장에서 \"심사 결과를 보내는 것\"과\n\"인증 결과를 보내는 것\"이 같은 모양이라 붙일 것이 하나뿐입니다.\n\n엔진의 결정 식별자는 파트너에게 노출하지 않습니다. 파트너가 쥐는 것은 그 건에만 유효한 수집 식별자\n하나입니다.\n\n## 트래블룰 이행은 증거를 받지 않습니다\n\n`attach_travel_rule_payload`는 제출을 기다리지 않습니다. **트래블룰 소스를 다시 수집해 이행을\n확인합니다.** 트래블룰은 가상자산 이전 시 송·수신 정보를 사업자끼리 교환하는 규제\n의무입니다([자세히](/#함께-제공하는-모듈)).\n\n첨부가 실제로 이루어졌는지는 그 소스의 스냅샷이 답합니다. 별도 증거를 받으면 소스와 증거가 갈리는\n경우를 또 다뤄야 합니다.\n\n이 재수집은 아직 코드가 아닙니다. 데드라인 기본값과 트래블룰 소스 선언이 둘 다 없어, 이 타입이\n부과된 요청은 재수집에 닿기 전에 `FAILED`로 종결합니다.\n\n## 어드민 쪽은 표와 챌린지로 모읍니다\n\n정족수와 어드민 2단계 인증은 어드민 표면에서 받습니다. 표를 던질 때마다 건별 챌린지를 검증하는\n스텝업을 함께 적용합니다.\n\n**그 스텝업은 표의 자격 검사이지 `require_2fa`의 이행이 아닙니다.** 지금 이행으로 기록되는 것은\n정족수 충족 하나입니다.\n\n챌린지는 그 요청의 내용에 묶여 있습니다. 그래서 승인자가 본 것과 승인된 것이 같음이 보장되고, 다른\n요청에 받은 응답을 재사용할 수 없습니다.\n\n상세한 흐름은 [승인 게이트](/policy/sequences/approval-gate)에 있습니다.\n\n## 이행이 끝나도 바로 통과가 아닙니다\n\n증거가 다 모이면 재개합니다. 그때 오래된 스냅샷을 다시 읽고 전체를 재평가한 뒤에야 결과가\n나옵니다.\n\n**최신 데이터가 앞선 승인 상태보다 우선합니다.** 재평가가 거부를 내면 거부로 끝납니다. 기다리는\n동안 주소가 회수됐거나 정책이 바뀌었으면 그 결과가 우선합니다.\n\n대기 중에 정책이 바뀌었어도 옛 정책을 적용하지 않습니다. 재개 시점의 활성 정책으로 평가합니다.\n\n## 재개는 별도 상태를 만들지 않습니다\n\n재개는 `EVALUATING`으로 되돌아가는 것입니다. 재평가가 사실을 더 요구하면 다시 비동기 수집 대기로\n내려가 같은 루프에 합류합니다.\n\n**재개 재평가도 평가 라운드를 하나 씁니다.** 평가 라운드는 한 판단 요청 안에서 평가가 몇 번째로\n실행됐는지입니다([자세히](/policy/rule/decision)). 그래서 obligation과 수집 사이를 오가는 진동의\n절대 상한이 라운드 상한입니다.\n\n## 만료는 미이행 데드라인의 최솟값입니다\n\nobligation마다 데드라인이 따로 있습니다. 대기 진입 시각에 타입별 TTL을 더해 고정되고, 개별\n데드라인은 이후에 움직이지 않습니다.\n\n**요청의 만료 시각은 아직 이행되지 않은 것들의 최솟값입니다.** 하나가 이행될 때마다 남은 것\n기준으로 다시 계산되고, 하나라도 데드라인을 넘기면 요청 전체가 만료됩니다.\n\n만료된 요청은 다시 진행되지 않습니다. 재시도는 처음부터이고 새 결정 식별자를 받습니다.\n\n## 다음으로\n\n- [승인 게이트](/policy/sequences/approval-gate) — 정족수와 어드민 2단계 인증의 전체 흐름\n- [비동기 수집](/policy/sequences/pending-data) — 파트너를 기다리는 다른 경우\n- [룰 쓰기](/policy/rules) — obligation을 룰에 어떻게 다나\n- [결정과 결합](/policy/rule/decision) — obligation 병합 규칙\n", "kind": "참고 문서", "path": "_reference/policy--sequences--obligations.html", "reference": true}, {"title": "비동기 수집", "text": "---\ntitle: 비동기 수집\ndescription: 파트너의 답을 기다리는 동안 요청은 어디에 있나\n---\n\n_읽는 사람: 구현팀. 즉시 답이 오지 않는 소스를 기다리는 동안 요청이 머무는 구간을 다룹니다._\n\n파트너 심사처럼 즉시 답이 오지 않는 소스가 있습니다. 그런 소스는 판단에 필요한 사실을 평가\n시점에 읽어 오는 수집 경로인 PIP([자세히](/policy/runtime/pip))의 비동기 쪽입니다. 그 답을\n기다리는 동안 요청이 머무는 상태가 `PENDING_DATA`입니다.\n\n## 비싼 조회는 룰이 요구할 때만 일어납니다\n\n모든 요청에 AML 심사를 적용하지 않습니다. 룰이 그 사실을 참조해야 발동할 때만 수집이\n트리거됩니다.\n\n**발동하지 않는 금액 구간은 조회 자체가 없습니다.** 룰의 `scope`가 요청 필드만 보므로, 어떤 룰이\n발동하는지는 데이터를 하나도 읽지 않고 확정됩니다.\n\n## 기다리는 상태를 영속으로 만듭니다\n\n**평가 루프 수집은 mode와 무관하게 `PENDING_DATA`를 거칩니다.** 동기 소스는 그 안에서 어댑터가\n인프로세스로 채워 바로 재개하고, 비동기 소스는 파트너의 제출이 도착할 때까지 영속 대기합니다.\n\n대기 시간의 상한은 소스마다 선언됩니다. 레지스트리에 응답 타임아웃이 적혀 있고, 그 값을 넘기면\n기다림이 끝납니다.\n\n## 전체 흐름\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant orc as 정책 엔진 (Orchestrator)\n    participant pdp as 평가기 (PDP)\n    participant pip as PIP 소스 (비동기 — 파트너 심사 등)\n    participant evt as 이벤트 스트림\n\n    pdp -->> orc : need_more_data (필요한 소스 목록)\n    orc ->> pip : 수집 발행 (참조 기반 온디맨드 트리거, 1회용 수집 식별자)\n    Note over orc : PENDING_DATA — 소스별 선언 타임아웃으로 영속 대기한다\n    alt 결과 도착 (타임아웃 내)\n        pip ->> orc : 결과 제출 (서명된 판정값 — 개인정보 불포함)\n        orc ->> orc : 도착 검사 아홉 단계 (상관 · 상태·만료·제출자 인증 · 선언 · 스키마 · 바인딩 · 신선도)\n        orc ->> pdp : 전체 입력으로 재평가 (평가 라운드를 소모한다)\n    else 소스 타임아웃 / 무효 결과\n        orc ->> evt : 거부 이벤트 (사유 = 수집 실패, 어느 소스인지 명시)\n    end\n```\n\n## 수집 식별자는 1회용입니다\n\n수집을 발행할 때 그 건에만 유효한 식별자를 만들어 함께 보냅니다. 파트너는 결과를 제출하면서 그\n식별자를 그대로 되돌려 줍니다.\n\n**엔진의 결정 식별자는 파트너에게 나가지 않습니다.** 파트너가 아는 것은 이 1회용 수집 식별자\n하나이고, 그것으로 다른 요청을 건드릴 수 없습니다.\n\n## 도착한 결과는 아홉 단계를 순서대로 거칩니다\n\n제출을 받았다고 바로 입력에 넣지 않습니다. **검사 순서는 싼 것부터가 아니라 좁은 것부터입니다.**\n앞 단계를 통과하지 못한 제출에는 뒤 단계의 결과를 알려 주지 않습니다. 아래가 그 순서입니다.\n\n- **대응 확인**: 이 수집 식별자가 실제로 발행된 미결 수집인가\n- **상태·만료·제출자 인증**: 아직 소비되지 않았고 시한 안이며 서명이 그 수집이 기대한 파트너의\n  것인가\n- **선언 존재**: 그 소스의 레지스트리 선언이 아직 있는가\n- **스키마 자가 점검**: 그 소스가 자가 점검에서 수집 거부 상태로 표시되지 않았는가\n- **스키마 버전**: 수집을 발행한 시점의 스냅샷 스키마 버전과 지금 선언이 같은가\n- **부모 요청**: 이 수집을 낸 판단 요청이 재개 가능한 상태로 있는가\n- **요청 바인딩**: 제출된 결과가 그 요청의 정규형 내용에 묶여 있는가\n- **스냅샷 스키마**: 제출된 스냅샷이 선언된 스키마를 만족하는가\n- **신선도**: 소스에 선언된 최대 나이 안인가\n\n단계별 거절 사유 코드는 [PIP](/policy/runtime/pip)에 있습니다.\n\n아홉을 통과한 제출은 단일 소비로 반영됩니다. 다른 제출이 먼저 소비하면 중복으로 접수되고 입력에\n들어가지 않습니다.\n\n요청 본문을 신뢰하지 않습니다. 어느 파트너의 제출인지는 인증된 신원이 정하고, 본문이 주장하는\n값이 정하지 않습니다.\n\n## 파트너가 보내는 것은 판정값입니다\n\n파트너가 보내는 것은 판정값입니다. **엔진이 하는 일은 그 판정값이 이 요청에 묶인 것인지 확인하는\n것입니다.** 심사 기준을 다시 계산하지 않습니다.\n\n위험 점수 임계 같은 세부는 심사 주체가 자기 경계 안에서 판정값으로 요약해 보냅니다. 개인정보가\n어디까지 오가는지는 [PIP](/policy/runtime/pip)에 있습니다.\n\n## 타임아웃은 실패가 아니라 거부입니다\n\n선언된 시간 안에 답이 오지 않으면 **거부로 종결**합니다. 예외 없이 fail-closed입니다.\n\n거부 사유에 어느 소스가 못 왔는지를 적고, 사유 코드로 정책 거부와 구분합니다. 그 코드가 재제출\n가능함을 식별합니다. 소스가 복구되면 요청을 소유한 서비스가 다시 올립니다.\n\n`FAILED`는 여기에 쓰지 않습니다. 그쪽은 정규화 실패나 평가 크래시 같은 엔진 자체의 오류 전용\n신호입니다.\n\n## 재진입도 라운드를 씁니다\n\n결과가 다 모이면 `EVALUATING`으로 돌아가 전체 입력으로 다시 평가합니다. 부분 재평가는 없습니다.\n\n**이 왕복에 상한이 있습니다.** 평가 라운드는 한 판단 요청 안에서 평가가 몇 번째로 실행됐는지입니다.\n그 상한은 5이고 재개 재평가도 같은 카운터를 소모합니다. 근거는\n[결정과 결합](/policy/rule/decision)에 있습니다.\n\n## 소스 장애가 오래가면 정책을 바꿉니다\n\n장기 장애에 특수 런타임 모드를 두지 않습니다. 장애가 난 소스를 참조하지 않도록 **룰을 고쳐 정식\n발행 경로로 내보냅니다.**\n\n제안자와 승인자를 갈라 두는 정책 변경 거버넌스인 maker-checker([자세히](/policy))와 테스트 벡터가\n그대로 적용되고, 복구 뒤 원복도 같은 경로입니다. 그래서 감사에 완화와 원복이 전부 남습니다.\n\n## 다음으로\n\n- [PIP](/policy/runtime/pip) — 어떤 소스가 있고 어떻게 선언되나\n- [obligation 수집](/policy/sequences/obligations) — 사람을 기다리는 쪽의 대기\n- [결정과 결합](/policy/rule/decision) — 평가 라운드 상한\n", "kind": "참고 문서", "path": "_reference/policy--sequences--pending-data.html", "reference": true}, {"title": "서명 게이트", "text": "---\ntitle: 서명 게이트\ndescription: 판단과 집행이 두 단계로 나뉩니다\n---\n\n_읽는 사람: 파트너사 개발자와 구현팀. 자금을 움직이는 요청이 판단과 집행 두 단계를 어떻게 거치는지를 다룹니다._\n\n서명 게이트는 자금을 움직이는 요청이 서명 인프라에 닿기 전에 거치는 2단계입니다. 집금·vault\n이체·출금·컨트랙트 호출·구조화 서명이 모두 같은 2단계를 거칩니다.\n\n**판단은 요청 시점에, 집행은 서명 직전에** 일어납니다. 아래는 그 대표 흐름입니다.\n\n## 1단계 — 접수하고 평가해서 인가를 발급합니다\n\n다이어그램의 배역은 여덟입니다.\n\n- **Orchestrator**: 판단 요청을 접수하고 입력 문서를 조립하고 PIP 수집과 obligation 루프를\n  조율하는 정책 엔진의 앞단입니다. 판정 자체는 하지 않습니다\n- **평가기(PDP)**: 완성된 입력 문서를 평가해 결정을 내는 역할입니다. 밖을 부르지 않습니다\n- **PIP**: 판단에 필요한 사실을 평가 시점에 읽어 오는 수집 경로입니다. Orchestrator 안의\n  어댑터 계층입니다\n- **인가 저장소**: 발급된 단회성 인가를 담고 소비를 기록하는 곳입니다\n- **이벤트 스트림**: 판단 완료 이벤트가 나가는 경로입니다. Wallet 서버가 구독합니다\n- **서명 인프라**: 키를 보관하고 트랜잭션에 서명하는 뒷단 플랫폼의 서명 부분입니다\n- **Wallet 서버**: 파트너 대상 API를 받아 정책 엔진에 판단을 묻고 서명 인프라에 제출하는\n  Wallet SDK의 서버 컴포넌트입니다\n- **파트너사**: Wallet SDK를 도입한 회사, 곧 Workspace 하나입니다\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant PT as 파트너사\n    participant ws as Wallet 서버\n    participant orc as 정책 엔진 (Orchestrator)\n    participant pdp as 평가기 (PDP)\n    participant pip as PIP 소스 (파트너 심사 · 트래블룰 · 주소록 · 잔액)\n    participant store as 인가 저장소\n    participant evt as 이벤트 스트림\n    participant fb as 서명 인프라\n\n    PT ->> ws : 서명 연산 요청 (업무 요청 식별자 = 업무 엔티티 id)\n    ws ->> +orc : 판단 요청 — 연산별 요청 스키마\u003cbr/>업무 요청 식별자는 인증된 caller에 바인딩됩니다\n    orc -->> -ws : 202 접수 (판단 요청 식별자)\u003cbr/>중복 접수는 409와 기존 식별자를 되돌립니다\n    Note over orc : 이하 평가는 내부 큐에서 비동기로 돕니다.\u003cbr/>평가 진입 전 vault 소유를 해석해 workspace·주소·chain을 확정하고,\u003cbr/>canonical intent는 엔진 정규화기가 생성합니다\n    orc ->> pdp : 평가 요청 (완성된 입력 문서)\n    alt 사실이 더 필요하면\n        pdp -->> orc : need_more_data (required: 심사 결과 …)\n        Note over orc, pip : 레지스트리가 선언한 mode로 어댑터가 수집합니다.\u003cbr/>비동기 소스가 등재되면 영속 대기, 동기만이면 인프로세스 재평가입니다\n        orc ->> pip : 조건부·단계적 수집\n        pip -->> orc : 결과 스냅샷 (결과값 + 참조 id, 수집 시각, 출처 — PII 불포함)\n        orc ->> pdp : 전체 입력으로 재평가\n    end\n    alt obligation이 붙으면\n        pdp -->> orc : pending (require_2fa · require_quorum · attach_travel_rule_payload)\n        Note over orc : 이행 수집 → 재개 직전 스냅샷 재수집 + 전체 재평가\n    end\n    pdp -->> orc : allow\n    orc ->> store : 승인 저장, 인가 발급 (TTL · 1회용)\n    orc ->> evt : 판단 완료 이벤트\u003cbr/>업무 요청 식별자 · 판단 요청 식별자 · 인가 식별자\n    evt ->> ws : 구독 수신\n    ws ->> fb : 전송 제출 — 외부 참조 id에 인가 식별자를 싣습니다\n    ws ->> PT : 시작 통지 (업무 요청 식별자)\n    Note over orc, evt : deny면 거부 이벤트로 종결합니다 — 인가를 발급하지 않으므로\u003cbr/>서명 인프라에 제출 자체가 없습니다\n```\n\n**deny면 제출이 없습니다.** 정책 위반이 서명 이전에 막힌다는 말의 실체가 이것입니다. 인가가\n없으면 Wallet 서버가 서명 인프라를 부르지 않습니다.\n\n## 접수는 즉시 끝나고 결과는 이벤트로 옵니다\n\n판단 요청은 한 업무 요청을 두고 엔진이 소유하는 판단 기록입니다. 202로 접수만 하고 돌아오며,\n평가는 내부 큐에서 처리되고 결과는 이벤트 스트림으로 나갑니다.\n\n**같은 업무 요청을 두 번 접수하면 409와 기존 판단 요청 식별자가 돌아옵니다.** 새 판단이 생기지\n않으므로 재전송이 안전합니다.\n\n파트너사가 받는 것은 시작 통지입니다. 판단 요청 식별자는 내부 전용 값이고, 파트너사는 자기\n업무 식별자로 상태를 조회합니다. 그 식별자를 Wallet 서버와 주고받는 내부 계약은 정책 엔진 내부\n문서에 있습니다.\n\n## 2단계 — 서명 직전에 대조합니다\n\n다이어그램에 정책 엔진 쪽 배역 둘이 새로 나옵니다.\n\n- **Co-Signer**: 서명 인프라 쪽에서 서명 직전에 정책 엔진 콜백으로 승인을 묻는 구성 요소입니다\n- **PEP**: 서명 인프라 콜백을 받아 인가 대조를 Orchestrator에 넘기는 엔드포인트입니다\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant fb as 서명 인프라\n    participant cs as Co-Signer\n    participant pep as 정책 엔진 (PEP · 종단, 레플리카 2+)\n    participant orc as 정책 엔진 (Orchestrator · 고속 경로, 레플리카 2+)\n    participant store as 인가 저장소\n    participant oc as 온체인\n\n    fb ->> cs : 서명 요청\n    cs ->> pep : 콜백 (JWT · 서명 대상 산출물)\n    pep ->> pep : JWT 양방향 검증 · 서명 대상 추출 ·\u003cbr/>산출물에서 인가 식별자 추출 (외부 참조 id 에코)\n    pep ->> orc : 대조 요청 (인가 식별자 · 서명 대상 · 보고 환경값)\n    orc ->> store : 인가 식별자로 조회\n    orc ->> orc : 서명 대상 대조 (재구성·digest, TOCTOU 방지) · 미만료·미소비 확인\n    alt 일치하고 유효하면\n        orc ->> store : 소비 (원자적 1회용)\n        orc -->> pep : 승인\n        pep -->> cs : 승인 (JWT 서명 응답)\n        cs -->> fb : OK\n        fb ->> oc : 트랜잭션\n    else 불일치 · 부재 · 만료 · 이미 소비\n        orc -->> pep : 거부\n        pep -->> cs : 거부 (일시 장애면 재시도)\n        Note over cs : 거부되면 Co-Signer는 서명하지 않습니다\n    end\n```\n\n**PEP는 콜백을 받기만 하고 대조는 Orchestrator가 합니다.** 콜백을 받아 JWT를 검증하고 서명 대상을\n꺼내는 것이 PEP의 일이고, 인가 저장소 대조와 1회용 소비는 Orchestrator가 소유합니다.\n\n재시도는 인프라 일시 오류에만 응답합니다. 승인 사실과 다른 것 — 미존재·만료·이미 소비·불일치\n— 은 전부 거부이고, 재시도 횟수를 다 써도 거부입니다.\n\n## 1단계의 판단과 실제로 서명될 것이 같다는 보장이 없습니다\n\n두 단계 사이에 요청이 바뀌거나 가로채일 수 있습니다. 그 위험 구간을 없애는 것이 2단계입니다.\n\n그래서 2단계는 서명 대상 산출물을 재구성해 1단계의 판단과 대조합니다. 인가 식별자는 조회\n힌트일 뿐이고, 실제 검증은 서명 대상 전체 대조입니다.\n\n**인가는 1회용입니다.** 대조를 통과하면 그 즉시 원자적으로 소비되어, 같은 인가로 두 번\n서명할 수 없습니다.\n\n## 콜백 경로는 밖으로 나가지 않습니다\n\n2단계 경로에서는 외부 시스템을 호출하지 않습니다. 응답이 늦으면 서명 인프라가 재시도하지 않고\n서명 요청을 취소하기 때문입니다.\n\n**파트너사 심사 결과도 이 경로에서 묻지 않습니다.** 자금세탁방지·이상거래 탐지 같은 외부 사실은\n1단계 평가 시점에 [PIP](/policy/runtime/pip)로 수집합니다.\n\n그래서 이 경로의 참여자는 레플리카를 둘 이상 띄우고 롤링 배포합니다.\n\n## 인가에는 유효 시간이 있습니다\n\n단회성 인가는 승인된 판단 요청이 발급하는 한 번만 쓸 수 있는 서명 근거입니다. 그 인가 TTL의\n상한은 3600초(60분), 기본값은 1200초(20분)입니다. 기본값이 하한을 겸하는 이유는\n[결정과 결합](/policy/rule/decision)에 있습니다.\n\n**정책을 새로 배포해도 이미 발급된 인가를 무효화하지 않습니다.** 구정책 승인은 TTL까지\n유효합니다.\n\n이 노출 창은 TTL 상한으로 묶인 의도된 트레이드오프입니다. 배포마다 진행 중인 정상 출금을\n실패시키지 않기 위해서입니다.\n", "kind": "참고 문서", "path": "_reference/policy--signing-gate.html", "reference": true}, {"title": "서명 상한 대조", "text": "---\ntitle: 서명 상한 대조\ndescription: 승인 스탬프는 서명 직전에 일합니다\n---\n\nexport const base = import.meta.env.BASE_URL.replace(/\\/$/, \"\");\n\n{/* 뷰어는 1440×900 데스크톱 기준의 자체 완결형 HTML이라 본문 칸(약 720px)에 그대로 넣으면 잘린다.\n    iframe을 1440×900으로 고정하고 칸 폭에 맞춰 축소한다 — 상호작용은 전체 화면·새 탭에서 한다. */}\n\u003cscript is:inline data-astro-rerun>{`\n(function () {\n  var W = 1440, H = 900;\n  function fit(w) {\n    var f = w.querySelector(\"iframe\");\n    var fs = document.fullscreenElement === w;\n    var s = fs ? Math.min(innerWidth / W, innerHeight / H) : w.clientWidth / W;\n    f.style.transform = \"scale(\" + s + \")\";\n    w.style.height = fs ? \"100%\" : Math.round(H * s) + \"px\";\n    f.style.left = fs ? Math.round((innerWidth - W * s) / 2) + \"px\" : \"0\";\n    f.style.top = fs ? Math.round((innerHeight - H * s) / 2) + \"px\" : \"0\";\n  }\n  function fitAll() { document.querySelectorAll(\".dg-wrap\").forEach(fit); }\n  window.__dgFit = fit;\n  window.__dgFull = function (btn) {\n    var w = btn.closest(\"figure\").querySelector(\".dg-wrap\");\n    (w.requestFullscreen || w.webkitRequestFullscreen).call(w);\n  };\n  addEventListener(\"resize\", fitAll);\n  addEventListener(\"fullscreenchange\", fitAll);\n  if (document.readyState !== \"loading\") fitAll(); else addEventListener(\"DOMContentLoaded\", fitAll);\n})();\n`}\u003c/script>\n\nexport function Diagram({ name, title }) {\n  const src = `${base}/diagrams/${name}.html`;\n  return (\n    \u003cfigure class=\"dg\" style=\"display:grid;gap:0;margin:.75rem 0 2.5rem 0\">\n      \u003cdiv class=\"dg-wrap\" style=\"margin:0;position:relative;overflow:hidden;width:100%;height:450px;border:1px solid var(--color-border,#e5e7eb);border-radius:8px 8px 0 0;background:#fff\">\n        \u003ciframe\n          src={src}\n          title={title}\n          loading=\"lazy\"\n          onload=\"window.__dgFit && window.__dgFit(this.parentElement)\"\n          style=\"position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0\"\n        >\u003c/iframe>\n      \u003c/div>\n      \u003cfigcaption style=\"margin:0;display:flex;gap:.6rem;justify-content:flex-end;align-items:center;padding:.55rem .75rem;border:1px solid var(--color-border,#e5e7eb);border-top:0;border-radius:0 0 8px 8px;font-size:.95rem\">\n        \u003cspan style=\"margin-right:auto;opacity:.6;font-size:.85rem\">축소 미리보기 — 상호작용은 전체 화면에서\u003c/span>\n        \u003cbutton type=\"button\" onclick=\"window.__dgFull(this)\" style=\"display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;background:transparent;font:inherit;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M8 3H5a2 2 0 0 0-2 2v3\"/>\u003cpath d=\"M21 8V5a2 2 0 0 0-2-2h-3\"/>\u003cpath d=\"M3 16v3a2 2 0 0 0 2 2h3\"/>\u003cpath d=\"M16 21h3a2 2 0 0 0 2-2v-3\"/>\u003c/svg>\n          전체 화면\n        \u003c/button>\n        \u003ca href={src} target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;text-decoration:none;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 3h6v6\"/>\u003cpath d=\"M10 14 21 3\"/>\u003cpath d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"/>\u003c/svg>\n          새 탭에서 열기\n        \u003c/a>\n      \u003c/figcaption>\n    \u003c/figure>\n  );\n}\n\n_읽는 사람: 구현팀. 값 이동 승인이 서명 직전에 마지막으로 대조되는 지점을 다룹니다._\n\n이 페이지는 승인 스탬프가 서명 직전 콜백에서 쓰이는 과정을 따라갑니다. 승인 스탬프는 승인 시점에\n찍히는 소비 시점 유효값이고, 인가 TTL과 건당 자원 상한이 거기\n담깁니다([자세히](/policy/runtime/normalization)).\n\n**allow와 함께 발급된 승인 스탬프는 기록이 아니라 피연산자입니다.** 서명 직전 콜백이 그 값으로\n마지막 대조를 합니다. 두 단계 구조 전체는 [서명 게이트](/policy/signing-gate)에 있습니다.\n\n\u003cDiagram name=\"usecase-callback-limit\" title=\"서명 직전 상한 대조 — 승인 스탬프의 마지막 일\" />\n\n## 스탬프는 승인 시점에 좁혀집니다\n\n**값 이동 승인의 자원 상한은 그 요청 체인의 항목 하나로 좁혀 새겨집니다.** 승인 시점에 좁히는\n것이 상한 우회를 막는 지점입니다. 다른 체인을 보고한 콜백은 대조할 항목을 찾지 못합니다.\n\n체인 식별자가 없는 요청은 좁힐 기준이 없어 선언 전체가 새겨집니다. 어느 쪽이든 콜백은 보고된 체인\n키로 항목을 찾습니다.\n\n## 판정 값은 서명될 트랜잭션 전체에서 나옵니다\n\n**수수료 상한의 피연산자는 서명될 트랜잭션 전체에서 유도합니다.** 그 옆에 따로 담겨 온 신고 총액을\n쓰면 상한을 우회할 수 있습니다. 정상적인 트랜잭션을 서명해 놓고 신고 값만 낮추면 됩니다.\n\n대조는 트랜잭션 재구성이 일치한 뒤에만 이뤄집니다. 재구성 일치가 곧 보고된 환경값이 실제로 서명에\n들어간다는 증명입니다. 재구성 검증 자체는 [정규화](/policy/runtime/normalization)에 있습니다.\n\n## 상한이 새겨지지 않은 것은 상한 없음이 아닙니다\n\n**보고된 체인의 상한 항목을 찾지 못하면 결과는 거절입니다.** 상한 부재를 \"상한 없음\"으로\n읽는 경로를 두지 않습니다. 부재는 통과 사유가 될 수 없습니다.\n\n## 거절도 200으로 나갑니다\n\n**판정은 HTTP 상태가 아니라 서명된 응답이 전달합니다.** 서명 인프라에게 4xx와 5xx는 \"응답을 못\n받았다\"라서 재시도를 부르고, Wallet SDK가 의도한 거절이라는 사실이 사라집니다.\n\n통과하면 인가를 소비합니다. 인가는 승인된 판단 요청이 발급하는 한 번만 쓸 수 있는 서명 근거라,\n같은 승인으로 두 번 서명할 수 없습니다. 인가 유효 시간과 재확인 구조는\n[서명 게이트](/policy/signing-gate)에 있습니다.\n\n## 다음으로\n\n- [서명 게이트](/policy/signing-gate) — 두 단계 구조와 인가 유효 시간\n- [출금 화이트리스트](/policy/use-cases/whitelist-loop) — 이 스탬프를 발급한 흐름\n", "kind": "참고 문서", "path": "_reference/policy--use-cases--callback-limit.html", "reference": true}, {"title": "금지선", "text": "---\ntitle: 금지선\ndescription: deny는 어떤 허가로도 뒤집히지 않습니다\n---\n\nexport const base = import.meta.env.BASE_URL.replace(/\\/$/, \"\");\n\n{/* 뷰어는 1440×900 데스크톱 기준의 자체 완결형 HTML이라 본문 칸(약 720px)에 그대로 넣으면 잘린다.\n    iframe을 1440×900으로 고정하고 칸 폭에 맞춰 축소한다 — 상호작용은 전체 화면·새 탭에서 한다. */}\n\u003cscript is:inline data-astro-rerun>{`\n(function () {\n  var W = 1440, H = 900;\n  function fit(w) {\n    var f = w.querySelector(\"iframe\");\n    var fs = document.fullscreenElement === w;\n    var s = fs ? Math.min(innerWidth / W, innerHeight / H) : w.clientWidth / W;\n    f.style.transform = \"scale(\" + s + \")\";\n    w.style.height = fs ? \"100%\" : Math.round(H * s) + \"px\";\n    f.style.left =
