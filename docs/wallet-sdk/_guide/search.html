fs ? Math.round((innerWidth - W * s) / 2) + \"px\" : \"0\";\n    f.style.top = fs ? Math.round((innerHeight - H * s) / 2) + \"px\" : \"0\";\n  }\n  function fitAll() { document.querySelectorAll(\".dg-wrap\").forEach(fit); }\n  window.__dgFit = fit;\n  window.__dgFull = function (btn) {\n    var w = btn.closest(\"figure\").querySelector(\".dg-wrap\");\n    (w.requestFullscreen || w.webkitRequestFullscreen).call(w);\n  };\n  addEventListener(\"resize\", fitAll);\n  addEventListener(\"fullscreenchange\", fitAll);\n  if (document.readyState !== \"loading\") fitAll(); else addEventListener(\"DOMContentLoaded\", fitAll);\n})();\n`}\u003c/script>\n\nexport function Diagram({ name, title }) {\n  const src = `${base}/diagrams/${name}.html`;\n  return (\n    \u003cfigure class=\"dg\" style=\"display:grid;gap:0;margin:.75rem 0 2.5rem 0\">\n      \u003cdiv class=\"dg-wrap\" style=\"margin:0;position:relative;overflow:hidden;width:100%;height:450px;border:1px solid var(--color-border,#e5e7eb);border-radius:8px 8px 0 0;background:#fff\">\n        \u003ciframe\n          src={src}\n          title={title}\n          loading=\"lazy\"\n          onload=\"window.__dgFit && window.__dgFit(this.parentElement)\"\n          style=\"position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0\"\n        >\u003c/iframe>\n      \u003c/div>\n      \u003cfigcaption style=\"margin:0;display:flex;gap:.6rem;justify-content:flex-end;align-items:center;padding:.55rem .75rem;border:1px solid var(--color-border,#e5e7eb);border-top:0;border-radius:0 0 8px 8px;font-size:.95rem\">\n        \u003cspan style=\"margin-right:auto;opacity:.6;font-size:.85rem\">축소 미리보기 — 상호작용은 전체 화면에서\u003c/span>\n        \u003cbutton type=\"button\" onclick=\"window.__dgFull(this)\" style=\"display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;background:transparent;font:inherit;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M8 3H5a2 2 0 0 0-2 2v3\"/>\u003cpath d=\"M21 8V5a2 2 0 0 0-2-2h-3\"/>\u003cpath d=\"M3 16v3a2 2 0 0 0 2 2h3\"/>\u003cpath d=\"M16 21h3a2 2 0 0 0 2-2v-3\"/>\u003c/svg>\n          전체 화면\n        \u003c/button>\n        \u003ca href={src} target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;text-decoration:none;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 3h6v6\"/>\u003cpath d=\"M10 14 21 3\"/>\u003cpath d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"/>\u003c/svg>\n          새 탭에서 열기\n        \u003c/a>\n      \u003c/figcaption>\n    \u003c/figure>\n  );\n}\n\n_읽는 사람: 구현팀. 금지 룰이 허가를 뒤집는 결합을 다룹니다._\n\n이 페이지는 허가 룰과 금지 룰이 함께 참일 때 결과가 어떻게 정해지는지를 따라갑니다. 룰은\n`scope`와 조건을 갖고 `allow`·`deny`를 내는 단위입니다([자세히](/policy/rules)).\n\n**허가 룰이 참이어도 금지 룰이 참이면 결과는 deny입니다.** 예약 어드민 계정에 권한을 부여하려는\n요청이 이 결합을 정확히 보여줍니다.\n\n이 페이지는 그 설계를 담습니다. 어드민 액션을 판단 요청으로 접수하는 표면은 아직\n없습니다([승인 게이트](/policy/sequences/approval-gate)).\n\n\u003cDiagram name=\"usecase-deny-override\" title=\"금지 룰 — deny 는 허가를 뒤집는다\" />\n\n## 금지 룰은 대상만 봅니다\n\n예약 어드민 계정을 권한 부여 대상으로 삼는 것을 금지하는 룰의 형태 예시입니다.\n\n```json\n{\n  \"id\": \"escalation/deny-reserved-admin-target\",\n  \"effect\": \"deny\",\n  \"scope\": {\n    \"all\": [\n      { \"field\": \"operation\", \"op\": \"eq\", \"value\": \"admin_action\" },\n      { \"field\": \"payload.action\", \"op\": \"eq\", \"value\": \"role_grant\" }\n    ]\n  },\n  \"when\": {\n    \"field\": \"payload.target_admin_id\",\n    \"op\": \"in\",\n    \"value\": [\"\u003c예약 계정 식별자 목록>\"]\n  }\n}\n```\n\n**deny 룰에는 obligation이 없습니다.** obligation은 통과로 확정되기 전에 이행해야 하는 조건이라,\n거부하면서 이행을 요구하는 것은 뜻이 성립하지 않습니다. 그 계약은\n[룰 쓰기](/policy/rules)에 있습니다.\n\n## deny 면제 메커니즘은 없습니다\n\n**어느 모듈에서든 금지 룰이 참이면 결과는 deny입니다.** 허가 룰이 몇 개 발동했는지는 결과를\n바꾸지 못합니다. 결합 규칙은 [결정과 결합](/policy/rule/decision)에 있습니다.\n\ndeny 판정은 수집 요구보다 앞입니다. 소스 없이도 이미 참인 금지 룰이 있으면 수집 없이 즉시\n종결하고, 거부가 확정된 요청에 수집 비용을 쓰지 않습니다.\n\n## 금지 값이 리터럴인 것이 통제입니다\n\n슬롯은 카탈로그에 선언되고 워크스페이스가 조정할 수 있는\n값입니다([자세히](/policy/rules)).\n\n**금지 대상 목록을 슬롯으로 두면 피통제 조직이 목록을 비워 무력화할 수 있습니다.** 금지 규칙을\n금지 대상이 직접 정하게 되는 셈입니다.\n\n리터럴로 두는 대가는 목록 변경이 룰 변경 거버넌스를 거치는 것입니다. 그 비용이 이 형태의\n요점이고, 금지 대상 목록을 바꾸는 일은 조용히 일어나면 안 됩니다.\n\n## 금지 룰은 채워짐이 보장된 필드만 참조합니다\n\n**값이 없는 필드의 비교는 거짓이 됩니다.** 허가 룰에서는 통과가 막히는 안전한 방향이지만,\n금지 룰에서는 금지가 적용되지 않는 방향입니다.\n\n그래서 이 룰은 액션 계약이 필수로 요구하는 필드만 봅니다. 필드 계약은\n[룰 명세](/policy/rule/reference)에 있습니다.\n\n## 다음으로\n\n- [결정과 결합](/policy/rule/decision) — deny 우선 결합과 결정값 네 가지\n- [권한 상승 게이트](/policy/use-cases/escalation-pending) — 같은 표면의 하한 obligation\n", "kind": "참고 문서", "path": "_reference/policy--use-cases--deny-override.html", "reference": true}, {"title": "권한 상승 게이트", "text": "---\ntitle: 권한 상승 게이트\ndescription: 하한 룰은 조건 없이 적용됩니다\n---\n\nexport const base = import.meta.env.BASE_URL.replace(/\\/$/, \"\");\n\n{/* 뷰어는 1440×900 데스크톱 기준의 자체 완결형 HTML이라 본문 칸(약 720px)에 그대로 넣으면 잘린다.\n    iframe을 1440×900으로 고정하고 칸 폭에 맞춰 축소한다 — 상호작용은 전체 화면·새 탭에서 한다. */}\n\u003cscript is:inline data-astro-rerun>{`\n(function () {\n  var W = 1440, H = 900;\n  function fit(w) {\n    var f = w.querySelector(\"iframe\");\n    var fs = document.fullscreenElement === w;\n    var s = fs ? Math.min(innerWidth / W, innerHeight / H) : w.clientWidth / W;\n    f.style.transform = \"scale(\" + s + \")\";\n    w.style.height = fs ? \"100%\" : Math.round(H * s) + \"px\";\n    f.style.left = fs ? Math.round((innerWidth - W * s) / 2) + \"px\" : \"0\";\n    f.style.top = fs ? Math.round((innerHeight - H * s) / 2) + \"px\" : \"0\";\n  }\n  function fitAll() { document.querySelectorAll(\".dg-wrap\").forEach(fit); }\n  window.__dgFit = fit;\n  window.__dgFull = function (btn) {\n    var w = btn.closest(\"figure\").querySelector(\".dg-wrap\");\n    (w.requestFullscreen || w.webkitRequestFullscreen).call(w);\n  };\n  addEventListener(\"resize\", fitAll);\n  addEventListener(\"fullscreenchange\", fitAll);\n  if (document.readyState !== \"loading\") fitAll(); else addEventListener(\"DOMContentLoaded\", fitAll);\n})();\n`}\u003c/script>\n\nexport function Diagram({ name, title }) {\n  const src = `${base}/diagrams/${name}.html`;\n  return (\n    \u003cfigure class=\"dg\" style=\"display:grid;gap:0;margin:.75rem 0 2.5rem 0\">\n      \u003cdiv class=\"dg-wrap\" style=\"margin:0;position:relative;overflow:hidden;width:100%;height:450px;border:1px solid var(--color-border,#e5e7eb);border-radius:8px 8px 0 0;background:#fff\">\n        \u003ciframe\n          src={src}\n          title={title}\n          loading=\"lazy\"\n          onload=\"window.__dgFit && window.__dgFit(this.parentElement)\"\n          style=\"position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0\"\n        >\u003c/iframe>\n      \u003c/div>\n      \u003cfigcaption style=\"margin:0;display:flex;gap:.6rem;justify-content:flex-end;align-items:center;padding:.55rem .75rem;border:1px solid var(--color-border,#e5e7eb);border-top:0;border-radius:0 0 8px 8px;font-size:.95rem\">\n        \u003cspan style=\"margin-right:auto;opacity:.6;font-size:.85rem\">축소 미리보기 — 상호작용은 전체 화면에서\u003c/span>\n        \u003cbutton type=\"button\" onclick=\"window.__dgFull(this)\" style=\"display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;background:transparent;font:inherit;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M8 3H5a2 2 0 0 0-2 2v3\"/>\u003cpath d=\"M21 8V5a2 2 0 0 0-2-2h-3\"/>\u003cpath d=\"M3 16v3a2 2 0 0 0 2 2h3\"/>\u003cpath d=\"M16 21h3a2 2 0 0 0 2-2v-3\"/>\u003c/svg>\n          전체 화면\n        \u003c/button>\n        \u003ca href={src} target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;text-decoration:none;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 3h6v6\"/>\u003cpath d=\"M10 14 21 3\"/>\u003cpath d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"/>\u003c/svg>\n          새 탭에서 열기\n        \u003c/a>\n      \u003c/figcaption>\n    \u003c/figure>\n  );\n}\n\n_읽는 사람: 구현팀. 권한 상승 요청이 받는 하한 게이트를 다룹니다._\n\n이 페이지는 권한을 올리는 요청이 pending으로 멈추는 지점을 따라갑니다. obligation은 통과로\n확정되기 전에 이행해야 하는 조건이고([자세히](/policy/rules)), 이 요청에서는 2단계\n인증과, 승인에 필요한 최소 인원인 정족수의 승인이 그것입니다.\n\n**권한을 올리는 요청은 어떤 설정에서도 가장 강한 게이트를 받습니다.** 그 하한을 만드는 것이\n조건 없는 룰 하나입니다.\n\n이 페이지는 그 설계를 담습니다. 어드민 액션을 판단 요청으로 접수하는 표면은 아직\n없습니다([승인 게이트](/policy/sequences/approval-gate)).\n\n\u003cDiagram name=\"usecase-escalation-pending\" title=\"권한 상승 게이트 — obligation 이 만드는 pending\" />\n\n## 하한 룰에는 조건이 없습니다\n\n권한 부여에 하한을 거는 룰의 형태 예시입니다.\n\n```json\n{\n  \"id\": \"escalation/role-grant-gate\",\n  \"effect\": \"allow\",\n  \"scope\": {\n    \"all\": [\n      { \"field\": \"operation\", \"op\": \"eq\", \"value\": \"admin_action\" },\n      { \"field\": \"payload.action\", \"op\": \"eq\", \"value\": \"role_grant\" }\n    ]\n  },\n  \"obligations\": [\n    { \"type\": \"require_2fa\" },\n    { \"type\": \"require_quorum\", \"params\": { \"n\": { \"slot\": \"escalation_quorum\" } } }\n  ]\n}\n```\n\n**`when`이 없는 것이 이 룰의 요점입니다.** 조건을 달면 조건이 거짓인 경우에 하한이 사라지고,\n그 경우는 다른 룰이 허가하는 순간 하한 없이 통과합니다.\n\n액션 종류만으로 대상이 식별되므로 필드 값 조건이 필요하지도 않습니다. 적용 범위 두 개가\n발동을 전부 정합니다.\n\n## 하한과 허가는 독립입니다\n\n**무엇을 줄 수 있는지는 허가 룰이 답하고, 얼마나 강한 게이트를 거치는지는 이 룰이 답합니다.** 부여\n가능 목록이 어떻게 바뀌어도 이 obligation은 그대로 남습니다.\n\n본인 승인 불허는 생략으로 표현합니다. 허용 여부의 병합은 하나라도 불허면 불허라서, 생략이 곧\n가장 안전한 값입니다. 병합 규칙은 [결정과 결합](/policy/rule/decision)에 있습니다.\n\n## 정족수는 리터럴이 아니라 슬롯입니다\n\n슬롯은 카탈로그에 선언되고 워크스페이스가 조정할 수 있는 값입니다.\n\n**값을 고르는 것은 워크스페이스이지만 하한 아래로는 내려가지 못합니다.** 조건 트리를\n평가하고 결정을 결합하는 정책 무관 고정 부분인 커널([자세히](/policy/rule/decision))이 평가 시점에\n하한을 다시 확인합니다. `escalation_quorum`의 기본값은 3이고 하한은 2입니다. 슬롯 계약은\n[룰 쓰기](/policy/rules)에 있습니다.\n\n정족수를 리터럴로 고정하면 워크스페이스가 자기 규모에 맞게 올릴 수도 없습니다. 조정 가능성과\n하한 보증을 슬롯 하나가 함께 만듭니다.\n\n## pending 뒤의 흐름은 승인 게이트가 맡습니다\n\n**이 룰이 만드는 것은 pending까지입니다.** 표 수집·정족수 집계·재평가·집행은\n[승인 게이트](/policy/sequences/approval-gate)에 있고, 2단계 인증 채널은\n[obligation 수집](/policy/sequences/obligations)에 있습니다.\n\n## 다음으로\n\n- [승인 게이트](/policy/sequences/approval-gate) — pending 이후의 표 수집과 집행\n- [금지선](/policy/use-cases/deny-override) — 같은 표면에서 deny 룰이 허가를 뒤집는 흐름\n- [룰 변경 게이트](/policy/use-cases/rule-change) — 정책 변경 자체가 받는 게이트\n", "kind": "참고 문서", "path": "_reference/policy--use-cases--escalation-pending.html", "reference": true}, {"title": "룰 변경 게이트", "text": "---\ntitle: 룰 변경 게이트\ndescription: 정책을 바꾸는 요청도 정책 평가를 거칩니다\n---\n\nexport const base = import.meta.env.BASE_URL.replace(/\\/$/, \"\");\n\n{/* 뷰어는 1440×900 데스크톱 기준의 자체 완결형 HTML이라 본문 칸(약 720px)에 그대로 넣으면 잘린다.\n    iframe을 1440×900으로 고정하고 칸 폭에 맞춰 축소한다 — 상호작용은 전체 화면·새 탭에서 한다. */}\n\u003cscript is:inline data-astro-rerun>{`\n(function () {\n  var W = 1440, H = 900;\n  function fit(w) {\n    var f = w.querySelector(\"iframe\");\n    var fs = document.fullscreenElement === w;\n    var s = fs ? Math.min(innerWidth / W, innerHeight / H) : w.clientWidth / W;\n    f.style.transform = \"scale(\" + s + \")\";\n    w.style.height = fs ? \"100%\" : Math.round(H * s) + \"px\";\n    f.style.left = fs ? Math.round((innerWidth - W * s) / 2) + \"px\" : \"0\";\n    f.style.top = fs ? Math.round((innerHeight - H * s) / 2) + \"px\" : \"0\";\n  }\n  function fitAll() { document.querySelectorAll(\".dg-wrap\").forEach(fit); }\n  window.__dgFit = fit;\n  window.__dgFull = function (btn) {\n    var w = btn.closest(\"figure\").querySelector(\".dg-wrap\");\n    (w.requestFullscreen || w.webkitRequestFullscreen).call(w);\n  };\n  addEventListener(\"resize\", fitAll);\n  addEventListener(\"fullscreenchange\", fitAll);\n  if (document.readyState !== \"loading\") fitAll(); else addEventListener(\"DOMContentLoaded\", fitAll);\n})();\n`}\u003c/script>\n\nexport function Diagram({ name, title }) {\n  const src = `${base}/diagrams/${name}.html`;\n  return (\n    \u003cfigure class=\"dg\" style=\"display:grid;gap:0;margin:.75rem 0 2.5rem 0\">\n      \u003cdiv class=\"dg-wrap\" style=\"margin:0;position:relative;overflow:hidden;width:100%;height:450px;border:1px solid var(--color-border,#e5e7eb);border-radius:8px 8px 0 0;background:#fff\">\n        \u003ciframe\n          src={src}\n          title={title}\n          loading=\"lazy\"\n          onload=\"window.__dgFit && window.__dgFit(this.parentElement)\"\n          style=\"position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0\"\n        >\u003c/iframe>\n      \u003c/div>\n      \u003cfigcaption style=\"margin:0;display:flex;gap:.6rem;justify-content:flex-end;align-items:center;padding:.55rem .75rem;border:1px solid var(--color-border,#e5e7eb);border-top:0;border-radius:0 0 8px 8px;font-size:.95rem\">\n        \u003cspan style=\"margin-right:auto;opacity:.6;font-size:.85rem\">축소 미리보기 — 상호작용은 전체 화면에서\u003c/span>\n        \u003cbutton type=\"button\" onclick=\"window.__dgFull(this)\" style=\"display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;background:transparent;font:inherit;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M8 3H5a2 2 0 0 0-2 2v3\"/>\u003cpath d=\"M21 8V5a2 2 0 0 0-2-2h-3\"/>\u003cpath d=\"M3 16v3a2 2 0 0 0 2 2h3\"/>\u003cpath d=\"M16 21h3a2 2 0 0 0 2-2v-3\"/>\u003c/svg>\n          전체 화면\n        \u003c/button>\n        \u003ca href={src} target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;text-decoration:none;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 3h6v6\"/>\u003cpath d=\"M10 14 21 3\"/>\u003cpath d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"/>\u003c/svg>\n          새 탭에서 열기\n        \u003c/a>\n      \u003c/figcaption>\n    \u003c/figure>\n  );\n}\n\n_읽는 사람: 구현팀. 정책 변경 자체가 받는 게이트를 다룹니다._\n\n이 페이지는 워크스페이스가 자기 룰을 바꾸는 요청이 어떤 게이트를 거치는지를 따라갑니다.\nmaker-checker는 제안자와 승인자를 갈라 두는 정책 변경 거버넌스입니다([자세히](/policy)).\n\n**정책 변경은 엔진 밖의 관리 작업이 아니라 엔진이 평가하는 연산입니다.** 워크스페이스가 자기\n룰을 바꾸려면 그 요청부터 게이트를 거칩니다.\n\n이 페이지는 그 설계를 담습니다. 지금 룰 변경이 실제로 거치는 것은 번들 발행의 maker-checker이고\n그 대비는 [승인 게이트](/policy/sequences/approval-gate)에 있습니다.\n\n\u003cDiagram name=\"usecase-rule-change\" title=\"룰 변경 게이트 — 저작에서 활성까지\" />\n\n## 게이트를 만드는 것은 allow 룰 하나입니다\n\n룰 변경 액션에 maker-checker를 적용하는 룰입니다. 저작 세트의 escalation 모듈에 이 형태로 있습니다.\n\n```json\n{\n  \"id\": \"escalation/workspace-rule-change-gate\",\n  \"effect\": \"allow\",\n  \"scope\": {\n    \"all\": [\n      { \"field\": \"operation\", \"op\": \"eq\", \"value\": \"admin_action\" },\n      { \"field\": \"payload.action\", \"op\": \"eq\", \"value\": \"workspace_rule_change\" }\n    ]\n  },\n  \"obligations\": [\n    { \"type\": \"require_quorum\", \"params\": { \"n\": { \"slot\": \"escalation_quorum\" } } }\n  ]\n}\n```\n\n**등재된 액션에는 그것을 명시로 제약하는 allow 룰이 최소 하나 있어야 합니다.** 없으면 컴파일이\n실패합니다. 게이트 없는 액션이 조용히 허용되는 상태를 컴파일 단계가 막습니다.\n\n## 모듈 조건을 달지 않는 것이 의도입니다\n\n**어느 모듈을 바꾸든 강도는 같습니다.** 모듈마다 강도를 가르면 목록에 없는 모듈이 하한 없는\n경우가 되고, 넓은 허가 룰 하나가 그 경우까지 허용해 버릴 수 있습니다.\n\n강도는 기준 설계가 정하고 저작이 더하지 않습니다. 이 경로의 강제는 maker-checker 하나입니다.\n2단계 인증은 [권한 상승 게이트](/policy/use-cases/escalation-pending)의 것입니다.\n\n## allow 뒤에도 발행을 거쳐야 바뀝니다\n\n**승인이 끝나도 서빙 중인 정책은 아직 그대로입니다.** 검증·컴파일·발행을 거쳐 활성 revision이\n전환된 뒤에야 다음 평가가 새 룰을 봅니다.\n\n저작에서 발행까지의 파이프라인은 [저작과 발행](/policy/workflow)에 있습니다. 평가가\n읽는 활성 revision은 [저장과 이동](/policy/runtime/storage)에 있습니다.\n\n## 다음으로\n\n- [저작과 발행](/policy/workflow) — 초안·검증·발행 파이프라인\n- [승인 게이트](/policy/sequences/approval-gate) — 정족수 집계와 재평가\n- [권한 상승 게이트](/policy/use-cases/escalation-pending) — 더 강한 하한이 적용되는 표면\n", "kind": "참고 문서", "path": "_reference/policy--use-cases--rule-change.html", "reference": true}, {"title": "출금 화이트리스트", "text": "---\ntitle: 출금 화이트리스트\ndescription: 조건 하나가 수집 루프 전체를 발동합니다\n---\n\nexport const base = import.meta.env.BASE_URL.replace(/\\/$/, \"\");\n\n{/* 뷰어는 1440×900 데스크톱 기준의 자체 완결형 HTML이라 본문 칸(약 720px)에 그대로 넣으면 잘린다.\n    iframe을 1440×900으로 고정하고 칸 폭에 맞춰 축소한다 — 상호작용은 전체 화면·새 탭에서 한다. */}\n\u003cscript is:inline data-astro-rerun>{`\n(function () {\n  var W = 1440, H = 900;\n  function fit(w) {\n    var f = w.querySelector(\"iframe\");\n    var fs = document.fullscreenElement === w;\n    var s = fs ? Math.min(innerWidth / W, innerHeight / H) : w.clientWidth / W;\n    f.style.transform = \"scale(\" + s + \")\";\n    w.style.height = fs ? \"100%\" : Math.round(H * s) + \"px\";\n    f.style.left = fs ? Math.round((innerWidth - W * s) / 2) + \"px\" : \"0\";\n    f.style.top = fs ? Math.round((innerHeight - H * s) / 2) + \"px\" : \"0\";\n  }\n  function fitAll() { document.querySelectorAll(\".dg-wrap\").forEach(fit); }\n  window.__dgFit = fit;\n  window.__dgFull = function (btn) {\n    var w = btn.closest(\"figure\").querySelector(\".dg-wrap\");\n    (w.requestFullscreen || w.webkitRequestFullscreen).call(w);\n  };\n  addEventListener(\"resize\", fitAll);\n  addEventListener(\"fullscreenchange\", fitAll);\n  if (document.readyState !== \"loading\") fitAll(); else addEventListener(\"DOMContentLoaded\", fitAll);\n})();\n`}\u003c/script>\n\nexport function Diagram({ name, title }) {\n  const src = `${base}/diagrams/${name}.html`;\n  return (\n    \u003cfigure class=\"dg\" style=\"display:grid;gap:0;margin:.75rem 0 2.5rem 0\">\n      \u003cdiv class=\"dg-wrap\" style=\"margin:0;position:relative;overflow:hidden;width:100%;height:450px;border:1px solid var(--color-border,#e5e7eb);border-radius:8px 8px 0 0;background:#fff\">\n        \u003ciframe\n          src={src}\n          title={title}\n          loading=\"lazy\"\n          onload=\"window.__dgFit && window.__dgFit(this.parentElement)\"\n          style=\"position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0\"\n        >\u003c/iframe>\n      \u003c/div>\n      \u003cfigcaption style=\"margin:0;display:flex;gap:.6rem;justify-content:flex-end;align-items:center;padding:.55rem .75rem;border:1px solid var(--color-border,#e5e7eb);border-top:0;border-radius:0 0 8px 8px;font-size:.95rem\">\n        \u003cspan style=\"margin-right:auto;opacity:.6;font-size:.85rem\">축소 미리보기 — 상호작용은 전체 화면에서\u003c/span>\n        \u003cbutton type=\"button\" onclick=\"window.__dgFull(this)\" style=\"display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;background:transparent;font:inherit;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M8 3H5a2 2 0 0 0-2 2v3\"/>\u003cpath d=\"M21 8V5a2 2 0 0 0-2-2h-3\"/>\u003cpath d=\"M3 16v3a2 2 0 0 0 2 2h3\"/>\u003cpath d=\"M16 21h3a2 2 0 0 0 2-2v-3\"/>\u003c/svg>\n          전체 화면\n        \u003c/button>\n        \u003ca href={src} target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;text-decoration:none;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 3h6v6\"/>\u003cpath d=\"M10 14 21 3\"/>\u003cpath d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"/>\u003c/svg>\n          새 탭에서 열기\n        \u003c/a>\n      \u003c/figcaption>\n    \u003c/figure>\n  );\n}\n\n_읽는 사람: 구현팀. 수집 루프가 끼는 평가 한 건을 처음부터 끝까지 다룹니다._\n\n이 페이지는 외부 주소 출금 요청이 화이트리스트 등재 상태를 확인받는 과정을 따라갑니다.\n화이트리스트는 출금 통제에서 부르는 주소록의 다른\n이름입니다([자세히](/fund-flows/address-book)).\n\n**이 흐름의 룰은 하나이고 조건도 하나입니다.** 그런데 그 조건이 읽는 값이 요청 안에 없어서,\n평가는 한 번으로 끝나지 않습니다.\n\n\u003cDiagram name=\"usecase-whitelist-loop\" title=\"출금 화이트리스트 — 수집 루프가 있는 평가\" />\n\n## 룰 형태가 흐름을 정합니다\n\n외부 주소 출금을 허가하는 룰의 형태 예시입니다. 필드와 조각의 뜻은\n[룰 쓰기](/policy/rules)에 있습니다.\n\n```json\n{\n  \"id\": \"withdrawal/allow-evm-external-address\",\n  \"effect\": \"allow\",\n  \"scope\": {\n    \"all\": [\n      { \"field\": \"operation\", \"op\": \"eq\", \"value\": \"value_transfer\" },\n      { \"field\": \"chain.family\", \"op\": \"eq\", \"value\": \"evm\" },\n      { \"field\": \"destination.type\", \"op\": \"eq\", \"value\": \"external_address\" },\n      { \"field\": \"source_vault.kind\", \"op\": \"eq\", \"value\": \"custody\" }\n    ]\n  },\n  \"when\": { \"field\": \"address_ownership.status\", \"op\": \"eq\", \"value\": \"active\" }\n}\n```\n\n**적용 범위는 조건 필드 네 개를 전부 긍정으로 확정합니다.** 부정으로 좁히면 새 체인이나 새\n목적지 종류가 등재되는 순간 이 룰이 그것까지 자동으로 함께 허용하기 때문입니다.\n\n이 모듈에 deny 룰이 없어도 미저작 경로는 전부 막힙니다. 매치되는 allow가 없으면 결과는\ndefault deny입니다. 결합 규칙은 [결정과 결합](/policy/rule/decision)에 있습니다.\n\n## 조건의 소스 참조가 루프를 만듭니다\n\n**`when`이 읽는 등재 상태는 요청이 담아 오는 값이 아닙니다.** 판단에 필요한 사실을 평가 시점에\n읽어 오는 수집 경로인 PIP([자세히](/policy/runtime/pip))가 가져오고, 첫 평가 시점에는 그 스냅샷이\n없습니다.\n\n그래서 1차 평가는 거부가 아니라 `need_more_data`로 끝납니다. 그 뒤의 수집 대기와 도착 검사,\n타임아웃은 [비동기 수집](/policy/sequences/pending-data)에 있습니다.\n\n## 화이트리스트 판정이 조건에 있는 것이 의도입니다\n\n**같은 비교를 적용 범위에 두면 미등재 주소가 \"룰 없음\" 거부와 구분되지 않습니다.** 조건에 두면\n룰이 적용됐으나 불허한 것이 되어, 결정 사유가 모듈과 룰을 지목합니다.\n\n등재 여부가 아니라 상태 값 하나를 봅니다. 회수는 등재 삭제가 아니라 상태 전이라서, `active`\n비교 하나가 미등재와 회수를 함께 막습니다.\n\n## 통과의 끝은 allow가 아니라 스탬프 있는 allow입니다\n\n**재평가가 allow를 내면 승인 스탬프가 함께 새겨집니다.** 그 스탬프에 담기는 것은 인가 유효 시한과\n체인별 자원 상한입니다. 승인 스탬프는 승인 시점에 찍히는 소비 시점\n유효값입니다([자세히](/policy/runtime/normalization)).\n\n스탬프를 낼 수 없으면 조건 트리를 평가하고 결정을 결합하는 정책 무관 고정 부분인\n커널([자세히](/policy/rule/decision))이 allow 대신 실패로 종결합니다.\n\n그 스탬프가 서명 직전에 하는 일은 [서명 상한 대조](/policy/use-cases/callback-limit)가 잇습니다.\n\n## 다음으로\n\n- [비동기 수집](/policy/sequences/pending-data) — 수집 대기·도착 검사·타임아웃\n- [PIP](/policy/runtime/pip) — 소스 선언과 수집 계약\n- [서명 상한 대조](/policy/use-cases/callback-limit) — 이 흐름이 발급한 스탬프의 마지막 일\n", "kind": "참고 문서", "path": "_reference/policy--use-cases--whitelist-loop.html", "reference": true}, {"title": "룰 저작과 발행", "text": "---\ntitle: 룰 저작과 발행\ndescription: draft 하나가 편집·검증·승인을 거쳐 활성 번들이 되기까지\n---\n\nexport const base = import.meta.env.BASE_URL.replace(/\\/$/, \"\");\n\n{/* 뷰어는 1440×900 데스크톱 기준의 자체 완결형 HTML이라 본문 칸(약 720px)에 그대로 넣으면 잘린다.\n    iframe을 1440×900으로 고정하고 칸 폭에 맞춰 축소한다 — 상호작용은 전체 화면·새 탭에서 한다. */}\n\u003cscript is:inline data-astro-rerun>{`\n(function () {\n  var W = 1440, H = 900;\n  function fit(w) {\n    var f = w.querySelector(\"iframe\");\n    var fs = document.fullscreenElement === w;\n    var s = fs ? Math.min(innerWidth / W, innerHeight / H) : w.clientWidth / W;\n    f.style.transform = \"scale(\" + s + \")\";\n    w.style.height = fs ? \"100%\" : Math.round(H * s) + \"px\";\n    f.style.left = fs ? Math.round((innerWidth - W * s) / 2) + \"px\" : \"0\";\n    f.style.top = fs ? Math.round((innerHeight - H * s) / 2) + \"px\" : \"0\";\n  }\n  function fitAll() { document.querySelectorAll(\".dg-wrap\").forEach(fit); }\n  window.__dgFit = fit;\n  window.__dgFull = function (btn) {\n    var w = btn.closest(\"figure\").querySelector(\".dg-wrap\");\n    (w.requestFullscreen || w.webkitRequestFullscreen).call(w);\n  };\n  addEventListener(\"resize\", fitAll);\n  addEventListener(\"fullscreenchange\", fitAll);\n  if (document.readyState !== \"loading\") fitAll(); else addEventListener(\"DOMContentLoaded\", fitAll);\n})();\n`}\u003c/script>\n\nexport function Diagram({ name, title }) {\n  const src = `${base}/diagrams/${name}.html`;\n  return (\n    \u003cfigure class=\"dg\" style=\"display:grid;gap:0;margin:.75rem 0 2.5rem 0\">\n      \u003cdiv class=\"dg-wrap\" style=\"margin:0;position:relative;overflow:hidden;width:100%;height:450px;border:1px solid var(--color-border,#e5e7eb);border-radius:8px 8px 0 0;background:#fff\">\n        \u003ciframe\n          src={src}\n          title={title}\n          loading=\"lazy\"\n          onload=\"window.__dgFit && window.__dgFit(this.parentElement)\"\n          style=\"position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0\"\n        >\u003c/iframe>\n      \u003c/div>\n      \u003cfigcaption style=\"margin:0;display:flex;gap:.6rem;justify-content:flex-end;align-items:center;padding:.55rem .75rem;border:1px solid var(--color-border,#e5e7eb);border-top:0;border-radius:0 0 8px 8px;font-size:.95rem\">\n        \u003cspan style=\"margin-right:auto;opacity:.6;font-size:.85rem\">축소 미리보기 — 상호작용은 전체 화면에서\u003c/span>\n        \u003cbutton type=\"button\" onclick=\"window.__dgFull(this)\" style=\"display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;background:transparent;font:inherit;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M8 3H5a2 2 0 0 0-2 2v3\"/>\u003cpath d=\"M21 8V5a2 2 0 0 0-2-2h-3\"/>\u003cpath d=\"M3 16v3a2 2 0 0 0 2 2h3\"/>\u003cpath d=\"M16 21h3a2 2 0 0 0 2-2v-3\"/>\u003c/svg>\n          전체 화면\n        \u003c/button>\n        \u003ca href={src} target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;text-decoration:none;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 3h6v6\"/>\u003cpath d=\"M10 14 21 3\"/>\u003cpath d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"/>\u003c/svg>\n          새 탭에서 열기\n        \u003c/a>\n      \u003c/figcaption>\n    \u003c/figure>\n  );\n}\n\n_읽는 사람: 파트너사 개발자. draft 하나가 활성 번들이 될 때까지 사람이 하는 일을 다룹니다._\n\n룰 저작은 콘솔에서 draft를 열고, 검증을 받고, 승인을 모아 발행과 활성화까지 가는 절차입니다. 이\n페이지는 그 절차를 순서대로 설명합니다.\n\n출발점은 저작 세트입니다. 저작 세트는 룰 모듈과 카탈로그·레지스트리 파일이 놓이는\n묶음입니다([자세히](/policy/architecture)).\n\n저작 세트를 컴파일하면 평가기가 읽는 선언 데이터가 됩니다. 채점은 컴파일된 룰이 의도대로\n판정하는지 테스트 벡터로 재는 검사입니다.\n\n컴파일과 채점을 통과한 내용이 정책 로직 번들로 묶여 발행됩니다. 정책 로직 번들은 룰과 선언\n데이터를 커널과 함께 담아 발행한 배포 산출물입니다.\n\n발행만으로는 아직 서빙되지 않습니다. 활성 포인터가 그중 한 revision을 가리켜야 그것이 서빙됩니다.\n\n\u003cDiagram name=\"rule-draft-lifecycle\" title=\"룰 draft의 일생 — 저작에서 활성까지\" />\n\n## 저작은 기준선에서 시작합니다\n\n콘솔의 편집기는 빈 화면이 아니라 활성 번들에서 유도한 기준선으로 시작합니다. 지금 서빙되는 내용을\n받아 고치는 구조라, 저작이 현재 상태와 동떨어지지 않습니다.\n\n활성 번들이 없을 때 무엇을 받는지는 두 경우로 갈립니다. 워크스페이스 저작은 앱에 미리 넣어 둔 시드\n저작 세트를 받습니다.\n\n그 시드도 없으면 기준선이 빕니다. 플랫폼 저작은 활성 번들이 없으면 그대로 빕니다.\n\n**빈 기준선은 오류가 아니라 첫 저작의 정상 출발점입니다.**\n\n## 편집은 revision을 쌓습니다\n\ndraft 하나가 편집의 머리(head)입니다. **편집은 언제나 새 revision을 추가하는 일입니다.**\n\n지난 revision은 고쳐지지 않고 그대로 남습니다. 그래서 편집 이력을 되짚을 때 그때의 내용을 revision\n번호로 다시 읽습니다.\n\n폐기도 삭제가 아니라 상태 전이입니다. 저작 원문이 어떻게 저장되는지는\n[저장과 이동](/policy/runtime/storage)에서 설명합니다.\n\n조회 범위는 요청이 아니라 인증에서 옵니다. [인증과 스코프](/start/authentication)의 규율\n그대로입니다.\n\n## 검증은 revision 하나에 묶입니다\n\n검증 요청은 draft가 아니라 특정 revision을 지목합니다. 컴파일 검사 전부와 케이스 채점이 한\n요청에서 함께 실행됩니다.\n\n결과는 그 revision에 남습니다. 통과 여부, 위반 목록, 실행된 케이스 수를 봅니다.\n\n그래서 \"검증 통과\"라는 말에는 항상 대상이 있습니다. **revision을 더 쌓으면 새 revision은 다시\n검증받아야 합니다.**\n\n콘솔 검증과 발행 빌드는 같은 컴파일러를 거칩니다. 그래서 검증 화면에서 통과한 내용이 발행 시점에\n다른 판정을 받지 않습니다.\n\n### 경고는 판정을 바꾸지 않습니다\n\n결과에는 위반 말고 경고가 함께 들어갑니다. **경고는 통과 여부를 뒤집지 않습니다.** 발행 검사에서\n막힐 것을 검증 화면이 미리 보여 주기 때문입니다.\n\n그래서 오타 하나가 승인 한 벌을 헛되게 하지 않습니다. 정족수는 승인이 성립하는 데 필요한 최소\n승인자 수입니다.\n\n경고 종류는 셋입니다.\n\n- **슬롯 카탈로그 드리프트**: 세트가 담은 카탈로그 사본이 기준 카탈로그와 갈렸습니다\n- **기준 카탈로그 미확정**: 대조할 기준을 찾지 못해 세트가 담은 사본으로 검증했습니다. 발행은\n  기준을 확정하지 못하면 거부합니다\n- **테넌트 부재**: 슬롯 값 구획이 적은 테넌트를 그 워크스페이스에서 찾지 못했습니다\n\n## 승인은 통과한 revision만 받습니다\n\n승인을 여는 사람(maker)과 표를 던지는 사람(checker)이 갈립니다. maker-checker는 제안자와 승인자를\n갈라 두는 정책 변경 거버넌스입니다([자세히](/policy)).\n\n**승인은 검증을 통과한 revision의 내용 해시에 묶입니다.** 통과하지 않은 revision은 승인의 대상이\n되지 않습니다.\n\n승인을 모은 뒤 내용을 고치면 그 승인은 새 내용에 적용되지 않습니다. 왜 그렇게 되는지는\n[저장과 이동](/policy/runtime/storage)에서 설명합니다.\n\n표 접수와 자격 재검증, 재평가로 이어지는 maker-checker 흐름은\n[승인 게이트](/policy/sequences/approval-gate)에 있습니다.\n\n## 발행은 승인된 내용만 번들로 만듭니다\n\n발행은 승인된 revision을 정책 로직 번들로 만드는 액션입니다. **발행된 것이 승인된 것과 같은\n바이트임을 서버가 대조합니다.**\n\n대조가 어긋나면 번들이 만들어지지 않습니다. 그 대조가 어떻게 이루어지는지는\n[저장과 이동](/policy/runtime/storage)에서 설명합니다.\n\n발행에는 컴파일 밖의 검사가 하나 더 있습니다. 슬롯 값 구획이 테넌트를 지목하면, 그 테넌트가 그\n워크스페이스에 실재하는지 지갑 쪽에 물어봅니다.\n\n거절 사유는 셋으로 갈립니다. 없다는 사실 확인, 물어보지 못한 상태, 그리고 배선 결함입니다. 물을\n테넌트 키가 없으면 조회 자체를 하지 않습니다.\n\n## 활성화는 별도 액션입니다\n\n발행은 번들 revision을 만드는 일이고, 무엇이 서빙되는지는 활성 포인터가 정합니다. 활성 포인터는\n지금 무엇이 서빙되는지를 정하는 단일 기록입니다.\n\n발행이 곧 활성화가 되지 않게 두 단계를 갈라 두었습니다. **되돌림은 재발행이 아니라 활성 포인터\n재전환입니다.**\n\n이전 revision은 저장소에 그대로 있습니다. 포인터 전환과 전환 이력의 저장 방식은\n[저장과 이동](/policy/runtime/storage)에서 설명합니다.\n\n## 콘솔은 두 배포로 갈립니다\n\n지금 프론트엔드는 라우터 하나에 전 화면이 든 단일 앱이고, 두 배포로 가르는 것은 계약과 이 문서가\n정한 목표 상태입니다.\n\n이 절차를 사람이 거치는 화면이 정책 콘솔입니다. 파트너사 워크스페이스가 쓰는 콘솔과, 플랫폼 통제\n구역이 쓰는 콘솔로 갈립니다.\n\n두 배포가 부를 수 있는 표면이 다르므로 화면 구성도 다릅니다. 표면은 계약 소유자와 인증 방식이\n하나로 정해지는 API 경로 묶음입니다([자세히](/start/authentication)).\n\n양쪽에 함께 있는 화면입니다.\n\n- **로그인**(`/login`)과 **자격 등록**(`/enroll`): 세션을 세우는 화면입니다. 자격 등록은 아직\n  세션이 없는 사람이 1회용 등록 토큰으로 부릅니다\n- **draft 목록**(`/drafts`)과 **draft 상세**(`/drafts/:draftId`): revision 체인과 편집기가 여기\n  있습니다\n- **승인 목록**(`/approvals`)과 **승인 상세**(`/approvals/:approvalId`): 표를 던지는 화면이고,\n  상세가 활성 번들을 기준선 삼아 내용 차이를 보여 줍니다\n- **어드민 목록**(`/admins`): 지명과 회수 화면입니다\n\n파트너사 콘솔에만 판단 요청 생성(`/requests/new`)과 판단 요청 상세(`/requests/:policyRequestId`)가\n있습니다. 접수 자격이 어드민 세션과 다른 기준이라 통제 구역 콘솔에는 이 화면을 두지 않습니다.\n\n통제 구역 콘솔에만 셋이 있습니다. 부트스트랩(`/bootstrap`)은 최초 어드민을 만들고, 활성\n번들(`/bundles`)은 지금 서빙되는 번들을 보여 주며, 워크스페이스 등록(`/workspaces/new`)은 새\n워크스페이스와 그 매니저를 만듭니다.\n\n## 다음으로\n\n- [결과 읽기](/policy/results) — 거절과 보류가 파트너사 API 응답에 어떻게 나타나나\n- [승인 게이트](/policy/sequences/approval-gate) — 표 접수와 자격 재검증이 거치는 흐름\n- [저장과 이동](/policy/runtime/storage) — 발행과 활성화의 대조가 어떻게 이루어지나\n- [룰 쓰기](/policy/rules) — 여기서 저작하는 룰이 무엇으로 이루어지나\n", "kind": "참고 문서", "path": "_reference/policy--workflow.html", "reference": true}, {"title": "API 레퍼런스", "text": "---\ntitle: API 레퍼런스\ndescription: 표면 다섯 개의 엔드포인트 전수\n---\n\n_읽는 사람: 파트너사 개발자. 엔드포인트 전수를 표면별로 나눠 다룹니다._\n\n계약 소유자와 인증 방식이 하나로 정해지는 API 경로 묶음인 표면([자세히](/start/authentication))이\n다섯 가지 있습니다. 부르는 주체와 인증 방식이 갈라서 다섯으로 나뉜 것입니다. 먼저 어느 표면인지를\n고르고 그 안에서 엔드포인트를 찾는 편이 빠릅니다.\n\n헤더의 드롭다운으로 표면 사이를 오갈 수 있습니다.\n\n## 파트너사가 쓰는 표면\n\n### [Wallet API](/reference/wallet)\n\n\u003cSpecDownload file=\"openapi.WalletApi.yaml\" />\n\n일상적인 연동에서 부르는 것은 이것 하나입니다. 계정과 지갑을 만들고, 입금을 조회하고, 집금과\n출금을 요청합니다.\n\n인증은 파트너사 API 키입니다. 스코프는 그 키가 정하고 요청이 싣지 않습니다.\n\n- **관련 서술**: [자금 이동](/fund-flows) · 설계 기록의 「식별자」\n\n## 운영자가 쓰는 표면\n\n### [Admin API](/reference/admin)\n\n\u003cSpecDownload file=\"openapi.WalletAdminApi.yaml\" />\n\n카탈로그(네트워크·토큰), 테넌트, API 키를 관리하고 승인 게이팅을 처리합니다. 격리 키가\nworkspace입니다.\n\n승인 게이팅은 어드민 액션이 승인자의 확인을 거쳐야 실행되는\n통제입니다([자세히](/policy/sequences/approval-gate)).\n\n- **관련 서술**: [카탈로그](/accounts-wallets/catalog) · [계정 계층](/accounts-wallets/accounts)\n\n### [Policy API](/reference/policy)\n\n\u003cSpecDownload file=\"openapi.PolicyApi.yaml\" />\n\n정책 판단 요청과 조회, 룰 저작·발행, 어드민 인증입니다. 사람이 콘솔로 접근하는 어드민 표면과\n서비스가 부르는 판단 표면이 같은 포트에 있습니다. 어느 쪽인지는 경로가 정합니다. 겹치면 어드민\n세션 인증이 우선하고, 엇갈린 자격은 401입니다.\n\n- **관련 서술**: [정책 엔진](/policy) · [표면과 인증](/start/authentication)\n\n## 서비스끼리 부르는 표면\n\n파트너사는 이 둘을 직접 부르지 않습니다. Wallet 서버가 게이트웨이를 겸해 대신 호출합니다.\nWallet 서버는 파트너 대상 API를 받아 정책 엔진에 판단을 묻고 서명 인프라에 제출하는 Wallet SDK의\n서버 컴포넌트입니다([자세히](/policy/architecture)). 문서에 실린 이유는 그 계약이 무엇인지가 자금\n흐름과 정책 판단을 읽는 데 필요해서입니다.\n\n### [Travel Rule Gateway API](/reference/travel-rule)\n\n\u003cSpecDownload file=\"openapi.TravelRuleGateway.yaml\" />\n\n가상자산 이전 시 송·수신 정보를 사업자끼리 교환하는 규제 의무인\n트래블룰([자세히](/#함께-제공하는-모듈))의 정보 교환입니다. 판단 주체는 wallet이고, 상대 VASP에는 단일\nboolean만 냅니다. 그 이상을 내면 상대가 파트너사의 최종 사용자를 열거할 수 있습니다.\n\n- **관련 서술**: [이동 종류](/fund-flows/movements) · [에코시스템](/#함께-제공하는-모듈)\n\n### Internal API\n\n\n자금을 움직이는 요청이 서명 인프라로 가기 전에 그 요청을 심사하는 별도 시스템인 정책\n엔진([자세히](/policy/architecture))이 평가 전에 사실을 읽는 경로입니다. vault 소유, 토큰 카탈로그,\n주소 등재 상태가 여기서 나옵니다.\n\n**조회 순서 자체가 격리의 근거입니다.** 토큰 카탈로그 조회는 요청이 신고한 workspace가 아니라\nvault 소유 해석에서 얻은 workspace로 스코프합니다. vault 소유 해석은 vault 식별자 하나로 소유\nworkspace와 tenant를 확정하는 조회입니다([자세히](/policy/runtime/pip)).\n\n- **관련 서술**: [PIP](/policy/runtime/pip) · [도메인 모델](/accounts-wallets/domain-model)\n\n## 계약의 기준 문서\n\n계약의 기준 문서는 TypeSpec입니다. 이 레퍼런스는 `docs/wallet-system/tsp/`에서 생성됩니다.\n엔드포인트·스키마·에러 코드가 바뀌면 그쪽이 먼저 바뀌고 여기가 따라옵니다.\n\n표면마다 있는 내려받기 버튼은 그 TypeSpec에서 생성한 OpenAPI 3.1 파일을 줍니다. 이 사이트의\n레퍼런스 페이지도 같은 파일에서 만들어지므로, 받은 파일과 화면의 내용은 같은 빌드에서 나온 것입니다.\n클라이언트 코드 생성이나 모의 서버에 넣을 때 씁니다.\n\n계약이 바뀐 것은 [변경 이력](/changelog)에 적습니다. 계약과 서술이 갈려 있는 것은\n설계 기록의 「알려진 제약」에 모아 두었습니다. **에러 코드 이름과 주소록 접두사가 지금\n그렇습니다.**\n\n**여기 실린 것이 다 동작하지는 않습니다.** 어느 오퍼레이션이 아직 모형 응답이고 어느 것이\n계약뿐인지는 설계 기록의 「구현 대기」가 빌드마다 코드에서 다시 셉니다.\n", "kind": "참고 문서", "path": "_reference/reference.html", "reference": true}, {"title": "Wallet Admin API", "text": "---\nseo:\n  description: Wallet Admin API API reference.\nsidebar:\n  label: Overview\ntitle: Wallet Admin API\n---\n\u003cApiOverview source=\"reference-admin\" />\n\n## Approvals\n\nmaker-checker 승인. 정족수 obligation의 이행 표면이고, 요청자와 승인자는 같을 수 없다.\n\n\u003cApiTagOperations source=\"reference-admin\" tag=\"approvals\" />\n\n## Auth\n\n어드민 인증. 세션과 2FA를 다룬다.\n\n\u003cApiTagOperations source=\"reference-admin\" tag=\"auth\" />\n\n## Networks\n\n블록체인 네트워크 카탈로그. 계열에 따라 주소 체계가 갈린다.\n\n\u003cApiTagOperations source=\"reference-admin\" tag=\"networks\" />\n\n## Policies\n\n정책 엔진 연동 표면.\n\n\u003cApiTagOperations source=\"reference-admin\" tag=\"policies\" />\n\n## Roles\n\n어드민 역할과 권한 부여.\n\n\u003cApiTagOperations source=\"reference-admin\" tag=\"roles\" />\n\n## Tenants\n\n파트너사 단위 스코프. 파트너 대상 API의 격리 키다.\n\n\u003cApiTagOperations source=\"reference-admin\" tag=\"tenants\" />\n\n## API Keys\n\n파트너사 API 키 발급·회수. 스코프가 여기서 정해진다.\n\n\u003cApiTagOperations source=\"reference-admin\" tag=\"api-keys\" />\n\n## Tokens\n\n네트워크 위의 자산. 유일성은 (workspace, network, 컨트랙트 주소)에서 성립한다.\n\n\u003cApiTagOperations source=\"reference-admin\" tag=\"tokens\" />\n\n## Users\n\n어드민 사용자 관리.\n\n\u003cApiTagOperations source=\"reference-admin\" tag=\"users\" />\n\n## Workspace Vaults\n\nworkspace에 귀속된 vault. 용도는 태그로 고객이 정의한다.\n\n\u003cApiTagOperations source=\"reference-admin\" tag=\"workspace-vaults\" />\n\n## Initialize\n\n최초 어드민 부트스트랩. 한 번만 통과한다 -list.html", "reference": true}, {"title": "유저 상태 변경", "text": "---\nsearch:\n  tags:\n    - Users\n    - POST\nseo:\n  description: >-\n    유저 상태 변경 Reference for the POST /admin/api/v1/users/{userId}/status endpoint\n    in the Wallet Admin API API.\nsidebar:\n  label: 유저 상태 변경\n  badge: POST\ntitle: 유저 상태 변경\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-admin\" id=\"users-change-status\" />\n", "kind": "참고 문서", "path": "_reference/reference--admin--users--users-change-status.html", "reference": true}, {"title": "유저 상세 조회", "text": "---\nsearch:\n  tags:\n    - Users\n    - GET\nseo:\n  description: >-\n    유저 상세 조회 Reference for the GET /admin/api/v1/users/{userId} endpoint in the\n    Wallet Admin API API.\nsidebar:\n  label: 유저 상세 조회\n  badge: GET\ntitle: 유저 상세 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-admin\" id=\"users-get\" />\n", "kind": "참고 문서", "path": "_reference/reference--admin--users--users-get.html", "reference": true}, {"title": "유저 초대", "text": "---\nsearch:\n  tags:\n    - Users\n    - POST\nseo:\n  description: >-\n    유저 초대 Reference for the POST /admin/api/v1/users endpoint in the Wallet\n    Admin API API.\nsidebar:\n  label: 유저 초대\n  badge: POST\ntitle: 유저 초대\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-admin\" id=\"users-invite\" />\n", "kind": "참고 문서", "path": "_reference/reference--admin--users--users-invite.html", "reference": true}, {"title": "유저 목록 조회", "text": "---\nsearch:\n  tags:\n    - Users\n    - GET\nseo:\n  description: >-\n    유저 목록 조회 Reference for the GET /admin/api/v1/users endpoint in the Wallet\n    Admin API API.\nsidebar:\n  label: 유저 목록 조회\n  badge: GET\ntitle: 유저 목록 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-admin\" id=\"users-list\" />\n", "kind": "참고 문서", "path": "_reference/reference--admin--users--users-list.html", "reference": true}, {"title": "내 정보 조회", "text": "---\nsearch:\n  tags:\n    - Users\n    - GET\nseo:\n  description: >-\n    내 정보 조회 Reference for the GET /admin/api/v1/users/me endpoint in the Wallet\n    Admin API API.\nsidebar:\n  label: 내 정보 조회\n  badge: GET\ntitle: 내 정보 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-admin\" id=\"users-me\" />\n", "kind": "참고 문서", "path": "_reference/reference--admin--users--users-me.html", "reference": true}, {"title": "유저 수정", "text": "---\nsearch:\n  tags:\n    - Users\n    - POST\nseo:\n  description: >-\n    유저 수정 Reference for the POST /admin/api/v1/users/{userId} endpoint in the\n    Wallet Admin API API.\nsidebar:\n  label: 유저 수정\n  badge: POST\ntitle: 유저 수정\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-admin\" id=\"users-update\" />\n", "kind": "참고 문서", "path": "_reference/reference--admin--users--users-update.html", "reference": true}, {"title": "Workspace Vault 상태 변경", "text": "---\nsearch:\n  tags:\n    - Workspace Vaults\n    - POST\nseo:\n  description: >-\n    Workspace Vault 상태 변경 Reference for the POST\n    /admin/api/v1/workspace-vaults/{workspaceVaultId}/status endpoint in the\n    Wallet Admin API API.\nsidebar:\n  label: Workspace Vault 상태 변경\n  badge: POST\ntitle: Workspace Vault 상태 변경\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-admin\" id=\"workspace-vaults-change-status\" />\n", "kind": "참고 문서", "path": "_reference/reference--admin--workspace-vaults--workspace-vaults-change-status.html", "reference": true}, {"title": "Workspace Vault 생성", "text": "---\nsearch:\n  tags:\n    - Workspace Vaults\n    - POST\nseo:\n  description: >-\n    Workspace Vault 생성 Reference for the POST /admin/api/v1/workspace-vaults\n    endpoint in the Wallet Admin API API.\nsidebar:\n  label: Workspace Vault 생성\n  badge: POST\ntitle: Workspace Vault 생성\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-admin\" id=\"workspace-vaults-create\" />\n", "kind": "참고 문서", "path": "_reference/reference--admin--workspace-vaults--workspace-vaults-create.html", "reference": true}, {"title": "Workspace Wallet 생성", "text": "---\nsearch:\n  tags:\n    - Workspace Vaults\n    - POST\nseo:\n  description: >-\n    Workspace Wallet 생성 Reference for the POST\n    /admin/api/v1/workspace-vaults/{workspaceVaultId}/wallets endpoint in the\n    Wallet Admin API API.\nsidebar:\n  label: Workspace Wallet 생성\n  badge: POST\ntitle: Workspace Wallet 생성\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-admin\" id=\"workspace-vaults-create-wallet\" />\n", "kind": "참고 문서", "path": "_reference/reference--admin--workspace-vaults--workspace-vaults-create-wallet.html", "reference": true}, {"title": "Workspace Vault 상세 조회", "text": "---\nsearch:\n  tags:\n    - Workspace Vaults\n    - GET\nseo:\n  description: >-\n    Workspace Vault 상세 조회 Reference for the GET\n    /admin/api/v1/workspace-vaults/{workspaceVaultId} endpoint in the Wallet\n    Admin API API.\nsidebar:\n  label: Workspace Vault 상세 조회\n  badge: GET\ntitle: Workspace Vault 상세 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-admin\" id=\"workspace-vaults-get\" />\n", "kind": "참고 문서", "path": "_reference/reference--admin--workspace-vaults--workspace-vaults-get.html", "reference": true}, {"title": "Workspace Wallet 상세 조회", "text": "---\nsearch:\n  tags:\n    - Workspace Vaults\n    - GET\nseo:\n  description: >-\n    Workspace Wallet… Reference for the GET\n    /admin/api/v1/workspace-vaults/{workspaceVaultId}/wallets/{workspaceWalletId}\n    endpoint in the Wallet Admin API API.\nsidebar:\n  label: Workspace Wallet 상세 조회\n  badge: GET\ntitle: Workspace Wallet 상세 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-admin\" id=\"workspace-vaults-get-wallet\" />\n", "kind": "참고 문서", "path": "_reference/reference--admin--workspace-vaults--workspace-vaults-get-wallet.html", "reference": true}, {"title": "Workspace Vault 목록 조회", "text": "---\nsearch:\n  tags:\n    - Workspace Vaults\n    - GET\nseo:\n  description: >-\n    Workspace Vault 목록 조회 Reference for the GET /admin/api/v1/workspace-vaults\n    endpoint in the Wallet Admin API API.\nsidebar:\n  label: Workspace Vault 목록 조회\n  badge: GET\ntitle: Workspace Vault 목록 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-admin\" id=\"workspace-vaults-list\" />\n", "kind": "참고 문서", "path": "_reference/reference--admin--workspace-vaults--workspace-vaults-list.html", "reference": true}, {"title": "Workspace Wallet 목록 조회", "text": "---\nsearch:\n  tags:\n    - Workspace Vaults\n    - GET\nseo:\n  description: >-\n    Workspace Wallet 목록 조회 Reference for the GET\n    /admin/api/v1/workspace-vaults/{workspaceVaultId}/wallets endpoint in the\n    Wallet Admin API API.\nsidebar:\n  label: Workspace Wallet 목록 조회\n  badge: GET\ntitle: Workspace Wallet 목록 조회\ntype: openapi-operation\n---\n\u003cOperation source=\"reference-admin\" id=\"workspace-vaults-list-wallets\" />\n", "kind": "참고 문서", "path": "_reference/reference--admin--workspace-vaults--workspace-vaults-list-wallets.html", "reference": true}, {"title": "Wallet Policy Engine Internal API", "text": "---\nseo:\n  description: Wallet Policy Engine Internal API API reference.\nsidebar:\n  label: Overview\ntitle: Wallet Policy Engine Internal API\n---\n\u003cApiOverview source=\"reference-policy\" />\n\n## Admins\n\n어드민 신원·역할 디렉토리.\n\n\u003cApiTagOperations source=\"reference-policy\" tag=\"admins\" />\n\n## Approvals\n\nmaker-checker 승인. 정족수 obligation의 이행 표면이고, 요청자와 승인자는 같을 수 없다.\n\n\u003cApiTagOperations source=\"reference-policy\" tag=\"approvals\" />\n\n## Admin Auth\n\n어드민 인증. 챌린지 모델로 2FA를 수집한다.\n\n\u003cApiTagOperations source=\"reference-policy\" tag=\"admin-auth\" />\n\n## Bundle Serving\n\nOPA 사이드카가 활성 번들을 당겨 가는 표면. 자격은 서비스 크리덴셜이다.\n\n\u003cApiTagOperations source=\"reference-policy\" tag=\"bundle-serving\" />\n\n## Callback\n\n서명 인프라 콜백. 서명 이전의 마지막 관문이다.\n\n\u003cApiTagOperations source=\"reference-policy\" tag=\"callback\" />\n\n## PIP Source Kinds\n\nPIP 소스 종류 카탈로그.\n\n\u003cApiTagOperations source=\"reference-policy\" tag=\"pip-source-kinds\" />\n\n## Partner\n\n비동기 PIP 결과 제출. 아웃바운드 트리거에 대한 인증된 인바운드다.\n\n\u003cApiTagOperations source=\"reference-policy\" tag=\"partner\" />\n\n## Bootstrap\n\n초기 어드민 등재. 온보딩 런북의 첫 단계다.\n\n\u003cApiTagOperations source=\"reference-policy\" tag=\"bootstrap\" />\n\n## Policy Bundle\n\n정책 로직 번들 발행·활성화. 플랫폼 거버넌스가 소유한다.\n\n\u003cApiTagOperations source=\"reference-policy\" tag=\"policy-bundle\" />\n\n## Workspace Registration\n\n워크스페이스 등록과 매니저 관리. platform 문 전용이다.\n\n\u003cApiTagOperations source=\"reference-policy\" tag=\"workspace-registration\" />\n\n## Policy Draft\n\n룰 저작. 컴파일 검증을 지나야 발행 후보가 된다.\n\n\u003cApiTagOperations source=\"reference-policy\" tag=\"policy-draft\" />\n\n## Request\n\n정책 판단 요청 접수와 조회. 202 접수 후 비동기 평가다.\n\n\u003cApiTagOperations source=\"reference-policy\" tag=\"request\" />\n\n## Workspace Bundle\n\n워크스페이스 번들 발행·활성화. 고객사가 자기 정책을 저작한다.\n\n\u003cApiTagOperations source=\"reference-policy\" tag=\"workspace-bundle\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy.html", "reference": true}, {"title": "2FA 등록 확인", "text": "---\nsearch:\n  tags:\n    - Admin Auth\n    - POST\nseo:\n  description: >-\n    등록 2단계. 1단계가 내준 시드로 만든 코드를 대조하고,… Reference for the POST\n    /auth/enrollments/confirm endpoint in the Wallet Policy Engine Internal API\n    API.\nsidebar:\n  label: 2FA 등록 확인\n  badge: POST\ntitle: 2FA 등록 확인\ntype: openapi-operation\n---\n등록 2단계. 1단계가 내준 시드로 만든 코드를 대조하고, 맞으면 2FA를 활성으로 넘기며\n그때 토큰을 소진한다. **세션을 요구하지 않는다** — 아직 자격이 없는 사람이 부른다.\n\n틀리면 아무것도 바뀌지 않는다 — 자격증명이 살아 있고 토큰도 남아 같은 시드로 다시\n시도할 수 있다. 1단계를 지난 토큰은 남은 수명이 분 단위로 당겨지므로 그 재시도는\n사람이 화면 앞에 있는 구간 안이다.\n\n실패 응답은 로그인과 같은 봉투다 — **코드 불일치와 토큰의 부재·만료·소진을 구분하지\n않는다.** 가르면 그 차이가 곧 \"이 토큰은 살아 있다\"를 알려 준다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 JSON 형태가 아니다\n- 401 AUTHENTICATION_FAILED: 그 밖의 모든 실패. 바디 부재도 여기로 접힌다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-admin-auth-confirm\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--admin-auth--policy-admin-auth-confirm.html", "reference": true}, {"title": "2FA 자가 등록", "text": "---\nsearch:\n  tags:\n    - Admin Auth\n    - POST\nseo:\n  description: >-\n    등록 1단계. 1회용 등록 토큰으로 비밀번호를 세우고 2FA 시드를… Reference for the POST\n    /auth/enrollments endpoint in the Wallet Policy Engine Internal API API.\nsidebar:\n  label: 2FA 자가 등록\n  badge: POST\ntitle: 2FA 자가 등록\ntype: openapi-operation\n---\n등록 1단계. 1회용 등록 토큰으로 비밀번호를 세우고 2FA 시드를 **한 번** 돌려준다.\n이 호출은 토큰을 소진하지 않고, 2FA는 아직 활성이 아니다 — 활성은 `confirm`이 한다.\n\n다시 부를 수 있다. QR을 못 찍은 사람이 갇히지 않게 하는 재시도 경로이고, 그 대가로\n이전 시드와 이전 비밀번호가 폐기된다 — 마지막 1단계의 것만 산다.\n\n실패 응답은 로그인과 같은 봉투다 — 토큰의 부재·만료·소진을 구분하지 않는다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 JSON 형태가 아니다\n- 401 AUTHENTICATION_FAILED: 그 밖의 모든 실패. 바디 부재도 여기로 접힌다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-admin-auth-enroll\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--admin-auth--policy-admin-auth-enroll.html", "reference": true}, {"title": "어드민 로그인", "text": "---\nsearch:\n  tags:\n    - Admin Auth\n    - POST\nseo:\n  description: >-\n    로그인. 성공하면 2FA 챌린지를 반환한다. Reference for the POST /auth/login endpoint in the\n    Wallet Policy Engine Internal API API.\nsidebar:\n  label: 어드민 로그인\n  badge: POST\ntitle: 어드민 로그인\ntype: openapi-operation\n---\n로그인. 성공하면 2FA 챌린지를 반환한다.\n\n실패 응답은 균일하다 — 자격 불일치·계정 부재·잠금을 구분하지 않아 계정 존재를 노출하지 않는다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 JSON 형태가 아니다\n- 401 AUTHENTICATION_FAILED: 그 밖의 모든 실패. 바디 부재도 여기로 접힌다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-admin-auth-login\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--admin-auth--policy-admin-auth-login.html", "reference": true}, {"title": "어드민 로그아웃", "text": "---\nsearch:\n  tags:\n    - Admin Auth\n    - POST\nseo:\n  description: >-\n    로그아웃. 이 브라우저의 세션 쿠키를 지운다. Reference for the POST /auth/logout endpoint in\n    the Wallet Policy Engine Internal API API.\nsidebar:\n  label: 어드민 로그아웃\n  badge: POST\ntitle: 어드민 로그아웃\ntype: openapi-operation\n---\n로그아웃. 이 브라우저의 세션 쿠키를 지운다.\n\n**자격을 요구하지 않는다** — 쿠키를 지우는 일은 무해하고 멱등이라 만료된 세션을 든 화면도\n부를 수 있어야 한다. 요구하면 그 화면이 쿠키를 지우지 못한 채 남는다.\n\n**서버측 폐기가 아니다** — 서버는 세션을 저장하지 않으므로(무상태 HMAC) 본문으로 옮겨 적은\n크리덴셜은 만료 시각까지 산다.\n\n\u003cOperation source=\"reference-policy\" id=\"policy-admin-auth-logout\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--admin-auth--policy-admin-auth-logout.html", "reference": true}, {"title": "세션 신원 조회", "text": "---\nsearch:\n  tags:\n    - Admin Auth\n    - GET\nseo:\n  description: >-\n    세션이 증명하는 신원 조회. 자격은 Bearer 헤더 또는 세션… Reference for the GET /auth/session\n    endpoint in the Wallet Policy Engine Internal API API.\nsidebar:\n  label: 세션 신원 조회\n  badge: GET\ntitle: 세션 신원 조회\ntype: openapi-operation\n---\n세션이 증명하는 신원 조회. 자격은 Bearer 헤더 또는 세션 쿠키다(`PolicyAdminSessionAuth`).\n만료·변조 토큰은 401이고 봉투는 위 둘과 같다. 콘솔은 기동 시 이것으로 쿠키 세션을 되살린다.\n\n인가 판정의 입력을 콘솔이 직접 볼 수 있게 하는 자리다 — 어드민 액션의 인가는\n여기 실린 grants로 판정된다.\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 세션이 확정되지 않았다. 계정의 소속이 이 문과 어긋난 경우도 여기다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-admin-auth-session\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--admin-auth--policy-admin-auth-session.html", "reference": true}, {"title": "2FA 검증", "text": "---\nsearch:\n  tags:\n    - Admin Auth\n    - POST\nseo:\n  description: >-\n    성공하면 세션 크리덴셜을 본문과 Set-Cookie로 함께… Reference for the POST /auth/2fa endpoint\n    in the Wallet Policy Engine Internal API API.\nsidebar:\n  label: 2FA 검증\n  badge: POST\ntitle: 2FA 검증\ntype: openapi-operation\n---\n성공하면 세션 크리덴셜을 본문과 `Set-Cookie`로 함께 낸다(`PolicyAdminSessionResponse`).\n실패 응답은 로그인과 같은 봉투다(§8 균일 오류).\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 JSON 형태가 아니다\n- 401 AUTHENTICATION_FAILED: 그 밖의 모든 실패. 바디 부재도 여기로 접힌다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-admin-auth-verify2-fa\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--admin-auth--policy-admin-auth-verify2-fa.html", "reference": true}, {"title": "어드민 초대", "text": "---\nsearch:\n  tags:\n    - Admins\n    - POST\nseo:\n  description: >-\n    계정과 역할 부여를 만들고 1회용 등록 토큰을 낸다. Reference for the POST /admins endpoint in the\n    Wallet Policy Engine Internal API API.\nsidebar:\n  label: 어드민 초대\n  badge: POST\ntitle: 어드민 초대\ntype: openapi-operation\n---\n계정과 역할 부여를 만들고 1회용 등록 토큰을 낸다.\n\n인가는 `policy_admin_manager` 부여이고, 새 부여의 스코프는 **그 부여의 스코프**다.\n요청자가 그 역할을 여러 스코프에서 가지면 거부한다 — 스코프를 요청이 고르게 하면\n격리 경계가 흐려진다.\n\n부여할 역할은 요청이 고르되 요청자가 같은 스코프에서 이미 가진 역할이어야 한다.\n닫힌 집합이라 오타는 거부로 떨어지고 권한 상향이 성립하지 않는다.\n\n아직 등록을 마치지 않은 계정에 다시 호출하면 새 토큰이 나고 이전 토큰은 통하지\n않는다. **이미 2팩터를 등록한 계정이면 거부한다** — 허용하면 활동 중인 어드민의\n자격을 초기화해 그 사람 행세를 할 수 있다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 JSON 형태가 아니거나 필수 필드가 없다\n- 401 AUTHENTICATION_FAILED: 세션이 확정되지 않았다\n- 403 ADMIN_DIRECTORY_FORBIDDEN: 초대 권한이 없다\n- 409 ADMIN_LOGIN_ID_TAKEN: 등록을 마친 계정이 그 loginId 를 쓴다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-admin-directory-create\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--admins--policy-admin-directory-create.html", "reference": true}, {"title": "어드민 목록 조회", "text": "---\nsearch:\n  tags:\n    - Admins\n    - GET\nseo:\n  description: >-\n    요청자의 초대 권한 부여 스코프에 있는 어드민 목록. Reference for the GET /admins endpoint in the\n    Wallet Policy Engine Internal API API.\nsidebar:\n  label: 어드민 목록 조회\n  badge: GET\ntitle: 어드민 목록 조회\ntype: openapi-operation\n---\n요청자의 초대 권한 부여 스코프에 있는 어드민 목록.\n\n**스코프 파라미터가 없는 것이 계약이다** — 세션의 부여가 그것을 정한다. 초대와 달리\n여러 스코프를 가진 요청자를 거부하지 않는다: 초대는 새 부여를 어디에 붙일지 하나로\n정해야 해서 거부하는 것이고, 읽기에는 그 선택이 없어 가진 스코프를 합친다.\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 세션이 확정되지 않았다\n- 403 ADMIN_DIRECTORY_FORBIDDEN: 목록 권한이 없다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-admin-directory-list\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--admins--policy-admin-directory-list.html", "reference": true}, {"title": "승인 대기 목록 조회", "text": "---\nsearch:\n  tags:\n    - Approvals\n    - GET\nseo:\n  description: >-\n    승인 가능 role 기준 대기 목록. Reference for the GET /approvals endpoint in the Wallet\n    Policy Engine Internal API API.\nsidebar:\n  label: 승인 대기 목록 조회\n  badge: GET\ntitle: 승인 대기 목록 조회\ntype: openapi-operation\n---\n승인 가능 role 기준 대기 목록.\n\n**양쪽 문에서 열린다** — `/approvals`와 `/platform/approvals`가 같은 오퍼레이션이고\n계정의 소속이 어느 경로를 지날 수 있는지 정한다(policy-api.tsp 문 표).\n\n**빈 페이지가 끝을 뜻하지 않는다.** 자격 판정이 SQL 술어로 좁혀지지 않아 스캔이 상한만\n지고 필터가 뒤에서 도므로, 자격 밖 항목만 담긴 페이지는 비어 나오면서 커서가 다음을\n가리킨다. 끝 신호는 `cursor`가 null인 것 하나다.\n\nErrors:\n- 400 INVALID_REQUEST: 커서가 형태 밖이다 (limit은 서버 상한으로 접힌다)\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-approval-get-pending\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--approvals--policy-approval-get-pending.html", "reference": true}, {"title": "승인 표 제출", "text": "---\nsearch:\n  tags:\n    - Approvals\n    - POST\nseo:\n  description: >-\n    표 제출. 건별 2FA 스텝업 필수. Reference for the POST\n    /request/{policyRequestId}/approvals endpoint in the Wallet Policy Engine\n    Internal API API.\nsidebar:\n  label: 승인 표 제출\n  badge: POST\ntitle: 승인 표 제출\ntype: openapi-operation\n---\n표 제출. 건별 2FA 스텝업 필수.\n\n인증: 어드민 세션(§8) 위에 건별 2FA 스텝업이다 — BearerAuth 표기는 세션 크리덴셜의\n자리표시자이고, 토큰 포맷은 어드민 인증 API와 함께 후속 확정이다.\n정족수 충족은 이행 증거의 완성일 뿐이고, 전체 표 자격 재검증 + stale 재조회 +\n전체 재평가(design-draft §9.3)를 통과해야 APPROVED다.\n\n**접두 사본이 없다** — 이 경로는 워크스페이스 문에만 있고 `/platform` 아래에 같은 표면이\n없다(policy-api.tsp 문 표).\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 없거나 verdict·challengeId·challengeResponse가 형태를 벗어났다\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 401 APPROVAL_CHALLENGE_INVALID: 건별 2FA 스텝업에 실패했다\n- 403 APPROVAL_NOT_ELIGIBLE: 이 요청의 승인 자격이 없다\n- 403 SELF_APPROVAL_FORBIDDEN: 요청자 본인이다\n- 404 APPROVAL_TARGET_UNKNOWN: 표를 받을 수 있는 요청이 아니다\n- 409 APPROVAL_ALREADY_CAST: 이미 표를 던졌다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-approval-vote-vote\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--approvals--policy-approval-vote-vote.html", "reference": true}, {"title": "초기 어드민 계정 생성", "text": "---\nsearch:\n  tags:\n    - Bootstrap\n    - POST\nseo:\n  description: >-\n    어드민 계정과 역할을 만들고 1회용 등록 토큰을 낸다. Reference for the POST\n    /platform/bootstrap/admins endpoint in the Wallet Policy Engine Internal API\n    API.\nsidebar:\n  label: 초기 어드민 계정 생성\n  badge: POST\ntitle: 초기 어드민 계정 생성\ntype: openapi-operation\n---\n어드민 계정과 역할을 만들고 1회용 등록 토큰을 낸다.\n\n아직 등록을 마치지 않은 계정에 다시 호출하면 새 토큰이 나고 이전 토큰은 통하지\n않는다 — 만료된 토큰 하나가 환경 전체를 굳히지 않게 하는 자리다.\n\n**이미 2팩터를 등록한 계정이면 거부한다.** 허용하면 root 가 활동 중인 어드민의\n자격을 초기화해 그 사람 행세를 할 수 있다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 없거나 loginId·displayName 이 없거나 형태를 벗어났다\n- 401 AUTHENTICATION_FAILED: root 자격이 확정되지 않았다\n- 403 BOOTSTRAP_CLOSED: 부트스트랩이 이미 끝났다\n- 409 ADMIN_LOGIN_ID_TAKEN: 등록을 마친 계정이 그 loginId 를 쓴다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-bootstrap-create-admin\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--bootstrap--policy-bootstrap-create-admin.html", "reference": true}, {"title": "활성 번들 조회 (서빙)", "text": "---\nsearch:\n  tags:\n    - Bundle Serving\n    - GET\nseo:\n  description: >-\n    활성 revision 조회. PDP 에 무엇이 활성인지 보는 운영… Reference for the GET\n    /bundles/{bundleName}/active endpoint in the Wallet Policy Engine Internal\n    API API.\nsidebar:\n  label: 활성 번들 조회 (서빙)\n  badge: GET\ntitle: 활성 번들 조회 (서빙)\ntype: openapi-operation\n---\n활성 revision 조회. PDP 에 무엇이 활성인지 보는 운영 관측 지점이다.\n\n레플리카들이 서로 다른 값을 주장하는 것이 결함이고, 사이드카 폴링 시차로 OPA 가 이보다\n뒤의 revision 을 쓰는 것은 정상이다.\n\nErrors:\n- 401 UNAUTHENTICATED: 서비스 크리덴셜이 신원을 확정하지 않는다\n- 403 FORBIDDEN_ROLE: 그 크리덴셜의 역할이 이 표면을 부를 수 없다\n- 503 no_active_bundle: 활성 포인터가 없다. **봉투가 다르다**\n\n\u003cOperation source=\"reference-policy\" id=\"policy-bundle-serving-active\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--bundle-serving--policy-bundle-serving-active.html", "reference": true}, {"title": "활성 번들 tarball 내려받기", "text": "---\nsearch:\n  tags:\n    - Bundle Serving\n    - GET\nseo:\n  description: >-\n    OPA 가 폴링하는 경로. 사이드카 설정의… Reference for the GET /bundles/{bundleName}.tar.gz\n    endpoint in the Wallet Policy Engine Internal API API.\nsidebar:\n  label: 활성 번들 tarball 내려받기\n  badge: GET\ntitle: 활성 번들 tarball 내려받기\ntype: openapi-operation\n---\nOPA 가 폴링하는 경로. 사이드카 설정의 `bundles.\u003cname>.resource` 와 짝이다.\n\n**ETag 가 내용 해시다.** 같은 내용이 같은 값을 갖고 다른 내용이 같은 값을 가질 수 없어\n304 가 \"내용이 바뀌지 않았다\"는 뜻이 된다. 없으면 폴링마다 tarball 전체를 다시 내려보내고\n사이드카가 매번 재활성화한다.\n\n서버는 ETag 를 먼저 정하고 바이트는 필요할 때만 읽는다 — 304 로 끝나는 폴링에서도 번들\n바이트를 끌어올리면 그것이 이 엔드포인트의 정상 부하가 된다.\n\nErrors:\n- 401 UNAUTHENTICATED: 서비스 크리덴셜이 신원을 확정하지 않는다\n- 403 FORBIDDEN_ROLE: 그 크리덴셜의 역할이 이 표면을 부를 수 없다\n- 503 no_active_bundle: 활성 포인터가 없다. **봉투가 다르다**\n\n\u003cOperation source=\"reference-policy\" id=\"policy-bundle-serving-download\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--bundle-serving--policy-bundle-serving-download.html", "reference": true}, {"title": "Co-Signer pre-signing 콜백", "text": "---\nsearch:\n  tags:\n    - Callback\n    - POST\nseo:\n  description: >-\n    PEP가 종단한다 — JWT 양방향 검증·서명 대상… Reference for the POST\n    /callback/fireblocks-cosigner endpoint in the Wallet Policy Engine Internal\n    API API.\nsidebar:\n  label: Co-Signer pre-signing 콜백\n  badge: POST\ntitle: Co-Signer pre-signing 콜백\ntype: openapi-operation\n---\nPEP가 종단한다 — JWT 양방향 검증·서명 대상 추출·**산출물에서 signingAuthorizationId\n추출**(owning service가 제출 시 externalTxId로 지정 — D-66. 조회 힌트이고 방어는 전체\ncanonical 대조 + CAS)·응답 서명. 승인 저장소 대조와 원자적 단회성 소비는\nOrchestrator가 소유한다.\n\n콜백이 거부하면 Co-Signer는 서명하지 않는다 — 이것이 최종 방어선이다.\n\n미디어 타입은 요청·응답 모두 `application/jose`(JWT compact 직렬화, RFC 7515 §9.2.1)다\n— provider 실물 Content-Type과의 대조는 실물 전환 게이트 항목이다(A8 확정 ⑥).\n\n\u003cOperation source=\"reference-policy\" id=\"policy-callback-handle\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--callback--policy-callback-handle.html", "reference": true}, {"title": "PIP 결과·이행 증거 제출", "text": "---\nsearch:\n  tags:\n    - Partner\n    - POST\nseo:\n  description: >-\n    PIP 결과와 obligation 이행 증거를 같은… Reference for the POST\n    /pip/{policyDataRequestId}/result endpoint in the Wallet Policy Engine\n    Internal API API.\nsidebar:\n  label: PIP 결과·이행 증거 제출\n  badge: POST\ntitle: PIP 결과·이행 증거 제출\ntype: openapi-operation\n---\nPIP 결과와 obligation 이행 증거를 같은 표면·인증·도착 규칙으로 제출한다.\n\n인증은 전송 계층이 아니라 본문이다 — JWS 서명키 → 등록 partnerId(파트너 PIP 계약 §4).\n그래서 이 표면은 NoAuth이고, bearer류 크리덴셜을 요구하지 않는다.\n\npolicyDataRequestId는 single-use 상관 키다 — Orchestrator가 미결 수집을 조회해\ncanonical intent 바인딩을 검증하고 소비한 뒤 신선도를 재검사하고 EVALUATING에 재진입한다.\n\nattach_travel_rule_payload는 여기 제출 없이 travel_rule 소스 재수집으로 이행을 확인한다.\n\n## 요청 형태\n바디는 JWS compact 직렬화 하나이고 미디어 타입은 `application/jose`로 고정한다(콜백\n선례). 서명 페이로드는 파트너 PIP 계약 §5의 인바운드 스키마\n`{policyDataRequestId, source, snapshot{...}, evaluatedAt}`이고, **payload의\npolicyDataRequestId는 경로 변수와 같아야 한다** — 서명이 상관 키를 덮지 않으면 한\n수집에 대한 유효 제출을 다른 수집의 경로로 재생할 수 있다.\n\n## 실패 응답은 균일하다\n서명 검증 이전·이후를 가리지 않고 인증 실패는 전부 **401 + 같은 바디**다\n(`UNAUTHENTICATED`). 사유(미등록 kid·서명 불일치·alg 변조)를 갈라 답하면 등록 키의\n형태를 탐색할 수 있다. 상관 키의 **존재 여부도 응답을 가르지 않는다** — 존재 선조회를\n서명 검증 앞에 두지 않으므로 미지 id와 유효 id가 같은 경로·같은 비용을 지난다.\n인증을 지난 뒤의 도착 판정(§4.3의 여덟 갈래)은 전부 200 `REJECTED` 한 값으로 접힌다.\n\nErrors:\n- 401 UNAUTHENTICATED: JWS 인증 실패. 미등록 kid·서명 불일치·alg 변조를 가르지 않는다\n- 415 UNSUPPORTED_MEDIA_TYPE: 바디가 `application/jose`가 아니다 (프레임워크 폴백)\n\n\u003cOperation source=\"reference-policy\" id=\"policy-partner-submission-submit\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--partner--policy-partner-submission-submit.html", "reference": true}, {"title": "PIP 소스 종류 목록 조회", "text": "---\nsearch:\n  tags:\n    - PIP Source Kinds\n    - GET\nseo:\n  description: >-\n    소스 종류 카탈로그 조회. read-only다 — 이 표면에 쓰기… Reference for the GET\n    /pip-source-kinds endpoint in the Wallet Policy Engine Internal API API.\nsidebar:\n  label: PIP 소스 종류 목록 조회\n  badge: GET\ntitle: PIP 소스 종류 목록 조회\ntype: openapi-operation\n---\n소스 종류 카탈로그 조회. **read-only다** — 이 표면에 쓰기 오퍼레이션이 없는 것이\n\"종류는 코드, 인스턴스는 번들\"의 표면 쪽 표현이다.\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 없거나 유효하지 않다\n- 403 DRAFT_FORBIDDEN: 발행 권한 role의 부여가 하나도 없다 (스코프는 가리지 않는다)\n\n\u003cOperation source=\"reference-policy\" id=\"pip-source-kind-list\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--pip-source-kinds--pip-source-kind-list.html", "reference": true}, {"title": "번들 활성화", "text": "---\nsearch:\n  tags:\n    - Policy Bundle\n    - POST\nseo:\n  description: >-\n    활성 포인터 전이. 발행된 번들만 대상이 된다. Reference for the POST\n    /platform/policy-bundles/activations endpoint in the Wallet Policy Engine\n    Internal API API.\nsidebar:\n  label: 번들 활성화\n  badge: POST\ntitle: 번들 활성화\ntype: openapi-operation\n---\n활성 포인터 전이. 발행된 번들만 대상이 된다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 없거나 bundleName·contentHash가 형태를 벗어났다\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 PUBLICATION_FORBIDDEN: 발행 권한 role의 platform 부여가 없다\n- 404 PUBLICATION_BUNDLE_UNKNOWN: 그 내용 해시로 발행된 번들이 없다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-bundle-activation-activate\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-bundle--policy-bundle-activation-activate.html", "reference": true}, {"title": "활성 번들 조회", "text": "---\nsearch:\n  tags:\n    - Policy Bundle\n    - GET\nseo:\n  description: >-\n    지금 활성인 번들. 승인 화면의… Reference for the GET\n    /platform/policy-bundles/activations/{bundleName} endpoint in the Wallet\n    Policy Engine Internal API API.\nsidebar:\n  label: 활성 번들 조회\n  badge: GET\ntitle: 활성 번들 조회\ntype: openapi-operation\n---\n지금 활성인 번들. 승인 화면의 diff 기준선이다 — 서빙 표면(/bundles/&#123;name&#125;/active)이\n같은 사실을 주지만 그쪽 자격은 서비스 크리덴셜이라 어드민 세션으로는 닿지 않는다.\n\n최초 발행 이전에는 404 PUBLICATION_ACTIVE_ABSENT다. 빈 봉투를 200으로 주면\n\"기준선이 없다\"와 \"기준선을 못 읽었다\"가 같은 자리에 섞인다.\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 PUBLICATION_FORBIDDEN: 발행 권한 role의 platform 부여가 없다\n- 404 PUBLICATION_ACTIVE_ABSENT: 그 이름으로 활성인 번들이 없다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-bundle-activation-view\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-bundle--policy-bundle-activation-view.html", "reference": true}, {"title": "발행 승인 목록", "text": "---\nsearch:\n  tags:\n    - Policy Bundle\n    - GET\nseo:\n  description: >-\n    checker가 대상을 찾는 자리. 집계·챌린지는 상세가 준다. Reference for the GET\n    /policy-bundles/approvals endpoint in the Wallet Policy Engine Internal API\n    API.\nsidebar:\n  label: 발행 승인 목록\n  badge: GET\ntitle: 발행 승인 목록\ntype: openapi-operation\n---\nchecker가 대상을 찾는 자리. 집계·챌린지는 상세가 준다.\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 PUBLICATION_FORBIDDEN: 발행 권한 role의 부여가 없다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-bundle-approval-list\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-bundle--policy-bundle-approval-list.html", "reference": true}, {"title": "발행 승인 레코드 개설", "text": "---\nsearch:\n  tags:\n    - Policy Bundle\n    - POST\nseo:\n  description: >-\n    발행 승인 레코드 개설(maker). Reference for the POST /policy-bundles/approvals\n    endpoint in the Wallet Policy Engine Internal API API.\nsidebar:\n  label: 발행 승인 레코드 개설\n  badge: POST\ntitle: 발행 승인 레코드 개설\ntype: openapi-operation\n---\n발행 승인 레코드 개설(maker).\n\n인증: 어드민 세션. 인가: 발행 권한 role의 platform 부여.\n\n검증을 통과하지 않은 revision은 422 DRAFT_REVISION_NOT_VALIDATED다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 없거나 bundleName·draftRevisionId가 비었다\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 PUBLICATION_FORBIDDEN: 발행 권한 role의 platform 부여가 없다\n- 404 DRAFT_REVISION_UNKNOWN: 그런 revision이 없다\n- 409 DRAFT_DISCARDED: 폐기된 draft의 칸이다\n- 422 DRAFT_REVISION_NOT_VALIDATED: 검증을 통과한 revision이 아니다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-bundle-approval-open\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-bundle--policy-bundle-approval-open.html", "reference": true}, {"title": "발행 승인 레코드 상세 조회", "text": "---\nsearch:\n  tags:\n    - Policy Bundle\n    - GET\nseo:\n  description: >-\n    승인 레코드 상세. 집계와… Reference for the GET\n    /policy-bundles/approvals/{publicationApprovalId} endpoint in the Wallet\n    Policy Engine Internal API API.\nsidebar:\n  label: 발행 승인 레코드 상세 조회\n  badge: GET\ntitle: 발행 승인 레코드 상세 조회\ntype: openapi-operation\n---\n승인 레코드 상세. **집계와 챌린지가 여기서만 나온다** — 목록은 레코드마다 왕복이 생기지\n않게 그 둘을 싣지 않으므로, checker가 표를 던지기 전에 보는 값이 이 표면이다.\n\n자격 밖 레코드는 부재와 같은 답을 받는다 — 갈라 답하면 그 id의 실재가 드러난다.\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 PUBLICATION_FORBIDDEN: 발행 권한 role의 부여가 없다\n- 404 PUBLICATION_APPROVAL_UNKNOWN: 그런 승인 레코드가 없다 (자격 밖 참조 포함)\n\n\u003cOperation source=\"reference-policy\" id=\"policy-bundle-approval-view-view\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-bundle--policy-bundle-approval-view-view.html", "reference": true}, {"title": "발행 승인 표 제출", "text": "---\nsearch:\n  tags:\n    - Policy Bundle\n    - POST\nseo:\n  description: >-\n    발행 승인 표 제출(checker… Reference for the POST\n    /policy-bundles/approvals/{publicationApprovalId}/votes endpoint in the\n    Wallet Policy Engine Internal API API.\nsidebar:\n  label: 발행 승인 표 제출\n  badge: POST\ntitle: 발행 승인 표 제출\ntype: openapi-operation\n---\n발행 승인 표 제출(checker). 건별 2FA 스텝업 필수이고 maker 본인은 던질 수 없다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 없거나 verdict·challengeId·challengeResponse가 형태를 벗어났다\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 401 PUBLICATION_CHALLENGE_INVALID: 건별 2FA 스텝업에 실패했다\n- 403 SELF_APPROVAL_FORBIDDEN: maker 본인이다\n- 404 PUBLICATION_APPROVAL_UNKNOWN: 표를 받을 수 있는 승인 레코드가 아니다 (자격 밖 참조 포함)\n- 409 PUBLICATION_VOTE_ALREADY_CAST: 이미 표를 던졌다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-bundle-approval-vote-vote\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-bundle--policy-bundle-approval-vote-vote.html", "reference": true}, {"title": "번들 발행", "text": "---\nsearch:\n  tags:\n    - Policy Bundle\n    - POST\nseo:\n  description: >-\n    번들 발행(스테이징 + 검증). 활성화하지 않는다. Reference for the POST\n    /policy-bundles/publications endpoint in the Wallet Policy Engine Internal\n    API API.\nsidebar:\n  label: 번들 발행\n  badge: POST\ntitle: 번들 발행\ntype: openapi-operation\n---\n번들 발행(스테이징 + 검증). **활성화하지 않는다.**\n\n승인 레코드 실재·정족수 충족·대상 바이트 결속을 전부 발행 이전에 확인한다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 없거나 필수 필드가 비었거나 approvalRef가 레코드 형태가 아니다\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 PUBLICATION_FORBIDDEN: 발행 권한 role의 platform 부여가 없다\n- 404 PUBLICATION_APPROVAL_UNKNOWN: 발행 승인 레코드가 없다 (자격 밖 참조 포함)\n- 404 DRAFT_REVISION_UNKNOWN: 그런 revision이 없다\n- 409 PUBLICATION_QUORUM_NOT_MET: 정족수가 채워지지 않았다\n- 409 PUBLICATION_PAYLOAD_NOT_APPROVED: 승인된 대상과 다르다\n- 409 PUBLICATION_APPROVAL_ALREADY_USED: 이미 발행에 쓰인 승인 참조다\n- 409 DRAFT_DISCARDED: 폐기된 draft다\n- 422 DRAFT_REVISION_NOT_VALIDATED: 검증을 통과한 revision이 아니다\n- 422 PUBLICATION_COMPILE_CHECK_FAILED: 스냅샷이 컴파일 검사를 통과하지 못했다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-bundle-publication-publish\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-bundle--policy-bundle-publication-publish.html", "reference": true}, {"title": "편집기 base 조회", "text": "---\nsearch:\n  tags:\n    - Policy Draft\n    - GET\nseo:\n  description: >-\n    편집기 base 조회. 활성 번들이 없거나 git… Reference for the GET\n    /policy-drafts/baseline/{bundleName} endpoint in the Wallet Policy Engine\n    Internal API API.\nsidebar:\n  label: 편집기 base 조회\n  badge: GET\ntitle: 편집기 base 조회\ntype: openapi-operation\n---\n편집기 base 조회. **활성 번들이 없거나 git 채널 번들이어도 200이다** — 그 사실은\n`hasBaseline`·`absentReason`이 말하고 편집기는 빈 스캐폴드로 이어 간다.\n\n404로 답하지 않는 것이 활성 번들 조회(`/policy-bundles/activations/{bundleName}`·\n`/workspace-bundles/activation`)와 갈리는 지점이다: 저쪽은 \"지금 무엇이 활성인가\"를\n묻고 부재가 곧 답의 부재지만, 이쪽은 \"무엇을 base로 편집을 시작하는가\"를 묻고 부재도\n답이다.\n\n**어느 스코프의 base를 주는지는 세션의 발행 부여가 정한다** — 요청은 그것을 나르지\n않는다. 부여가 없거나 여럿이면 거부하고 두 경우를 응답에서 가르지 않는다. platform과\nworkspace 발행 자격을 함께 가진 어드민이 여기서 거부되는 것이 그 계약 그대로다:\n예외를 두면 어느 기준선을 받는지가 부여 조합에 따라 조용히 갈린다.\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 없거나 유효하지 않다\n- 403 DRAFT_FORBIDDEN: 발행 권한 role의 부여가 없거나 여럿이다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-draft-baseline-view\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-draft--policy-draft-baseline-view.html", "reference": true}, {"title": "draft 생성", "text": "---\nsearch:\n  tags:\n    - Policy Draft\n    - POST\nseo:\n  description: >-\n    draft와 첫 칸을 함께 만든다. Reference for the POST /policy-drafts endpoint in the\n    Wallet Policy Engine Internal API API.\nsidebar:\n  label: draft 생성\n  badge: POST\ntitle: draft 생성\ntype: openapi-operation\n---\ndraft와 첫 칸을 함께 만든다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 JSON 형태가 아니거나 name·content가 없다\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 DRAFT_FORBIDDEN: 발행 권한 role의 부여가 없거나 여럿이다\n- 409 DRAFT_NAME_DUPLICATE: 같은 이름의 활성 draft가 있다\n- 413 DRAFT_CONTENT_TOO_LARGE: 본문이 256 KiB를 넘는다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-draft-create\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-draft--policy-draft-create.html", "reference": true}, {"title": "draft 폐기", "text": "---\nsearch:\n  tags:\n    - Policy Draft\n    - POST\nseo:\n  description: >-\n    head를 폐기로 전이한다. revision 기록은… Reference for the POST\n    /policy-drafts/{draftId}/discard endpoint in the Wallet Policy Engine\n    Internal API API.\nsidebar:\n  label: draft 폐기\n  badge: POST\ntitle: draft 폐기\ntype: openapi-operation\n---\nhead를 폐기로 전이한다. revision 기록은 불변으로 남는다.\n\n**폐기는 그 draft의 열린 발행 승인을 무효화한다.** 승인 행을 고쳐서가 아니라(승인\n기록은 불변이다) 발행 이전 관문이 revision의 draft 상태를 다시 읽기 때문이다 —\n기승인이어도 발행은 409 DRAFT_DISCARDED로 거부된다.\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 DRAFT_FORBIDDEN: 발행 권한 role의 부여가 없다\n- 404 DRAFT_UNKNOWN: 그런 draft가 없다 (자격 밖 draft 포함)\n- 409 DRAFT_DISCARDED: 이미 폐기된 draft다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-draft-discard-discard\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-draft--policy-draft-discard-discard.html", "reference": true}, {"title": "draft 목록", "text": "---\nsearch:\n  tags:\n    - Policy Draft\n    - GET\nseo:\n  description: >-\n    콘솔 목록. 폐기된 것도 준다 — 목록이 활성/폐기를 구분해 보여야… Reference for the GET /policy-drafts\n    endpoint in the Wallet Policy Engine Internal API API.\nsidebar:\n  label: draft 목록\n  badge: GET\ntitle: draft 목록\ntype: openapi-operation\n---\n콘솔 목록. **폐기된 것도 준다** — 목록이 활성/폐기를 구분해 보여야 한다.\n목록의 술어는 세션이 확정한 스코프다.\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 DRAFT_FORBIDDEN: 발행 권한 role의 부여가 없다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-draft-list\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-draft--policy-draft-list.html", "reference": true}, {"title": "revision 추가", "text": "---\nsearch:\n  tags:\n    - Policy Draft\n    - POST\nseo:\n  description: >-\n    새 칸을 붙이고 head를 그리로 옮긴다. 새… Reference for the POST\n    /policy-drafts/{draftId}/revisions endpoint in the Wallet Policy Engine\n    Internal API API.\nsidebar:\n  label: revision 추가\n  badge: POST\ntitle: revision 추가\ntype: openapi-operation\n---\n새 칸을 붙이고 head를 그리로 옮긴다. **새 칸에는 검증 기록이 없다** — 편집이 검증을\n무효화하는 것이 아니라, 결과가 애초에 칸마다 붙기 때문이다.\n\nhead가 그 사이 옮겨졌거나 draft가 폐기됐으면 409다.\n\nErrors:\n- 400 INVALID_REQUEST: 바디가 JSON 형태가 아니거나 content가 없다\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 DRAFT_FORBIDDEN: 발행 권한 role의 부여가 없다\n- 404 DRAFT_UNKNOWN: 그런 draft가 없다 (자격 밖 draft 포함)\n- 409 DRAFT_DISCARDED: 폐기된 draft다\n- 409 DRAFT_HEAD_CONFLICT: head가 그 사이 옮겨졌다\n- 413 DRAFT_CONTENT_TOO_LARGE: 본문이 256 KiB를 넘는다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-draft-revision-append\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-draft--policy-draft-revision-append.html", "reference": true}, {"title": "revision 조회 (주소)", "text": "---\nsearch:\n  tags:\n    - Policy Draft\n    - GET\nseo:\n  description: >-\n    주소만으로 읽는 칸. draft를 지나지 않는… Reference for the GET\n    /policy-drafts/revisions/{revisionId} endpoint in the Wallet Policy Engine\n    Internal API API.\nsidebar:\n  label: revision 조회 (주소)\n  badge: GET\ntitle: revision 조회 (주소)\ntype: openapi-operation\n---\n주소만으로 읽는 칸. **draft를 지나지 않는 것이 의도다** — 발행 승인이 든 것은 revision\n주소뿐이라(어느 draft의 칸인지는 담지 않는다), 승인 화면이 diff 기준선을 찾으려면 그\n주소에서 콘텐츠로 갈 수 있어야 한다.\n\ndraft 종속 경로(/policy-drafts/&#123;draftId&#125;/revisions/&#123;revisionId&#125;)는 저작 화면의 포함\n관계 검사로 남는다 — 거기서는 URL의 두 id가 서로 맞는지가 뜻을 갖는다.\n\ndraft를 지나지 않아도 **스코프 판정은 지난다** — 없으면 revision id 하나로 남의\n워크스페이스가 읽힌다. 자격 밖 revision은 부재와 같은 답을 받는다.\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 DRAFT_FORBIDDEN: 발행 권한 role의 부여가 없다\n- 404 DRAFT_REVISION_UNKNOWN: 그런 revision이 없다 (자격 밖 revision 포함)\n\n\u003cOperation source=\"reference-policy\" id=\"policy-draft-revision-by-address-view\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-draft--policy-draft-revision-by-address-view.html", "reference": true}, {"title": "revision 조회", "text": "---\nsearch:\n  tags:\n    - Policy Draft\n    - GET\nseo:\n  description: >-\n    칸 하나. 여기서만 content가 실린다. Reference for the GET\n    /policy-drafts/{draftId}/revisions/{revisionId} endpoint in the Wallet\n    Policy Engine Internal API API.\nsidebar:\n  label: revision 조회\n  badge: GET\ntitle: revision 조회\ntype: openapi-operation\n---\n칸 하나. 여기서만 content가 실린다.\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 DRAFT_FORBIDDEN: 발행 권한 role의 부여가 없다\n- 404 DRAFT_UNKNOWN: 그런 draft가 없다 (자격 밖 draft 포함)\n- 404 DRAFT_REVISION_UNKNOWN: 그런 revision이 없거나 이 draft의 칸이 아니다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-draft-revision-view\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-draft--policy-draft-revision-view.html", "reference": true}, {"title": "revision 검증 실행", "text": "---\nsearch:\n  tags:\n    - Policy Draft\n    - POST\nseo:\n  description: >-\n    컴파일 검사 전종 +… Reference for the POST\n    /policy-drafts/{draftId}/revisions/{revisionId}/validation endpoint in the\n    Wallet Policy Engine Internal API API.\nsidebar:\n  label: revision 검증 실행\n  badge: POST\ntitle: revision 검증 실행\ntype: openapi-operation\n---\n컴파일 검사 전종 + 벡터 채점을 **동기로** 돌린다. 결과는 이 revision에 결속되고,\n이미 있으면 다시 돌리지 않는다 — revision이 불변이라 답이 같다.\n\n**검증 실패는 4xx가 아니다.** 검증 실행은 성공했고 판정이 FAILED인 것이므로 200에\noutcome을 싣는다. 4xx로 답하면 \"요청이 잘못됐다\"와 \"정책이 검사를 통과하지 못했다\"가\n같은 자리에 섞인다.\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 DRAFT_FORBIDDEN: 발행 권한 role의 부여가 없다\n- 404 DRAFT_UNKNOWN: 그런 draft가 없다 (자격 밖 draft 포함)\n- 404 DRAFT_REVISION_UNKNOWN: 그런 revision이 없거나 이 draft의 칸이 아니다\n- 409 DRAFT_DISCARDED: 폐기된 draft다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-draft-validation-run\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-draft--policy-draft-validation-run.html", "reference": true}, {"title": "draft 조회", "text": "---\nsearch:\n  tags:\n    - Policy Draft\n    - GET\nseo:\n  description: >-\n    head와 체인. 각 칸의 검증 결과가 함께 온다. Reference for the GET /policy-drafts/{draftId}\n    endpoint in the Wallet Policy Engine Internal API API.\nsidebar:\n  label: draft 조회\n  badge: GET\ntitle: draft 조회\ntype: openapi-operation\n---\nhead와 체인. 각 칸의 검증 결과가 함께 온다.\n\nErrors:\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 DRAFT_FORBIDDEN: 발행 권한 role의 부여가 없다\n- 404 DRAFT_UNKNOWN: 그런 draft가 없다 (자격 밖 draft 포함)\n\n\u003cOperation source=\"reference-policy\" id=\"policy-draft-view\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--policy-draft--policy-draft-view.html", "reference": true}, {"title": "판단 요청 조회", "text": "---\nsearch:\n  tags:\n    - Request\n    - GET\nseo:\n  description: >-\n    상태 조회. 이벤트 유실 시 재동기화용이자 서명 연산… Reference for the GET\n    /request/{policyRequestId} endpoint in the Wallet Policy Engine Internal API\n    API.\nsidebar:\n  label: 판단 요청 조회\n  badge: GET\ntitle: 판단 요청 조회\ntype: openapi-operation\n---\n상태 조회. 이벤트 유실 시 재동기화용이자 서명 연산 소비자(owning service)의 실행 근거다 —\n이벤트는 깨우는 신호이고 실행 근거는 조회다(§4). 어드민 액션은 집행이 결정 소유자와\n같은 프로세스라 실행 전 재확인이 불요하다(D-65).\n\nErrors: (코드 값 정본은 PolicyRequestErrorCode — D-88)\n- 401 UNAUTHENTICATED: 인증 실패\n- 403 FORBIDDEN_ROLE: 서비스 크리덴셜의 역할이 이 표면을 부를 수 없다 (인증 필터가 낸다)\n- 404 NOT_FOUND: 그 policyRequestId가 없거나 caller의 것이 아니다 — **둘을 합쳐 답한다.**\n갈라 답하면 남의 요청 id에 403이 돌아가 그 id의 존재가 드러난다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-request-get-detail\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--request--policy-request-get-detail.html", "reference": true}, {"title": "판단 요청 접수", "text": "---\nsearch:\n  tags:\n    - Request\n    - POST\nseo:\n  description: >-\n    접수. 같은 serviceRequestId 재제출은 활성·CONSUMED 불문 409로 거부하고,… Reference for the\n    POST /request endpoint in the Wallet Policy Engine Internal API API.\nsidebar:\n  label: 판단 요청 접수\n  badge: POST\ntitle: 판단 요청 접수\ntype: openapi-operation\n---\n접수. 같은 serviceRequestId 재제출은 활성·CONSUMED 불문 409로 거부하고, 에러 바디에\n기존 policyRequestId를 싣는다(D-78) — 202 유실 재시도는 그 id로 조회해 복구한다.\n판단 결과는 응답이 아니라 이벤트로 통지된다(§2·§4).\n\n인증: 인증된 owning service 신원이며 body의 신원 주장과 매칭 검증한다(§1).\n스킴은 **정적 서비스 크리덴셜**로 확정됐다(D-159 · PD-4 — D-103 대체) — BearerAuth 표기가\n그 스킴이고, `X-Caller-Service-Id` 선언은 크리덴셜 바인딩과 일치해야 한다(어긋나면 401).\n\nErrors: (코드 값 정본은 PolicyRequestErrorCode — D-88)\n- 400 INVALID_REQUEST: 요청 스키마 구조 위반 — 미등재 admin action(룰 스키마 명세 §1.5)과\n256 KiB 본문 상한 초과가 여기로 접힌다. 이 표면은 상한 초과를 413으로 내지 않는다\n- 400 UNKNOWN_OPERATION: 미지 연산\n- 400 UNSUPPORTED_SCHEMA_VERSION: 미지 스키마 버전\n- 401 UNAUTHENTICATED: 인증 실패\n- 403 FORBIDDEN: caller-연산 인가 실패. **현재 `admin_action`이 전부 여기로 접힌다**\n- 403 FORBIDDEN_ROLE: 서비스 크리덴셜의 역할이 이 표면을 부를 수 없다 (인증 필터가 낸다)\n- 409 IDEMPOTENCY_CONFLICT: 같은 serviceRequestId 재제출 — details는 PolicyIdempotencyConflictDetails로 타입 고정(D-78)\n- 503 DRAINING: 이 인스턴스가 드레인 중이다. `Retry-After`가 없다\n- 503 INTAKE_SATURATED: 접수 버퍼가 포화다. `Retry-After`가 실린다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-request-submit\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--request--policy-request-submit.html", "reference": true}, {"title": "워크스페이스 번들 활성화", "text": "---\nsearch:\n  tags:\n    - Workspace Bundle\n    - POST\nseo:\n  description: >-\n    활성 포인터 전이. 발행된 번들만 대상이 되고,… Reference for the POST\n    /workspace-bundles/activations endpoint in the Wallet Policy Engine Internal\n    API API.\nsidebar:\n  label: 워크스페이스 번들 활성화\n  badge: POST\ntitle: 워크스페이스 번들 활성화\ntype: openapi-operation\n---\n활성 포인터 전이. 발행된 번들만 대상이 되고, 되돌리기는 옛 번호를 지목한다.\n\n인증: 어드민 세션. 인가: 발행 권한 role 의 `workspace:{workspaceId}` 부여이고, **그\n부여가 대상 워크스페이스를 정한다** — 활성화에는 스코프를 정해 줄 승인 참조가 없다.\n\n이미 활성인 번호를 다시 세우면 `activationSeq` 를 올리지 않고 현재 상태를 돌려준다 —\n재시도가 이력을 부풀리면 \"몇 번 활성화됐는가\" 가 감사 신호로서 의미를 잃는다.\n\nErrors:\n- 400 INVALID_REQUEST: bundleVersion 이 양의 정수가 아니거나 digest 가 소문자 hex 64자가 아니다\n- 401 AUTHENTICATION_FAILED: 어드민 세션이 확정되지 않았다\n- 403 PUBLICATION_FORBIDDEN: 워크스페이스 발행 권한이 없다 (platform 부여도 여기서 끝난다)\n- 404 WORKSPACE_BUNDLE_UNKNOWN: 그 번호의 번들이 이 워크스페이스에 없다\n- 409 WORKSPACE_BUNDLE_DIGEST_MISMATCH: 그 번호의 다이제스트가 요청과 다르다\n- 409 WORKSPACE_BUNDLE_ACTIVATION_CONFLICT: 다른 활성화가 먼저 지나갔다\n\n\u003cOperation source=\"reference-policy\" id=\"policy-workspace-bundle-activation-activate\" />\n", "kind": "참고 문서", "path": "_reference/reference--policy--workspace-bundle--policy-workspace-bundle-activation-activate.html", "reference": true}, {"title": "활성 워크스페이스 번들 조회", "text": "---\nsearch:\n  tags:\n    - Workspace Bundle\n    - GET\nseo:\n  description: >-\n    요청자 워크스페이스의 지금 활성 번들. 승인 화면의… Reference for the GET\n    /workspace-bundles/activation endpoint in the Wallet Policy Engine Internal\n    API API.\nsidebar:\n  label: 활성 워크스페이스 번들 조회\n  badge: GET\ntitle: 활성 워크스페이스 번들 조회\ntype: openapi-operation\n---\n요청자 워크스페이스의 지금 활성 번들. 승인 화면의 diff 기준선이다.\n\n**경로 변수도 쿼리도 없는 것이 계약이다** — 대상 워크스페이스는 세션의 발행 부여가\n정한다. 로직 번들 활성 조회(`/policy-bundles/activations/{bundleName}`)에 얹지 않는\n이
