— 계정 지갑으로 들어오는 입금의 감지·확정과, 동결을 풀어도 되는지 판단하는 사전·사후 확인\n  - [집금](/fund-flows/sweep) — 입금 건을 지목해 옮기고, 그 이동이 해제를 겸합니다\n  - [출금](/fund-flows/withdrawal) — 가용 잔액 예약과 목적지별 확인 근거\n  - [Vault 이체](/fund-flows/vault-transfer) — 양쪽 끝이 내부라 확인 근거가 빠집니다\n- [자금 동결](/fund-flows/release) — 왜 자동 해제가 없고, 해제가 어디서 일어나는가\n- [웹훅](/fund-flows/webhooks) — 무엇이 언제 오나\n- [주소록](/fund-flows/address-book) — 출금 목적지 화이트리스트: 소유 증명과 회수, 그리고 정책 입력\n", "kind": "참고 문서", "path": "_reference/fund-flows.html", "reference": true}, {"title": "주소록 (Address Book · Whitelist)", "text": "---\ntitle: 주소록 (Address Book · Whitelist)\ndescription: 출금 목적지 화이트리스트 — 주소에 근거를 붙이고, 정책이 그 근거를 읽습니다\n---\n\n_읽는 사람: 파트너사 개발자. 주소록 등재와 회수, 그리고 그 근거가 정책에 들어가는 지점을 설명합니다._\n\n주소록은 주소에 근거를 붙이는 장부입니다. 그 근거가 출금 목적지 판정과 입금 발신처 판정 양쪽에\n쓰입니다. 이 페이지는 두 주소록이 어떻게 나뉘는지와 소유 증명으로 등재가 성립하는 절차, 회수 뒤의\n동작을 설명합니다.\n\n**정책 문서와 결정 로그는 같은 것을 화이트리스트(Whitelist)라고 부릅니다.** 두 이름은 쓰는 맥락이\n다를 뿐입니다.\n\n표면은 계약 소유자와 인증 방식이 하나로 정해지는 API 경로 묶음입니다. 등재·회수를 다루는 API\n표면에서는 주소록이고, \"이 주소로 나가도 되는가\"를 판단하는 출금 통제에서는 화이트리스트입니다.\n\n## 자금 귀속에 따라 주소록이 둘로 나뉩니다\n\n자금 귀속은 그 자금이 Account 것인지 Workspace 것인지입니다.\n\n| | 계정 주소록 | 워크스페이스 주소록 |\n|---|---|---|\n| 자금 귀속 | 최종 사용자 | 회사 |\n| 격리 기준 | tenant | workspace |\n| 등재 근거 | 최종 사용자의 소유 증명 | 미정 — 아래 \"알려진 공백\" 참조 |\n| 출금에서 | 계정 귀속 출금의 개인 지갑 목적지 | 자기 귀속 출금의 목적지 |\n| 입금에서 | 개인 지갑 발신처 판정 | 회사 외부 지갑 발신처 판정 |\n\n스코프 축은 어떤 데이터가 어느 스코프 키로 격리되는지의 분류입니다. 두 주소록은 축이 달라, 하나로\n합치면 어느 스코프로 조회해야 하는지가 행마다 달라집니다.\n\n## 소유 증명은 nonce에 서명하는 것입니다\n\n소유 증명은 개인 지갑을 주소록에 올리기 전에 최종 사용자가 그 키로 서명해 보이는 절차입니다.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant U as 최종 사용자\n    participant PT as 파트너사\n    participant SYS as Wallet SDK\n\n    PT->>SYS: nonce 발급 요청 (네트워크 · 주소)\n    SYS-->>PT: nonce · 서명 대상 메시지 · 만료 시각\n    PT->>U: 메시지 서명 요청\n    U-->>PT: 서명\n    PT->>SYS: 등재 요청 (라벨 · 네트워크 · 주소 · nonce · 서명)\n    SYS->>SYS: nonce 유효성과 서명 검증\n    SYS-->>PT: 주소록 항목\n```\n\nnonce는 만료 시각이 있고 한 번만 쓰입니다. 서명 대상 메시지와 서명 값이 항목에 남아, 그 등재가\n무엇으로 성립했는지를 나중에도 확인합니다.\n\n**증명이 선택이 아닙니다.** 계정 주소록은 증명 없이 항목을 만들 수 없습니다. 요청·응답 필드는\n[Wallet API](/reference/wallet)에 있습니다.\n\n## 등재는 네트워크 단위입니다\n\n항목마다 네트워크가 하나씩 지정됩니다. 같은 주소 문자열이라도 네트워크가 다르면 별개 항목이고, 한쪽 등재가\n다른 쪽 근거가 되지 않습니다.\n\n## VASP 목적지는 이 장부를 타지 않습니다\n\n상대 거래소 수탁 지갑으로 보낼 때는 소유 증명을 요구하지 않습니다. 가상자산 이전 시 송·수신\n정보를 사업자끼리 교환하는 규제 의무인 트래블룰이 그 역할을 대신하므로 **제3자 송금이 가능합니다**.\n\n근거가 목적지마다 갈리는 전체 그림은 [이동 종류](/fund-flows/movements)에 있습니다.\n\n## 같은 항목이 입금 판정에도 쓰입니다\n\n입금이 확정되면 발신 주소가 그 계정의 주소록에 있는지를 함께 판정합니다. 결과는 확정 통지의\n`sourceRegistered`로 나갑니다.\n\n**판정은 수취를 막지 않습니다.** 등재되지 않은 주소에서 와도 그대로 받고, 다만 해제를 요청할\n판단 재료가 하나 줄어듭니다. 통지에 담기는 필드는 [웹훅](/fund-flows/webhooks)에 있습니다.\n\n## 등재는 거절 사유가 아니라 정책 입력입니다\n\n미등재가 곧 거부는 아닙니다. 등재 여부가 정책 입력으로 들어가고 정책이 그것을 보고 판단합니다.\n\n화이트리스트 출금은 이 입력 위에 놓이는 룰입니다. \"등재된 주소로만 나간다\"는 규칙을 Wallet\nSDK가 코드에 박지 않고, 워크스페이스 정책이 `address_ownership` 입력을 보고 정합니다. 그래서 같은\n주소록을 두고도 한 워크스페이스는 미등재를 거부하고 다른 워크스페이스는 한도만 걸 수 있습니다.\n\n**등재 여부를 요청에 담지 않고 평가 시점에 읽습니다.** 그래서 회수가 즉시 반영됩니다. 읽는 경로는\n평가 시점에 사실을 읽어 오는 수집 경로인 [PIP](/policy/runtime/pip)에 있습니다.\n\n## 회수한 주소를 다시 등재하면 새 항목입니다\n\n항목을 지워도 행이 사라지지 않고 닫힌 것으로 표시됩니다. 같은 주소를 다시 등재하면 새 항목이\n생기고 식별자가 새로 발급됩니다. 닫힌 항목의 식별자는 다시 쓰이지 않습니다.\n\n**식별자를 보관해 두었다면 회수 뒤에 다시 받아야 합니다.** 항목 단건 조회와 회수가 식별자를\n경로로 받으므로, 옛 식별자를 그대로 쓰면 없는 항목을 가리킵니다.\n\n출금 요청은 이 변화를 타지 않습니다. 요청이 보내는 것은 목적지 주소이고, 등재 여부는 그 주소로\n매칭해 판정합니다.\n\n세대가 쌓이므로 항목의 세대가 곧 추가·삭제 이력입니다. 어느 주소가 언제 등재됐다가 언제\n닫혔는지를 행으로 확인합니다.\n\n활성 항목이 있는 주소는 다시 등재되지 않습니다. 같은 계정·네트워크·주소에 닫히지 않은 항목이\n있으면 등록이 거절되므로, 새 세대는 회수한 뒤에만 생깁니다.\n\n계정을 비활성화하면 그 계정 항목이 전부 닫힙니다. 재활성화해도 복구되지 않습니다. 이유는\n[계정 계층](/accounts-wallets/accounts)에 있습니다.\n\n## 알려진 공백이 둘 있습니다\n\n**워크스페이스 주소록에 항목을 만드는 경로가 아직 없습니다.** 등록 근거로 무엇을 남길지가 정해지지\n않았고, 그 경로를 여는 변경이 근거 필드를 먼저 추가합니다. 어드민 액션이 승인자의 확인을 거쳐야\n실행되는 통제인 승인 게이팅 대상으로 권고돼 있습니다.\n\n출금 목적지 주소가 참조한 항목의 주소와 같은지는 애플리케이션이 검사합니다. 둘을 묶는 스키마\n제약이 없어, 항목을 참조했다는 사실만으로 실제 송금 주소가 보증되지는 않습니다.\n\n진행 상황은 [변경 이력](/changelog)에서 추적합니다.\n\n## 다음으로\n\n주소록 근거가 출금 판정에서 어떻게 쓰이는지는 [출금](/fund-flows/withdrawal)에, 입금 발신처\n판정에서 어떻게 쓰이는지는 [입금](/fund-flows/deposit)에 있습니다.\n", "kind": "참고 문서", "path": "_reference/fund-flows--address-book.html", "reference": true}, {"title": "입금 (Deposit)", "text": "---\ntitle: 입금 (Deposit)\ndescription: 온체인 전송에서 확정 통지까지, 그리고 동결을 풀어도 되는지 판단하는 사전·사후 확인\n---\n\n_읽는 사람: 파트너사 개발자. 계정 지갑 입금이 거치는 구간과, 그 입금의 동결을 풀어도 되는지 판단하는 데 필요한 확인 재료가 통지에 담기는 순서를 설명합니다._\n\n입금은 온체인에서 Wallet SDK 지갑으로 들어온 자금이고, 거부할 수 없습니다. 이 페이지는 계정 지갑을 만들어 주소를 건네는 데서 시작해 감지와 확정, 동결, 그리고 동결을 풀어도 되는지 판단하는 사전·사후 확인과 통지 순서까지를 설명합니다. 워크스페이스 지갑으로 들어오는 입금은 다루지 않습니다.\n\n다이어그램에 등장하는 배역은 아홉입니다.\n\n- **상대 거래소 (VASP)**: 최종 사용자가 자산을 보내오는 상대편 가상자산사업자입니다\n- **최종 사용자**: 파트너사 서비스를 쓰는 사람입니다\n- **파트너사**: Wallet SDK를 도입한 회사, 곧 Workspace 하나입니다\n- **Wallet SDK**: 파트너 대상 API를 받아 정책 엔진에 판단을 묻고 서명 인프라에 제출하는 서버 컴포넌트입니다\n- **지갑 원장**: 지갑·입금·트래블룰·주소록 기록을 담는 Wallet SDK 쪽 저장소입니다\n- **트래블룰 게이트웨이**: 송·수신 정보를 사업자끼리 교환하는 트래블룰 경로를 중개합니다\n- **뒷단 플랫폼**: 지갑과 키를 보관하고 온체인 이벤트를 관측하는 외부 플랫폼입니다\n- **온체인**: 블록체인 네트워크입니다\n- **KYT 심사**: KYT 검사를 수행하고 결과를 돌려주는 외부 심사입니다\n\n## 입금 지갑 생성 시점\n\n수취 측 입금 지갑은 송금 대상이 될 수 있도록 입금 시점에 미리 생성되어 있어야 합니다.\n\nWallet SDK 관점에서는 특정 Account에게 Account Vault 1개, 그리고 이와 연관된 최소 1개 이상의 Account Wallet이 생성되어 있어야 합니다.\n\nAccount Wallet은 Token 단위로 생성되기 때문에, EVM 주소가 할당된 상태에서도 특정 토큰의 Account Wallet은 생성되지 않은 상태일 수도 있습니다. 이 경우 자동으로 해당 Token의 Account Wallet이 생성됩니다.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant U as 최종 사용자\n    participant PT as 파트너사\n    participant SYS as Wallet SDK\n    participant DB as 지갑 원장\n    participant PROV as 뒷단 플랫폼\n    participant OC as 온체인\n\n    U ->> PT : 계정 지갑 생성 요청\n    PT ->> SYS : GET /accounts?referenceId={referenceId}\n    SYS -->> PT : 계정 없음\n    PT ->> SYS : POST /accounts\n    PT ->> SYS : POST /accounts/{accountId}/account-wallets\u003cbr/>토큰 A\n    SYS ->> PROV : 지갑 생성\n    SYS ->> DB : Account Vault 생성 (첫 Account Wallet과 함께)\n    SYS ->> DB : Account Wallet 기록 생성 (토큰 A)\n    SYS -->> PT : 지갑 주소 전달\n    PT -->> U : 지갑 주소 노출\n\n    Note over U, OC : 같은 주소로 토큰 B가 들어오는 경우\n    OC -->> PROV : 이벤트 감지 (토큰 B)\n    PROV ->> +SYS : 입금 감지 통지\n    SYS ->> DB : 토큰 B의 Account Wallet 행 자동 생성\u003cbr/>새 주소가 아니라 같은 vault 주소를 적은 장부 한 줄\n    SYS ->> DB : 계정 지갑 입금 기록 생성 (depositId)\n    SYS ->> PT : 통지 / DEPOSIT_DETECTED\n    SYS -->> -PROV : OK\n```\n\n지갑 행이 없어도 기록하는 이유는 주소 소유가 결국 키로 증명되기 때문입니다. Wallet SDK 주소는 모두 그 키에서 유도되므로 그 자금은 Wallet SDK가 처리할 수 있는 것입니다. 여기서 만들어지는 것은 새 주소가 아니라 이미 건넨 vault 주소를 적은 장부 한 줄입니다. 계정이 비활성이어도 같습니다. 자세한 것은 [지갑 계층](/accounts-wallets/wallets)에 있습니다.\n\n## 입금 기본 흐름\n\nTravel Rule이나 KYT 같은 절차를 제외하면, 입금은 기본적으로 감지 이후 확정으로 진행되는 흐름으로 구성됩니다. 감지시와 확정 시 파트너사에 웹훅으로 각 이벤트를 통지하게 됩니다.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant EX as 상대 거래소 (VASP)\n    participant OC as 온체인\n    participant PROV as 뒷단 플랫폼\n    participant SYS as Wallet SDK\n    participant DB as 지갑 원장\n    participant PT as 파트너사\n\n    EX ->> OC : 블록체인 자산 전송\n    OC -->> PROV : 이벤트 감지\n    PROV ->> +SYS : 입금 감지 통지 (detected)\n    SYS ->> DB : 계정 지갑 입금 기록 생성 (depositId · txHash)\n    SYS ->> PT : 통지 / DEPOSIT_DETECTED\n    SYS -->> -PROV : OK\n    alt 네트워크별 confirmation 기준 충족\n        PROV ->> +SYS : 확정 감지 통지 (finalized)\n        SYS ->> DB : 계정 지갑 입금 / 상태 변경 (FROZEN)\n        SYS ->> PT : 통지 / DEPOSIT_FINALIZED\n        SYS -->> -PROV : OK\n    else 확정 전 실패\n        PROV ->> +SYS : 실패 통지\n        SYS ->> DB : 계정 지갑 입금 / 상태 변경 (FAILED)\n        SYS ->> PT : 통지 / DEPOSIT_FAILED\n        SYS -->> -PROV : OK\n    end\n```\n\n각 입금 건에는 식별자로 `depositId`가 발급됩니다. 기본 흐름에서 통지되는 이벤트는 블록체인으로부터 탐지하기 때문에 `txHash` 등의 값을 함께 통지합니다.\n\n관측(`DEPOSIT_DETECTED`)은 온체인에서 트랜잭션을 봤다는 뜻이고, 아직 확정이 아니라 되돌려질 수 있습니다. 확정(`DEPOSIT_FINALIZED`)은 네트워크별 confirmation 기준을 넘겼다는 뜻입니다. 확정 전에 실패하면 `DEPOSIT_FAILED`가 나가고 거기서 끝나며, 확정된 입금은 실패로 되돌리지 않습니다.\n\n## 입금된 자산의 기본 상태 : 동결\n\n입금된 자산은 기본적으로 동결 상태로 입금 지갑에 머무르게 됩니다. 입금 지갑 자산의 동결 해제는 현재 워크스페이스 볼트(Workspace Vault)로의 스윕(Sweep) 뿐입니다.\n\n해당 동결 자금이라는 것은 실제 온체인 상 동결 혹은 컨트랙트 상 동결이 아니라, Wallet SDK의 오프체인 DB에서 동결해두는 것을 의미합니다.\n\n```mermaid\nstateDiagram-v2\n    direction LR\n    [*] --> DETECTED : 온체인 관측\n    DETECTED --> FROZEN : 확정 (통지에는 FINALIZED)\n    DETECTED --> FAILED : 확정 전 실패\n    FROZEN --> WITHDRAWN : 집금(Sweep) 접수\u003cbr/>해제와 이동이 한 트랜잭션\n    WITHDRAWN --> FROZEN : 집금 실패 종결\u003cbr/>되돌아와 재집금 가능\n    FAILED --> [*]\n    WITHDRAWN --> [*]\n    note right of FROZEN\n        동결. 확인 근거가 있어도\n        시스템이 스스로 풀지 않습니다.\n        계정 지갑 입금은 RELEASED를 거치지 않습니다.\n    end note\n```\n\n확정 시점의 도메인 상태는 동결(`FROZEN`)이지만 통지에는 `FINALIZED`로 나갑니다. 해제는 파트너사가 요청하는 흐름이라 동결 여부를 파트너사에게 보이는 상태 이름에 섞지 않습니다. 동결 자체는 [자금 동결](/fund-flows/release)에 있습니다.\n\n따라서 입금이 확정된 이후 적절한 절차를 거친 이후 해당 입금건의 동결을 풀어도 된다고 판단하면 Sweep을 요청해 워크스페이스 볼트로 자산을 온체인 송금한 뒤 유동적으로 활용합니다. 집금 요청 자체는 [집금](/fund-flows/sweep)에 있습니다.\n\n입금의 전체 과정에서 입금 사전(혹은 동시)에 확인할 수 있는 정보와 사후에 확인할 수 있는 정보를 나눠 기술하겠습니다.\n\n## 동결 해제 사전 확인 조건\n\n동결을 해제해도 되는 건인지, 즉 입금을 허용해도 되는 건인지 파악하기 위해서 사전 확인할 수 있는 정보는 송금인 식별 정보입니다.\n\n송금인의 지갑이 어느 VASP의 어떤 고객인지 식별할 수 있도록 VASP 사업자 간에는 Travel Rule로 온체인 트랜잭션이 발생하기 이전에 송금인과 수취인의 개인 식별 정보를 교환하게 됩니다. 트래블룰 자체는 [에코시스템](/#함께-제공하는-모듈)이 설명합니다.\n\n만약 TR 사전 정보가 없어 VASP 사업자가 관리하는 지갑임을 인지할 수 없을 경우, 개인 지갑으로부터 발생한 트랜잭션으로 간주합니다. 이 때, 파트너사가 아는 지갑인지 미리 Wallet SDK에 화이트리스트로 등록해두었다면 입금 통지시 화이트리스트 등록 정보를 제공받을 수 있습니다. 모두 해당하지 않는다면, 별도로 사유를 제출받아야 하는 입금건으로 간주할 수 있습니다.\n\n사전 확인 조건이 만족될 경우 파트너사에서는 입금 기본 흐름에서 확정 통지에 관련 정보를 전달받게 됩니다.\n\n### VASP : Travel Rule\n\nTravel Rule에는 2번의 정보 교환이 일어납니다.\n\n첫 번째는 주소 교환으로, 상대 VASP가 파트너사 VASP에게 송금하려는 지갑의 주소가 파트너사 VASP의 것인지 묻는 절차입니다. Wallet SDK 내부적으로 Wallet SDK가 소유하고 있는 Account Wallet에 해당 지갑이 있는지 선제적으로 확인합니다.\n\n만약 소유하고 있는 지갑일 경우 상대 VASP가 파트너사에서 허용하는 VASP인지 확인하기 위해 파트너사에 확인 동기 요청을 보내 허용 여부를 확인합니다. 파트너사가 제한 시간 안에 답하지 않으면 허용으로 간주합니다. 제한 시간 값은 아직 정해지지 않았습니다.\n\n일련의 과정을 거쳐 상대 VASP에게 해당 송금건을 허용할 것인지 응답하게 됩니다.\n\n이 1차 교환이 1초 안에 완료되어야 합니다.\n\n두 번째는 PII 검증으로, 수취인과 송금인의 개인 식별 정보를 교환하는 과정입니다. 송금인의 PII와 수취인의 PII를 채워서 상대 VASP에서 파트너사 VASP에 요청하게 되고, Wallet SDK에서는 TR Gateway로 PII 정보를 파트너사에 전달하게 됩니다.\n\nPII 확인이 완료되면 `trId`를 발급해 PII 정보와 함께 저장 동기 요청하게 되고, 파트너사에서는 해당 정보를 저장합니다. 저장이 완료된 이후에 상대 VASP 측으로 PII 검증 확인을 응답하게 됩니다. PII 원문은 Wallet SDK가 저장하지 않습니다. 트래블룰 게이트웨이에서 받은 값을 파트너사로 넘기고, 지갑 원장에는 식별자와 검증 UUID만 남깁니다.\n\n이 2차 교환이 5초 안에 완료되어야 합니다.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant EX as 상대 거래소 (VASP)\n    participant TR as 트래블룰 게이트웨이\n    participant SYS as Wallet SDK\n    participant DB as 지갑 원장\n    participant PT as 파트너사\n\n    Note over EX, PT : 1차 교환 — 주소 확인. 1초 안에 응답합니다\n    EX ->> +TR : 지갑 주소 확인 요청\n    TR ->> +SYS : 지갑 주소 확인\n    SYS ->> DB : Account Wallet에 해당 주소가 있는지 확인\n    opt Wallet SDK 소유 주소\n        SYS ->> +PT : 허용 VASP 확인 (동기)\u003cbr/>상대 VASP 식별자\n        PT -->> -SYS : 허용 / 거절\u003cbr/>제한 시간 안에 답이 없으면 허용으로 간주\n    end\n    SYS -->> -TR : 주소 확인 결과 (허용 여부 포함)\n    TR -->> -EX : OK / 거절\n\n    Note over EX, PT : 2차 교환 — PII 검증. 5초 안에 응답합니다\n    EX ->> +TR : PII 검증 요청\u003cbr/>송금인 PII · 수취인 PII\n    TR ->> +PT : 수신인 PII와 거래소 사용자 식별자 확인 요청\n    PT -->> -TR : PII와 사용자 식별자 OK\n    TR ->> +SYS : 트래블룰 정상 수신\u003cbr/>주소 · 금액 · 토큰 · PII\n    SYS ->> SYS : trId 채번\n    SYS ->> +PT : 저장 요청 (동기)\u003cbr/>trId · 송·수신인 PII\n    PT ->> PT : trId와 PII 저장\n    PT -->> -SYS : 저장 완료\n    SYS ->> DB : 트래블룰 기록 저장\u003cbr/>trId · 주소 · 금액 · 토큰 · 검증 UUID (PII 원문 없음)\n    SYS -->> -TR : 트래블룰 정보 수신 처리 완료\n    TR -->> -EX : PII 검증 확인 응답\n```\n\nTravel Rule 교환이 성공적으로 완료되면 해당 입금건은 양측 VASP는 기본적으로 문제 없는 자금 흐름으로 판단할 수 있게 됩니다. 이후 온체인 트랜잭션이 완료되고 나면 Transaction Status API로 tx hash 전달하게 되고, Wallet SDK가 입금 기본 흐름에서 인식한 tx hash와 대조하여 `trId` 와 입금건을 매핑하여 통지할 수 있는 상태가 됩니다. 그러면 해당 자금의 소유주가 기본적으로 확인되기 때문에 미등록 개인 지갑으로부터 발생한 트랜잭션과 다르게 일련의 사유 제출 절차를 생략할 수 있게 됩니다.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant EX as 상대 거래소 (VASP)\n    participant OC as 온체인\n    participant TR as 트래블룰 게이트웨이\n    participant SYS as Wallet SDK\n    participant DB as 지갑 원장\n    participant PT as 파트너사\n\n    EX ->> OC : 블록체인 자산 전송\n    EX ->> +TR : 전송 완료 통지 (Transaction Status)\u003cbr/>검증 UUID · txHash\n    TR ->> +SYS : 검증 UUID · txHash · 입금 정보\n    SYS ->> DB : 트래블룰 기록 / 검증 UUID로 txHash 업데이트\n    SYS ->> DB : 계정 지갑 입금 / txHash 일치 건 조회\n    alt 입금 건이 이미 기록돼 있음\n        SYS ->> DB : 입금 건에 trId 매핑\n        SYS ->> PT : 통지 / DEPOSIT_UPDATED (trId)\n    else 입금 건이 아직 없음\n        Note right of SYS : 이후 감지·확정 시점에 txHash로 대조해 trId를 실어 보냅니다\n    end\n    SYS -->> -TR : OK\n    TR -->> -EX : OK\n```\n\n### 개인 지갑 : 화이트 리스트\n\nVASP 사업자가 관리하는 지갑이 아닌 개인 지갑으로부터 발생한 트랜잭션일 경우 파트너사에서 해당 지갑이 사전에 등록된 지갑인지 사전에 파악할 수 있어야 합니다.\n\nWallet SDK에서는 이를 위해 화이트 리스트 기능을 제공합니다. 각 계정에 할당되는 화이트리스트는 기본적으로 지갑의 소유 증명으로 등록하게 됩니다. 표면은 계약 소유자와 인증 방식이 하나로 정해지는 API 경로 묶음입니다. 등재·회수 API 표면에서는 이 장부를 주소록이라 부릅니다([주소록](/fund-flows/address-book)).\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant U as 최종 사용자\n    participant PT as 파트너사\n    participant SYS as Wallet SDK\n    participant DB as 지갑 원장\n\n    PT ->> SYS : nonce 발급 요청 (네트워크 · 주소)\n    SYS -->> PT : nonce · 서명 대상 메시지 · 만료 시각\n    PT ->> U : 메시지 서명 요청 (개인 지갑 키로)\n    U -->> PT : 서명\n    PT ->> SYS : 등재 요청 (라벨 · 네트워크 · 주소 · nonce · 서명)\n    SYS ->> SYS : nonce 유효성과 서명 검증\n    SYS ->> DB : 계정 화이트리스트 항목 생성\n    SYS -->> PT : 주소록 항목\n```\n\n따라서 화이트리스트에 존재하는 지갑 주소라면 특정 계정의 사용자 본인의 지갑으로 간주할 수 있습니다. 본인의 지갑으로부터 발생하는 입금건임이 확인이 된다면 일련의 사유 제출 절차를 생략할 수 있게 됩니다.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant U as 최종 사용자 (개인 지갑)\n    participant OC as 온체인\n    participant PROV as 뒷단 플랫폼\n    participant SYS as Wallet SDK\n    participant DB as 지갑 원장\n    participant PT as 파트너사\n\n    U ->> OC : 개인 지갑에서 계정 지갑 주소로 전송\n    OC -->> PROV : 이벤트 감지\n    PROV ->> +SYS : 입금 감지 통지 (detected)\u003cbr/>송금 주소 포함\n    SYS ->> DB : 계정 지갑 입금 기록 생성 (depositId)\n    SYS ->> DB : 계정 화이트리스트 / 송금 주소 등록 여부 확인\n    Note right of SYS : 입금 당시의 등록 여부를 그 입금 건에 고정합니다.\u003cbr/>이후 화이트리스트에서 지워도 이 건의 판정은 바뀌지 않습니다\n    SYS ->> PT : 통지 / DEPOSIT_DETECTED\u003cbr/>화이트리스트 등록 여부 (등록됨)\n    SYS -->> -PROV : OK\n    PROV ->> +SYS : 확정 감지 통지 (finalized)\n    SYS ->> DB : 계정 지갑 입금 / 상태 변경 (FROZEN)\n    SYS ->> PT : 통지 / DEPOSIT_FINALIZED\u003cbr/>화이트리스트 등록 여부 (등록됨)\n    SYS -->> -PROV : OK\n```\n\n### 그 외 : 직접 사유 제출\n\n이외의 케이스는 알 수 없는 지갑으로부터 발생한 트랜잭션으로 간주해야 합니다. 따라서 반환 절차 등의 프로세스를 마련하여 사용자 혹은 고객이 직접 본인의 자금 흐름임을 사유로 제출해 동결을 해제하는 등 운영성 정책의 마련이 필요합니다.\n\nTravel Rule 교환이 있었더라도 상대 VASP의 tx hash 통지가 끝내 오지 않으면 `trId` 매핑이 붙지 않습니다. 그런 건은 Wallet SDK 입장에서 알 수 없는 개인 지갑으로부터의 입금과 구분할 수 없으므로, 파트너사도 이 케이스로 다루면 됩니다. 매핑을 기다리는 기한은 따로 두지 않습니다.\n\n## 동결 해제 사후 확인 조건\n\n사전 조건을 만족했다면 입금건을 집금(Sweep) 처리(동결 해제 + 이동)하기 위해 사후 확인을 진행하게 됩니다. 파트너사에서 일련의 AML/FDS 탐지 과정을 거치고, Wallet SDK에선 KYT 과정을 거치게 됩니다.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant PROV as 뒷단 플랫폼\n    participant SYS as Wallet SDK\n    participant DB as 지갑 원장\n    participant KYT as KYT 심사\n    participant PT as 파트너사\n\n    PROV ->> +SYS : 확정 감지 통지 (finalized)\n    SYS ->> DB : 계정 지갑 입금 / 상태 변경 (FROZEN)\n    SYS ->> PT : 통지 / DEPOSIT_FINALIZED\u003cbr/>trId는 매핑돼 있으면 함께\n    SYS -->> -PROV : OK\n\n    par 파트너사 사후 확인\n        PT ->> PT : AML · FDS 탐지\n        Note right of PT : 결과를 Wallet SDK에 되돌릴 의무는 없습니다\n    and Wallet SDK 사후 확인\n        SYS ->> +KYT : KYT 검사 (txHash · 송금 주소 · 금액)\n        KYT -->> -SYS : KYT 결과\n        SYS ->> DB : 계정 지갑 입금 / KYT 결과 저장\n        SYS ->> PT : 통지 / DEPOSIT_UPDATED\u003cbr/>지금까지의 모든 정보 + KYT 결과\n        Note right of SYS : BLOCKED여도 결과만 싣습니다.\u003cbr/>차단 조치는 파트너사가 합니다\n    end\n    Note over SYS, PT : 사후 확인이 모두 끝나면 파트너사가 집금을 요청합니다\n```\n\nAML·FDS는 파트너사가 자기 책임으로 수행하고 결과를 Wallet SDK에 되돌릴 의무가 없습니다. KYT 결과가 BLOCKED여도 Wallet SDK는 결과를 통지에 담기만 하고, 그 입금을 원장에 반영하지 않거나 반환하는 조치는 파트너사가 합니다. 차단을 Wallet SDK 기록에 반영하는 표면은 없습니다.\n\nWallet SDK에선 역시나 KYT 과정이 완료되면 입금 관련 이벤트로 지금까지의 모든 상태와 더불어 최신 상태를 파트너사로 통지하게 됩니다. 아래는 그 통지의 예시이고, `travelRule`과 `kyt` 안의 필드 이름은 확정된 계약이 아니라 형태를 보이기 위한 예시입니다.\n\n```json\n{\n  \"eventType\": \"DEPOSIT_UPDATED\",\n  \"correlationKey\": \"awd-1234567890abcdef:DEPOSIT_UPDATED:2\",\n  \"depositId\": \"awd-1234567890abcdef\",\n  \"workspaceId\": \"ws-...\",\n  \"tenantId\": \"tn-...\",\n  \"status\": \"FINALIZED\",\n  \"accountId\": \"acc-...\",\n  \"accountWalletId\": \"aw-...\",\n  \"tokenId\": \"tok-...\",\n  \"amount\": \"100.00\",\n  \"amountRaw\": \"100000000\",\n  \"txHash\": \"0x...\",\n  \"sourceAddress\": \"0x...\",\n  \"sourceRegistered\": false,\n  \"travelRule\": {\n    \"trId\": \"tr-...\",\n    \"counterpartyVaspId\": \"vasp-...\"\n  },\n  \"kyt\": {\n    \"result\": \"PASS\",\n    \"checkedAt\": \"2026-09-08T10:12:00+09:00\"\n  }\n}\n```\n\n`travelRule`과 `kyt`는 그 시점에 확인된 것만 들어가고, 아직 없으면 `null`입니다. `correlationKey` 끝의 숫자는 그 입금 건의 갱신 순번이고, 갱신 통지마다 1씩 오릅니다.\n\n통지된 정보를 활용하여 사후 확인까지 완료하고 나면 정상 입금건임을 최종적으로 확인할 수 있게 됩니다.\n\n## 사전 / 사후로 나눠서 보는 전체 흐름도\n\n지금까지 이야기한 흐름도를 사전 / 사후로 명확히 나눠 기술하면 다음과 같이 볼 수 있습니다.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant EX as 상대 거래소 (VASP)\n    participant TR as 트래블룰 게이트웨이\n    participant OC as 온체인\n    participant SYS as Wallet SDK\n    participant KYT as KYT 심사\n    participant PT as 파트너사\n\n    rect rgb(235, 245, 255)\n        Note over EX, PT : 사전 확인 — 온체인 트랜잭션 이전\n        EX ->> TR : 1차 주소 확인 · 2차 PII 검증\n        TR ->> SYS : 트래블룰 정상 수신\n        SYS ->> PT : trId · PII 저장 요청 (동기)\n    end\n    EX ->> OC : 블록체인 자산 전송\n    OC -->> SYS : 입금 감지\n    SYS ->> PT : 통지 / DEPOSIT_DETECTED\n    EX ->> TR : 전송 완료 통지 (txHash)\n    TR ->> SYS : txHash\n    SYS ->> SYS : txHash 대조 → trId 매핑\n    OC -->> SYS : 입금 확정\n    SYS ->> PT : 통지 / DEPOSIT_FINALIZED\u003cbr/>txHash · trId 모두 포함\n    rect rgb(255, 245, 235)\n        Note over SYS, PT : 사후 확인 — 확정 이후\n        par\n            PT ->> PT : AML · FDS\n        and\n            SYS ->> KYT : KYT 검사\n            KYT -->> SYS : 결과\n            SYS ->> PT : 통지 / DEPOSIT_UPDATED (KYT 결과 포함)\n        end\n    end\n    PT ->> SYS : 집금 요청 (depositId)\n```\n\n하지만 현실은 생각보다 녹록치 않은데, 일단 Travel Rule의 조건 때문입니다.\n\n## Travel Rule의 현실, 개인 지갑 구분, 그리고 해결책\n\nTravel Rule을 두고 FATF가 낸 권고는 사실상 사후 전송만 아니면 된다에 가깝습니다. 또한 트래블룰 게이트웨이를 거쳐 기대하는 케이스대로 들어온다고 하더라도 상대 VASP 측에서도 온체인 확정을 감지한 후 tx hash를 통지해줄 것이기 때문에 Wallet SDK에서 먼저 온체인 입금 확정을 감지할 확률이 높습니다.\n\n즉, 대부분은 입금 확정시에 TR 정보를 매핑하는 것이 어렵습니다.\n\n순서가 보장되지 않는 상황에서 Wallet SDK가 보장할 수 있는 유일한 기준은 직접 감지하는 온체인 이벤트로 보는 것이 바람직합니다. 따라서 Travel Rule 교환 규칙과 무관하게 다음 흐름으로 처리합니다.\n\n- Travel Rule 정보 교환은 온체인 트랜잭션과 무관하게 발생합니다.\n- 입금 감지 이벤트는 온체인에서 Wallet SDK 지갑으로의 입금이 감지되면 통지합니다.\n    - (개인 지갑 대응 추가) 이 때, 송금 발생 주소가 화이트 리스트에 등록 되었는지 여부를 함께 통지합니다.\n- 입금 확정 이벤트는 온체인에서 입금이 확정되면 통지합니다.\n    - (Optional) TR 정보 교환으로 `trId` 매핑이 완료되었을 경우 함께 통지합니다.\n- 입금 확정 이후 입금건의 정보 변경이 발생할 때 마다 그 순간의 최대 정보를 포함하여 입금 갱신 통지(`DEPOSIT_UPDATED`)합니다.\n    - TR 정보 교환으로 `trId` 매핑이 완료되었을 경우 `trId`를 포함하여 통지합니다.\n    - KYT 확인이 완료되었을 경우 KYT 결과를 포함하여 통지합니다.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant EX as 상대 거래소 (VASP)\n    participant TR as 트래블룰 게이트웨이\n    participant OC as 온체인\n    participant SYS as Wallet SDK\n    participant DB as 지갑 원장\n    participant KYT as KYT 심사\n    participant PT as 파트너사\n\n    EX ->> TR : 1차 주소 확인 · 2차 PII 검증 (사전)\n    TR ->> SYS : 트래블룰 정상 수신 (trId 채번)\n    EX ->> OC : 블록체인 자산 전송\n\n    OC -->> SYS : 입금 감지\n    SYS ->> DB : 계정 화이트리스트 / 송금 주소 등록 여부 확인\n    SYS ->> PT : 통지 / DEPOSIT_DETECTED\u003cbr/>화이트리스트 등록 여부\n\n    OC -->> SYS : 입금 확정\n    SYS ->> DB : 트래블룰 기록 / txHash 일치 건 조회\n    alt txHash가 이미 도착함\n        SYS ->> PT : 통지 / DEPOSIT_FINALIZED\u003cbr/>화이트리스트 등록 여부 · trId\n    else txHash가 아직 도착하지 않음 (대부분)\n        SYS ->> PT : 통지 / DEPOSIT_FINALIZED\u003cbr/>화이트리스트 등록 여부 · 트래블룰 정보 없음\n    end\n\n    par 트래블룰 txHash가 늦게 도착\n        EX ->> TR : 전송 완료 통지 (txHash)\n        TR ->> SYS : txHash\n        SYS ->> DB : txHash 대조 → 입금 건에 trId 매핑\n        SYS ->> PT : 통지 / DEPOSIT_UPDATED #1\u003cbr/>지금까지의 모든 정보 + trId\n    and KYT 사후 확인\n        SYS ->> KYT : KYT 검사\n        KYT -->> SYS : 결과\n        SYS ->> DB : KYT 결과 저장\n        SYS ->> PT : 통지 / DEPOSIT_UPDATED #2\u003cbr/>지금까지의 모든 정보 + KYT 결과\n    end\n    Note over SYS, PT : 두 갱신은 순서가 바뀔 수 있습니다.\u003cbr/>각 통지는 그 순간의 최대 정보를 담으므로 마지막 순번의 통지가 최신 상태입니다\n```\n\n따라서 파트너사에서는 각 통지 시점마다 상태를 최신화하여 입금의 진행 상태를 판단할 수 있습니다.\n", "kind": "참고 문서", "path": "_reference/fund-flows--deposit.html", "reference": true}, {"title": "이동 종류", "text": "---\ntitle: 이동 종류\ndescription: 어디서 어디로 갈 수 있는가\n---\n\n_읽는 사람: 파트너사 개발자. 자금이 어디서 어디로 갈 수 있고 무엇이 허용되지 않는지를 설명합니다._\n\n이 페이지는 Wallet SDK 안에서 자금이 움직일 수 있는 경로를 전부 늘어놓습니다. 경로는 일곱 개뿐이고\n그 밖의 조합은 허용하지 않습니다. 아래 표가 그 일곱을 접두사·요청 주체·정책과 함께 열거합니다.\n\n| 이동 | 접두사 | 어디서 어디로 | 요청 주체 | 정책 |\n|---|---|---|---|---|\n| 계정 지갑 입금 | `awd-` | VASP·개인 → 계정 지갑 | 온체인 관측 | 없음 |\n| 워크스페이스 지갑 입금 | `wwd-` | 회사 외부 지갑 → 워크스페이스 지갑 | 온체인 관측 | 해제 요청이 승인 게이팅 |\n| 집금 | `swp-` | 계정 지갑 → 워크스페이스 vault | 시스템 | 서명 인가 |\n| Vault 이체 | `wvt-` | 워크스페이스 vault 간 | 시스템·운영자 | 서명 인가 |\n| 계정 귀속 출금 | `wwac-` | 워크스페이스 vault → VASP·개인 지갑 | 사용자·시스템 | 서명 인가 |\n| 자기 귀속 출금 | `wwsf-` | 워크스페이스 vault → 회사 외부 지갑 | 운영자 | 서명 인가 |\n| 계정 지갑 출금 | `aww-` | 계정 지갑 → 외부 | 운영자(오입금 반환) | 서명 인가 + 승인 게이팅 |\n\n표의 승인 게이팅은 어드민 액션이 승인자의 확인을 거쳐야 실행되는\n통제입니다([자세히](/policy/sequences/approval-gate)).\n\n## 이동은 여섯 대상 사이에서만 일어납니다\n\n자금이 오가는 대상은 여섯입니다. 내부 둘과 외부 넷으로 나뉩니다.\n\n| 대상 | 실체 | 자금 귀속 | 식별 근거 |\n|---|---|---|---|\n| **계정 지갑** | 최종 사용자 수취 주소 | 최종 사용자 | — |\n| **워크스페이스 vault** | 계정용이 아닌 모든 vault | 워크스페이스 | vault 태그 |\n| **VASP** | 상대 거래소 수탁 지갑 | 상대 VASP의 고객 | vaspId + 수탁 지갑 확인 |\n| **개인 지갑** | 최종 사용자 본인 지갑 | 최종 사용자 | 계정 주소록 — nonce 서명 소유 증명 |\n| **회사 외부 지갑** | 발행 시스템 · 콜드월렛 | 워크스페이스 | 워크스페이스 주소록 |\n| **미등록** | 어느 주소록에도 없는 주소 | 알 수 없음 | 없음 |\n\n미등록은 종류가 아니라 판정 실패 상태입니다. 그런 주소에서도 자금이 들어올 수 있고, 그때도 동결로\n받습니다. 동결은 입금을 확정 시 fail-closed로 잡아 두는 상태입니다([자세히](/fund-flows/release)).\n\n## 막을 수 있는 방향과 막을 수 없는 방향이 판정을 가릅니다\n\n방향이 판정을 가릅니다. 아래 그림이 그 방향을 요약합니다.\n\n```mermaid\nflowchart LR\n    EXT[\"외부 넷\u003cbr/>VASP · 개인 · 회사외부 · 미등록\"]\n    AW[\"계정 지갑\"]\n    WV[\"워크스페이스 vault\"]\n\n    EXT -->|입금 · 막을 수 없다| AW\n    EXT -->|입금 · 막을 수 없다| WV\n    AW -->|집금| WV\n    WV -->|vault 이체| WV\n    WV -->|출금 · 우리가 서명한다| EXT\n    AW -->|반환| EXT\n```\n\n**입금은 막을 수 없어 동결로 받습니다.** 온체인 전송에는 Wallet SDK의 허가가 필요하지 않기 때문입니다.\n\n출금은 반대입니다. Wallet SDK가 서명하므로 실제로 막을 수 있습니다. 그래서 구조적으로 지원하지\n않는 조합이 매트릭스에서 다섯 칸이고, 규칙으로 묶으면 셋입니다.\n\n- **계정 지갑에서 바로 나가지 않습니다**: 다른 계정 지갑·VASP·개인 지갑이 모두 막혀 있고, 집금이 선행합니다.\n- **워크스페이스 vault에서 계정 지갑으로 되돌아가지 않습니다**: 집금을 되돌리는 반대 방향 이동이 없습니다.\n- **근거 없는 주소로는 나가지 않습니다**: 워크스페이스 vault에서 미등록 주소로 가는 칸이 그것입니다.\n\n## 출금이 셋으로 갈린 이유는 자금 귀속입니다\n\n자금 귀속은 그 자금이 Account 것인지 Workspace 것인지입니다. 계정 귀속 출금(`wwac-`)이 옮기는\n자금은 최종 사용자의 것이고, 자기 귀속 출금(`wwsf-`)이 옮기는 자금은 회사 자기 자금입니다.\n\n이 구분이 스코프 축을 정합니다. 스코프 축은 어떤 데이터가 어느 스코프 키로 격리되는지의\n분류입니다. 앞의 것은 tenant 축이고 뒤의 것은 workspace 축이라, 격리 키가 달라져 이동 종류를\n나눕니다.\n\n계정 지갑 출금(`aww-`)은 또 다른 경우입니다. 계정 지갑에서 직접 나가는 유일한 경로이고, 알려진\n용도는 오입금 반환입니다.\n\n## 집금을 시작하는 주체는 운영자가 아니라 시스템입니다\n\n집금(sweep)은 계정 지갑 자산을 워크스페이스 vault로 모으는\n이동입니다([자세히](/fund-flows/sweep)). 시작하는 주체는 시스템이고, 파트너사 서버 요청과 온체인\n관측과 자동화가 모두 여기 들어갑니다.\n\n**운영자가 계정 지갑 자금을 건드리는 경로는 집금이 아닙니다.** 계정 지갑 출금(`aww-`)입니다.\n\n## 목적지마다 확인 근거가 갈립니다\n\n개인 지갑은 최종 사용자의 소유 증명이 필요합니다. 소유 증명은 개인 지갑을 주소록에 올리기 전에\n최종 사용자가 그 키로 서명해 보이는 절차입니다.\n\nVASP 지갑은 트래블룰이 그 역할을 대신합니다. 트래블룰은 가상자산 이전 시 송·수신 정보를\n사업자끼리 교환하는 규제 의무입니다([자세히](/#함께-제공하는-모듈)).\n\n**미등재가 곧 거부는 아닙니다.** 등재 여부는 정책 입력이고 정책이 그것을 보고 판단합니다.\n\n## 다음으로\n\n주소록은 주소에 등재 근거를 붙이는 장부입니다. 등재 근거와 회수, 재등재가 식별자에 무엇을 하는지는\n[주소록](/fund-flows/address-book)에 있습니다.\n", "kind": "참고 문서", "path": "_reference/fund-flows--movements.html", "reference": true}, {"title": "자금 동결", "text": "---\ntitle: 자금 동결\ndescription: 자동 해제가 없는 이유와 두 해제 경로, 그 아래 깔린 동시성 방어\n---\n\n_읽는 사람: 파트너사 개발자. 동결과 해제, 그리고 그 아래 깔린 동시성 방어를 설명합니다._\n\n동결은 입금을 확정 시 fail-closed로 잡아 두는 상태입니다. 이 페이지는 자동 해제가 없는 이유와\n해제가 일어나는 두 경로, 그리고 그 아래에 깔린 동시성 방어를 설명합니다.\n\n## 입금은 동결로 도착합니다\n\n온체인 전송에는 Wallet SDK의 허가가 필요하지 않습니다. 받을지 말지를 고를 수 없어서 **확정된 입금은\n전부 동결(`FROZEN`)로 받습니다.**\n\n동결은 \"이 자금은 아직 움직일 수 없다\"는 상태입니다. 원장 CREDIT도 이 시점이 아니라 해제\n시점에 새겨집니다.\n\n동결은 온체인이나 컨트랙트 위의 동결이 아니라 Wallet SDK 오프체인 DB의 상태입니다. 온체인 잔액은\n그대로이고, Wallet SDK가 그 자금을 움직이는 요청을 받지 않는 것입니다.\n\n## 자동 해제는 없습니다\n\n가상자산 이전 시 송·수신 정보를 사업자끼리 교환하는 규제 의무인 트래블룰의 정보가 맞아떨어져도\n시스템이 스스로 풀지 않습니다. 주소에 등재 근거를 붙이는 장부인\n[주소록](/fund-flows/address-book)에 등록된 주소에서 왔어도 마찬가지입니다.\n\n**확인 근거는 판단 재료일 뿐 방아쇠가 아닙니다.** 근거를 확정 통지에 담아 보내면, 그것을 본\n파트너사나 운영자가 해제를 요청합니다. 그래서 해제 근거는 두 가지뿐입니다.\n\n| 값 | 누가 요청했나 |\n|---|---|\n| `SERVICE_REQUEST` | 파트너사 |\n| `ADMIN_REQUEST` | 운영자 |\n\n## 해제가 어디서 일어나는지는 용도가 정합니다\n\n**해제의 용도가 경로를 가릅니다.** 그냥 가용 자산으로 만들려는 것이면 해제는 독립된 상태\n전이이고, 특정 건을 옮기려는 것이면 해제와 이동이 원자적이어야 합니다.\n\n### 워크스페이스 지갑 입금은 독립 해제로 풉니다\n\n워크스페이스 지갑으로 들어온 자금은 **해제 요청으로 풀고, 풀린 금액이 가용 잔액으로 편입**됩니다.\n가용 잔액은 온체인 잔액에서 동결분과 진행 중 출금 예약분을 뺀 값입니다. 그 뒤로는 누가 쓰든\n상관없습니다. 해제의 목적이 가용 자산을 늘리는 것이기 때문입니다.\n\n해제는 건 단위 전액입니다. 입금 레코드가 `FROZEN`에서 `RELEASED`로 전이합니다.\n\n### 계정 지갑 입금은 이동이 해제를 겸합니다\n\n계정 지갑 자산을 워크스페이스 vault로 모으는 이동인 [집금](/fund-flows/sweep)을 요청할 때 입금 건\n하나를 지목하면, 그 건의 해제와 워크스페이스 vault로의 송금이 한 트랜잭션에 들어갑니다. 상태는\n`FROZEN`에서 `WITHDRAWN`으로 직행하고 `RELEASED`를 거치지 않습니다.\n\n**해제와 송금을 순차로 하면 그 사이에 시간차가 생깁니다.** 해제로 늘어난 금액을 그 창에서 다른 요청이\n소진하면, 원래 옮기려던 건이 옮겨지지 않습니다.\n\n## 확인 근거는 입금마다 다릅니다\n\n| 입금 | 확인 근거 | 해제 |\n|---|---|---|\n| VASP → 계정 지갑 | 트래블룰 정보 | 그 건을 지정한 이동이 겸합니다 |\n| 개인 지갑 → 계정 지갑 | 그 계정의 주소록 항목 | 그 건을 지정한 이동이 겸합니다 |\n| 회사 외부 → 워크스페이스 지갑 | 워크스페이스 주소록 항목 | 독립 해제 요청 |\n| VASP·개인 → 워크스페이스 지갑 | 없음 — vault의 확인 근거는 워크스페이스 주소록뿐입니다 | 독립 해제 요청 |\n| 미등록 발신처 | 없음 | 위 규칙을 그대로 따릅니다 |\n\n**근거가 없다고 해제가 막히는 것은 아닙니다.** 근거는 파트너사와 운영자가 판단할 재료이고, 판단의\n책임은 요청하는 쪽에 있습니다.\n\n## 동시성 방어는 두 자원에 적용됩니다\n\n같은 목적을 서로 다른 자원에 적용합니다. 하나는 금액에, 하나는 건에.\n\n### 지갑을 출발지로 쓰는 송금은 금액을 예약합니다\n\n가용 잔액은 조회가 아니라 예약입니다. 조회만 하면 동시 요청 두 건이 같은 값을 보고 둘 다\n통과합니다.\n\n```\n가용 잔액 = 온체인 잔액 − 동결 금액 − 진행 중 송금 예약분\n```\n\n예약은 두 단계입니다. 요청을 접수할 때 금액을 예약하고, 송금이 성공하면 그 예약을 확정합니다.\n\n송금이 실패하면 예약이 풀려 가용 잔액으로 돌아옵니다. 예약된 동안에는 그 금액이 다른 요청의\n가용 잔액에서 빠져 있습니다.\n\n예약은 지갑에서 나가는 송금 셋에 함께 적용됩니다 — 계정 귀속 출금·자기 귀속 출금·vault 이체입니다.\n하나만 빼면 vault 이체로 옮긴 뒤 출금하는 우회 경로가 생깁니다.\n\n예약은 Wallet SDK 원장 기준의 방어입니다. 온체인 잔액이 충분한지를 요청 시점에 조회하지는 않아,\n예약을 통과한 요청도 뒷단 플랫폼이 제출을 거절하면 잔액 부족으로 실패합니다.\n\n**이 예약은 vault 이체에만 들어와 있습니다.** 계정 귀속 출금과 자기 귀속 출금은 아직 잔액을 사전\n검증하지 않고 접수되며, 부족은 제출 결과로만 드러납니다. 그동안은 vault 이체로 옮긴 뒤 출금하는\n우회 경로가 아직 있습니다.\n\n### 입금 건을 출발지로 쓰는 송금은 건을 지정합니다\n\n입금 건 지정을 조건부 갱신으로 취합니다. \"그 건이 동결 상태이고 활성 지정이 없다\"를 조건에 담아\n갱신하고, 영향받은 행이 1건일 때만 통과시킵니다.\n\n선조회 후 검사로 하면 동시 요청 둘이 모두 \"지정 없음\"을 관측해 같은 건을 이중 소진합니다. 입금\n1건은 **활성 이동 1건**에만 지정됩니다.\n\n## 인가의 강도는 요청한 주체에 따라 달라집니다\n\n**파트너사 API 요청에는 정족수가 없습니다.** 정족수는 승인에 필요한 최소 인원입니다.\n\n그 요청이 만든 이동의 서명 인가 하나만 통과하면 됩니다.\n\n어드민 액션이 승인자의 확인을 거쳐야 실행되는 통제인 승인 게이팅은 운영자가 시작한 요청 중\n일부에만 적용됩니다. 그리고 승인이 필요한 경로에서는 요청자와 승인자가 같을 수 없습니다.\n\n정족수를 실제로 요구하는 것은 워크스페이스 지갑 입금 해제와 오입금 반환이고, 둘 다 운영자\n경로입니다.\n\n## 다음으로\n\n집금이 해제를 겸하는 구간의 상세는 [집금](/fund-flows/sweep)에 있습니다. 예약을 실제로 소비하는\n쪽은 [출금](/fund-flows/withdrawal)과 [Vault 이체](/fund-flows/vault-transfer)입니다.\n", "kind": "참고 문서", "path": "_reference/fund-flows--release.html", "reference": true}, {"title": "집금 (Sweep)", "text": "---\ntitle: 집금 (Sweep)\ndescription: 입금 건을 지목해 옮기고, 그 이동이 해제를 겸한다\n---\n\n_읽는 사람: 파트너사 개발자. 집금 요청이 접수에서 원장 반영까지 거치는 구간을 설명합니다._\n\n집금은 계정 지갑에 흩어진 자금을 워크스페이스 vault로 모으는 이동입니다. 이 페이지는 요청 접수와\n정책 판단, 서명 직전 대조, 원장 반영까지를 순서대로 설명합니다. 요청은 입금 건 하나를 지목하고,\n옮길 금액은 그 건이 정합니다.\n\n## 요청은 접수만 되고 판단은 뒤따릅니다\n\n다이어그램의 배역은 일곱입니다.\n\n- **파트너사**: Wallet SDK를 도입한 회사, 곧 Workspace 하나입니다\n- **Wallet SDK**: 파트너 대상 API를 받아 정책 엔진에 판단을 묻고 서명 인프라에 제출하는 서버 컴포넌트입니다\n- **지갑 원장**: 지갑·입금·집금 기록을 담는 Wallet SDK 쪽 저장소입니다\n- **정책 엔진**: 자금을 움직이는 요청이 서명 인프라로 가기 전에 그 요청을 심사하는 별도 시스템입니다\n- **정책 저장소**: 판단 요청과 평가 결과, 서명 인가를 담는 정책 엔진 쪽 저장소입니다\n- **이벤트 스트림**: 판단 완료 이벤트를 구독자에게 나르는 경로입니다\n- **뒷단 플랫폼**: 지갑과 키를 보관하고 트랜잭션을 제출하는 외부 플랫폼입니다\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant PT as 파트너사\n    participant SYS as Wallet SDK\n    participant DB as 지갑 원장\n    participant POL as 정책 엔진\n    participant PDB as 정책 저장소\n    participant EVT as 이벤트 스트림\n    participant PROV as 뒷단 플랫폼\n\n    PT ->> +SYS : POST /sweeps\u003cbr/>depositId · 목적지 워크스페이스 vault · referenceId\n    SYS ->> DB : 계정 지갑 입금 건 확인\n    SYS ->> DB : 집금 / sweepId 채번, 입금 건 연결\n    SYS ->> +POL : 판단 요청\u003cbr/>sweepId · 출발 vault · 토큰 · 금액 · 목적지 · depositId\n    POL -->> -SYS : 202 접수 (판단 요청 식별자)\n    SYS -->> -PT : OK (sweepId)\n    Note over POL, PDB : 이하 평가는 내부 큐에서 비동기로 돕니다\n    POL ->> PDB : 판단 요청 저장\n    POL ->> POL : 정책 평가\n    POL ->> PDB : 평가 결과 저장 (승인)\n    POL ->> PDB : 서명 인가 발급 (TTL · 1회용)\n    POL ->> EVT : 판단 완료 이벤트\n    EVT ->> SYS : 구독 수신\n    SYS ->> DB : 계정 지갑 입금·집금 / 조건부 갱신 — 동결이고 활성 지정이 없을 때만 트랜잭션 시작 마킹\n    Note right of SYS : 이 갱신이 곧 \"입금당 활성 집금 1건\" 락입니다\n    SYS ->> PROV : 집금 트랜잭션 요청\u003cbr/>externalTxId = 서명 인가 식별자\n```\n\n요청에 함께 넣는 `referenceId`는 재시도 복구의 유일한 키입니다. 응답을 받지 못한 요청을 같은\n값으로 다시 보내면 이미 만들어진 집금을 되찾습니다.\n\n서명 인가는 승인된 판단 요청이 발급하는 한 번만 쓸 수 있는 서명 근거입니다. **옛 설계는 판단\n요청에 그 인가를 동기로 돌려줬습니다.** 지금은 202로 접수만 하고 결과를 이벤트로 냅니다. 그\n2단계 규율은 [서명 게이트](/policy/signing-gate)에서 정합니다.\n\n## 서명 직전에 다시 대조합니다\n\n앞 다이어그램에 없던 배역은 둘입니다.\n\n- **Co-Signer**: 서명 인프라 쪽에서 서명 직전에 정책 엔진 콜백으로 승인을 묻는 구성 요소입니다\n- **온체인**: 블록체인 네트워크입니다\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant PROV as 뒷단 플랫폼\n    participant CS as Co-Signer\n    participant POL as 정책 엔진\n    participant PDB as 정책 저장소\n    participant OC as 온체인\n    participant SYS as Wallet SDK\n    participant DB as 지갑 원장\n    participant PT as 파트너사\n\n    PROV ->> CS : Co-Signer 승인 요청\n    CS ->> +POL : 콜백으로 승인 요청\n    POL ->> PDB : 승인 여부 확인\n    POL ->> PDB : 서명 인가 소비 저장\n    Note over POL, CS : 옛 설계에는 여기서 파트너사에 되묻는 구간이 있었습니다.\u003cbr/>지금 콜백 경로는 외부를 호출하지 않고, 파트너 심사는 평가 시점에 PIP로 수집합니다\n    POL -->> -CS : OK\n    CS -->> PROV : OK\n    PROV -->> OC : 트랜잭션\n\n    Note over SYS, PROV : 트랜잭션 전파 이후\n    PROV ->> +SYS : 집금 감지 통지\n    SYS ->> DB : 계정 지갑 입금·집금 / 상태 변경\n    SYS ->> PT : 통지 / 집금 시작\n    SYS -->> -PROV : OK\n    PROV ->> +SYS : 집금 확정 통지\n    SYS ->> DB : 계정 지갑 입금·집금 / 상태 변경\n    SYS ->> SYS : 원장 반영 — 해제 CREDIT과 이동 DEBIT을 같은 시점에\n    SYS ->> PT : 통지 / 집금 완료 (finalized)\n    SYS -->> -PROV : OK\n```\n\n콜백 경로가 밖으로 나가지 않는 이유는 시간입니다. 응답이 늦으면 뒷단 플랫폼이 재시도하지 않고\n서명 요청을 취소합니다. 자세한 규율은 [서명 게이트](/policy/signing-gate)에 있습니다.\n\n## 해제와 이동이 원자적입니다\n\n집금을 요청하면 그 입금 건의 상태가 동결에서 출금 완료로 직행합니다. `RELEASED`를 거치지\n않습니다.\n\n해제와 송금을 순차로 하면 그 사이에 시간차가 생깁니다. 해제로 늘어난 금액을 그 창에서 다른 요청이\n소진하면, 원래 옮기려던 건이 옮겨지지 않습니다.\n\n## 지정은 조회가 아니라 조건부 갱신입니다\n\n\"그 입금이 동결이고 활성 지정이 없다\"를 갱신 조건에 담고, 영향받은 행이 1건일 때만 통과시킵니다.\n\n선조회 후 검사로 구현하면 동시 요청 둘이 모두 \"지정 없음\"을 관측해 같은 건을 이중 소진합니다.\n**입금 1건은 활성 이동 1건에만 지정됩니다.**\n\n## 인가는 서명 인가 하나뿐입니다\n\n파트너사가 요청한 집금에는 정족수가 붙지 않습니다. 정족수는 승인에 필요한 최소 인원입니다.\n\n그 요청이 만든 이동의 서명 인가 하나만 통과하면 됩니다.\n\n정책은 지정한 건의 동결 상태와 확인 근거 유무, 해제 금액을 보고 판단합니다.\n\n**목적지 vault의 용도 태그는 아직 그 입력에 들어오지 않습니다.** 태그를 판단 입력으로 읽는 경로가\n신설로 정해졌습니다. 상세는 평가 시점에 사실을 읽어 오는 수집 경로인\n[PIP](/policy/runtime/pip)에 있습니다.\n\n## 비활성 계정에서도 집금은 동작합니다\n\n계정이 비활성이어도 집금은 허용합니다. 원장 반영 같은 오케스트레이션을 파트너사가 처리할 수 있기\n때문입니다. 출금과 갈리는 지점입니다.\n\n## 집금이 실패하면 지정했던 입금 건이 동결로 돌아옵니다\n\n집금이 실패로 종결되면 지정했던 입금 건은 다시 `FROZEN`이 됩니다. 그래서 같은 건을 다시 집금할 수\n있습니다.\n\n되돌리는 지점은 실패 종결 한 곳입니다. 요청 흐름에서 거절된 경우와 실패 통지를 받은 경우, 대사가\n실패로 판정한 경우가 모두 그 경로를 거칩니다. 되돌린 사실은 감사 기록으로 남습니다.\n\n## 다음으로\n\n집금은 시작·완료·실패를 각각 통지합니다 — `SWEEP_INITIATED`·`SWEEP_FINALIZED`·`SWEEP_FAILED`.\n통지 본문과 중복 제거 규칙은 [웹훅](/fund-flows/webhooks)에 있습니다.\n\n집금이 겸하는 해제가 왜 자동으로 일어나지 않는지는 [자금 동결](/fund-flows/release)에 있습니다.\n", "kind": "참고 문서", "path": "_reference/fund-flows--sweep.html", "reference": true}, {"title": "Vault 이체 (Vault Transfer)", "text": "---\ntitle: Vault 이체 (Vault Transfer)\ndescription: 워크스페이스 vault 사이에서만 도는 이동\n---\n\n_읽는 사람: 파트너사 개발자. 워크스페이스 vault 사이 이동의 흐름과 실패 계약을 설명합니다._\n\nVault 이체는 워크스페이스 vault에서 다른 워크스페이스 vault로 자산을 옮기는 이동입니다. 이\n페이지는 그 흐름과 확인 근거가 빠지는 이유, 상태 단계와 실패 사유, 재시도 복구 방법을 설명합니다.\n출발지와 목적지가 둘 다 Wallet SDK 안의 vault라, 목적지 확인 근거가 필요 없는 유일한 이동입니다.\n\n## 요청 하나가 접수에서 완료 통지까지 한 흐름으로 처리됩니다\n\n다이어그램의 배역은 다섯입니다.\n\n- **파트너사**: Wallet SDK를 도입한 회사, 곧 Workspace 하나입니다\n- **Wallet SDK**: 파트너 대상 API를 받아 정책 엔진에 판단을 묻고 서명 인프라에 제출하는 서버 컴포넌트입니다\n- **정책 엔진**: 자금을 움직이는 요청이 서명 인프라로 가기 전에 그 요청을 심사하는 별도 시스템입니다\n- **뒷단 플랫폼**: 지갑과 키를 보관하고 트랜잭션을 제출하는 외부 플랫폼입니다\n- **온체인**: 블록체인 네트워크입니다\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant PT as 파트너사\n    participant SYS as Wallet SDK\n    participant POL as 정책 엔진\n    participant PROV as 뒷단 플랫폼\n    participant OC as 온체인\n\n    PT->>SYS: 이체 요청 (출발 vault · 목적지 vault · 토큰 · 금액)\n    SYS->>SYS: 양쪽 vault 유효성 확인 — 온체인 잔액은 보지 않는다\n    SYS->>SYS: 원장 가용 잔액 예약 — 부족하면 400\n    SYS->>SYS: 이체 기록 생성\n    SYS->>POL: 판단 요청\n    POL-->>SYS: 서명 인가 (TTL · 1회용)\n    SYS->>PROV: 전송 제출 — 인가 식별자를 함께\n    PROV-->>SYS: 제출 접수\n    PROV->>OC: 온체인 전송\n    OC-->>PROV: 확정\n    PROV-->>SYS: 완료 콜백\n    SYS->>SYS: 정산 중으로 기록\n    SYS->>SYS: 목적지 vault 잔액 반영\n    SYS->>SYS: 출발 vault 잔액 반영 · 완료\n    SYS->>PT: 완료 통지\n```\n\n## 양쪽 끝이 내부라 확인 근거가 빠집니다\n\n출금은 목적지가 외부라 주소록이나 트래블룰로 근거를 세웁니다. vault 이체는 양쪽이 다 Wallet\nSDK가 소유한 vault여서 그 절차가 통째로 빠집니다.\n\n**남는 통과 조건은 서명 인가 하나입니다.** 서명 인가는 승인된 판단 요청이 발급하는 한 번만 쓸 수 있는\n서명 근거입니다. 정책은 출발·목적지 vault와 토큰과 금액을 보고 판단합니다. 판단과 집행이 나뉘는\n구조는 [서명 게이트](/policy/signing-gate)에 있습니다.\n\nvault의 용도 태그를 정책이 읽는 경로는 신설 예정입니다. 지금은 그 태그를 판단 입력으로 가져오는\n수집 경로가 없고, 신설이 정해졌습니다. 상세는 평가 시점에 사실을 읽어 오는 수집 경로인\n[PIP](/policy/runtime/pip)에 있습니다.\n\n## 쌍은 종류를 가리지 않되 워크스페이스를 넘지 않습니다\n\n같은 워크스페이스 안이면 어느 vault에서 어느 vault로든 갑니다. vault를 가르는 것은 파트너사가\nvault 용도를 정의하는 값인 용도 태그입니다. 그 태그는 이동을 막는 벽이 아니라 정책 판단에 쓰려고\n두는 값입니다.\n\n**워크스페이스를 넘는 이동은 없습니다.** 남의 워크스페이스 vault를 목적지로 지목하면 조회 단계에서\n없는 것으로 답하고, 정책 쪽에서도 평가에 들어가기 전에 한 번 더 막습니다.\n\n이것을 룰로 막지 않는 이유는 정책이 평가하는 요청 항목에 워크스페이스가 없기 때문입니다. 룰은\n목적지 vault의 종류까지만 지목할 수 있어, 그 앞의 수집 단계가 이 역할을 대신합니다.\n\n계정 지갑은 어느 쪽에도 오지 않습니다. 계정 지갑에서 vault로 오는 이동은\n[집금](/fund-flows/sweep)이고, vault에서 계정 지갑으로 되돌아가는 경로는 없습니다.\n\n## 잔액 부족은 드러나는 시점이 둘입니다\n\n**원장 가용 잔액이 모자라면 요청 시점에 400입니다**(`WORKSPACE_VAULT_INSUFFICIENT_BALANCE`).\n온체인 잔액 부족만 사후에 이체 상태로 드러납니다.\n\n이체를 접수할 때 온체인 잔액이 충분한지는 조회하지 않습니다. 부족은 뒷단 플랫폼이 제출을 거절할\n때 드러나고, 그 건은 잔액 부족을 사유로 실패 마킹됩니다.\n\nWallet SDK 원장 기준의 예약은 그것과 별개로 적용됩니다. vault 이체도 지갑을 출발지로 쓰는 송금이라\n접수 시점에 금액을 예약하고, 송금이 성공하면 그 예약을 확정합니다.\n\n송금이 실패하면 예약이 풀립니다. 예약이 막는 것은 동시 요청이 같은 잔액을 두 번 쓰는 것이고,\n온체인 충분성은 예약을 통과한 뒤에도 보증되지 않습니다. 예약의 기준 설명은\n[자금 동결](/fund-flows/release)에 있습니다.\n\n## 상태는 다섯 단계를 지나고 정산 중 전까지는 어디서든 실패합니다\n\n접수 → 심사 → 온체인 → 정산 중 → 완료 순으로 갑니다. 정산 중은 온체인 완료가 확인됐고 두 vault의\n잔액 반영이 남은 구간입니다. 목적지 vault의 잔액이 먼저 오르고, 출발 vault의 잔액이 내려가면서\n완료가 됩니다. 완료 통지는 그 뒤에 나갑니다.\n\n**정산 중에 이르면 실패로 끝나지 않습니다.** 온체인에서 이미 옮겨진 자산이라 되돌릴 실패가 없기\n때문입니다. 실패는 접수·심사·온체인 단계에서만 옵니다.\n\n정산 중에 머무는 시간은 보통 1초 안입니다. 내부 처리가 끊기면 대사가 몇 분 안에 이어 갑니다. 그\n사이 출발 vault의 가용 잔액은 이체 금액만큼 잡혀 있고, 목적지 vault의 가용 잔액은 반영이 끝난\n쪽부터 오릅니다.\n\n세부 상태가 그 안을 가릅니다. 접수 단계에서만 비어 있고 그 뒤로는 항상 채워집니다. 정산 중과\n완료에서는 `COMPLETED`입니다. 값 목록은 [Wallet API](/reference/wallet)에 있습니다.\n\n## 실패 사유는 드러나는 시점으로 갈립니다\n\n요청 시점에 400으로 거부되는 것은 다섯입니다 — 출발지와 목적지가 같은 vault\n(`WORKSPACE_VAULT_TRANSFER_SOURCE_DESTINATION_SAME`), 금액이 0 이하이거나 토큰 정밀도를 넘는 경우\n(`..._INVALID_AMOUNT`), 같은 `referenceId`가 이미 쓰인 경우(`..._REFERENCE_CONFLICT`), 어느 한쪽\nvault가 비활성인 경우(`WORKSPACE_VAULT_INACTIVE`), 출발 vault의 원장 가용 잔액이 모자란 경우\n(`WORKSPACE_VAULT_INSUFFICIENT_BALANCE`)입니다.\n\n정책 거부도 요청 시점에 400으로 옵니다(`..._POLICY_DENIED`). 다만 이체 기록은 남고 실패\n상태로 마킹됩니다. 거부된 시도가 조회되지 않으면 무슨 일이 있었는지 되짚을 수 없기 때문입니다.\n\n404는 \"없다\"로 통일합니다. vault·토큰·해당 지갑이 없을 때가 여기 들어가고, 남의 워크스페이스\n자원도 같은 응답입니다. 코드를 갈라 주면 그것이 곧 존재 여부를 알려주는 오라클이 됩니다.\n\n제출 이후에 드러나는 것은 잔액 부족과 트랜잭션 revert, 타임아웃입니다. 상태와 세부 상태에\n담겨 오고 요청 응답에는 나타나지 않습니다.\n\n**제출 결과 자체가 불명이면 503입니다**(`..._PROVIDER_UNAVAILABLE`). 이때 이체는 실패가 아니라\n접수 상태로 남고, 기록과 뒷단 플랫폼의 사실이 어긋난 것을 바로잡는 2차 방어인 대사가 정리합니다.\n나갔는지 모르는 것을 실패로 판정하면 이중 송금이 일어날 수 있습니다.\n\n값 목록과 전체 조건은 [Wallet API](/reference/wallet)가 기준 문서입니다.\n\n## 재시도 복구는 `referenceId`로 합니다\n\n요청에 `referenceId`를 실으면 그 값으로 이체를 되찾을 수 있습니다. 같은 값으로 두 번 만들면\n거부되므로 업무 단위 중복도 함께 막힙니다.\n\n`Idempotency-Key` 헤더는 아직 동작하지 않습니다. 현재 상태는 [첫 요청](/start/first-request)에\n있습니다.\n\n## 양쪽이 내부라 출금과 확인 근거가 갈립니다\n\n| | vault 이체 | 출금 |\n|---|---|---|\n| 목적지 | 워크스페이스 vault | VASP · 개인 지갑 · 회사 외부 지갑 |\n| 확인 근거 | 없음 — 양쪽이 내부입니다 | 주소록 또는 트래블룰 |\n| 트래블룰 | 타지 않습니다 | 계정 귀속 출금의 VASP 목적지만 |\n| 자금 귀속 | 워크스페이스 | 최종 사용자 또는 회사 |\n\n## 다음으로\n\nvault 이체는 완료와 실패만 통지합니다 — `VAULT_TRANSFER_FINALIZED`·`VAULT_TRANSFER_FAILED`.\n시작 통지가 없으므로 접수 직후 상태는 조회로 확인합니다. 통지 본문은\n[웹훅](/fund-flows/webhooks)에 있습니다.\n\n셋으로 나뉜 출금은 [출금](/fund-flows/withdrawal)에 있습니다.\n", "kind": "참고 문서", "path": "_reference/fund-flows--vault-transfer.html", "reference": true}, {"title": "웹훅(Webhook)", "text": "---\ntitle: 웹훅(Webhook)\ndescription: 무엇이 언제 오고 무엇을 하면 되는가\n---\n\n_읽는 사람: 파트너사 개발자. 어떤 통지가 언제 오고 받는 쪽이 무엇을 하면 되는지를 설명합니다._\n\n웹훅은 통지를 나르는 채널입니다. 파트너사가 등록한 URL로 HTTP 호출이 갑니다. 통지는 온체인\n이벤트를 파트너사에 보내는 아웃바운드 호출이고, 웹훅에 담기는 내용물입니다.\n\n## 인지할 수 있는 온체인 이벤트는 걸러내지 않고 보냅니다\n\n온체인 이벤트는 최대한 보냅니다. 파트너사가 무엇을 원장에 반영할지는 파트너사가 정할 문제입니다.\n\n입금 통지는 두 단계로 오고, 확정 뒤에 확인 재료가 늘면 갱신 통지가 따라옵니다.\n\n| 이벤트 | 언제 | 파트너사에게 보이는 상태 |\n|---|---|---|\n| `DEPOSIT_DETECTED` | 온체인에서 관측했을 때 | `DETECTED` |\n| `DEPOSIT_FINALIZED` | 확정됐을 때 | `FINALIZED` |\n| `DEPOSIT_UPDATED` | 확정 뒤에 트래블룰 매핑이나 KYT 결과가 붙었을 때 | `FINALIZED` |\n| `DEPOSIT_FAILED` | 확정 전에 실패했을 때 | `FAILED` |\n\n갱신 통지는 한 건에 여러 번 올 수 있고, 매번 그 순간까지 확인된 정보를 전부 담습니다. 트래블룰\n정보가 온체인 확정보다 늦게 오는 것이 보통이라 확정 통지에는 없던 값이 갱신 통지에 들어갑니다.\n왜 그 순서인지는 [입금](/fund-flows/deposit)에 있습니다.\n\n**파트너사에게 보이는 상태는 도메인 상태와 다릅니다.** 확정된 입금의 도메인 상태는\n동결(`FROZEN`)이지만 통지에는 `FINALIZED`로 나갑니다. 동결은 입금을 확정 시 fail-closed로 잡아\n두는 상태입니다([자세히](/fund-flows/release)).\n\n해제는 파트너사가 요청하는 흐름입니다. 그래서 통지는 \"확정됐다\"까지만 말하고, 동결 여부를\n파트너사에게 보이는 상태 이름에 섞지 않습니다.\n\n## 나가는 자금도 시작과 끝을 통지합니다\n\n출금·집금·vault 이체도 각각 통지를 냅니다. 이동 종류마다 이벤트 이름이 갈립니다.\n\n| 이벤트 | 언제 |\n|---|---|\n| `WITHDRAWAL_INITIATED` | 출금 트랜잭션을 제출했을 때 |\n| `WITHDRAWAL_FINALIZED` | 출금이 온체인에서 확정됐을 때 |\n| `WITHDRAWAL_FAILED` | 출금이 실패로 끝났을 때 |\n| `SWEEP_INITIATED` | 집금 트랜잭션을 제출했을 때 |\n| `SWEEP_FINALIZED` | 집금이 온체인에서 확정됐을 때 |\n| `SWEEP_FAILED` | 집금이 실패로 끝났을 때 |\n| `VAULT_TRANSFER_FINALIZED` | vault 이체가 온체인에서 확정됐을 때 |\n| `VAULT_TRANSFER_FAILED` | vault 이체가 실패로 끝났을 때 |\n\n**vault 이체에는 시작 통지가 없습니다.** 출금과 집금에는 `..._INITIATED`가 있지만 vault 이체는\n완료와 실패만 냅니다. 접수 직후의 진행 상태가 필요하면 조회로 확인합니다.\n\n## 통지 본문에는 판단 재료가 들어갑니다\n\n관측·확정 통지의 본문은 아래 형태입니다.\n\n```json\n{\n  \"depositId\": \"awd-...\",\n  \"status\": \"FINALIZED\",\n  \"workspaceId\": \"ws-...\",\n  \"tenantId\": \"tn-...\",\n  \"accountId\": \"acc-...\",\n  \"accountWalletId\": \"aw-...\",\n  \"tokenId\": \"tok-...\",\n  \"amount\": \"100.00\",\n  \"amountRaw\": \"100000000\",\n  \"txHash\": \"0x...\",\n  \"sourceRegistered\": true,\n  \"addressBookId\": \"aab-...\",\n  \"travelRule\": null,\n  \"kyt\": null\n}\n```\n\n`sourceRegistered`는 발신 주소가 그 계정의 주소록에 등록돼 있는지입니다. 주소록은 주소에 등재\n근거를 붙이는 장부입니다([자세히](/fund-flows/address-book)). 해제를 요청할지 판단하는 근거로\n씁니다. 등록돼 있으면 `addressBookId`가 함께 옵니다.\n\n`travelRule`은 트래블룰 매핑이 끝난 뒤 `trId`와 상대 VASP 식별자를 담고, `kyt`는 KYT 검사가 끝난\n뒤 결과와 시각을 담습니다. 둘 다 아직 없으면 `null`입니다. 확정 통지에 `null`로 왔다가 갱신 통지에서\n채워지는 것이 보통입니다.\n\n**실패 통지에는 `sourceRegistered`·`addressBookId`가 없습니다.** 판단할 것이 없기 때문입니다.\n\n## 중복 수신을 전제로 만듭니다\n\n수신 측은 같은 통지를 두 번 받을 수 있다고 보고 만듭니다. `correlationKey`가\n`{depositId}:{eventType}` 형태로 오므로, 수신 측은 그 값으로 중복을 제거합니다.\n\n`depositId`만으로 제거하면 안 됩니다. 관측 통지와 확정 통지가 같은 `depositId`를 공유해서, 키만\n보면 확정 통지가 중복으로 걸러집니다.\n\n갱신 통지는 `{depositId}:DEPOSIT_UPDATED:{순번}`입니다. 한 건에 갱신이 여러 번 오므로 이벤트\n종류만으로는 갈리지 않고, 순번이 1씩 오릅니다. 순번이 큰 통지가 최신 상태입니다.\n\n## 아직 지키지 못하는 것\n\n통지가 아직 지키지 못하는 것이 둘입니다.\n\n**트래블룰 정보와 갱신 통지는 아직 나가지 않습니다.** 트래블룰은 가상자산 이전 시 송·수신 정보를\n사업자끼리 교환하는 규제 의무입니다([자세히](/#함께-제공하는-모듈)). `DEPOSIT_UPDATED`와 `travelRule`·`kyt`\n필드는 계약으로 정해졌지만 트래블룰 매칭과 KYT 연동이 아직 구현되지 않았습니다. 그때까지 VASP\n입금의 해제 판단은 주소록 등록 여부 하나에 기댑니다.\n\n재시도가 4xx와 5xx를 구분하지 않습니다. 지금은 둘 다 똑같이 재시도해서, 영구 실패로 판정해야 할\n응답도 재시도 대상이 됩니다. 진행 상황은 [변경 이력](/changelog)에서 추적합니다.\n", "kind": "참고 문서", "path": "_reference/fund-flows--webhooks.html", "reference": true}, {"title": "출금 (Withdrawal)", "text": "---\ntitle: 출금 (Withdrawal)\ndescription: 워크스페이스 vault에서 외부로, 그리고 계정 지갑의 오입금 반환\n---\n\n_읽는 사람: 파트너사 개발자. 워크스페이스 vault에서 나가는 출금 셋과 그 확인 근거를 설명합니다._\n\n출금은 워크스페이스 vault에서 외부로 자금이 나가는 이동이고, 계정 지갑에서 직접 나가는 오입금\n반환도 여기 들어갑니다. 목적지가 무엇이냐에 따라 앞 구간이 달라지고, 달라진 둘이 만난 뒤는 한\n절차입니다. 아래 세 다이어그램이 그 순서입니다.\n\n## VASP 출금은 상대 거래소와 정보를 두 번 주고받습니다\n\n이 흐름은 계약에만 있습니다. 지금 `CUSTODIAL` 목적지를 지정하면 첫 검증에서 400\n`ACCOUNT_WITHDRAWAL_CUSTODIAL_UNSUPPORTED` 가 돌아옵니다.\n\n다이어그램의 배역은 여섯입니다.\n\n- **상대 거래소 (VASP)**: 자산을 받는 상대편 가상자산사업자입니다\n- **최종 사용자**: 파트너사 서비스를 쓰는 사람입니다\n- **파트너사**: Wallet SDK를 도입한 회사, 곧 Workspace 하나입니다\n- **Wallet SDK**: 파트너 대상 API를 받아 정책 엔진에 판단을 묻고 서명 인프라에 제출하는 서버 컴포넌트입니다\n- **지갑 원장**: 출금·트래블룰·주소록 기록을 담는 Wallet SDK 쪽 저장소입니다\n- **트래블룰 게이트웨이**: 송·수신 정보를 사업자끼리 교환하는 트래블룰 경로를 중개합니다\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant EX as 상대 거래소 (VASP)\n    participant U as 최종 사용자\n    participant PT as 파트너사\n    participant SYS as Wallet SDK\n    participant DB as 지갑 원장\n    participant TR as 트래블룰 게이트웨이\n\n    U ->> +PT : 출금 화면 조회\n    PT ->> +SYS : 연동 VASP 목록 조회\u003cbr/>GET /travel-rules/vasps\n    SYS ->> +TR : 연동 VASP 목록 조회\n    TR -->> -SYS : VASP 목록 반환\n    SYS -->> -PT : VASP 목록 반환\n    PT -->> -U : VASP 목록 반환\n    U ->> U : VASP 선택, 수신인 이름·지갑 주소·토큰 입력\n    U ->> PT : 출금 요청\n    PT ->> PT : AML·FDS 검사\n    PT ->> +SYS : POST /accounts/{accountId}/withdrawals\u003cbr/>CUSTODIAL · vaspId · 송·수신인 PII · 지갑 주소 · 토큰 · 금액 · 출발 vault\n    SYS ->> DB : 계정 귀속 출금 / 출금 정보 저장\n\n    SYS ->> +TR : 수신인 지갑 주소 확인\u003cbr/>vaspId · address\n    TR ->> +EX : 수탁 지갑인지 확인\u003cbr/>vaspId · address\n    EX -->> -TR : OK\n    TR -->> -SYS : VASP 내 지갑 보유 여부 응답\n\n    alt 지갑 보유 여부 확인 실패\n        SYS ->> PT : 출금 실패 전달\u003cbr/>고객 정보 불일치 · withdrawalId\n    end\n\n    SYS ->> DB : 트래블룰 / 식별자 채번, withdrawalId 연결\n    SYS ->> +TR : VASP 간 PII 교환 요청\u003cbr/>트래블룰 식별자 · 송·수신인 PII · 지갑 주소 · 토큰 · 금액\n    TR ->> +EX : 송·수신인 PII 검증 요청\n    EX -->> -TR : 요청 응답 w/ 검증 UUID\n    TR -->> -SYS : 교환 요청 응답 w/ 트래블룰 식별자 · 검증 UUID\n    SYS -->> DB : 트래블룰 / 식별자로 검증 UUID 업데이트\n\n    SYS -->> -PT : 출금 정보 반환\u003cbr/>지갑 검증 여부 · withdrawalId · 트래블룰 식별자\n    Note right of SYS : 출금 추적용 식별자를 돌려줍니다\n    PT ->> PT : 트래블룰 기록 (withdrawalId 기준)\n\n    Note over EX, TR : 상대 VASP의 교환 응답이 오면 내부 상태를 바꾸고 파트너사에 알립니다\n\n    EX ->> +TR : 송·수신인 PII 검증 응답 (콜백)\n    TR -->> -EX : OK\n\n    TR ->> SYS : PII 검증 응답\u003cbr/>검증 UUID · 트래블룰 상태 (SUCCESS · DENIED)\n    SYS ->> DB : 트래블룰 / 검증 UUID로 상태 업데이트\n\n    SYS ->> PT : 통지 / 트래블룰 완료\u003cbr/>withdrawalId · 트래블룰 상태\n    Note left of SYS : 여기까지가 트래블룰 검증 흐름입니다\n    PT ->> PT : 트래블룰 상태 업데이트 (withdrawalId 기준)\n```\n\n## 개인 지갑 출금은 주소록 등재가 선행됩니다\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant U as 최종 사용자\n    participant PT as 파트너사\n    participant SYS as Wallet SDK\n    participant DB as 지갑 원장\n\n    U ->> PT : 개인 지갑 등록\n    PT ->> +SYS : POST /accounts/{accountId}/address-books/nonce\n    SYS -->> -PT : nonce 발급\n    PT ->> PT : 개인 지갑으로 서명\n    PT ->> +SYS : POST /accounts/{accountId}/address-books\n    SYS ->> SYS : nonce와 서명 검증\n    SYS ->> DB : 계정 주소록 / 화이트리스트 주소 저장\n    SYS -->> -PT : 개인 지갑 등록 완료 응답\n\n    Note over PT, SYS : 개인 지갑 등록 절차 완료\n\n    U ->> PT : 개인 지갑으로 출금 요청\n\n    PT ->> PT : AML·FDS 검사\n    PT ->> +SYS : POST /accounts/{accountId}/withdrawals\u003cbr/>NON_CUSTODIAL · 수신인 지갑 주소 · 토큰 · 금액 · 출발 vault\n    SYS ->> +DB : 계정 주소록 / 등록 여부 조회\n    DB -->> -SYS : 등재 여부 응답 (address 기준)\n    Note left of SYS : 미등재는 거절 사유가 아닙니다 — 등재 여부를 정책 입력으로 넘기고 허용 여부는 정책이 판정합니다\n\n    SYS ->> DB : 계정 귀속 출금 / 출금 정보 저장\u003cbr/>등재분이면 주소록 참조\n    SYS -->> -PT : 출금 정보 반환\u003cbr/>지갑 검증 여부 · withdrawalId\n    Note left of SYS : 개인 지갑이므로 트래블룰 검증은 지나가고 기록만 남깁니다\n    PT ->> PT : 트래블룰 기록 (withdrawalId 기준)\n```\n\n## 두 경로가 합쳐진 뒤는 한 절차입니다\n\n앞 다이어그램에 없던 배역은 다섯입니다.\n\n- **KYT 심사**: KYT 검증을 수행하고 결과를 돌려주는 외부 심사입니다\n- **정책 엔진**: 자금을 움직이는 요청이 서명 인프라로 가기 전에 그 요청을 심사하는 별도 시스템입니다\n- **정책 저장소**: 판단 요청과 평가 결과, 서명 인가를 담는 정책 엔진 쪽 저장소입니다\n- **이벤트 스트림**: 판단 완료 이벤트를 구독자에게 나르는 경로입니다\n- **뒷단 플랫폼**: 지갑과 키를 보관하고 트랜잭션을 제출하는 외부 플랫폼입니다\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant PT as 파트너사\n    participant SYS as Wallet SDK\n    participant DB as 지갑 원장\n    participant KYT as KYT 심사\n    participant POL as 정책 엔진\n    participant PDB as 정책 저장소\n    participant EVT as 이벤트 스트림\n    participant PROV as 뒷단 플랫폼\n\n    Note right of SYS : 여기부터 출금 프로세스가 진행됩니다\n    opt KYT\n        SYS ->> KYT : KYT 검증\n        KYT -->> SYS : KYT OK\n    end\n    SYS ->> +POL : 판단 요청\u003cbr/>withdrawalId · 출발 vault · 토큰 · 금액 · 목적지 주소\n    POL -->> -SYS : 202 접수 (판단 요청 식별자)\n    Note over POL, PDB : 이하 평가는 내부 큐에서 비동기로 돕니다.\u003cbr/>목적지 주소의 주소록 등재 여부는 평가 시점에 PIP로 읽습니다\n    POL ->> PDB : 판단 요청 저장\n    POL ->> POL : 정책 평가\n    POL ->> PDB : 평가 결과 저장 (승인)\n    POL ->> PDB : 서명 인가 발급 (TTL · 1회용)\n    POL ->> EVT : 판단 완료 이벤트\n    EVT ->> SYS : 구독 수신\n    SYS ->> DB : 계정 귀속 출금 / 트랜잭션 시작 상태 마킹\n    SYS ->> PROV : 출금 트랜잭션 요청\u003cbr/>externalTxId = 서명 인가 식별자\n    SYS ->> PT : 통지 / withdrawalId · 출금 시작\n```\n\n이어지는 다이어그램에 새로 나오는 배역은 둘입니다.\n\n- **Co-Signer**: 서명 인프라 쪽에서 서명 직전에 정책 엔진 콜백으로 승인을 묻는 구성 요소입니다\n- **온체인**: 블록체인 네트워크입니다\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant PROV as 뒷단 플랫폼\n    participant CS as Co-Signer\n    participant POL as 정책 엔진\n    participant PDB as 정책 저장소\n    participant OC as 온체인\n    participant SYS as Wallet SDK\n    participant DB as 지갑 원장\n    participant TR as 트래블룰 게이트웨이\n    participant PT as 파트너사\n\n    PROV ->> CS : Co-Signer 승인 요청\n    CS ->> +POL : 콜백으로 승인 요청\n    POL ->> PDB : 승인 여부 확인\n    POL ->> PDB : 서명 인가 소비 저장\n    Note over POL, CS : 옛 설계에는 여기서 파트너사에 되묻는 구간이 있었습니다.\u003cbr/>지금 콜백 경로는 외부를 호출하지 않고, 파트너 심사는 평가 시점에 PIP로 수집합니다\n    POL -->> -CS : OK\n    CS -->> PROV : OK\n    PROV -->> OC : 트랜잭션\n\n    Note over SYS, PROV : 트랜잭션 전파 이후\n    PROV ->> +SYS : 출금 감지 통지\u003cbr/>뒷단 트랜잭션 식별자 · txHash\n    SYS ->> DB : 계정 귀속 출금 / 뒷단 식별자로 withdrawalId 조회\n    SYS ->> DB : 계정 귀속 출금 / 트랜잭션 상태 변경\n\n    SYS ->> DB : 트래블룰 / withdrawalId로 트래블룰 조회\n    SYS ->> TR : 조회한 검증 UUID를 키로 txHash 업데이트\n\n    SYS ->> PT : 통지 / withdrawalId · 출금 완료\n\n    SYS -->> -PROV : OK\n```\n\n서명 인가는 승인된 판단 요청이 발급하는 한 번만 쓸 수 있는 서명 근거입니다. **옛 설계는 판단\n요청에 그 인가를 동기로 돌려줬습니다.** 지금은 202로 접수만 하고 결과를 이벤트로 냅니다. 그\n2단계 규율은 [서명 게이트](/policy/signing-gate)에서 정합니다.\n\n## 예약은 지갑에서 나가는 송금 셋에 함께 적용됩니다\n\n계정 귀속 출금·자기 귀속 출금·vault 이체가 같은 가용 잔액을 예약해서 나갑니다. 가용 잔액은\n온체인 잔액에서 동결분과 진행 중 출금 예약분을 뺀 값입니다. 하나만 빼면 vault 이체로 옮긴 뒤\n출금하는 우회 경로가 생깁니다.\n\n**온체인 충분성은 요청 시점에 보지 않습니다.** 예약은 Wallet SDK 원장 기준이라, 예약을 통과한\n요청도 제출 단계에서 잔액 부족으로 실패합니다.\n\n예약이 어떤 단계에서 잡히고 언제 풀리는지는 [자금 동결](/fund-flows/release)에서 정합니다.\n\n## 출금 종류를 나누는 기준은 자금 귀속입니다\n\n자금 귀속은 그 자금이 Account 것인지 Workspace 것인지입니다.\n\n| 종류 | 자금 귀속 | 목적지 | 요청 주체 |\n|---|---|---|---|\n| 계정 귀속 출금 | 최종 사용자 | VASP · 개인 지갑 | 사용자 · 시스템 |\n| 자기 귀속 출금 | 회사 | 회사 외부 지갑 (등재분 한정) | 운영자 |\n| 계정 지갑 출금 | 최종 사용자 | 지정한 입금 건의 발신처 | 운영자 (오입금 반환) |\n\n스코프 축은 어떤 데이터가 어느 스코프 키로 격리되는지의 분류입니다. 계정 귀속 출금은 tenant\n축이고 자기 귀속 출금은 workspace 축이라, 같은 테이블에 담으면 어느 스코프로 조회해야 하는지가\n행마다 달라집니다.\n\n## 계정 지갑 출금은 오입금 반환 하나입니다\n\n계정 지갑 출금(`aww-`)은 계정 지갑에서 직접 밖으로 나가는 유일한 경로입니다. 앞의 둘과\n달리 워크스페이스 vault를 거치지 않습니다.\n\n- **목적지**: 임의 주소가 아니라 지정한 입금 건의 발신처입니다. 잘못 들어온 자금을 온 곳으로\n  돌려보내는 것이 알려진 용도의 전부입니다. 발신처가 기록되지 않은 입금 건은 지정할 수 없습니다.\n  목적지 근거가 없기 때문입니다. 발신처 밖까지 허용할지는 아직 정하지 않았습니다.\n- **요청 주체**: 운영자뿐입니다. 파트너사 API에는 이 경로가 없습니다.\n- **인가**: 어드민 액션이 승인자의 확인을 거쳐야 실행되는 통제인 승인 게이팅이 서명 인가에\n  더해집니다. 승인에 필요한 최소 인원인 정족수가 필요하고 요청자와 승인자가 같을 수 없습니다.\n  일곱 이동 중 승인이 붙는 출금은 이것뿐입니다.\n\n계정 지갑 자산을 워크스페이스 vault로 모으는 이동인 [집금](/fund-flows/sweep)과 같은 자원을\n씁니다. 입금 건을 지정하고 그 건의 해제를 겸합니다. 그래서 반환된 건은 `RELEASED`를 거치지 않고\n`WITHDRAWN`으로 직행합니다.\n\n**전용 시퀀스는 이 문서군에 없습니다.** 트래블룰 교환이 없는 점 외에는 위 \"두 경로가 합쳐진 뒤\"의\n서명·제출 구간을 그대로 거칩니다.\n\n## 목적지에 따라 확인 근거가 다릅니다\n\n개인 지갑은 최종 사용자의 소유 증명이 필요합니다. 소유 증명은 개인 지갑을 주소록에 올리기 전에\n최종 사용자가 그 키로 서명해 보이는 절차입니다. nonce에 서명해 그 주소를 자기 것으로 증명하고 그\n결과가 [주소록](/fund-flows/address-book)에 등재됩니다.\n\n**VASP 지갑은 소유 증명을 요구하지 않습니다.** 트래블룰이 그 역할을 대신하므로 제3자 송금이\n가능합니다. 파트너사 사용자가 상대 거래소의 다른 사람에게 보낼 수 있습니다. 다만 이때는 최소한\n실명 정보가 트래블룰 정보에 들어갑니다.\n\n## 화이트리스트는 거절 사유가 아닙니다\n\n미등재가 곧 거부는 아닙니다. 등재 여부가 정책 입력으로 들어가고 정책이 그것을 보고\n판단합니다.\n\n등재·회수와 그 반영 시점은 [주소록](/fund-flows/address-book)에 있습니다.\n\n**계정이 비활성이면 출금이 막힙니다.** 응답은 전용 에러 코드가 아니라 404입니다. 자세한 이유는\n[계정 계층](/accounts-wallets/accounts)에 있습니다.\n\n## 다음으로\n\n출금은 시작·완료·실패를 각각 통지합니다 —\n`WITHDRAWAL_INITIATED`·`WITHDRAWAL_FINALIZED`·`WITHDRAWAL_FAILED`. 통지 본문과 중복 제거 규칙은\n[웹훅](/fund-flows/webhooks)에 있습니다.\n\n출금이 예약하는 가용 잔액과 그 예약이 언제 풀리는지는 [자금 동결](/fund-flows/release)에 있습니다.\n", "kind": "참고 문서", "path": "_reference/fund-flows--withdrawal.html", "reference": true}, {"title": "정책", "text": "---\ntitle: 정책\ndescription: 서명 앞의 검사 단계\n---\n\n_읽는 사람: 파트너사 개발자와 구현팀. 정책 엔진이 무엇을 막는지와 어느 순서로 읽을지를 담습니다._\n\n정책 엔진은 자금을 움직이는 요청이 서명 인프라로 가기 전에 그 요청을 심사하는 별도 시스템입니다.\nWallet 서버가 요청을 받으면 정책 엔진에 판단을 묻고, 허가가 있어야만 서명을 요청합니다. 심사\n기준인 룰은 플랫폼과 파트너사가 각자 저작합니다.\n\n## 정책 위반은 서명 이전에 막습니다\n\n서명한 뒤 거절하는 방식을 두지 않습니다. 서명이 나가면 그것은 이미 나간 것이라, 거절할 여지가\n남지 않기 때문입니다.\n\n정책 엔진은 서명 인프라로 요청이 나가기 전의 마지막 검사 단계입니다.\n\n## 허가하는 룰이 없으면 거절입니다\n\n요청에 매치되는 `allow` 룰이 하나도 없으면 결정은 거절입니다. 그래서 새 체인·새 목적지 종류·새\nvault 종류가 등재돼도 그것을 허가하는 룰을 쓰기 전까지는 아무것도 나가지 않습니다.\n\n`deny` 룰이 하나라도 매치되면 다른 룰이 허가해도 결정은 거절이고, 그 뒤의 평가는 멈춥니다. 룰이 여럿일 때 결정이 모이는 규칙은\n[결정과 결합](/policy/rule/decision)에 있습니다.\n\n허가에는 조건이 붙을 수 있습니다. 2단계 인증이나 승인이 성립하는 데 필요한 최소 승인자 수인\n정족수를 요구하는 룰이 통과하면, 결정은 `allow`가 아니라 `pending`이고 그 조건이 채워진 뒤에 확정됩니다.\n\n## 판단 주체를 갈라 두면 한쪽이 침해돼도 서명이 나가지 않습니다\n\n**Wallet SDK만 탈취당해도 서명이 나가지 않습니다.** 정책 엔진이 별도 판단 주체라, 침해된 쪽이\n자기 판단으로 서명을 얻어낼 수 없습니다.\n\n정책 엔진을 제외한 전부가 침해돼도 한 번에 다량이 나가지 않습니다. 건당 자원 상한 같은 통제가\n승인마다 붙기 때문입니다.\n\n## 다음으로\n\n파트너사가 읽는 길은 「정책 쓰기」 절 다섯 쪽입니다. 순서대로 읽으면 정책을 쓰고 발행하고 결과를\n읽는 데 필요한 것이 다 나옵니다.\n\n- [서명 게이트](/policy/signing-gate) — 판단과 집행이 나뉘는 두 단계\n- [룰 쓰기](/policy/rules) — 룰 하나가 무엇으로 이루어지고 무엇을 참조할 수 있나\n- [예시 정책](/policy/examples) — 워크스페이스 시드의 실물 룰 셋과 통과·거절 대조\n- [룰 저작과 발행](/policy/workflow) — draft 하나가 검증·승인을 거쳐 활성 번들이 되기까지\n- [결과 읽기](/policy/results) — 결정이 API 응답의 어느 자리에 나타나나\n\n엔진을 만드는 사람은 그 아래 「엔진 내부 동작」 절로 갑니다. [전체 지도](/policy/map)가 첫\n진입이고, 구조·다이어그램·운영과 관측 뒤에 룰의 구현팀 층과 평가 런타임이 옵니다.\n", "kind": "참고 문서", "path": "_reference/policy.html", "reference": true}, {"title": "구조", "text": "---\ntitle: 구조\ndescription: 무엇이 어디에 배포되고 각자 무엇을 지는가\n---\n\n_읽는 사람: 구현팀. 정책 엔진이 어떤 역할로 나뉘고 그 역할들이 어디에 배포되는지를 다룹니다._\n\n정책 엔진은 자금을 움직이는 요청이 서명 인프라로 가기 전에 그 요청을 심사하는 별도 시스템입니다.\n이 페이지는 그 시스템이 어떤 역할로 나뉘고, 각 역할이 어느 배포 단위에 실리는지를 씁니다.\n\n## 다섯 역할\n\n\"정책 엔진\"은 특정 컴포넌트가 아니라 시스템 전체를 가리킵니다. 그 안에서 역할이 다섯으로\n갈립니다.\n\n| 역할 | 지는 것 | 지지 않는 것 |\n|---|---|---|\n| Orchestrator | 입력 문서 조립, PIP 수집, obligation 루프, 결정 상태 머신 | 판정 자체 |\n| 평가기(PDP) | 완성된 입력의 판정 | 외부 호출, 데이터 수집 |\n| PIP | 판단에 필요한 사실의 수집 경로 | 심사 판단 |\n| PAP | 룰 저작·검증·발행 경로 | 평가 |\n| PEP | 서명 인프라 콜백의 수신 | 대조와 소비 판단 |\n\n**PIP와 PAP는 배포 단위가 아닙니다.** PIP는 Orchestrator 안의 어댑터 계층이고, PAP는 저작\n경로 전체를 부르는 이름입니다.\n\n표에 나오는 obligation은 통과로 확정되기 전에 이행해야 하는 조건입니다([룰\n구조](/policy/rules)).\n\n## 평가기의 순수성\n\n평가기는 밖을 부르지 않습니다. 평가기에 들어가는 것은 이미 완성된 입력 문서이고, 사실을 모으는\n일은 전부 Orchestrator가 끝낸 뒤입니다.\n\n**같은 입력이면 언제나 같은 결정이 나옵니다.** 이 성질이 감사와 재현의 전제입니다. 기록해 둔\n입력으로 판정을 다시 실행해 같은 답을 얻을 수 있어야 규제 대응이 성립합니다.\n\n## 역할과 배포 단위\n\n역할과 배포 단위는 1:1이 아닙니다. Orchestrator와 평가기는 한 배포 단위이고, 평가 엔진은 그\n단위 안의 사이드카 프로세스로 띄웁니다. 앱은 localhost로 판정을 질의합니다.\n\n프로세스가 나뉘어도 \"평가기는 순수하다\"는 성질은 유지됩니다. 조건 트리를 평가하고 결정을 결합하는\n[커널](/policy/rule/decision)이 외부 호출을 쓰지 않기 때문입니다.\n\n**프로세스 간 왕복이 지연 예산에 들어오지 않습니다.** 평가는 비동기 큐에서 처리되고, 30초 제한이\n적용되는 콜백 경로는 평가기를 거치지 않습니다.\n\n## 사이드카를 고른 경위\n\n사이드카는 비교 끝에 고른 것이 아니라 남은 길입니다. 평가 엔진이 Go 프로젝트라 JVM 안에 넣는\n경로가 없고, 다른 배치가 성립하지 않습니다.\n\n버전의 기준 문서는 앱 저장소의 버전 카탈로그 하나입니다. compose와 IaC의 이미지 태그는 전부 그\n사본이고, `latest`와 자동 업그레이드는 쓰지 않습니다.\n\n**업그레이드는 접점 셋을 실제 연동으로 다시 검증한 뒤에 끝납니다** — 번들 로드 포맷, 골든\n스위트 시맨틱, 관리 표면 차단입니다.\n\n## 사이드카 관리 표면의 폐쇄\n\n평가 엔진 서버에는 데이터 쓰기 API가 있습니다. 열려 있으면 번들을 건드리지 않고 값만 바꿔\n통제를 전부 우회할 수 있습니다.\n\n그래서 기본 거부 인가 정책으로 판정 질의만 남기고 localhost에 바인딩합니다. **번들에 서명을\n두지 않기로 한 뒤로 이 폐쇄가 \"사이드카가 무엇을 평가하는가\"를 지키는 유일한 장치입니다.**\n\n인가 정책과 번들 설정은 정책 로직 번들 밖의 배포 산출물입니다. 기준 문서는 앱 저장소이고 수정\n경로는 PR 리뷰 하나이며, 저장소 밖에 고칠 수 있는 사본을 두지 않습니다.\n\n## 번들 서빙 경로\n\n번들은 앱이 서빙하고 사이드카가 받아 갑니다. 평가 엔진이 번들을 HTTP로 가져가는 구조라, 앱이\n번들 엔드포인트를 열고 사이드카가 localhost로 폴링합니다.\n\n번들 바이트는 관계형 저장소에 있습니다. **저장소가 앱 뒤에 있어 스토리지 자격증명이 사이드카로\n내려가지 않습니다.**\n\n활성 revision은 캐시 없이 매번 포인터를 조회합니다. 캐시를 두면 레플리카마다 활성 revision이\n갈리기 때문입니다. 병목이 실측되면 짧은 TTL 캐시와 발행 무효화를 다시 봅니다.\n\n## 무결성의 근거와 보유 키\n\n무결성의 근거는 \"누가 서명했나\"가 아니라 \"어디서 받았나\"입니다. 별도 번들 서명자 배포 단위를\n두지 않고, 앱이 번들을 서빙하고 사이드카가 localhost로만 폴링합니다. 대조 기준은 활성 포인터가\n확정한 `payloadHash`이고, 활성 포인터는 지금 무엇이 서빙되는지를 정하는 단일 기록입니다.\n\n신뢰 구간을 둘로 갈랐기 때문입니다. **인프라·네트워크 구간은 배포 존에 맡기고, 앱 구간은 계속\n방어합니다.** 코드 결함이나 앱만 장악하는 침해는 배포 존이 막아 주지 않습니다.\n\n잃은 것은 파싱은 통과하는 다른 출처의 번들을 거부하는 힘입니다. 그 남은 위험은 배포 존\n구분으로 수용합니다.\n\n이 결정으로 번들 서명키가 없어졌습니다. 엔진이 보유·운영하는 키는 셋입니다.\n\n- **콜백 응답 서명키**: 서명 인프라에 되돌려 주는 판정 응답에 서명합니다\n- **어드민 세션 서명키**: 콘솔 세션 쿠키를 서명합니다\n- **2FA 암호화 키**: 어드민 2단계 인증 시크릿을 저장할 때 암호화합니다\n\n셋 다 설정과 환경변수로 주입하고 코드에 기본값을 두지 않습니다. 그 키를 쓰지 않는 프로세스에는\n주지 않습니다.\n\n## 콜백 엔드포인트의 배치\n\n콜백 엔드포인트는 떼어 낼 수 있게 둡니다. 신뢰 존과 스케일 프로파일이 나머지와 달라, 외부\n인바운드를 노출하고 콜백 서명키를 듭니다. 여기에는 30초 데드라인이 적용되고, 집금의 대량·고빈도\n처리량도 이 경로로 들어옵니다.\n\nv1은 한 서비스에 얹되 엔드포인트·키·경로를 격리합니다. **분리 여부는 집금 피크 처리량을 실측한\n뒤에 판단합니다.**\n\n분리한다면 콜백 엔드포인트와 Orchestrator 사이 채널에 상호 인증과 전용 인가가 먼저 있어야 합니다. 응답\n위조가 곧 승인 위조이고, 임의 호출은 정당한 콜백을 거부시키는 선점 소비가 되기 때문입니다.\n\n## 콜백과 저장소\n\n콜백은 저장소를 직접 읽지 않습니다. 콜백 엔드포인트는 받아서 검증하고 넘기기만 하며, 인가\n저장소 대조와 원자적 1회용 소비는 Orchestrator가 소유합니다.\n\n그래서 콜백이 Orchestrator 가용성에 묶입니다. **Orchestrator에 대조와 소비만 하는 콜백 전용\n고속 경로를 둡니다.**\n\n무응답은 서명 인프라가 재시도하지 않고 요청을 취소합니다. 그래서 이 경로의 두 참여자는 레플리카\n둘 이상에 롤링 배포가 최소 요건입니다. 소비가 조건부 단일행 갱신이라 레플리카를 늘려도 1회용이\n깨지지 않습니다.\n\n## 배포와 정책 존\n\n배포 하나가 정책 존 하나입니다. 정책 로직 번들은 배포마다 하나이고, 보안 레벨이 다른 업무는 같은\n구현을 존별로 따로 배포합니다. 결정과 서명 인가의 발급·검증·소비도 존별로 독립합니다.\n\n파트너사마다 다른 정책은 배포를 나눠서 처리하지 않습니다. 그것은 워크스페이스 번들이 담당합니다.\n\n## 접수와 통지\n\n판단은 접수하고 나중에 통지합니다. `POST /request`는 검증 뒤 즉시 202로 접수 식별자를 돌려주고,\n평가는 내부 큐에서 진행합니다. 결과는 이벤트 스트림으로 발행하고 요청을 소유한 서비스가\n구독합니다.\n\n**동기 응답은 애초에 성립하지 않습니다.** 정족수와 2단계 인증은 사람을 기다리고, 비동기 PIP는\n파트너를 기다립니다. 정족수는 승인이 성립하는 데 필요한 최소 승인자 수입니다.\n\n유일한 동기 경로는 서명 인프라 콜백입니다. 30초 제한이 적용된 외부 계약이라 비동기로 바꿀 수\n없습니다.\n\n어드민 로그인과 2단계 인증은 이 계약 밖입니다. 정책 판단이 아니라 인증이라 별도 동기 API로\n답하고, 접수와 이벤트 통지는 로그인 이후의 어드민 액션에만 적용됩니다.\n\n## 어드민 신원의 소유\n\n어드민 신원도 정책 엔진이 소유합니다. 어드민 계정·역할·2단계 인증 자격증명이 전부 여기 있고,\n어드민 콘솔은 자체 저장소 없이 정책 엔진의 API를 부르는 표면입니다.\n\n**평가 경로는 어드민 저장소를 읽기 전용으로만 봅니다.** 평가가 쓰지 않으므로 요청자 속성이 평가\n시점 스냅샷으로 고정되고, 결정 기록이 나중의 권한 변경에 흔들리지 않습니다. 결정 기록은 결정을\n주체·행위·대상·시각·결과와 함께 남기는 추가 전용 해시 체인입니다.\n\n이 한 지점만 DB grant가 아니라 코드가 검사로 강제합니다. 계정과 grant가 그 범위를 어떻게 나눠\n지는지는 정책 엔진 내부 문서에 있습니다.\n\n## 저장소를 나눈 기준\n\n논리 저장소는 셋이고 나눈 기준은 소유자가 아니라 수명입니다. 룰은 발행 단위로, 요청과 결정은\n요청 단위로, 어드민 신원은 사람 단위로 남습니다.\n\n**파기 주기가 다르면 같은 저장소 안에 둘 이유가 없습니다.** 세 저장소의 계정과 grant를 어떻게\n갈랐는지는 정책 엔진 내부 문서에 있습니다.\n\n## 저작에서 발행까지\n\n저작 세트가 번들로 발행되는 전체 경로는 [룰 저작과 발행](/policy/workflow)에 있습니다.\n\n## 집행의 두 강제력\n\n집행의 강제력이 두 가지입니다. 같은 커널을 쓰지만 결정을 강제하는 지점이 다릅니다.\n\n| | 서명 게이트 | 승인 게이트 |\n|---|---|---|\n| 대상 | 자금 이동 연산 | 어드민 액션·정책 변경 |\n| 강제 지점 | 서명 인프라 콜백 | 정책 엔진의 maker-checker |\n| 강제력 | 암호학적 — 거부하면 서명 자체가 불가 | 앱 사이드 — 승인 전까지 아무것도 쓰지 않음 |\n| 집행자 | 요청을 소유한 서비스 | 정책 엔진 자신 |\n\n**승인 게이트를 거치는 산출물은 셋입니다** — 어드민 권한, 워크스페이스 번들, 그리고 정책 로직\n번들의 룰과 레지스트리입니다. 셋 다 산출물의 소유자가 정책 엔진이기 때문입니다.\n\n역할 부여와 워크스페이스 룰 변경은 어드민 액션 카탈로그에 등재된 둘이고, 정족수 obligation이\n붙습니다. 번들 발행은 엔진 안의 별도 maker-checker가 검증 통과 revision의 내용 해시에 승인을\n묶습니다([룰 저작과 발행](/policy/workflow)).\n\n## XACML에서 가져온 이름\n\n역할 이름은 XACML에서 가져왔습니다. PDP·PEP·PIP·PAP는 OASIS XACML 3.0의 이름 그대로이고,\n`deny-overrides`와 obligation도 같습니다.\n\n이름을 맞춰 두면 프라이어 아트를 그대로 승계합니다. **이 구조가 왜 이렇게 나뉘는지를 표준 한\n줄로 설명할 수 있습니다.**\n\n맞추지 않는 것도 있습니다.\n\n- **Advice를 두지 않습니다**: 표준은 이행하지 않아도 되는 권고를 obligation과 구분합니다. 이행\n  여부가 판단에 반영되지 않는 조치는 감사에서 게이트로 오독되므로 도입하지 않습니다\n- **모듈은 Policy·PolicySet이 아닙니다**: 모듈 간 AND는 표준 결합 알고리즘에 없는 조합이라\n  이름을 빌리지 않습니다\n- **`need_more_data`는 확장입니다**: 표준은 속성 부재를 판정 불가로 접을 뿐, 수집한 뒤 다시\n  평가하는 루프가 없습니다\n\n## 다음으로\n\n- [서명 게이트](/policy/signing-gate) — 자금 이동이 거치는 2단계\n- [룰 저작과 발행](/policy/workflow) — 저작 세트가 번들이 되어 서빙되기까지\n- [승인 게이트](/policy/sequences/approval-gate) — 승인 게이트와 예외 흐름\n- [결정과 결합](/policy/rule/decision) — 커널이 고정한 결합 규칙\n- [PIP](/policy/runtime/pip) — 세상의 상태를 언제 읽나\n", "kind": "참고 문서", "path": "_reference/policy--architecture.html", "reference": true}, {"title": "다이어그램", "text": "---\ntitle: 다이어그램\ndescription: 정책 엔진의 배포 토폴로지·서명 게이트·상태 머신·발행 워크플로우와, rego·JSON 소스 구성, 코드 레벨 호출 경로를 상호작용 뷰어로 봅니다\n---\n\nexport const base = import.meta.env.BASE_URL.replace(/\\/$/, \"\");\n\n{/* 뷰어는 1440×900 데스크톱 기준으로 만든 자체 완결형 HTML 이라 본문 칸(약 720px)에 그대로 넣으면 잘린다.\n    그래서 iframe 을 1440×900 으로 고정하고 칸 폭에 맞춰 축소해 전체를 보이게 한다. 상호작용은\n    전체 화면(Fullscreen API — 화면에 맞춰 다시 키운다, Esc 로 복귀)이나 새 탭에서 한다. */}\n\u003cscript is:inline data-astro-rerun>{`\n(function () {\n  var W = 1440, H = 900;\n  function fit(w) {\n    var f = w.querySelector(\"iframe\");\n    var fs = document.fullscreenElement === w;\n    var s = fs ? Math.min(innerWidth / W, innerHeight / H) : w.clientWidth / W;\n    f.style.transform = \"scale(\" + s + \")\";\n    w.style.height = fs ? \"100%\" : Math.round(H * s) + \"px\";\n    f.style.left = fs ? Math.round((innerWidth - W * s) / 2) + \"px\" : \"0\";\n    f.style.top = fs ? Math.round((innerHeight - H * s) / 2) + \"px\" : \"0\";\n  }\n  function fitAll() { document.querySelectorAll(\".dg-wrap\").forEach(fit); }\n  window.__dgFit = fit;\n  window.__dgFull = function (btn) {\n    var w = btn.closest(\"figure\").querySelector(\".dg-wrap\");\n    (w.requestFullscreen || w.webkitRequestFullscreen).call(w);\n  };\n  addEventListener(\"resize\", fitAll);\n  addEventListener(\"fullscreenchange\", fitAll);\n  if (document.readyState !== \"loading\") fitAll(); else addEventListener(\"DOMContentLoaded\", fitAll);\n})();\n`}\u003c/script>\n\nexport function Diagram({ name, title }) {\n  const src = `${base}/diagrams/${name}.html`;\n  return (\n    \u003cfigure class=\"dg\" style=\"display:grid;gap:0;margin:.75rem 0 2.5rem 0\">\n      \u003cdiv class=\"dg-wrap\" style=\"margin:0;position:relative;overflow:hidden;width:100%;height:450px;border:1px solid var(--color-border,#e5e7eb);border-radius:8px 8px 0 0;background:#fff\">\n        \u003ciframe\n          src={src}\n          title={title}\n          loading=\"lazy\"\n          onload=\"window.__dgFit && window.__dgFit(this.parentElement)\"\n          style=\"position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0\"\n        >\u003c/iframe>\n      \u003c/div>\n      \u003cfigcaption style=\"margin:0;display:flex;gap:.6rem;justify-content:flex-end;align-items:center;padding:.55rem .75rem;border:1px solid var(--color-border,#e5e7eb);border-top:0;border-radius:0 0 8px 8px;font-size:.95rem\">\n        \u003cspan style=\"margin-right:auto;opacity:.6;font-size:.85rem\">축소 미리보기 — 상호작용은 전체 화면에서\u003c/span>\n        \u003cbutton type=\"button\" onclick=\"window.__dgFull(this)\" style=\"display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;background:transparent;font:inherit;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M8 3H5a2 2 0 0 0-2 2v3\"/>\u003cpath d=\"M21 8V5a2 2 0 0 0-2-2h-3\"/>\u003cpath d=\"M3 16v3a2 2 0 0 0 2 2h3\"/>\u003cpath d=\"M16 21h3a2 2 0 0 0 2-2v-3\"/>\u003c/svg>\n          전체 화면\n        \u003c/button>\n        \u003ca href={src} target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;text-decoration:none;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 3h6v6\"/>\u003cpath d=\"M10 14 21 3\"/>\u003cpath d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"/>\u003c/svg>\n          새 탭에서 열기\n        \u003c/a>\n      \u003c/figcaption>\n    \u003c/figure>\n  );\n}\n\n_읽는 사람: 구현팀. 정책 엔진의 다이어그램을 모아 둔 곳이고, 각 장이 무엇을 담는지만 씁니다._\n\n이 페이지는 정책 엔진의 다이어그램 열 장을 모아 둡니다. 설계 다섯 장, 소스 구성 두 장, 코드 주파\n세 장입니다. 열 장 전부 자체 완결형 뷰어라 안에서 확대·검색·관계 추적·안내 보기(`Play story`)가\n됩니다.\n\n명세와 재생성 절차는 저장소의 `docs/site/diagrams/README.md`에 있습니다.\n\n이 페이지 밖에도 열세 장이 있습니다. 저작 세트와 컴파일을 그린 두 장은 정책 엔진 내부 문서에\n있습니다. 저작·평가 서사 네 장(draft 일생·번들 해부·평가 입력·산출물이 가는 곳)은\n[룰 저작과 발행](/policy/workflow)·[평가의 순간](/policy/runtime/evaluation)·[저장과\n이동](/policy/runtime/storage)과 내부 문서에 나뉘어 있습니다. 전체 지도 두 장(저작 산출물이 가는\n경로·평가 입력 문서)은 [전체 지도](/policy/map)에 있습니다. 유즈케이스 다섯 장은\n[사용 사례](/policy/use-cases/whitelist-loop) 다섯 편에 각각 있습니다.\n\n설계 다섯 장은 설계 문서(`design-draft` §2·§5.2, `sequences-draft` §1)와 `PolicyRequestStatus.kt`에서,\n소스 구성 두 장은 `backend/policy/policy-source/`·`rule-compiler`·`kernel-runner`의 실제 파일(2026-08-31)에서,\n코드 주파 세 장은 2026-08-30 codegraph로 hop마다 확정한 호출 체인에서 그렸습니다. 코드 주파 장의\n파일:라인은 그 시점 트리 기준이라 코드가 바뀌면 어긋납니다.\n\n## 설계 — 무엇이 어디에 있고 어떤 순서로 처리되는가\n\n### 배포 토폴로지\n\npolicy zone 안의 `policy-server`·OPA sidecar·논리 DB 3분할·이벤트 스트림과, 인바운드 신뢰 근거 넷입니다.\n\n\u003cDiagram name=\"policy-topology\" title=\"Policy Server 배포 토폴로지\" />\n\n### 서명 게이트 Phase 1 — 접수·평가·인가 발급\n\n\u003cDiagram name=\"signing-gate-phase1\" title=\"서명 게이트 Phase 1\" />\n\n### 서명 게이트 Phase 2 — Co-Signer 콜백\n\n\u003cDiagram name=\"signing-gate-phase2\" title=\"서명 게이트 Phase 2\" />\n\n### 판단 요청 상태 머신\n\n`PolicyRequestStatus`의 `ALLOWED_TRANSITIONS`와 대조한 전이입니다. `APPROVED → DENIED`(콜백 종결 전용)와\n`RECEIVED`·`NORMALIZING → FAILED`는 선 대신 카드에 적었습니다.\n\n\u003cDiagram name=\"request-status\" title=\"판단 요청 상태 머신\" />\n\n### 번들 저작·발행 워크플로우\n\n\u003cDiagram name=\"bundle-publication\" title=\"번들 저작·발행 워크플로우\" />\n\n## 소스 구성 — rego와 JSON이 번들이 되기까지\n\n두 장이 한 쌍입니다. 첫 장은 rego 네 부류와 JSON 저작 데이터가 컴파일·채점을 거쳐 서빙·채점\nOPA에 닿는 전체 계층을 잡습니다. 둘째 장은 그 왼쪽 구획(저작 세트·채점 입력·골든 스위트)을\n파일 수준으로 폅니다.\n\n### rego와 JSON의 계층\n\n룰은 코드가 아니라 데이터입니다. 평가 로직은 커널 `decision.rego` 하나이고, authz rego 두 벌이\n서빙·채점 OPA의 관리 표면을 막습니다. 커널은 조건 트리를 평가하고 결정을 결합하는 정책 무관 고정\n부분입니다([결정과 결합](/policy/rule/decision)). 저작·빌드 구획의 파일 구성은 바로 아래 상세\n장이 폅니다.\n\n\u003cDiagram name=\"rego-json-layers\" title=\"정책 엔진 — rego와 JSON의 계층\" />\n\n### policy-source 상세 — 저작·채점·골든\n\n저작 세트는 파일 위치 열거가 곧 계약입니다. 채점 입력은 저작한 룰의 기대 판정을 재고, 골든 스위트는\n커널 자체를 잽니다. 컴파일 산출물이 그다음 어디로 가는지는 위의 계층 장이 잡습니다.\n\n\u003cDiagram name=\"policy-source-detail\" title=\"policy-source 상세 — 저작·채점·골든\" />\n\n## 코드 주파 — 한 요청이 어느 클래스를 어떤 순서로 거치는가\n\n### 판단 요청\n\n접수는 동기 202이고 구동은 `@Scheduled` 1초 폴링이며 OPA 질의는 트랜잭션 밖입니다. 종결은\n`DecisionRecordingService`가 전이·결정로그·outbox를 한 트랜잭션으로 묶습니다.\n\n\u003cDiagram name=\"code-flow-request\" title=\"판단 요청 코드 주파 경로\" />\n\n### Co-Signer 콜백\n\nJWT 검증 → 대조 세 단계 → 조건부 단일행 CAS(`consumeSigningAuthorization` / `terminateSigningAuthorization`)까지\n한 트랜잭션이고, HTTP는 언제나 200입니다.\n\n\u003cDiagram name=\"code-flow-callback\" title=\"콜백 코드 주파 경로\" />\n\n### 번들·PIP 클래스 배선도\n\n번들 서빙과 PIP 수집이 만나는 세 지점 — `BundleBackedPipSourceRegistry`의 `activationSeq` 캐시, `WalletSourceClient`\n공유, 파트너 결과 도착이 요청 스레드 안에서 커널을 다시 부르는 경로입니다.\n\n\u003cDiagram name=\"code-flow-bundle-pip\" title=\"번들·PIP 클래스 배선도\" />\n", "kind": "참고 문서", "path": "_reference/policy--diagrams.html", "reference": true}, {"title": "예시 정책", "text": "---\ntitle: 예시 정책\ndescription: 워크스페이스 시드에 들어 있는 룰 셋과 그 룰이 가르는 요청\n---\n\n_읽는 사람: 파트너사 개발자. 실제로 동작하는 룰 셋을 그대로 보고, 어떤 요청이 통과하고 어떤 요청이 막히는지 대조합니다._\n\n이 페이지의 룰 셋은 예시로 지어낸 것이 아닙니다. Wallet SDK를 도입한 회사 하나인\n워크스페이스([계정 계층](/accounts-wallets/accounts))가 등록되면 이 셋이 그 워크스페이스의 첫\n번들이 됩니다. 그래서 아래 JSON은 파트너사가 처음 열어 보게 되는 룰과 같습니다.\n\n세 룰은 각각 출금·집금·vault 이체를 허가합니다. 셋 다 `effect`가 `allow`이고, 어느 룰의 적용\n범위에도 매치되지 않는 요청은 기본 거절(default deny)로 끝납니다. 조각의 뜻과 참조할 수 있는\n필드는 [룰 쓰기](/policy/rules)에 있습니다.\n\n## 출금은 등재된 외부 주소로만 나갑니다\n\n```json\n{\n  \"id\": \"withdrawal/allow-evm-external-address\",\n  \"effect\": \"allow\",\n  \"scope\": {\n    \"all\": [\n      { \"field\": \"operation\", \"op\": \"eq\", \"value\": \"value_transfer\" },\n      { \"field\": \"chain.family\", \"op\": \"eq\", \"value\": \"evm\" },\n      { \"field\": \"destination.type\", \"op\": \"eq\", \"value\": \"external_address\" },\n      { \"field\": \"source_vault.kind\", \"op\": \"eq\", \"value\": \"custody\" }\n    ]\n  },\n  \"when\": { \"field\": \"address_ownership.status\", \"op\": \"eq\", \"value\": \"active\" }\n}\n```\n\n적용 범위의 네 조건이 이 룰에 걸리는 요청을 가릅니다.\n\n- `operation` = `value_transfer` : 출금·vault 이체·집금처럼 자산을 실제로 움직이는 연산 셋인 값 이동만 매치합니다([결정과 결합](/policy/rule/decision))\n- `chain.family` = `evm` : EVM 계열 네트워크의 요청만 매치합니다\n- `destination.type` = `external_address` : 목적지가 외부 주소인 요청만 매치합니다. 내부 vault로 가는 집금과 vault 이체는 여기 걸리지 않습니다\n- `source_vault.kind` = `custody` : 출발이 custody vault인 요청만 매치합니다. deposit vault에서 나가는 이동은 여기 걸리지 않습니다\n\n조건은 하나입니다. `address_ownership.status`가 `active`인지를 봅니다. 이 값은 요청이 담아 오지\n않고, 룰이 참조하는 외부 사실의 출처인 PIP 소스([자세히](/policy/runtime/pip))가 평가 도중\n채웁니다.\n\n통과하는 요청입니다. 등재 상태가 `active`인 외부 주소로 나가는 EVM 출금입니다.\n\n- `operation` : `value_transfer`\n- `chain.family` : `evm`\n- `destination.type` : `external_address`\n- `source_vault.kind` : `custody`\n- `address_ownership.status` : `active`\n\n막히는 요청입니다. 나머지는 같고 목적지 주소가 주소록에 없습니다.\n\n- `destination.type` : `external_address`\n- `source_vault.kind` : `custody`\n- `address_ownership.status` : `unregistered`\n\n**이 거절은 기본 거절이 아닙니다.** 적용 범위는 매치됐고 조건이 불성립한 것이라, 결정 사유가 이\n모듈과 이 룰을 지목합니다. 회수된 주소도 상태가 `revoked`로 바뀌어 같은 경로로 막힙니다.\n\n통과 방향의 끝에는 승인할 때 정해져 소비 시점에 적용되는 유효값인 승인 스탬프 둘이 함께\n찍힙니다([자세히](/policy/runtime/normalization)). 인가 유효 시간과 건당 자원 상한이고, 두 값은\n이 룰이 아니라 슬롯 `approved_intent_ttl_seconds`·`resource_limit_per_tx`에서 옵니다.\n\n## 집금은 deposit 지갑에서 custody 지갑으로만 모입니다\n\n```json\n{\n  \"id\": \"sweep/allow-evm-deposit-to-custody\",\n  \"effect\": \"allow\",\n  \"scope\": {\n    \"all\": [\n      { \"field\": \"operation\", \"op\": \"eq\", \"value\": \"value_transfer\" },\n      { \"field\": \"principal.type\", \"op\": \"eq\", \"value\": \"service\" },\n      { \"field\": \"chain.family\", \"op\": \"eq\", \"value\": \"evm\" },\n      { \"field\": \"destination.type\", \"op\": \"eq\", \"value\": \"internal_vault\" },\n      { \"field\": \"source_vault.kind\", \"op\": \"eq\", \"value\": \"deposit\" },\n      { \"field\": \"destination.vault_kind\", \"op\": \"eq\", \"value\": \"custody\" }\n    ]\n  }\n}\n```\n\n집금은 계정 지갑 자산을 워크스페이스 vault로 모으는 이동입니다([자세히](/fund-flows/sweep)).\n적용 범위의 여섯 조건이 그 이동 하나만 남깁니다.\n\n- `operation` = `value_transfer` : 값 이동만 매치합니다\n- `principal.type` = `service` : 파트너사 서비스가 낸 요청만 매치합니다. 최종 사용자가 직접 내는 경로가 생겨도 이 룰이 그것을 함께 허가하지 않습니다\n- `chain.family` = `evm` : EVM 계열 네트워크의 요청만 매치합니다\n- `destination.type` = `internal_vault` : 목적지가 내부 vault인 요청만 매치합니다. 외부 주소로 나가는 집금은 여기 걸리지 않습니다\n- `source_vault.kind` = `deposit` : 출발이 deposit vault인 요청만 매치합니다. custody vault에서 출발하는 이동과 갈립니다\n- `destination.vault_kind` = `custody` : 목적지가 custody vault인 요청만 매치합니다. 다른 deposit vault로 흐르는 이동은 여기 걸리지 않습니다\n\n조건 절이 없습니다. 적용 범위가 매치되면 그대로 허가이고, 수집 없이 평가 한 번으로 끝납니다.\n대량으로 자주 일어나는 연산이라 PIP 참조를 두지 않은 것입니다.\n\n통과하는 요청입니다.\n\n- `operation` : `value_transfer`\n- `principal.type` : `service`\n- `chain.family` : `evm`\n- `destination.type` : `internal_vault`\n- `source_vault.kind` : `deposit`\n- `destination.vault_kind` : `custody`\n\n**막히는 요청은 목적지가 외부 주소인 집금입니다.** 출금 룰은 출발이 custody vault라야 매치되고\n이 룰은 목적지가 내부 vault라야 매치되므로, 이 요청은 어느 allow에도 걸리지 않고 기본 거절로\n끝납니다.\n\n- `destination.type` : `external_address`\n- `source_vault.kind` : `deposit`\n\n이 룰이 내는 통과 결정에도 커널이 승인 스탬프 둘을 같은 슬롯 둘에서 읽어 찍습니다.\n\n## 내부 이체는 custody 지갑 사이에서만 일어납니다\n\n```json\n{\n  \"id\": \"custody-transfer/allow-evm-internal-custody\",\n  \"effect\": \"allow\",\n  \"scope\": {\n    \"all\": [\n      { \"field\": \"operation\", \"op\": \"eq\", \"value\": \"value_transfer\" },\n      { \"field\": \"chain.family\", \"op\": \"eq\", \"value\": \"evm\" },\n      { \"field\": \"destination.type\", \"op\": \"eq\", \"value\": \"internal_vault\" },\n      { \"field\": \"source_vault.kind\", \"op\": \"eq\", \"value\": \"custody\" },\n      { \"field\": \"destination.vault_kind\", \"op\": \"eq\", \"value\": \"custody\" }\n    ]\n  }\n}\n```\n\nvault 이체는 워크스페이스 vault 사이의 이동입니다([자세히](/fund-flows/vault-transfer)). 적용\n범위의 다섯 조건이 그 이동을 가릅니다.\n\n- `operation` = `value_transfer` : 값 이동만 매치합니다\n- `chain.family` = `evm` : EVM 계열 네트워크의 요청만 매치합니다\n- `destination.type` = `internal_vault` : 목적지가 내부 vault인 요청만 매치합니다\n- `source_vault.kind` = `custody` : 출발이 custody vault인 요청만 매치합니다. deposit vault에서 출발하는 집금과 갈립니다\n- `destination.vault_kind` = `custody` : 목적지가 custody vault인 요청만 매치합니다\n\n**목적지가 deposit vault인 이동은 여기 없습니다.** 자금 흐름에 custody에서 deposit으로\n되돌리는 방향이 없기 때문입니다.\n\n통과하는 요청입니다.\n\n- `operation` : `value_transfer`\n- `chain.family` : `evm`\n- `destination.type` : `internal_vault`\n- `source_vault.kind` : `custody`\n- `destination.vault_kind` : `custody`\n\n막히는 요청입니다. 나머지는 같고 목적지 vault가 deposit입니다. 어느 allow에도 걸리지 않아 기본\n거절로 끝납니다.\n\n- `source_vault.kind` : `custody`\n- `destination.vault_kind` : `deposit`\n\n여기서도 통과 결정에 승인 스탬프 둘이 같은 슬롯 둘에서 와서 찍힙니다.\n\n## 예시에 없는 것 셋에는 각각 이유가 있습니다\n\n세 룰이 다루지 않는 것이 셋입니다. 하나는 쓸 수 있으나 실물이 없고, 둘은 지금 쓸 수 없습니다.\n\n- **deny 룰**: 룰 스키마는 `effect`에 `deny`를 허용하고, deny 룰에는 통과로 확정되기 전에 이행해야 하는 조건인 obligation을 달 수 없습니다. deny 룰은 지금도 쓸 수 있습니다. 시드에 실물이 없어 이 페이지에 싣지 않는 것뿐입니다. 계약은 [룰 명세](/policy/rule/reference)에, deny가 허가를 덮는 사례는 [금지선](/policy/use-cases/deny-override)에 있습니다\n- **자산별 금액 상한 조건**: 금액 리터럴의 순서 비교는 컴파일 검사가 거부합니다. 그래서 상한은 금액 슬롯을 참조해서만 씁니다. 값 이동 금액 슬롯은 자산마다 엔트리를 요구하는데, 그 자산 키는 `token_catalog` 수집이 동작한 뒤에 정해집니다\n- **서명 연산의 정족수**: 정족수는 승인이 성립하는 데 필요한 최소 승인자 수입니다. 지금 서명 연산에는 obligation 루프가 없어 정족수를 요구할 곳이 없고, 세 룰의 통과 방향 끝이 그대로 `allow`인 것도 같은 이유입니다\n\n여러 룰의 결정이 하나로 합쳐지는 규칙은 [결정과 결합](/policy/rule/decision)에 있습니다. 조건\n하나가 수집 루프를 발동하는 흐름은 [출금 화이트리스트](/policy/use-cases/whitelist-loop)가\n처음부터 끝까지 따라갑니다.\n\n## 다음으로\n\n- [룰 저작과 발행](/policy/workflow) — 이 룰을 고쳐 발행할 때 거치는 절차\n- [결과 읽기](/policy/results) — 거절과 보류가 파트너 대상 API 응답에 나타나는 곳\n- [룰 쓰기](/policy/rules) — 조각의 뜻과 참조할 수 있는 필드 전체\n", "kind": "참고 문서", "path": "_reference/policy--examples.html", "reference": true}, {"title": "전체 지도", "text": "---\ntitle: 전체 지도\ndescription: 저작 산출물이 가는 세 경로와 평가 입력의 조립, 두 장으로 요약한 정책 엔진\n---\n\nexport const base = import.meta.env.BASE_URL.replace(/\\/$/, \"\");\n\n{/* 뷰어는 1440×900 데스크톱 기준의 자체 완결형 HTML이라 본문 칸(약 720px)에 그대로 넣으면 잘린다.\n    iframe을 1440×900으로 고정하고 칸 폭에 맞춰 축소한다 — 상호작용은 전체 화면·새 탭에서 한다. */}\n\u003cscript is:inline data-astro-rerun>{`\n(function () {\n  var W = 1440, H = 900;\n  function fit(w) {\n    var f = w.querySelector(\"iframe\");\n    var fs = document.fullscreenElement === w;\n    var s = fs ? Math.min(innerWidth / W, innerHeight / H) : w.clientWidth / W;\n    f.style.transform = \"scale(\" + s + \")\";\n    w.style.height = fs ? \"100%\" : Math.round(H * s) + \"px\";\n    f.style.left = fs ? Math.round((innerWidth - W * s) / 2) + \"px\" : \"0\";\n    f.style.top = fs ? Math.round((innerHeight - H * s) / 2) + \"px\" : \"0\";\n  }\n  function fitAll() { document.querySelectorAll(\".dg-wrap\").forEach(fit); }\n  window.__dgFit = fit;\n  window.__dgFull = function (btn) {\n    var w = btn.closest(\"figure\").querySelector(\".dg-wrap\");\n    (w.requestFullscreen || w.webkitRequestFullscreen).call(w);\n  };\n  addEventListener(\"resize\", fitAll);\n  addEventListener(\"fullscreenchange\", fitAll);\n  if (document.readyState !== \"loading\") fitAll(); else addEventListener(\"DOMContentLoaded\", fitAll);\n})();\n`}\u003c/script>\n\nexport function Diagram({ name, title }) {\n  const src = `${base}/diagrams/${name}.html`;\n  return (\n    \u003cfigure class=\"dg\" style=\"display:grid;gap:0;margin:.75rem 0 2.5rem 0\">\n      \u003cdiv class=\"dg-wrap\" style=\"margin:0;position:relative;overflow:hidden;width:100%;height:450px;border:1px solid var(--color-border,#e5e7eb);border-radius:8px 8px 0 0;background:#fff\">\n        \u003ciframe\n          src={src}\n          title={title}\n          loading=\"lazy\"\n          onload=\"window.__dgFit && window.__dgFit(this.parentElement)\"\n          style=\"position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0\"\n        >\u003c/iframe>\n      \u003c/div>\n      \u003cfigcaption style=\"margin:0;display:flex;gap:.6rem;justify-content:flex-end;align-items:center;padding:.55rem .75rem;border:1px solid var(--color-border,#e5e7eb);border-top:0;border-radius:0 0 8px 8px;font-size:.95rem\">\n        \u003cspan style=\"margin-right:auto;opacity:.6;font-size:.85rem\">축소 미리보기 — 상호작용은 전체 화면에서\u003c/span>\n        \u003cbutton type=\"button\" onclick=\"window.__dgFull(this)\" style=\"display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;background:transparent;font:inherit;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M8 3H5a2 2 0 0 0-2 2v3\"/>\u003cpath d=\"M21 8V5a2 2 0 0 0-2-2h-3\"/>\u003cpath d=\"M3 16v3a2 2 0 0 0 2 2h3\"/>\u003cpath d=\"M16 21h3a2 2 0 0 0 2-2v-3\"/>\u003c/svg>\n          전체 화면\n        \u003c/button>\n        \u003ca href={src} target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border:1px solid var(--color-border,#e5e7eb);border-radius:8px;text-decoration:none;font-size:.95rem;font-weight:600;color:inherit;line-height:1\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 3h6v6\"/>\u003cpath d=\"M10 14 21 3\"/>\u003cpath d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"/>\u003c/svg>\n          새 탭에서 열기\n        \u003c/a>\n      \u003c/figcaption>\n    \u003c/figure>\n  );\n}\n\n_읽는 사람: 파트너사 개발자와 구현팀. 조각들이 어디로 가는지만 담고, 각 조각의 정의와 규칙은 링크된 페이지에 있습니다._\n\n정책 엔진은 자금을 움직이는 요청이 서명 인프라로 가기 전에 그 요청을 심사하는 별도 시스템입니다.\n이 페이지는 그 엔진의 조각들을 한눈에 놓는 지도입니다. 저작 산출물이 어디로 가는지와 평가 입력이\n어떻게 조립되는지, 두 장으로 요약합니다.\n\n## 저작 산출물이 가는 곳은 셋으로 갈립니다\n\n저작과 검증에 등장하는 파일이 많아 보여도, 각 산출물이 가는 곳은 셋 중 하나입니다.\n\n- **번들에 들어갑니다**: 룰·슬롯·카탈로그·레지스트리·퇴역 대장. 컴파일을 거쳐 스냅샷 구획이\n  되고, 발행·활성화로 평가기의 data 에 적재됩니다.\n- **빌드에서만 쓰입니다**: 테스트 벡터·결합 스위트·골든 스위트. 발행될 번들 바이트를 재고,\n  번들에는 들어가지 않습니다.\n- **런타임에 조립됩니다**: 워크스페이스 번들·수집 스냅샷·테넌트 식별 값. 저작물이 아니라\n  요청마다 입력 문서로 조립됩니다.\n\n\u003cDiagram name=\"source-fates\" title=\"저작 산출물이 가는 세 경로 — 번들로 실리는 것과 빌드에서 끝나는 것\" />\n\n## 조각마다 소유 페이지가 있습니다\n\n역할 한 줄과 기준 페이지 위치입니다. 정의·규칙·실제 모습은 링크된 페이지에 있습니다.\n\n| 산출물 | 가는 곳 | 역할 한 줄 | 기준 페이지 |\n|---|---|---|---|\n| 룰 모듈 | 번들 | 관심사 하나의 룰 목록 | 설계 기록(내부) · [룰 쓰기](/policy/rules) |\n| 슬롯 카탈로그 | 번들 | 워크스페이스가 조정할 값의 선언과 하한 | 설계 기록(내부) |\n| 액션 카탈로그 | 번들 | 액션별 payload 경로와 타입 | 설계 기록(내부) |\n| 레지스트리 둘 | 번들 | PIP 소스·서명 어댑터 — 바깥 표면의 선언 | 설계 기록(내부) |\n| 퇴역 대장 | 번들 | 지운 룰 ID — 재사용 금지 | 설계 기록(내부) |\n| 테스트 벡터 | 빌드 전용 | 룰 하나의 기대 판정 | 설계 기록(내부) |\n| 결합 스위트 | 빌드 전용 | 모듈 결합과 obligation 병합 | 설계 기록(내부) |\n| 골든 스위트 | 빌드 전용 | 커널 자체의 변경 검사 | 설계 기록(내부) |\n| 규모별 프리셋 | 조건부 | 온보딩 시드 — 채택되면 그 기관의 저작 세트가 됩니다 | 이 페이지 (아래) |\n| 워크스페이스 번들 · 수집 스냅샷 | 런타임 조립 | 요청마다 입력 문서로 | [평가의 순간](/policy/runtime/evaluation) |\n\n**규모별 프리셋은 예시 문서가 아닙니다.** 관리 화면의 가이드 빌더가 생기기 전까지 플랫폼이 기관\n대신 저작하는 시드 세트입니다. 표의 저작 세트는 룰 모듈과 카탈로그·레지스트리 파일이 놓이는\n묶음입니다.\n\n프리셋은 플랫폼 시드 위에 겹쳐 같은 컴파일 검사와 채점을 거칩니다. 채점은 컴파일된 룰을\n케이스로 돌려 기대 결과와 맞는지 확인하는 검사입니다.\n\n겹침의 해석은 파일 단위이고, 같은 파일이 양쪽에 있으면 프리셋을 우선합니다.\n\n## 평가 입력은 조립 결과입니다\n\n입력 문서는 Orchestrator가 요청·환경·PIP 결과를 모아 평가기에 넘기는 완성된 평가 입력입니다.\n세 요소가 요청마다 하나로 조립됩니다 — 요청의 사실, 수집한 세상의 사실, 엔진이 확정한 값입니다.\n\n조립 규칙과 슬롯 해석은 [평가의 순간](/policy/runtime/evaluation)에 있습니다.\n\n\u003cDiagram name=\"input-document\" title=\"평가 입력 문서 — 세 재료와 엔진 구획\" />\n\n## 다음으로\n\n각 역할이 어디에 배포되는지는 [구조](/policy/architecture)에 있습니다. 판단과 집행이 나뉘는 두\n단계는 [서명 게이트](/policy/signing-gate)에, 상호작용 뷰어 모음은\n[다이어그램](/policy/diagrams)에 있습니다.\n\n파일 위치를 하나씩 열거한 목록은 정책 엔진 내부 문서에 있습니다. 여기서 알 것은 그 파일이\n각각 위의 세 경로 중 하나로 간다는 점입니다.\n", "kind": "참고 문서", "path": "_reference/policy--map.html", "reference": true}, {"title": "운영과 관측", "text": "---\ntitle: 운영과 관측\ndescription: fail-closed는 조용합니다\n---\n\n_읽는 사람: 구현팀. 프로덕션 배포 전에 세워야 하는 관측과 운영 요건을 다룹니다._\n\n이 페이지는 정책 엔진을 운영하며 무엇을 보고 무엇을 알릴지를 담습니다. 조용한 실패 지점을 고정해\n두고, 지점마다 신호를 어디서 얻고 어떤 코드로 알릴지를 적습니다.\n\n## fail-closed의 침묵\n\n정책 엔진은 판단 불가도, 데이터 부재도, 정규화 실패도 전부 거부로 떨어뜨립니다. **그래서 정상\n요청이 거부되는 것과 공격이 거부되는 것이 시스템에서 똑같이 보입니다.**\n\n이중화한 경로도 같습니다. 한쪽이 죽어도 증상이 없습니다.\n\n이 두 성질이 관측을 선택이 아니라 요건으로 만듭니다. 여기 적은 항목은 코어 구현을 막지 않지만\n프로덕션 배포를 막습니다.\n\n## 관측 대상의 도출\n\n무엇을 볼지는 취향이 아닙니다. **설계가 \"fail-closed\"·\"이중화\"·\"기록만 남긴다\"라고 적은 대목이\n그대로 알림 목록입니다.**\n\n조용한 실패 지점을 스무 곳 고정해 두었습니다. 지점마다 무엇이 조용히 일어나는지, 신호를 어디서\n얻는지, 어떤 코드로 알릴지, 근거가 무엇인지를 함께 답니다.\n\n목록을 순번으로 세지 않습니다. \"앞의 여섯이 핵심\"처럼 쓰면 행이 늘 때마다 그 수가 조용히\n어긋납니다.\n\n## 판정 불가라는 세 번째 값\n\n대조가 실행되지 못한 사이클과 \"이상 0\" 사이클은 모양이 같습니다. **데이터소스 장애가 곧 무탐지가\n되는데, 그 상태가 초록으로 보입니다.**\n\n그래서 판정을 두 값이 아니라 세 값으로 둡니다. 정합, 훼손, 그리고 판정 불가입니다. 판정 불가도\n알림을 내고, 코드를 따로 씁니다.\n\n코드를 가르는 이유는 대응이 다르기 때문입니다. 훼손은 조사할 일이고 판정 불가는 탐지 장치를\n복구할 일입니다. 지금 네 곳입니다 — 승인 없는 발행의 주기 대조, 어드민 소속 대조, 결정\n기록 체인 검증, sidecar 자가 점검입니다.\n\n결정 기록은 결정을 주체·행위·대상·시각·결과와 함께 남기는 추가 전용 해시 체인입니다.\n\n각 지점에서 판정 불가가 나오는 사연도 적어 둡니다. 발행 대조에서는 승인자 스코프를 재검증하지\n못하는 경우가 그 하나입니다. 표를 던진 뒤 부여가 좁혀졌는데 표에 자격 스냅샷을 남기지 않아 좁힌\n시점을 알 수 없습니다.\n\n## 감지기 자기 고장의 취급\n\n번들 활성화 드리프트는 60초 주기로 대조하고 같은 기대값에서 불일치가 연속 3회면 알립니다.\n감지 지연은 120초입니다.\n\n구동기 자신이 실패하면 불일치로 세지 않고 연속 카운터를 유지한 채 판정 불가로 남깁니다. 지금\n무엇이 서빙되는지를 정하는 단일 기록인 활성 포인터를 못 읽거나 sidecar가 무응답인 때입니다.\n\n두 대안이 다 틀립니다. 카운터를 리셋하면 DB가 불안정한 동안 드리프트가 영영 임계를 못 채웁니다.\n**일치로 처리하면 감지 장치가 자기 고장을 초록으로 보고합니다.**\n\n## 매 주기 감사 줄\n\n대조가 돌 때마다 감사 줄을 남깁니다. 불일치일 때만이 아니라 **일치일 때도 남깁니다.**\n\n통제가 동작했다는 것 자체가 증거이기 때문입니다. 기록이 없으면 \"이상이 없었다\"와 \"동작하지\n않았다\"를 사후에 가를 수 없습니다.\n\n## 저장소 직접 DML의 탐지\n\n앱이 갱신하지 않는 상태가 둘 있습니다. 워크스페이스 구획의 저장 바이트와 어드민 계정의\n소속입니다. 둘 다 앱이 쓰지 않으므로 어긋남은 앱 결함이 아니라 논리 DB에 직접 건 DML의\n자국입니다.\n\n**요청 경로가 그것을 보지 못합니다.** 구획 캐시가 선언 다이제스트를 키로 쓰므로, 다이제스트를\n그대로 둔 채 바이트만 바꾼 편집은 평가에서 드러나지 않습니다. 소속 위반도 부여 시점 검사를 거쳐 온\n뒤라 조회가 막지 않습니다.\n\n그래서 주기 대조가 유일한 신호입니다. 셋 다 자동 조치가 없습니다. 어느 쪽이 옳은지 대조가 정할 수\n없기 때문입니다.\n\n| 알림 코드 | 무엇을 뜻하는가 | 발생 지점 |\n|---|---|---|\n| `WORKSPACE_BUNDLE_CONTENT_DRIFT` | 워크스페이스 구획의 저장 바이트가 발행 시점에 기록된 `content_hash`와 어긋납니다 | 워크스페이스 번들 주기 대조 — 등록된 워크스페이스를 커서로 돌며 틱마다 일부를 다시 해시하고, 같은 선언 다이제스트에 연속 3회 불일치 |\n| `ADMIN_HOME_SCOPE_MISMATCH` | 어드민 계정의 소속과 그 계정의 부여 스코프가 어긋납니다. 건수만 내고 자동 수정이 없습니다 | 발행 대조 사이클(1시간)에 얹힌 소속 대조 |\n| `ADMIN_HOME_SCOPE_UNDECIDABLE` | 소속 대조가 판정하지 못했습니다 — 조회 무응답·collation 불일치입니다 | 동 |\n\n소속을 옮길지 부여를 지울지는 대조가 정할 수 없습니다. 예방은 부여 시점 검사가 하므로 앱이\n만드는 위반은 0이고, 그 전제가 앱만이 어드민 논리 DB에 쓴다는 것입니다.\n\n## 드리프트의 자동 조치\n\n드리프트에 자동 조치를 두지 않습니다. 서빙을 차단하지도, 자동으로 재활성화하지도 않습니다.\n\n**자동 재활성화는 앱이 스스로 정책을 바꾸는 경로입니다.** \"발행이 곧 활성화\"를 금지해 둔 것과\n정면으로 충돌합니다.\n\n평가 요청마다 대조하지도 않습니다. 폴링 시차는 정상이고, 매번 강제하면 발행할 때마다 최대 20초\n동안 전량이 막힙니다.\n\n## 사이드카 자가 점검\n\nsidecar 관리 표면이 열려 있으면 번들 경로 통제가 전부 우회되는데, 평상시 증상이 없습니다. 그래서\n데이터 쓰기 API에 무해 경로 쓰기를 실제로 시도해 거부되는지 봅니다. 수락되면 알립니다.\n\n**무해 경로는 번들이 소유한 경로 밖이어야 합니다.** 번들 소유 경로는 인가와 무관하게 400이 나고,\n그것을 \"거부됨\"으로 읽으면 점검이 영원히 통과합니다.\n\n성공한 쓰기는 되돌립니다. 되돌리지 못하면 그 사실을 같은 알림에 함께 냅니다.\n\n결론에 닿지 못한 상태는 별도 코드입니다. 무응답·타임아웃·예상 밖 상태코드가 그것입니다. 거짓\n초록이 통제 부재보다 나쁩니다. 이 점검이 그 방어선의 유일한 장치이기 때문입니다.\n\n## 알림 페이로드의 범위\n\n알림에 개인정보·키·토큰·서명 대상 원문을 포함하지 않습니다. 해석된 값도 넣지 않습니다.\n\nworkspace 대조가 어긋났을 때 알림에 담는 것은 요청 상관 키와 호출자가 스스로 보낸 식별 값까지입니다.\n해석해서 얻은 workspace와 tenant는 알림에도 거부 사유에도 없습니다. **거부 응답이 열거 수단이\n되지 않게** 하기 위해서입니다.\n\n발행 대조도 같습니다. 어긋난 항목 이름만 내고 해시 값은 내지 않습니다. 결정 기록 체인이 깨졌을\n때도 식별 값과 사유 코드까지만 냅니다. 엔트리 내용에 요청 전문이 있기 때문입니다.\n\n## 알림의 두 경로\n\n즉시 알림은 구조화 로그와 알림 포트로 동시에 나갑니다. 로그는 저장소 안에 남는 자국이고 알림은\n밖으로 나가는 신호라, 채널이 사라져도 자국은 남아야 합니다.\n\n기본 채널은 구조화 로그이고, `policy.alert.webhook-url`을 주면 그 URL로 JSON을 보냅니다.\n\n**발송 실패는 판정을 막지 않습니다.** 로그로 폴백합니다. 알림이 판정에 물리면 알림 채
