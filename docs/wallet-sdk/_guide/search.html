층 ↗ · 도메인 모델 ↗ · Wallet SDK ↗ Vault와 Wallet 객체 용도 식별과 주소 WorkspaceVault 파트너가 자금을 보관하고 출금·이체하는 지갑 그룹 API의 출발·목적지에는 wv-… Vault ID 사용 AccountVault 고객 측 지갑을 묶는 내부 그룹 공개 API로 직접 생성하지 않음. 첫 AccountWallet 생성에 따라 마련됨 AccountWallet 고객의 토큰별 입금 지갑 aw-… Wallet ID와 accountId를 연결 주소 온체인 수신·송신 위치 현재 EVM에서는 같은 Vault의 EVM 지갑들이 같은 주소를 공유 현재 EVM 모델에서는 같은 Vault의 토큰별 Wallet이 주소를 공유합니다. 서로 다른 주소가 필요하면 Vault를 분리해야 합니다. 온체인 기록을 저장할 때는 주소만으로 식별하지 않도록 네트워크와 토큰도 함께 보존하는 것을 권장합니다. 참고: 지갑 계층 ↗ 주요 식별자 값 만드는 쪽 / 의미 보존할 연결 accountId (acc-…) SDK / 최종 사용자 계정 파트너 사용자 referenceId + Tenant 범위 accountWalletId (aw-…) SDK / 고객 토큰 지갑 accountId + tokenId + 수신 주소 depositId (awd-…) SDK / 관측한 입금 건 지갑 + txHash + 입금 금액 / Sweep이 가리키는 대상 sweepId · withdrawalId · workspaceVaultTransferId SDK / 이동 요청 파트너 업무 referenceId + 요청 본문 + 후속 상태 referenceId 파트너 / 업무별 재조회에 사용하는 식별자 계정·Sweep은 Tenant, VaultTransfer는 Workspace의 유일성 규칙 확인 Idempotency-Key HTTP 요청 헤더 지갑 생성에서는 필수이지만 중복 방지 처리가 미구현 멱등성과 재조회 중복 처리 방식은 API마다 다릅니다. 계정 생성은 같은 referenceId에 400을 반환하므로 조회로 기존 계정을 찾습니다. 지갑 생성은 Idempotency-Key가 필수지만 중복 방지 처리가 아직 없습니다. OpenAPI의 헤더 설명과 실제 지원 범위를 함께 확인해야 합니다. 참고: 첫 요청 ↗ · 집금 (Sweep) ↗ · Vault 이체 (Vault Transfer) ↗ Vault 용도와 자산 분리 Vault에 용도 태그를 붙일 수 있지만 SDK가 이를 해석하지는 않습니다. 태그를 정책 입력으로 읽는 PIP도 아직 없습니다. 출금 풀로 표시한 Vault만 목적지로 허용하려면 별도의 통제 방법이 필요합니다. 자산 분리 설계 고객 보관용과 회사 자산용 Vault의 식별 방법, 허용할 이동 조합, 주소 등록·활성화 권한을 정해야 합니다. 이 구분을 SDK가 자동으로 집행하는지는 공개 문서만으로 확인되지 않습니다. 참고: 지갑 계층 ↗ · 집금 (Sweep) ↗ · Vault 이체 (Vault Transfer) ↗ ← 전체 흐름 입금 주소 발급 → 문서 출처와 검토 범위", "kind": "업무 안내", "path": "_guide/concepts.html"}, {"title": "입금 주소 발급", "text": "입금 주소 발급 계정을 생성한 뒤 토큰을 선택해 AccountWallet을 발급합니다. 반환된 주소가 고객의 입금 주소입니다. 이 페이지 목차 환경 준비 계정 생성 토큰 선택과 지갑 생성 입금 확인 환경 준비 Workspace, Network, Tenant, API 키, Token, WorkspaceVault는 플랫폼 운영자가 먼저 준비해야 합니다. 실제 API 호스트와 온보딩 절차도 운영자에게 확인합니다. 예시의 키와 ID를 발급받은 값으로 바꿔 호출합니다. 인증 헤더는 X-API-KEY 이며, Workspace와 Tenant는 API 키에 연결된 범위가 적용됩니다. 키 전달 API 키의 비밀 값은 승인 후 한 번만 표시됩니다. 발급받을 때 비밀 저장소에 보관해야 합니다. 참고: 첫 요청 ↗ · 표면과 인증 ↗ 계정 생성 POST 요청 예시 복사 POST /api/v1/accounts\nX-API-KEY: \u003c발급받은_API_키>\nContent-Type: application/json\n\n{\n  \"referenceId\": \"user-8f21c0\"\n} 201 응답의 계정 ID를 파트너 사용자와 연결해 저장합니다. 같은 Tenant에서 이미 사용한 referenceId는 400 입니다. 응답을 놓쳤다면 다음 조회로 기존 계정을 확인합니다. GET 요청 예시 복사 GET /api/v1/accounts?referenceId=user-8f21c0\nX-API-KEY: \u003c발급받은_API_키> 참고: 계정 생성 ↗ · 계정 referenceId 조회 ↗ 토큰 선택과 지갑 생성 GET 요청 예시 복사 GET /api/v1/tokens\nX-API-KEY: \u003c발급받은_API_키> 활성 Token·Network 목록에서 실제 tokenId 를 선택합니다. 지갑 생성에는 SDK가 반환한 accountId를 넣습니다. POST 요청 예시 복사 POST /api/v1/accounts/{accountId}/account-wallets\nX-API-KEY: \u003c발급받은_API_키>\nIdempotency-Key: \u003c요청_식별자>\nContent-Type: application/json\n\n{\n  \"tokenId\": \"\u003c선택한_tokenId>\"\n} 201 응답의 Wallet ID와 주소를 저장합니다. 사용자는 해당 네트워크·토큰으로 이 주소에 송금합니다. 지갑 생성 재시도 Idempotency-Key는 필수지만 현재 서버에서 사용하지 않습니다. 응답을 받지 못했으면 지갑 목록부터 조회합니다. 생성 여부를 확인하기 전에는 같은 요청을 다시 보내지 않습니다. GET 요청 예시 복사 GET /api/v1/accounts/{accountId}/account-wallets\nX-API-KEY: \u003c발급받은_API_키> 참고: 첫 요청 ↗ · 계정 지갑 생성 ↗ 입금 확인 주소 발급 완료 계정·Wallet·Token·주소 매핑을 저장하고 고객에게 네트워크와 주소를 전달합니다. 입금 관측 대기 고객이 온체인으로 송금하면 SDK가 감지합니다. 파트너가 호출하는 “입금 생성 API”는 없습니다. 입금 확정 후 처리 웹훅 또는 입금 조회로 상태를 확인합니다. 확정된 입금도 SDK 내부에서는 동결되므로 별도의 Sweep 판단이 필요합니다. GET 요청 예시 복사 GET /api/v1/accounts/{accountId}/deposits\nX-API-KEY: \u003c발급받은_API_키> 참고: 첫 요청 ↗ · 입금 (Deposit) ↗ ← 계정·주소·Vault 입금 → Sweep → 문서 출처와 검토 범위", "kind": "업무 안내", "path": "_guide/start.html"}, {"title": "입금과 집금 (Sweep)", "text": "입금과 집금 (Sweep) 고객 입금은 온체인 확정 후에도 동결 상태로 남습니다. 심사를 마친 입금 건을 지정해 WorkspaceVault로 집금합니다. 이 페이지 목차 집금 대상과 목적지 처리 순서 Sweep 요청 상태와 완료 기준 재시도와 미지원 기능 집금 대상과 목적지 고객에게 발급한 AccountWallet과 연결된 accountId·tokenId·네트워크·주소가 필요합니다. Sweep의 목적지는 WorkspaceVault ID 입니다. 어떤 Vault를 출금 풀이나 보관용으로 사용할지는 파트너가 정합니다. 파트너는 입금의 고객 귀속과 심사 결과를 관리합니다. 주소록·트래블룰 정보가 일치한다는 사실만으로 SDK가 자동 해제하거나 자동 Sweep하지는 않습니다. 참고: 입금 (Deposit) ↗ · 자금 동결 ↗ · 집금 (Sweep) ↗ 처리 순서 정책 연동은 설계 흐름 현재 Wallet 서버는 실제 정책 서버와 연결되지 않아 동기 자동 승인합니다. 아래의 정책 심사·서명 인가 흐름은 연동 설계이며, 실제 연결과 거부·실패 동작 검증이 필요합니다. 참고: 정책 결과와 현재 구현 ↗ SDK가 입금을 관측합니다 DEPOSIT_DETECTED를 받으면 입금 건을 기록합니다. 이 시점은 온체인 확정 전입니다. 네트워크 기준에 따라 확정됩니다 DEPOSIT_FINALIZED의 이벤트 상태는 FINALIZED이지만 SDK 내부 입금 상태는 FROZEN입니다. 동결은 SDK DB의 사용 제한이며 온체인 토큰의 동결 기능을 뜻하지 않습니다. 파트너가 입금 처리 여부를 판단합니다 필요한 출처 확인·심사를 마친 뒤 depositId와 목적지 Vault를 지정하여 Sweep을 요청합니다. 트래블룰·KYT 연계에는 아래 미구현 제약이 있습니다. SDK가 정책 판단을 받고 입금 건을 선점합니다 FROZEN이고 진행 중인 이동이 없는 입금 건만 조건부로 갱신합니다. 입금 한 건에 동시에 두 개의 이동이 진행되는 것을 막는 조건입니다. 인가받은 내용으로 서명하고 송금합니다 서명 인프라가 제출한 실제 서명 대상을 일회용 인가와 대조합니다. SWEEP_INITIATED는 집금 시작 알림입니다. SWEEP_FINALIZED로 집금 완료를 확인합니다 집금의 온체인 완료를 확인하고 파트너 원장에 업무 정책대로 반영합니다. 내부 WITHDRAWN 표시만으로 완료 처리하지 않습니다. DB 처리와 온체인 전송 입금 선점과 해제 회계는 DB에서 묶어 처리할 수 있지만, 온체인 송금까지 같은 트랜잭션으로 확정되지는 않습니다. 실제 송금 결과는 이동 상태와 완료 이벤트로 확인합니다. 참고: 입금 (Deposit) ↗ · 집금 (Sweep) ↗ · 자금 동결 ↗ · 웹훅(Webhook) ↗ Sweep 요청 POST 요청 예시 복사 POST /api/v1/sweeps\nX-API-KEY: \u003c발급받은_API_키>\nIdempotency-Key: \u003c요청_식별자>\nContent-Type: application/json\n\n{\n  \"depositId\": \"\u003c확정된_depositId>\",\n  \"destinationVaultId\": \"\u003c목적지_wv_ID>\",\n  \"referenceId\": \"sweep-job-0001\"\n} 201 응답의 sweepId를 저장합니다. 금액은 지정한 입금 건에서 가져오므로 요청에 amount를 넣지 않습니다. Idempotency-Key는 필수 헤더이며, 응답 유실 시에는 referenceId로 조회합니다. 여러 입금을 묶는 온체인 배치 구성은 이 API 명세에서 확인할 수 없습니다. 파트너 API는 요청 생성 시 201을 반환합니다. 정책 엔진의 내부 접수 응답은 202 이며, 이후 비동기로 평가합니다. 송금 완료 여부는 SWEEP_FINALIZED로 확인합니다. GET 요청 예시 복사 GET /api/v1/sweeps?referenceId=sweep-job-0001\nX-API-KEY: \u003c발급받은_API_키> 참고: 스윕 요청 생성 ↗ · 스윕 referenceId 조회 ↗ · 서명 게이트 ↗ 집금 접수·거부 설명의 차이 집금 시퀀스는 기록 생성·201 후 비동기 심사를 그립니다. 새 결과 읽기는 인가 전에 집금 행을 만들지 않고 거부 시 조회 기록도 없다고 설명합니다. 현재는 자동 승인하므로 실제 정책 연결 후 접수·거부·조회 계약을 확인해야 합니다. 참고: 집금 원문 ↗ · 정책 결과와 현재 구현 ↗ 상태와 완료 기준 보이는 신호 의미 파트너 처리 DEPOSIT_DETECTED 입금 감지 관측 기록. 확정 입금과 구분 DEPOSIT_FINALIZED / 내부 FROZEN 온체인 확정 / 사용 제한 유지 귀속·심사 판단. 사용 가능 잔액과 구분 내부 WITHDRAWN 원문상 Sweep 접수 단계에서도 등장하는 상태 단독으로 집금 완료를 판단하지 않음 SWEEP_INITIATED 송금 시작 sweepId로 계속 추적 SWEEP_FINALIZED 집금 완료 중복을 제거하고 원장에 반영 SWEEP_FAILED 집금 실패 실패 사유와 최신 상태 확인. 원문상 입금은 FROZEN으로 복귀 원장 반영 시점 입금 표시, 사용 가능 잔액 전환, 집금 완료 기록의 시점은 파트너의 원장 정책으로 정합니다. 각 시점에 사용할 SDK 이벤트를 연결해 두어야 합니다. 참고: 입금 (Deposit) ↗ · 집금 (Sweep) ↗ · 웹훅(Webhook) ↗ 재시도와 미지원 기능 응답을 받지 못했으면 referenceId로 기존 Sweep을 조회합니다. 같은 값으로 다시 요청해도 기존 집금을 반환하는 계약입니다. 새 referenceId를 발급하기 전에는 이전 요청의 결과부터 확인합니다. 트래블룰·KYT 연동 미구현 입금에 트래블룰·KYT 정보를 결합하는 기능과 DEPOSIT_UPDATED 통지는 아직 구현되지 않았습니다. 현재 입금 이벤트만으로 이 정보를 얻을 수는 없습니다. 목적지 Vault의 용도 태그를 검사하는 PIP도 미구현입니다. AccountWallet 입금은 Sweep 또는 반환으로 소비합니다. WorkspaceWallet 입금은 별도의 전액 해제 경로를 사용합니다. 참고: 입금 (Deposit) ↗ · 자금 동결 ↗ · 집금 (Sweep) ↗ ← 입금 주소 발급 고객 출금·반환 → 문서 출처와 검토 범위", "kind": "업무 안내", "path": "_guide/deposit.html"}, {"title": "출금과 오입금 반환", "text": "출금과 오입금 반환 출금 유형에 따라 출발 지갑, 목적지, 호출 권한과 승인 경로가 달라집니다. 이 페이지 목차 출금 유형 수취 주소 등록 고객 출금 요청 서명과 출금 완료 실패와 재조회 출금 유형 유형 자금 경로 대상·통제 고객 출금 WorkspaceVault → 외부 주소 Account에 귀속되는 고객 출금. 파트너 API 자체 출금 WorkspaceVault → 회사 외부 주소 회사 자산의 이동. Workspace 범위의 운영 경로 오입금 반환 AccountWallet → 해당 입금의 원래 송신 주소 운영자 경로. 문서는 승인과 서명 통제를 요구하며 임의 목적지는 허용하지 않음 고객 귀속 정보 고객 출금의 출발지는 WorkspaceVault입니다. 출발 Vault와 accountId를 함께 저장하고, 해당 고객의 원장 차감은 파트너가 처리합니다. 참고: 출금 (Withdrawal) ↗ 반환 승인 지원 여부 계정 지갑 반환은 운영자 승인·정족수를 요구하는 설계지만 현재 Wallet Admin Approvals API는 고정 응답이며 quorum은 null입니다. 실제 승인 절차 지원을 확인해야 합니다. 참고: 정책 결과와 현재 구현 ↗ 수취 주소 등록 수취인 유형 문서상 준비 현재 제약 NON_CUSTODIAL · 개인 지갑 주소록 nonce 발급 → 고객 서명 → 서명 증명으로 주소 등록 미등록 주소의 최종 허용·거부는 정책이 결정한다고 설명됨 CUSTODIAL · 외부 VASP 수취 주소 확인과 트래블룰 정보 교환을 거치는 설계 현재 400 ACCOUNT_WITHDRAWAL_CUSTODIAL_UNSUPPORTED 개인 지갑의 주소 등록은 다음 경로를 사용합니다. nonce 발급과 서명 검증의 상세 필드는 원문 API에서 확인합니다. POST 요청 예시 복사 POST /api/v1/accounts/{accountId}/address-books/nonce\nX-API-KEY: \u003c발급받은_API_키>\nContent-Type: application/json\n\n{\n  \"networkId\": \"\u003c대상_networkId>\",\n  \"address\": \"\u003c수취_주소>\"\n} POST 요청 예시 복사 POST /api/v1/accounts/{accountId}/address-books\nX-API-KEY: \u003c발급받은_API_키>\nContent-Type: application/json\n\n{\n  \"label\": \"고객 개인 지갑\",\n  \"networkId\": \"\u003c대상_networkId>\",\n  \"address\": \"\u003c수취_주소>\",\n  \"nonce\": \"\u003c발급받은_nonce>\",\n  \"signature\": \"\u003cnonce에_대한_고객_서명>\"\n} 참고: 출금 (Withdrawal) ↗ · 주소록 등록용 지갑 소유 증명 nonce 발급 ↗ · 주소록 등록 (지갑 소유 증명 nonce 서명 포함) ↗ 고객 출금 요청 POST 요청 예시 복사 POST /api/v1/accounts/{accountId}/withdrawals\nX-API-KEY: \u003c발급받은_API_키>\nIdempotency-Key: \u003c요청_식별자>\nContent-Type: application/json\n\n{\n  \"sourceVaultId\": \"\u003c출발_wv_ID>\",\n  \"tokenId\": \"\u003c출금_tokenId>\",\n  \"amount\": \"1.25\",\n  \"walletType\": \"NON_CUSTODIAL\",\n  \"destinationAddress\": \"\u003c수취_주소>\",\n  \"referenceId\": \"withdrawal-job-0001\"\n} amount 는 토큰 표시 단위의 문자열입니다. 예시의 주소와 ID를 실제 값으로 바꿔 요청하고, 201 응답의 withdrawalId를 요청 본문과 함께 저장합니다. 출금 잔액 검증 미구현 고객 출금과 자체 출금에는 선행 잔액 검증이 아직 없습니다. 동결·예약 금액을 제외하지 않고 출금이 진행될 수 있으므로 운영 전에 보완이 필요합니다. 파트너의 잔액 확인만으로는 SDK 내부의 동시 요청까지 통제할 수 없습니다. 참고: 출금 요청 ↗ · 자금 동결 ↗ 서명과 출금 완료 정책 연동은 설계 흐름 현재 Wallet 서버는 실제 정책 서버와 연결되지 않아 동기 자동 승인합니다. 아래의 정책 심사·서명 인가 흐름은 연동 설계이며, 실제 연결과 거부·실패 동작 검증이 필요합니다. 참고: 정책 결과와 현재 구현 ↗ 파트너가 출금 업무를 승인합니다 고객 귀속 금액과 자체 AML·FDS 기준을 확인하고 요청합니다. 이 판단과 SDK 정책 판단은 서로 다른 책임입니다. SDK가 정책 판단을 받습니다 정책 엔진은 비동기로 평가하고 허용된 요청에 일회용 서명 인가를 발급합니다. 거부되면 서명 인프라에 제출하지 않습니다. 서명 직전에 승인된 내용을 대조합니다 목적지·금액 등 실제 서명 대상이 인가와 맞고 미만료·미소비 상태여야 진행합니다. 이벤트와 조회로 완료를 확인합니다 WITHDRAWAL_INITIATED는 시작, WITHDRAWAL_FINALIZED는 완료, WITHDRAWAL_FAILED는 실패입니다. 시작 또는 트랜잭션 감지만으로 완료 처리하지 않습니다. GET 요청 예시 복사 GET /api/v1/accounts/{accountId}/withdrawals/{withdrawalId}\nX-API-KEY: \u003c발급받은_API_키> 참고: 출금 (Withdrawal) ↗ · 웹훅(Webhook) ↗ · 서명 게이트 ↗ 실패와 재조회 결과를 알 수 없으면 withdrawalId로 조회하거나 계정의 출금 목록에서 해당 요청을 찾습니다. 고객 출금에는 referenceId 전용 조회 API가 없습니다. 목록 조회 조건과 중복 생성 처리는 상세 명세를 확인합니다. 비활성 Account의 고객 출금은 404로 거부됩니다. 오입금 반환은 입금 당시의 송신 주소 기록이 있어야 요청할 수 있습니다. 다른 주소로 반환하는 경로는 아직 정해지지 않았습니다. 반환 승인 경로 미확정 자금 흐름 문서는 반환에 운영자 승인을 요구하지만, 정책 문서는 일반 admin_action 접수를 403으로 거부한다고 설명합니다. 반환 요청이 실제로 어느 승인 경로를 거치는지 확인이 필요합니다. 참고: 출금 (Withdrawal) ↗ · 승인 게이트 ↗ 정책 거부 상태 계약상 정책 거부는 FAILED / SCREENING_REJECTED로 읽습니다. 출금 정책 거부 전용 오류 코드는 명세에 없고, 현재 자동 승인 구현에서는 거부 분기에 도달하지 않습니다. 참고: 정책 결과와 현재 구현 ↗ ← 입금 → Sweep Vault 간 이동 → 문서 출처와 검토 범위", "kind": "업무 안내", "path": "_guide/withdrawal.html"}, {"title": "Vault 간 이체", "text": "Vault 간 이체 같은 Workspace에 속한 Vault 사이에서 자산을 옮깁니다. 요청 시 금액을 예약하고, 온체인 확정 후 양쪽 Vault 잔액 반영이 끝나면 완료를 통지합니다. 이 페이지 목차 이체 조건 이체 요청 잔액 예약과 전송 상태 조회 오류 처리 이체 조건 동일 Workspace의 WorkspaceVault 사이에서만 이동합니다. 출발과 목적지는 서로 달라야 하며 둘 다 활성 상태여야 합니다. AccountVault는 어느 쪽에도 쓸 수 없습니다. 내부 이체에는 외부 주소록·트래블룰 단계가 없습니다. 정책 평가와 서명 인가는 필요합니다. 고객 자산과 회사 자산 사이의 이동 허용 여부도 별도로 정해야 합니다. 참고: Vault 이체 (Vault Transfer) ↗ 이체 요청 POST 요청 예시 복사 POST /api/v1/workspace-vault-transfers\nX-API-KEY: \u003c발급받은_API_키>\nIdempotency-Key: \u003c요청_식별자>\nContent-Type: application/json\n\n{\n  \"sourceVaultId\": \"\u003c출발_wv_ID>\",\n  \"destinationVaultId\": \"\u003c목적지_wv_ID>\",\n  \"tokenId\": \"\u003c이체_tokenId>\",\n  \"amount\": \"1.25\",\n  \"referenceId\": \"vault-transfer-job-0001\"\n} referenceId 는 Workspace 안에서 이체 업무를 식별합니다. Idempotency-Key는 명세상 필수이지만 이체 안내는 해당 헤더가 아직 동작하지 않는다고 명시합니다. 201 응답의 workspaceVaultTransferId를 저장합니다. 금액은 양수여야 하며 토큰 정밀도를 따라야 합니다. 참고: 워크스페이스 Vault 이체 요청 생성 ↗ 잔액 예약과 전송 입력과 사용 가능 잔액 검사 동일 Vault, 비활성 Vault, 잘못된 금액을 거부합니다. 문서의 사용 가능 잔액 개념은 온체인 잔액에서 동결 금액과 진행 중 예약 금액을 뺀 값입니다. 예약과 정책 판단 VaultTransfer는 잔액을 예약합니다. 정책 거부는 400 계약이지만 현재 Wallet 서버는 실제 정책 서버와 연결되지 않아 자동 승인합니다. 서명과 온체인 제출 인가와 실제 서명 대상을 대조하여 제출합니다. 원장 예약은 실시간 온체인 잔액 조회를 대신하지 않으므로 provider에서 잔액 부족으로 실패할 수 있습니다. 정산 중 → 양쪽 잔액 반영 → 완료 온체인 확정 후 SETTLING으로 기록합니다. 목적지 Vault 잔액을 반영한 뒤 출발 Vault 잔액과 예약을 정리하고 COMPLETED로 바꿉니다. 완료 통지는 양쪽 반영 뒤에 나갑니다. 정책 계약과 현재 구현 v1.1.0의 결과 읽기는 현재 정책 인가를 동기로 자동 승인한다고 설명합니다. VaultTransfer 정책 거부 시 400 계약은 있으나 지금은 그 분기에 도달하지 않습니다. 실제 정책 엔진 연결 후의 응답·상태·이벤트를 확인해야 합니다. 참고: 정책 결과와 현재 구현 ↗ 참고: Vault 이체 (Vault Transfer) ↗ · 자금 동결 ↗ · 서명 게이트 ↗ 상태 조회 상태·이벤트 뜻 PENDING → SCREENING → ON_CHAIN → SETTLING → COMPLETED 접수·심사·온체인·정산 중·완료. 중간 상태가 매번 통지된다는 뜻은 아닙니다. SETTLING / subStatus: COMPLETED 온체인 이동 완료, SDK 잔액 반영 중. 처리 중단 시 SDK 대사가 이어갑니다. 출발 가용액은 예약된 상태이며 목적지 가용액은 반영된 쪽부터 증가합니다. COMPLETED / VAULT_TRANSFER_FINALIZED 양쪽 Vault 잔액 반영 완료 후 통지. SDK 완료는 CORE 원장 반영 완료와 별개입니다. FAILED / VAULT_TRANSFER_FAILED 정산 중 이전에 실패 종결. SETTLING에 도달한 이체는 실패로 되돌리지 않습니다. INITIATED 이벤트 VaultTransfer에는 시작 통지가 정의되어 있지 않음. 생성 응답과 조회를 사용 GET 요청 예시 복사 GET /api/v1/workspace-vault-transfers?referenceId=vault-transfer-job-0001\nX-API-KEY: \u003c발급받은_API_키> GET 요청 예시 복사 GET /api/v1/workspace-vault-transfers/{workspaceVaultTransferId}\nX-API-KEY: \u003c발급받은_API_키> 참고: 웹훅(Webhook) ↗ · Vault 이체 (Vault Transfer) ↗ · 워크스페이스 Vault 이체 referenceId 조회 ↗ v1.1.0 완료 기준 웹훅 이벤트 표는 아직 온체인 확정 시점으로 설명합니다. 여기서는 최신 변경 이력과 Vault 이체 본문의 양쪽 잔액 반영 후 통지를 기준으로 읽습니다. SETTLING은 스윕·출금에서는 발생하지 않습니다. 참고: v1.1.0 변경 이력 ↗ · Vault 이체 ↗ · 웹훅 ↗ 오류 처리 상황 문서의 응답·상태 연동 시 처리 예약 가능한 잔액 부족 400 / WORKSPACE_VAULT_INSUFFICIENT_BALANCE 원인 해결 후 새로운 업무 시도 여부 결정 서명 인프라 제출 결과 불명 503 / WORKSPACE_VAULT_TRANSFER_PROVIDER_UNAVAILABLE, PENDING 유지 동일 referenceId로 조회·조정. 새 referenceId로 무조건 재송금하지 않음 제출 이후 실패 잔액 부족·revert·취소·timeout 등의 세부 상태 txHash와 최신 상태 확인 후 확정 실패 여부를 판단 이미 사용한 referenceId로 재생성 400 충돌 원래 요청을 조회해 결과를 확인 SETTLING에서 내부 처리 중단 실패 전환 없이 SDK 대사로 잔액 반영 재개 기존 이체를 조회·추적합니다. 자산은 이미 이동했으므로 새 요청으로 재송금하지 않습니다. 참고: Vault 이체 (Vault Transfer) ↗ ← 고객 출금·반환 정책 판단 → 서명 → 문서 출처와 검토 범위", "kind": "업무 안내", "path": "_guide/transfer.html"}, {"title": "정책 평가와 서명", "text": "정책 평가와 서명 정책 엔진이 요청을 평가해 일회용 인가를 발급합니다. 서명 직전에는 실제 트랜잭션이 인가 내용과 일치하는지 검사합니다. 이 페이지 목차 독립 정책 엔진을 두는 이유 평가와 서명 검증 요청 접수와 결과 통지 예제 1 — 등록된 개인 지갑으로 출금 예제 2 — 승인 후 거래가 바뀌는 경우 인가 유효 시간 운영자 승인 정책 작성과 결과 확인 독립 정책 엔진을 두는 이유 서비스 수준의 정책 판단과 승인 이력을 독립적으로 관리하고, product service가 고위험 업무를 단독 실행하지 못하게 하기 위한 설계입니다. Policy Server가 업무 실행 허가를 판단하고, Fireblocks 거래의 서명 직전에는 Co-Signer Callback으로 그 허가를 강제합니다. Fireblocks 자체 정책과 추가 승인 요건도 함께 충족해야 합니다. 도입 근거와 역할 설계 근거 의미 메인 설계 문서 2.3 · 운영 전제 Fireblocks policy와 별개로 서비스 수준의 정책 판단 및 승인 이력을 관리합니다. 후속 설계 문서 · 2026-06-09 결정 로그 Policy-Gated Operation Model을 도입해 product service가 고위험 업무나 Fireblocks transaction을 단독 실행하지 않고 Policy Server의 최종 업무 허가를 받게 합니다. 리스크 표 · Policy Server 우회 product service가 거래를 직접 생성할 수 있더라도, Co-Signer Callback이 Policy Server 검증을 통과하지 않으면 서명되지 않아야 합니다. 메인 설계 문서 · Policy-Gated Operation Model 외부 승인 주체는 Fireblocks 정책엔진의 추가 승인 요건입니다. JV cosigner가 allow해도 Fireblocks의 승인 요건이 부족하면 거절될 수 있습니다. 근거: 사용자가 제공한 메인·후속 설계 문서 발췌를 요약했습니다. 해당 설계 원문은 이 SDK 보관본에 포함되어 있지 않습니다. 거래 생성과 서명 허가는 별개입니다 예를 들어 product service가 Policy Server를 거치지 않고 출금 거래를 직접 생성했다고 가정합니다. 서명 단계에서 PEP가 실제 서명 대상을 전달하고, Orchestrator가 유효한 인가와의 일치를 검증해야 합니다. 인가가 없거나 거래 내용이 다르면 서명을 거부해야 합니다. 이 통제가 성립하려면 대상 거래의 서명 경로에 해당 콜백 검증이 필수로 연결되어야 합니다. 서비스 정책·서명 대조 Fireblocks 정책·승인 요건 결과 통과 충족 두 정책 계층의 조건을 충족합니다. 나머지 서명·실행 조건도 통과해야 거래를 진행할 수 있습니다. 거부 또는 유효한 인가 없음 충족 콜백 검증에서 서명을 차단해야 합니다. 통과 추가 승인 부족 또는 정책 거부 서비스의 허용만으로 진행할 수 없습니다. 두 계층의 허용은 모두 필요한 조건입니다. Policy Server의 최종 업무 허가는 Fireblocks의 정책 결정을 덮어쓰지 않으며, 어느 한쪽의 허용도 온체인 거래 완료를 보장하지 않습니다. 벤더 종속 완화는 별도의 설계 목적입니다 리스크 표의 Custody vendor lock-in 항목은 Fireblocks의 운영 편의성을 활용하면서 Wallet Server에 custody provider 추상화 계층을 두도록 합니다. 이 구조는 서비스 정책을 벤더와 분리하는 데 도움이 됩니다. Dfns 등 다른 제공자에서도 같은 통제를 유지하려면 해당 제공자의 서명·승인 경로에 인가 검증을 연결해야 하며, 추상화 인터페이스만으로 우회 차단이 완성되지는 않습니다. 이 절은 도입 의도와 요구되는 통제를 설명합니다. 보관된 SDK의 실제 정책 연동 상태와 현재 제약은 아래에서 함께 확인합니다. 평가와 서명 검증 설계 흐름과 현재 연결 상태 아래는 정책 연동 설계입니다. 보관된 v1.1.0 문서는 Wallet 서버와 실 정책 서버가 아직 연결되지 않았고 현재 동기 자동 승인한다고 명시합니다. 이 흐름을 현재 배포에서 검증된 처리로 보지 않습니다. 참고: 정책 결과와 현재 구현 ↗ 요청 시점에는 정책을 평가해 인가를 발급하고, 서명 직전에는 실제 거래가 그 인가와 일치하는지 검사합니다. 밑줄이 있는 용어는 마우스를 올리거나 키보드로 선택하거나 터치하면 설명을 볼 수 있습니다. 역할 맡는 일 Orchestrator 접수·정규화·자료 수집·재평가를 조율하고, 인가 저장·서명 직전 대조·일회용 소비를 맡습니다. PDP 주어진 입력에 룰을 적용해 판단합니다. 직접 외부 시스템을 조회하지 않습니다. PIP 룰이 요구하는 주소 소유 등 사실을 가져오는 Orchestrator의 어댑터 계층입니다. PEP Co-Signer 콜백을 받아 JWT를 검증하고 서명 대상을 추출합니다. 대조·소비는 Orchestrator에 맡깁니다. 1단계 — 정책 평가와 인가 발급 접수하고 정규화합니다 Wallet 서버가 POST /request 로 판단을 요청하면 Orchestrator는 202 와 판단 요청 ID를 돌려줍니다. 이후 비동기로 출발 지갑의 소유·체인을 해석하고 승인할 거래의 고정 내용을 정규화합니다. 필요한 사실을 수집하고 평가합니다 PDP가 적용할 룰을 평가합니다. 자료가 부족하면 need_more_data 를 반환하고, Orchestrator가 PIP로 자료를 수집한 뒤 전체 입력으로 재평가합니다. 보관된 버전의 평가 루프 수집 소스는 address_ownership 입니다. 허용하면 일회용 인가를 발급합니다 allow 이면 승인 내용·유효 시간·수수료 상한과 함께 signingAuthorizationId 를 저장하고 결과 이벤트를 발행합니다. deny 이면 거부 이벤트로 끝나며 서명 인프라에 제출하지 않습니다. 인가 ID와 함께 거래를 제출합니다 Wallet 서버는 승인 이벤트를 받아 서명 인프라에 거래를 제출합니다. 문서의 Fireblocks 경로에서는 externalTxId 에 인가 ID를 연결합니다. 이 ID는 조회 단서이며, 거래 내용의 검증을 대신하지 않습니다. 2단계 — 실제 서명 대상 대조와 소비 서명 직전 콜백을 받습니다 Co-Signer가 PEP에 JWT와 실제 서명 대상을 보냅니다. PEP는 인증·내용 추출 후 Orchestrator에 대조를 요청합니다. 승인 내용과 실제 거래를 맞춥니다 Orchestrator는 인가의 존재·만료·소비 여부, 출발 지갑과 실제 서명할 내용을 확인합니다. EVM 트랜잭션은 고정 필드와 nonce·수수료 등 서명 시점 값으로 재구성하고 수수료 상한도 대조합니다. 통과한 인가를 한 번 소비합니다 대조에 성공하면 인가를 원자적으로 소비하고 PEP가 승인 응답에 서명합니다. 거부되면 Co-Signer는 서명하지 않습니다. 이 콜백 경로에서는 주소록·AML 등 외부 시스템을 다시 호출하지 않습니다. 서명·방송 후 거래 결과를 추적합니다 서비스 인가 대조와 Fireblocks 자체 정책·추가 승인 요건을 모두 충족하고 나머지 실행 조건도 통과하면 서명 인프라가 거래를 서명·방송합니다. 정책 승인이나 인가 소비는 온체인 완료를 뜻하지 않습니다. Wallet 서버는 이후 거래 상태와 웹훅으로 최종 결과를 전달합니다. 정책 커널의 pending 은 추가 이행 조건을 기다리는 결정입니다. 다만 현재 서명 연산에는 obligation 루프가 없어 정족수 승인을 요구할 수 없다고 문서가 명시합니다. 관리자 2명 승인이 위 흐름에 이미 연결됐다고 해석하지 않습니다. 참고: 서명 게이트 ↗ · 평가의 순간 ↗ · PIP ↗ 요청 접수와 결과 통지 경계 응답·판단 의미 파트너 → Wallet API 이동 요청 생성의 201 업무 엔티티 생성. 온체인 완료 아님 Wallet → 정책 엔진 판단 접수 202 비동기 평가 시작. 파트너 API의 응답 코드와 다름 정책 엔진 → Wallet 허용·거부 결과 이벤트 허용 시 인가를 근거로 후속 제출 서명 인프라 → 정책 콜백 서명 대조 승인·거부 이미 허용된 요청과 실제 서명할 내용의 일치 확인 SDK → 파트너 업무별 FINALIZED 또는 FAILED 웹훅 파트너가 자기 업무 식별자로 결과 반영 정책 엔진의 중복 판단 요청은 409 규칙을 따릅니다. 파트너 API의 중복 생성 처리는 각 업무의 referenceId와 Idempotency-Key 계약을 확인해야 합니다. 참고: 서명 게이트 ↗ · 웹훅(Webhook) ↗ · 첫 요청 ↗ 예제 1 — 등록된 개인 지갑으로 출금 설명을 위해 custody vault에서 등록된 개인 지갑 A로 100 USDC를 출금한다고 가정합니다. 아래 JSON은 문서에 실린 실제 시드 정책 이며 출금 API 요청 본문은 아닙니다. 주소 A와 금액 100 USDC는 이해를 돕기 위한 예시입니다. {\n  \"id\": \"withdrawal/allow-evm-external-address\",\n  \"effect\": \"allow\",\n  \"scope\": {\n    \"all\": [\n      { \"field\": \"operation\", \"op\": \"eq\", \"value\": \"value_transfer\" },\n      { \"field\": \"chain.family\", \"op\": \"eq\", \"value\": \"evm\" },\n      { \"field\": \"destination.type\", \"op\": \"eq\", \"value\": \"external_address\" },\n      { \"field\": \"source_vault.kind\", \"op\": \"eq\", \"value\": \"custody\" }\n    ]\n  },\n  \"when\": { \"field\": \"address_ownership.status\", \"op\": \"eq\", \"value\": \"active\" }\n} scope 는 이 룰을 적용할 요청을 고르고, when 은 허용 조건을 검사합니다. 출금은 정규화 과정에서 value_transfer 가 됩니다. 주소 상태는 요청자의 주장 대신 PIP가 읽은 address_ownership.status 로 확인합니다. 상황 이 룰의 판정 EVM·custody 출발·외부 주소 A·등재 상태 active 허용 같은 요청이지만 주소가 unregistered 조건 불성립으로 거부 주소가 회수돼 revoked 조건 불성립으로 거부 주소 상태를 아직 수집하지 못함 need_more_data → 수집 후 재평가 다른 룰도 적용된다면 최종 결정은 결합 규칙을 따릅니다. 이 시드 룰에는 송금액 100 USDC를 제한하는 조건이 없습니다. 문서는 자산별 금액 상한 조건은 token_catalog 수집이 없어 현재 작성할 수 없다고 설명합니다. 참고: 예시 정책 ↗ · 결정과 결합 ↗ 예제 2 — 승인 후 거래가 바뀌는 경우 앞선 평가로 “지갑 A에게 100 USDC”가 승인되었다고 가정합니다. 서명 직전에는 PEP가 전달한 실제 서명 대상과 저장된 인가 내용을 Orchestrator가 대조합니다. 실제 서명 요청 결과 승인된 A에게 100 USDC·올바른 서명 지갑·수수료 상한 이내·유효한 미소비 인가 인가 소비 후 승인 목적지가 B로 변경됨 거부 금액이 1,000 USDC로 변경됨 거부 다른 지갑의 키로 서명하려 함 거부 수수료 상한 초과 거부 인가 부재·만료·이미 소비됨 거부 EVM 수수료 상한은 재구성 검증을 통과한 트랜잭션에서 gasLimit × maxFeePerGas 로 유도합니다. 이는 최대 수수료이며 송금액 상한과는 별개입니다. 체인별 상한이 없으면 무제한으로 허용하지 않고 거부합니다. 참고: 정규화·서명 대상 대조 ↗ · 서명 상한 대조 ↗ 인가 유효 시간 서명 인가의 TTL은 기본·하한 20분, 상한 60분입니다. 정책을 새로 배포해도 이미 발급된 인가는 TTL까지 유효합니다. 서명 콜백은 외부 데이터를 다시 읽지 않습니다. 따라서 주소를 긴급 차단하거나 정책을 바꿨을 때 기존 인가를 어떻게 취소·차단할지는 별도로 확인해야 합니다. 일회용 인가 소비가 파트너 원장 반영까지 한 번만 일어나게 해주는 것은 아닙니다. 참고: 서명 게이트 ↗ · 결정과 결합 ↗ 운영자 승인 경로 문서가 설명하는 상태 자금 이동의 서명 게이트 정책 판단과 실제 서명 대조를 연결하는 2단계 일반 admin_action 승인 게이트 접수 표면에서 403으로 거부. 승인 뒤 권한 적용·발행 경로도 아직 없음 현재 룰 변경 승인 초안 revision의 내용 해시에 표를 결속하는 별도 maker-checker. 발행과 활성화는 각각 호출 현재 역할 부여 초대 표면에서 직접 인가. 제안자·승인자를 나누는 단계는 없음 admin_action 미지원 통합 admin_action 승인 경로는 아직 동작하지 않습니다. 운영자 승인이 필요한 액션은 현재 제공되는 개별 경로와 지원 범위를 확인해야 합니다. 참고: 승인 게이트 ↗ Wallet Admin 승인 API의 현재 한계 Approvals API 세 개는 고정 응답을 냅니다. 승인 게이팅을 거치는 엔드포인트도 현재 APPROVED·DENIED만 내며 quorum은 null입니다. 반환·해제의 정족수 승인이 동작한다고 전제하지 않습니다. Policy API의 통합 admin_action 미지원과 구분해 확인합니다. 참고: 정책 결과와 현재 구현 ↗ 정책 작성과 결과 확인 서명 게이트 → 룰 쓰기 → 예시 정책 → 룰 저작과 발행 → 결과 읽기 순서로 읽습니다. 엔진 내부 동작은 별도 참고 문서에서 확인합니다. 항목 확인할 내용 룰 필드 요청 필드는 scope·when에서, 평가 중 PIP가 수집하는 필드는 when에서 사용합니다. 참조 가능 필드 표는 원문의 생성된 카탈로그를 확인합니다. 시드 집금 정책 EVM·서비스 주체·deposit → custody 내부 이동을 허용합니다. PIP 조건은 없습니다. 이 종류 구분만으로 핫·콜드·고객·회사 용도 태그 통제가 완성되지는 않습니다. 승인·발행 승인은 검증된 revision의 내용 해시에 묶입니다. 내용을 고치면 다시 검증·승인해야 하며 발행과 활성화는 별도 액션입니다. 현재 제약 서명 연산 정족수 루프와 자산별 금액 상한 조건은 현재 사용할 수 없다고 명시합니다. resource_limit_per_tx는 건당 수수료 상한이며 송금액 상한과 다릅니다. 참고: 서명 게이트 ↗ · 룰 쓰기 ↗ · 예시 정책 ↗ · 룰 저작과 발행 ↗ · 결과 읽기 ↗ ← Vault 간 이동 웹훅·재시도·복구 → 문서 출처와 검토 범위", "kind": "업무 안내", "path": "_guide/policy.html"}, {"title": "웹훅과 장애 복구", "text": "웹훅과 장애 복구 웹훅을 받아 업무 상태와 원장에 반영합니다. 중복 통지, 순서가 바뀐 통지, 응답을 받지 못한 요청을 처리하는 방법을 설명합니다. 이 페이지 목차 이벤트 목록 중복 수신과 순서 역전 업무별 재조회 방법 복구 절차 운영 전 확인 사항 이벤트 목록 업무 진행 알림 완료·실패 알림 입금 DEPOSIT_DETECTED DEPOSIT_FINALIZED / DEPOSIT_FAILED 입금 정보 갱신 DEPOSIT_UPDATED · 현재 미구현 확정 뒤 보강 정보를 알리는 설계이며 새 입금을 뜻하지 않음 Sweep SWEEP_INITIATED SWEEP_FINALIZED / SWEEP_FAILED 고객·자체 출금 등 출금 WITHDRAWAL_INITIATED WITHDRAWAL_FINALIZED / WITHDRAWAL_FAILED VaultTransfer 별도 INITIATED 없음 VAULT_TRANSFER_FINALIZED / VAULT_TRANSFER_FAILED 입금 FINALIZED는 온체인 확정입니다. 내부 동결이 풀렸다는 의미가 아닙니다. 이동 요청의 생성 응답과 시작 알림도 온체인 완료가 아닙니다. 참고: 웹훅(Webhook) ↗ · 입금 (Deposit) ↗ Vault 이체 완료 통지의 기준 VAULT_TRANSFER_FINALIZED는 온체인 확정에 이어 양쪽 Vault 잔액 반영까지 끝난 뒤 나갑니다. 그 사이 조회 상태는 SETTLING이며 SDK 대사가 반영을 이어갑니다. 입금·집금·출금의 완료 기준과 섞지 않습니다. 참고: v1.1.0 변경 이력 ↗ · Vault 이체 ↗ 중복 수신과 순서 역전 입금 웹훅의 correlationKey 형식은 {depositId}:{eventType} 입니다. 입금 ID만으로 중복 제거하면 같은 입금의 감지와 확정 중 하나를 버릴 수 있습니다. 계획된 UPDATED 이벤트에는 seq가 추가됩니다. 다른 이동 이벤트의 중복 키 형식은 해당 계약을 확인해야 합니다. 파트너 수신부 구현 시 권장사항 수신 이벤트 원본과 중복 키를 저장하고, 원장 반영과 처리 완료 표시를 같은 로컬 트랜잭션으로 묶는 것을 권장합니다. 늦게 도착한 진행 이벤트가 완료된 업무를 되돌리지 않도록 상태 전이를 제한합니다. 상태가 충돌하면 최신 값을 조회해 조정합니다. 웹훅은 4xx와 5xx 응답 모두 재시도합니다. 재시도 기간, 재전송·보관 범위, 서명 검증 방식, 이벤트의 순서·버전 규칙은 연동 전에 추가로 확인해야 합니다. 참고: 웹훅(Webhook) ↗ 업무별 재조회 방법 작업 기존 결과 찾기 주의 계정 생성 GET /api/v1/accounts?referenceId=… 중복 생성은 400. 조회로 accountId 회수 AccountWallet 생성 GET /api/v1/accounts/{accountId}/account-wallets Idempotency-Key 미구현. 목록만으로 식별이 안 되면 새 생성 보류 Sweep GET /api/v1/sweeps?referenceId=… 같은 referenceId로 기존 집금을 복구하는 계약 고객 출금 개별 ID 조회 또는 계정 출금 목록 referenceId 전용 조회 API 없음 VaultTransfer GET /api/v1/workspace-vault-transfers?referenceId=… provider 결과 불명 503도 PENDING일 수 있음 참고: 첫 요청 ↗ · 집금 (Sweep) ↗ · Vault 이체 (Vault Transfer) ↗ · 출금 내역 목록 조회 ↗ 복구 절차 응답을 못 받았을 때 먼저 기존 업무 ID 또는 referenceId로 조회합니다. 타임아웃만으로 “요청이 실행되지 않았다”고 판단하지 않습니다. 온체인 처리 중일 때 최신 업무 상태·txHash를 확인합니다. 별도 새 요청으로 동일 금액을 다시 보내기 전에 이전 제출 결과를 조정합니다. 실패가 확정됐을 때 예약 해제와 입금 FROZEN 복귀 등 해당 업무의 복구 상태를 확인합니다. 원래 요청의 재접수와 새로운 업무 요청을 구분하여 이력을 보존합니다. 완료된 이벤트가 다시 왔을 때 이미 반영한 원장 처리를 반복하지 않습니다. 이벤트 보관과 원장 반영의 성공 여부를 함께 확인합니다. 참고: Vault 이체 (Vault Transfer) ↗ · 집금 (Sweep) ↗ · 자금 동결 ↗ 운영 전 확인 사항 추가로 필요한 운영 계약 확정 후 깊은 reorg의 보정 방식, 웹훅 서명·재전송 계약, 온체인 거래 안의 개별 이동 식별 규칙, 모호한 요청의 조정 기한과 담당 주체를 확인해야 합니다. 현재 입금 조회 OpenAPI에는 트래블룰·KYT 필드가 없습니다. 웹훅에 추가될 이 정보를 조회로도 복구할 수 있는지 확인이 필요합니다. 참고: 입금 (Deposit) ↗ · 웹훅(Webhook) ↗ · 입금 내역 상세 조회 ↗ ← 정책 판단 → 서명 지원 현황과 미확정 사항 → 문서 출처와 검토 범위", "kind": "업무 안내", "path": "_guide/recovery.html"}, {"title": "지원 현황과 미확정 사항", "text": "지원 현황과 미확정 사항 현재 미지원 기능과 연동 전에 확인해야 할 계약을 모았습니다. 이 페이지 목차 검토 범위 지원 현황 검토 범위 기준 문서 2026-09-11 공개 문서를 기준으로 검토했습니다. 미구현·미지원은 원문에 명시된 상태이며, 문서 간 불일치와 추가 확인 사항은 문서를 대조하면서 정리한 내용입니다. 실제 배포 환경의 지원 여부는 별도로 확인해야 합니다. 지원 현황 전체 미구현·미지원 문서 간 불일치 추가 확인 필요 미구현·미지원 Wallet 서버와 실 정책 서버 미연결 현재 정책 인가는 동기 자동 승인입니다. 문서의 비동기 판단·서명 게이트는 연동 설계이며 실제 연결·거부·실패 처리 검증이 필요합니다. 참고: 정책 결과와 현재 구현 ↗ 미구현·미지원 Wallet Admin Approvals API 목록·상세·승인 API는 고정 응답입니다. 게이팅 엔드포인트도 현재 APPROVED·DENIED만 반환하며 quorum은 null입니다. 반환·독립 해제의 정족수 승인이 실제 동작한다고 전제하지 않습니다. 참고: 정책 결과와 현재 구현 ↗ 미구현·미지원 서명 정족수와 자산별 금액 상한 서명 연산의 obligation 루프가 없고 token_catalog 수집도 동작하지 않아 자산별 금액 상한 조건을 작성할 수 없다고 명시합니다. resource_limit_per_tx는 수수료 상한입니다. 참고: 예시 정책과 현재 제약 ↗ · 룰 쓰기 ↗ 미구현·미지원 지갑 생성 멱등성 Idempotency-Key는 필수지만 서버가 중복 방지에 사용하지 않습니다. 응답 유실 시 목록으로 식별하는 절차와 중복 방지 구현 시점을 확인. 참고: 첫 요청 ↗ 미구현·미지원 고객·자체 출금 잔액 통제 잔액 예약은 VaultTransfer에만 적용됩니다. 고객 출금과 자체 출금의 선행 잔액 검증은 아직 없습니다. 동결·예약 잔액을 모든 이동에 일관되게 적용하는지 확인. 참고: 자금 동결 ↗ 미구현·미지원 CUSTODIAL 고객 출금 400 ACCOUNT_WITHDRAWAL_CUSTODIAL_UNSUPPORTED. 외부 VASP 출금의 지원 범위와 연동 환경을 확인. 참고: 출금 (Withdrawal) ↗ 미구현·미지원 입금 TR·KYT 정보와 갱신 웹훅 입금 결합 및 DEPOSIT_UPDATED 발행 미구현. 입금 심사에 필요한 실제 데이터 공급 경로를 확정. 참고: 입금 (Deposit) ↗ · 웹훅(Webhook) ↗ 미구현·미지원 Vault 용도 태그의 정책 입력 Vault의 용도 태그를 읽는 PIP가 아직 없습니다. 등록된 목적지와 활성 목적지를 무엇으로 강제할지 확인. 참고: 지갑 계층 ↗ · 집금 (Sweep) ↗ 미구현·미지원 통합 어드민 승인 게이트 admin_action 접수 403. 룰 변경·역할 부여는 별도 경로. 반환·해제 등 각 운영 액션이 실제로 어느 승인 경로를 쓰는지 확인. 참고: 승인 게이트 ↗ · 자금 동결 ↗ 문서 간 불일치 VaultTransfer 정책 응답 정책 거부 400 계약은 있지만 현재 자동 승인으로 해당 분기에 도달하지 않습니다. 비동기 서명 게이트 설계와 실제 연동 후 응답·상태를 맞춰야 합니다. API 호출자에게 어떤 응답·상태·이벤트를 보장할지 확정. 참고: Vault 이체 (Vault Transfer) ↗ · 서명 게이트 ↗ 참고: 정책 결과와 현재 구현 ↗ 문서 간 불일치 입금 WITHDRAWN의 시점 Sweep 접수 단계의 상태 변경과 확정 시 회계 처리 설명이 함께 존재. 업무 상태와 온체인 완료를 구분하는 최종 상태표 확정. 참고: 입금 (Deposit) ↗ · 집금 (Sweep) ↗ · 자금 동결 ↗ 추가 확인 필요 고객 자산과 회사 자산의 구분 Workspace 범위·Vault 용도와 자산 소유 구분을 같은 통제로 볼 근거가 부족. 소유 주체 식별자, 허용 이동 조합, 주소 단위 분리 정책 결정. 참고: 도메인 모델 ↗ · 지갑 계층 ↗ 추가 확인 필요 웹훅과 확정 후 보정 서명·보관·재전송·전체 순서 및 확정 뒤 깊은 reorg 보정 계약을 추가 확인해야 함. 운영 담당자·조정 절차·중복 원장 반영 방지 계약 확정. 참고: 웹훅(Webhook) ↗ · 입금 (Deposit) ↗ 추가 확인 필요 기존 서명 인가의 긴급 차단 정책 교체는 발급된 인가를 무효화하지 않음. 주소 폐기나 사고 시 TTL 전에 차단할 별도 절차 확인. 참고: 서명 게이트 ↗ 문서 간 불일치 집금 기록 생성·정책 거부 시점 집금 시퀀스는 기록 생성·201 뒤 비동기 평가를 그립니다. 결과 읽기는 인가 전 집금 행을 만들지 않아 거부 시 조회 기록이 없다고 설명합니다. 실제 정책 연결 후의 접수·거부·조회 계약을 확인해야 합니다. 참고: 집금 원문 ↗ · 정책 결과와 현재 구현 ↗ 문서 간 불일치 Vault 이체 완료 통지 v1.1.0과 Vault 이체 본문은 SETTLING 이후 양쪽 잔액 반영 완료를 기준으로 통지합니다. 웹훅 표는 온체인 확정 시점으로 남아 있습니다. 가이드는 최신 변경 이력을 기준으로 설명합니다. 참고: v1.1.0 변경 이력 ↗ · Vault 이체 ↗ · 웹훅 ↗ ← 웹훅·재시도·복구 원문 전체 · 201개 → 문서 출처와 검토 범위", "kind": "업무 안내", "path": "_guide/status.html"}, {"title": "Wallet SDK", "text": "---\ntitle: Wallet SDK\ndescription: 규제 준수형 집금 지갑을 서비스에 붙이는 B2B 제품\n---\n\n_읽는 사람: 도입 검토자. Wallet SDK가 무엇을 맡고 어떤 사업자에게 맞는지를 다룹니다._\n\nWallet SDK는 B2B 고객이 자기 서비스에 가상자산 지갑을 붙이는 수단입니다. 지갑 주소를 직접\n발급하지 않고, 온체인 입금을 직접 관측하지 않고, 서명 인프라를 직접 다루지 않아도 됩니다.\n서명 인프라는 키를 보관하고 트랜잭션에 서명하는 뒷단 플랫폼의 서명 부분입니다.\n\n그 셋을 Wallet SDK가 맡습니다. 파트너사는 자기 원장과 사용자 경험에 집중합니다. 어디까지를\nWallet SDK가 맡고 어디부터를 파트너사가 맡는지는 아래 「무엇을 맡고 무엇을 맡지 않나」에 있습니다.\n\n## 집금 지갑을 대상으로 합니다\n\n시중의 지갑 솔루션 대부분은 개별 지갑(segregated wallet)이나 내장형 지갑(embedded wallet)을\n대상으로 합니다. Wallet SDK는 그쪽이 아닙니다.\n\n파트너사가 최종 사용자의 자산을 한데 모아 관리하면서도 사용자별 귀속을 잃지 않는 구조를\n목표로 합니다.\n\n집금 지갑을 고른 것은 기술적 선호가 아니라 규제 대응 비용 때문입니다. 고객 자산 분리, 거래기록\n보존, 트래블룰 대응은 전부 \"누구의 자금인가\"를 시스템이 알고 있어야 가능합니다.\n\n트래블룰은 가상자산 이전 시 송·수신 정보를 사업자끼리 교환하는 규제 의무입니다(아래\n「함께 제공하는 모듈」).\n\n개별 지갑 모델은 그 답이 지갑 주소밖에 없습니다. 따라서 사용자 단위 의무를 이행하려면 바깥에\n별도 원장을 또 만들어야 합니다.\n\n**\"집금 지갑\"은 이 페이지의 말이고 시스템 안에는 그런 이름이 없습니다.** 지갑의 용도를 시스템이\n정의하지 않기로 정했기 때문입니다. 제품에서 쓰는 말과 도메인에서 쓰는 말이 왜 갈리는지는\n[용어](/start/terminology)에 있습니다.\n\n## 사용자 단위 체계가 Wallet SDK의 바탕입니다\n\n기존 지갑 서비스는 **지갑이 곧 사용자 체계**입니다. 정책도 트랜잭션도 지갑 단위로 적용됩니다.\n\n그래서 집금 지갑 하나 안에서 여러 사용자를 다루려면 정책 관리·트래블룰 대응·집금 처리를 전부\n따로 만들어야 합니다. 그 개발에는 블록체인을 깊이 이해해야 합니다.\n\nWallet SDK는 최종 사용자를 대리하는 계정을 시스템 안에 둡니다. 지갑은 그 계정에 딸립니다.\n\n그래서 정책도 주소록도 트래블룰도 사용자 단위로 적용되고, 파트너사는 사용자가 행동하는 모양 그대로\nAPI를 씁니다. 자세한 계층은 [계정 계층](/accounts-wallets/accounts)에 있습니다.\n\n## 네 가지를 제공합니다\n\nWallet SDK가 파트너사에 제공하는 것은 넷입니다.\n\n- **규제 준수형 집금 지갑**: 사용자별 입금 주소를 발급하고, 거기 쌓인 자금을 지정한 vault로만\n  옮길 수 있게 막습니다. vault는 Wallet의 그룹입니다([자세히](/accounts-wallets/wallets)).\n  고객 자산 분리와 거래기록 보존이 이 구조에서 나옵니다.\n- **사용자 단위 지갑 생성·관리**: 대량 발급을 전제로 설계했습니다. 주소를 재발급해도 사용자와의\n  연결이 끊기지 않아, 보안 사고나 지갑 분실 상황에서 서비스가 계속 동작합니다.\n- **블록체인 기능의 추상화**: 뒷단 지갑 솔루션이 바뀌어도 파트너사가 쓰는 API는 그대로입니다.\n  솔루션 종속을 없애는 것이 이 추상화의 목적입니다.\n- **에코시스템 연결**: 환전·크로스체인·해외송금·결제 네트워크를 같은 지갑 위에서 씁니다.\n  모듈 목록은 아래 「함께 제공하는 모듈」에 있습니다.\n\n첫 항목의 요점은 사용자 자금이 임의의 지갑으로 잘못 나가는 경로가 애초에 없다는 것입니다.\n\n## 무엇을 맡고 무엇을 맡지 않나\n\n가상자산 지갑을 서비스에 붙이려면 셋을 직접 해야 합니다 — 주소 발급·관리, 온체인 입금 관측, 서명\n인프라입니다. 셋 다 만들면 오래 걸리고, 셋 다 틀리면 자금이 움직입니다. 그 셋을 Wallet SDK 가\n맡습니다.\n\n무엇을 대신해 주지 않는지도 같은 무게입니다. 아래 넷은 파트너사가 직접 구축합니다.\n\n- **자체 원장**: Wallet SDK 는 지갑으로 들어오고 나가는 이벤트만 관리합니다. 원장 자체는 파트너사가\n  자기 DB 로 관리합니다. 사용자에게 얼마를 어떻게 표시할지, 내부 이체를 어떤 단위로 기록할지는\n  서비스마다 다르기 때문입니다. Wallet SDK 가 주는 것은 입금·집금·출금이 언제 확정됐는지의 사실입니다.\n- **AML·FDS**: 어떤 행동이 이상한지는 그 서비스의 정상 행동을 알아야 판정할 수 있어 직접 구축합니다.\n  호출 시점 가이드와 파트너사가 구현할 인터페이스는 Wallet SDK 가 제공하고, 정책 평가가 외부 판정을\n  기다릴 수 있는 구조라 나중에 연결할 수 있습니다.\n- **키 관리 서버**: 개인키를 관리하는 서버는 Wallet SDK 의 관리 범위 밖입니다. 구축·운영 방법은\n  지원하지만 서버 자체는 파트너사 측에 둡니다. 그래서 자산의 소유권은 파트너사에 있습니다.\n- **지갑 인프라 계약**: 뒷단 지갑 인프라는 파트너사가 자기 계정을 가져오는 방식으로 씁니다.\n  Fireblocks·Privy·Octet 같은 플랫폼이 여기 해당하고, 지갑 기능이 내재화되더라도 키와 서명 인프라는\n  뒷단 플랫폼이 계속 맡습니다.\n\n「수탁」이라는 말은 두 관계에서 다르게 쓰입니다. 파트너사와 최종 사용자 사이는 수탁입니다. 최종\n사용자는 자기 키를 갖지 않고 파트너사가 자산을 맡아 관리합니다.\n\nWallet SDK 와 서명 인프라 사이는 비수탁입니다. 키 전체가 Wallet SDK 한 곳에 온전히 존재하지 않고,\nWallet 서버 단독으로는 서명이 성립하지 않습니다.\n\n소유권이 파트너사에 있다는 말은 처분할 권리가 어디 있는지를 가리키고, 키를 혼자 쥔다는 말이\n아닙니다. 「단독으로 움직일 수 없다」는 파트너사에도 적용됩니다.\n\n## 함께 제공하는 모듈\n\nWallet SDK 로 만든 지갑 위에서 모듈 다섯을 씁니다. 지갑의 소유권이 파트너사에 있어 자체 지갑이 있으면\n모듈만 따로 쓸 수도 있고, Wallet SDK 가 제공하지 않는 다른 생태계를 붙일 수도 있습니다.\n\n- **컴플라이언스**: KYT(입출금 트랜잭션 스크리닝과 위험도 점수), 트래블룰(상대 사업자 탐색·송수신자\n  정보 교환·확인된 사업자 판정), 리포팅(규제 대응용 거래 데이터와 증적)입니다. 모듈은 판정을 내고\n  차단은 정책이 합니다. 위험도 점수도 트래블룰 상태도 정책 평가의 입력이고, 무엇을 막을지는 룰이\n  정하며 차단은 서명 이전에 일어납니다([서명 게이트](/policy/signing-gate)).\n- **Paymaster**: 체인 네이티브 수수료 통화 없이 가스비를 대납합니다. 규제상 암호화폐를 보유할 수 없는\n  기관에는 선택이 아니라 전제입니다.\n- **Gateway**: 여러 체인에 흩어진 같은 통화를 하나의 잔고로 취급하고 필요한 체인에서 즉시 쓰게 하는\n  유동성 관리입니다.\n- **Payment Network**: 최종 수취 금융기관을 몰라도 스테이블코인 기반 국경 간 송금과 off-ramp 를 쓰게\n  합니다. 여러 제공자 중 최소 시간·최소 비용 경로를 제안합니다.\n- **Cross-chain**: 원화 기반 토큰을 과발행 없이 다른 지원 체인에서 쓰도록 경로 선택과 라우팅을\n  추상화합니다. 발행사 주관으로 실시합니다.\n\n트래블룰에서는 개인정보 원문은 저장하지 않고 판정과 그 근거만 저장합니다. 송수신자 정보는 통과만\n시키고 원문의 저장소는 트래블룰 제공자 쪽입니다.\n\n특금법상 5년 보관 의무는 Wallet SDK 에 있고 그 대상은 판정 기록입니다. 상대 사업자에게 내는 값은\nboolean 하나입니다. 그 이상을 내면 상대가 이쪽 고객을 열거할 수 있습니다.\n\n기능별 단품 벤더를 직접 조합하면 벤더마다 계약·통합·운영이 따로 생기고 조합의 책임은 전부 파트너사가\n집니다. Wallet SDK 가 그 조합을 대신 맡습니다.\n\n## 규제 대응이 짐인 사업자에게 맞습니다\n\n규제 대응 부담이 큰 사업자 셋을 대상으로 합니다.\n\n- **발행법인**: 스테이블코인을 발행하는 법인이 발행 시스템의 집금 지갑을 이 솔루션 위에서\n  만듭니다. Wallet SDK를 만드는 합작 법인 자신이 여기에 듭니다.\n- **은행**: 사용자 자산을 집금 지갑으로 관리하려는 은행입니다. 블록체인 기술 자체에 투자하고\n  유지보수하는 것은 은행업의 본질이 아니라서, 외부 솔루션 수요가 큽니다.\n- **서비스 사업자**: 포인트·머니 같은 디지털 자산 체계가 이미 있는 곳입니다. 심리스한 전환과\n  즉각적인 내부 이체가 필요하면 온체인 지갑보다 집금 지갑과 내부 원장이 맞습니다.\n\n**빅테크와 온체인 자체가 제품인 서비스에는 맞지 않습니다.** 빅테크는 커스터마이징 요구가 크고\n내재화할 인력을 갖추기 쉽습니다. 다만 레퍼런스 솔루션이나 초기 구축 파트너, 턴키 납품 형태는\n가능합니다. DeFi 지갑처럼 온체인 상호작용이 본질인 서비스는 집금 지갑으로 가면 잃는 것이 더\n큽니다.\n\n## 먼저 알아 둘 것은 셋입니다\n\n- **모든 입금은 동결로 도착합니다**: 온체인 입금은 거부할 수 없기 때문입니다([자세히](/fund-flows/release)).\n- **정책 위반은 서명 이전에 막습니다**: 자금을 움직이는 요청이 서명 인프라로 가기 전에 정책 엔진이\n  심사합니다([자세히](/policy)).\n- **스코프는 인증이 정하고 요청 본문에 들어가지 않습니다**: `workspaceId`와 `tenantId`를 요청\n  본문·경로·쿼리로 받지 않습니다([표면과 인증](/start/authentication)).\n\n## 어디부터 읽으면 되나요\n\n탭 여섯이 파트너사가 붙이는 영역 넷과 진입점 둘입니다. 탭마다 먼저 볼 페이지를 하나씩 달아 두었습니다.\n\n- **[시작하기](/start)** — 붙이는 순서와 색인 둘. 먼저 [첫 요청](/start/first-request).\n- **[계정과 지갑](/accounts-wallets)** — Workspace·Tenant·Account 와 Vault·Wallet·Token. 먼저 그 탭의 개요.\n- **[자금 이동](/fund-flows)** — 입금이 동결로 도착하는 이유와 그것을 푸는 두 경로. 먼저 [이동 종류](/fund-flows/movements).\n- **[정책](/policy)** — 서명 앞에서 하는 심사. 먼저 [서명 게이트](/policy/signing-gate).\n- **[API 레퍼런스](/reference)** — 표면 다섯 개의 엔드포인트 전수. 먼저 [Wallet API](/reference/wallet).\n- **[변경 이력](/changelog)** — 계약이 바뀐 것과 문서가 바뀐 것. 날짜 순입니다.\n\n모르는 말이 나오면 [용어](/start/terminology)를 봅니다. 낱말마다 한 줄 정의와 자세한 설명이 있는\n페이지를 함께 알려 줍니다.\n", "kind": "참고 문서", "path": "_reference/overview.html", "reference": true}, {"title": "계정과 지갑", "text": "---\ntitle: 계정과 지갑\ndescription: 두 계층이 왜 따로 있고 각각 무슨 역할인지\n---\n\n_읽는 사람: 파트너사 개발자. 계정 계층과 지갑 계층이 왜 따로 있고 각각 무슨 역할인지를 다룹니다._\n\n계정과 지갑은 파트너사가 Wallet SDK에서 가장 먼저 만드는 상태입니다. 이 페이지는 두 계층이 왜\n따로 있고 각각 무슨 역할을 하는지를 설명합니다. 각 개념의 정의와 API 계약은 계층별 페이지에\n있습니다.\n\n## 계정 계층은 데이터가 누구의 것인지를 정합니다\n\n한 파트너사 안에 계정 체계가 여럿 있고, 한 계정 체계 안에 사용자가 여럿 있습니다. Wallet SDK는\n이 세 단위를 Workspace, Tenant, Account 세 계층으로 나눕니다([계정 계층](/accounts-wallets/accounts)).\n\n이 계층이 중요한 이유는 데이터를 가르는 기준이 여기서 나오기 때문입니다. 파트너사 대상 API는\nTenant 단위로 데이터를 가르고, 어느 Tenant인지는 요청 본문이 아니라 인증에서\n정해집니다([표면과 인증](/start/authentication)).\n\n같은 사람이 두 계정 체계에 가입하면 Account가 둘 생기는 것도 이 계층 때문입니다.\n\nWorkspace를 만드는 경로는 아직 정해지지 않았습니다. 지금은 플랫폼 운영자가 승인을 거쳐\n만듭니다([온보딩](/accounts-wallets/onboarding)).\n\n## 지갑 계층은 자산을 어디에 담는지를 정합니다\n\n자산은 어느 네트워크 위의 어느 토큰인지로 구분합니다. 같은 USDC라도 네트워크가 다르면 다른\nToken입니다([카탈로그](/accounts-wallets/catalog)).\n\nWallet은 토큰 하나를 담는 단위입니다([지갑 계층](/accounts-wallets/wallets)). 그런데 이\n단위만으로는 여러 토큰을 가진 실체를 나타낼 수 없습니다.\n\n유저 유통 지갑 하나가 USDC와 KRWK를 함께 담아야 하기 때문입니다. 따라서 Wallet 여럿을 담는 상위\n단위가 필요합니다.\n\nWallet SDK는 이 상위 단위를 Vault라 부릅니다. Workspace나 Account가 실제로 소유하는 자산의\n단위는 이 Vault입니다.\n\n## 파트너사는 Vault 단위로 보면 됩니다\n\n파트너사 관점에서는 Vault에 Token을 담고, 자산의 이동은 Vault 단위로 일어난다고 보면 됩니다.\nAPI가 어느 식별자를 받는지는 [지갑 계층](/accounts-wallets/wallets)의 발급 단위 표에 있습니다.\n\n## 다음으로\n\n- [도메인 모델](/accounts-wallets/domain-model) — 엔티티가 서로를 어떻게 소유하는가\n- [계정 계층](/accounts-wallets/accounts) — 세 계층의 정의와 `referenceId`, 상태 계약\n- [지갑 계층](/accounts-wallets/wallets) — Vault와 Wallet의 정의, 발급 단위 표\n- [카탈로그](/accounts-wallets/catalog) — Network와 Token의 등록 주체와 가시성\n- [온보딩](/accounts-wallets/onboarding) — 이 상태를 처음 세우는 절차\n", "kind": "참고 문서", "path": "_reference/accounts-wallets.html", "reference": true}, {"title": "계정 계층", "text": "---\ntitle: 계정 계층\ndescription: Workspace · Tenant · Account\n---\n\n_읽는 사람: 파트너사 개발자. 격리 컨테이너 세 계층과 Account 상태 계약을 다룹니다._\n\n계정 계층은 어느 데이터가 누구 것인지를 정하는 기준입니다. Workspace·Tenant·Account 세\n계층으로 이루어지고, 파트너사 대상 API의 데이터 격리 키가 이 계층에서 나옵니다. 지갑과 자산이\n어디에 귀속되는지도 이 계층을 따릅니다.\n\n## 세 계층의 구성\n\nWorkspace, Tenant, Account 세 계층입니다.\n\n- **Workspace**: Wallet SDK를 도입한 회사 하나입니다. 최상위 격리 컨테이너라 Tenant·토큰·자산이 전부 이 아래 있고, 정책 번들도 여기에 연결됩니다. 계약 소유자와 인증 방식이 하나로 정해지는 API 경로 묶음인 운영자 표면([자세히](/start/authentication))의 격리 키이기도 합니다.\n- **Tenant**: Workspace 아래에서 Account를 묶는 계정 체계 하나입니다. 파트너사 대상 API의 데이터 격리 키가 이 값이라, **같은 사람이 두 Tenant에 가입하면 Account가 둘**입니다.\n- **Account**: 그 계정 체계의 최종 사용자 한 명을 wallet 안에서 대리하는 virtual 사용자입니다. Wallet SDK가 발급한 `accountId`로 지칭하고, 파트너사가 발급한 값은 `referenceId`로 함께 보관합니다.\n\n예시로 보면 세 계층이 쉽게 구분됩니다.\n\n| 계층 | 카카오페이라면 | 발행 시스템이라면 |\n|---|---|---|\n| Workspace | 카카오페이 | JV |\n| Tenant | 유저 월렛 · 비즈 월렛 | JV Custody |\n| Account | 도리의 유저 월렛 Account · 도리의 비즈 월렛 Account | 적격 기관 월렛 Account |\n\n파트너사와 Workspace는 같은 회사를 가리킵니다. 이 사이트에서 그 회사를 부르는 말은 파트너사\n하나이고, 격리 단위로 말할 때는 Workspace와 Tenant를 이름으로 부릅니다.\n\n## 데이터 격리 기준과 정책 기준\n\n**데이터 격리 기준과 정책 기준이 같지 않습니다.** 파트너사 대상 API의 데이터 격리 키는 tenant입니다.\n\n정책 번들은 workspace 단위입니다. 그래서 한 workspace의 Tenant 전부가 같은 번들의 판정을\n받습니다. 파트너사가 알 것은 Tenant를 나눠도 정책 판정이 갈리지 않는다는 점입니다.\n\n## `referenceId` 계약\n\n`referenceId`에는 개인정보를 넣지 않습니다. 값의 성격을 파트너사가 정하므로 **Tenant 간 충돌이\n정상**입니다. 유일성은 Tenant 안에서만 성립합니다.\n\n여기에 내부 식별자만 담는다는 계약이 평문 저장의 근거입니다. 계약이 바뀌면 저장 암호화와\n응답·로그 마스킹을 다시 적용해야 합니다.\n\n## 상태와 비활성화\n\n상태는 활성·비활성 두 값뿐이고 파트너사가 바꿉니다. Account는 삭제되지 않습니다.\n\n전환은 **파트너사가 직접** 합니다. 어느 최종 사용자가 서비스를 그만 쓰는지는 파트너사만 아는\n사실이기 때문입니다.\n\n### 비활성화의 효과\n\n**주소록이 초기화됩니다.** 주소에 등재 근거를 붙이는 장부인 [주소록](/fund-flows/address-book)에서\n그 계정의 출금 목적지 등록이 전부 소프트 삭제되고, 재활성화해도 복구되지 않습니다.\n\n복구하지 않는 이유는 등재 근거에 있습니다. 출금 통제에서 부르는 주소록의 다른 이름인\n화이트리스트의 근거는 최종 사용자의 소유 증명입니다. 소유 증명은 개인 지갑을 주소록에 올리기\n전에 그 키로 서명해 보이는 절차이고, 계정이 비활성인 기간에는 그것이 성립하지 않습니다.\n\n재활성화한 뒤 같은 주소를 다시 등재하면 새 항목이 생기고 식별자가 바뀝니다. 그 규칙은\n[주소록](/fund-flows/address-book)에 있습니다.\n\n새 지갑과 새 주소록도 만들 수 없습니다. 파트너사 요청으로는 막힙니다.\n\n### 비활성 계정의 이동 처리\n\n입금과 집금은 계속 동작하고 출금만 막힙니다.\n\n입금은 계속 기록됩니다. 수취 지갑을 다른 사용자에게 재할당하지 않으므로 그 자금은 여전히\n그 사용자 것입니다. 다만 주소록 근거가 사라져 등록된 발신처로 판정되지 않습니다.\n\n계정 지갑 자산을 워크스페이스 vault로 모으는 이동인 집금(sweep,\n[자세히](/fund-flows/sweep))도 동작합니다. 원장 반영 같은 후속 처리를 파트너사가 직접 할 수\n있어 허용합니다.\n\n**출금은 막힙니다.** 다만 응답은 전용 에러 코드가 아니라 `404`입니다. `ACCOUNT_INACTIVE` 같은\n코드를 두면 남의 테넌트에 그 계정이 있는지 없는지를 구별할 단서를 주게 됩니다.\n\n## 조회와 상태 노출\n\n조회는 상태로 거르지 않습니다. 파트너사 조회가 비활성 계정도 상태와 함께 냅니다.\n\n거르면 다시 활성화할 대상을 찾을 수 없고, 같은 `referenceId`로 새로 만드는 것은 유니크 제약이\n막으므로 그 계정을 다시 찾을 방법이 없어집니다.\n\nToken과 갈리는 지점입니다. Token의 파트너 계약에는 상태 필드가 없어 노출이 곧 \"쓸 수 있다\"는\n신호이지만, Account는 상태를 계약에 포함해 그 판단을 파트너사에 넘깁니다.\n", "kind": "참고 문서", "path": "_reference/accounts-wallets--accounts.html", "reference": true}, {"title": "카탈로그", "text": "---\ntitle: 카탈로그\ndescription: Network · Token — 무엇을 담을 수 있는지\n---\n\n_읽는 사람: 파트너사 개발자. 지갑이 담을 수 있는 자산을 무엇이 정하는지 다룹니다._\n\n카탈로그는 지갑이 무엇을 담을 수 있는지 정하는 기준입니다. Network가 블록체인 네트워크이고\nToken이 그 위의 자산이며, Wallet은 Token 하나를 담습니다. 등록 주체와 가시성 규칙은 Network와\nToken에서 다릅니다.\n\n## Network\n\n블록체인 네트워크입니다. 각 네트워크는 서로 완전히 독립적으로 동작합니다. 잔액도 주소도\n트랜잭션도 네트워크를 넘지 않습니다.\n\n**플랫폼이 관리합니다.** 워크스페이스 운영자가 등록하지 않고, 어느 네트워크를 쓸 수 있는지는\n플랫폼 수준에서 정해집니다. 워크스페이스가 하는 일은 그 네트워크 위에 토큰을 등록하는 것입니다.\n\n네트워크 계열에 따라 주소 체계가 갈립니다. 지금 계약에 있는 값은 EVM 하나이고 Solana가 예약돼\n있습니다. 카탈로그는 이 값을 `protocol`로 냅니다.\n\n## Token\n\nWallet이 담는 단위입니다. Network 위의 자산 하나를 나타냅니다. **같은 자산이라도 네트워크가\n다르면 다른 Token입니다.**\n\n예를 들어 다음은 서로 다른 Token 넷입니다.\n\n- BASE 네트워크의 USDC\n- Ethereum 네트워크의 USDC\n- Solana 네트워크의 KRWK\n- Solana 네트워크의 Wrapped Ether\n\n워크스페이스 운영자가 등록합니다. 등록해야 그 토큰의 지갑을 만들고 출금할 수 있습니다.\n\n유일성은 (workspace, network, 컨트랙트 주소) 조합에서 성립합니다. `networkId`는 스코프 키가\n아니라 조회 조건입니다.\n\n`symbol`은 키가 아닙니다. 같은 체인에 동명 토큰이 등록되는 것이 정당하기 때문입니다.\n자산 식별자와 소수점 자릿수는 뒷단 플랫폼이 정하고, `symbol`·이름·아이콘은 요청이 정합니다.\n\n### 표면별 가시성\n\n계약 소유자와 인증 방식이 하나로 정해지는 API 경로 묶음인\n표면([자세히](/start/authentication))마다 가시성이 다릅니다.\n\n**운영자 조회는 상태로 거르지 않습니다.** 거르면 비활성 토큰을 되돌릴 방법이 사라집니다.\n\n파트너사 조회는 토큰과 소속 Network가 모두 활성인 것만 냅니다. 파트너 계약에 상태 필드가\n없어 노출된다는 사실 자체가 \"쓸 수 있다\"는 신호이고, Network가 비활성이면 그 `networkId`를\n파트너가 해석할 수 없기 때문입니다.\n", "kind": "참고 문서", "path": "_reference/accounts-wallets--catalog.html", "reference": true}, {"title": "도메인 모델", "text": "---\ntitle: 도메인 모델\ndescription: 엔티티가 서로를 어떻게 소유하는가\n---\n\n_읽는 사람: 파트너사 개발자. 엔티티의 소유 관계와 개수 대응, 자금 이동 레코드가 어디에 연결되는지를 다룹니다._\n\n도메인 모델은 엔티티가 서로를 어떻게 소유하는지를 나타냅니다. 격리 기준·자산 기준·카탈로그 세\n묶음으로 나뉘고, 자금 이동은 지갑이 아니라 별도 레코드로 남습니다. 각 엔티티가 무엇인지는\n[계정 계층](/accounts-wallets/accounts)과 [지갑 계층](/accounts-wallets/wallets)에 있습니다.\n\n## 격리와 자산의 구성\n\n엔티티는 두 묶음으로 나뉩니다. **격리 기준이 소유를 정하고 자산 기준이 내용물을 정합니다.**\n앞쪽은 어느 데이터가 누구 것인지를, 뒤쪽은 그 안에 무엇이 들어가는지를 답합니다.\n\n```mermaid\nflowchart TB\n    subgraph iso[\"격리 기준\"]\n        direction TB\n        WS[\"Workspace\"]\n        TN[\"Tenant\"]\n        AU[\"운영자 계정\"]\n        AC[\"Account\"]\n\n        WS -->|1:N| TN\n        WS -->|1:N| AU\n        TN -->|1:N| AC\n    end\n\n    subgraph asset[\"자산 기준\"]\n        direction TB\n        WV[\"WorkspaceVault\"]\n        WW[\"WorkspaceWallet\u003cbr/>\u003ci>토큰별\u003c/i>\"]\n        AV[\"AccountVault\"]\n        AW[\"AccountWallet\u003cbr/>\u003ci>토큰별 · 온체인 주소\u003c/i>\"]\n\n        WV -->|1:N| WW\n        AV -->|1:N| AW\n    end\n\n    subgraph cat[\"카탈로그\"]\n        direction TB\n        NW[\"Network\"]\n        TK[\"Token\u003cbr/>\u003ci>network + 컨트랙트 주소\u003c/i>\"]\n\n        TK -->|N:1| NW\n    end\n\n    WS -->|1:N| WV\n    AC -->|1:N| AV\n    WW -->|N:1| TK\n    AW -->|N:1| TK\n```\n\n두 묶음이 만나는 곳이 둘입니다. Workspace가 `WorkspaceVault`를 직접 소유하고, Account가\n`AccountVault`를 소유합니다. 그 아래로는 구조가 같습니다. vault가 토큰별 wallet을 묶습니다.\n\n## Account의 소속\n\nAccount는 Tenant에만 속합니다. Account가 Workspace에도 직접 연결된 구조를 떠올릴 수 있는데,\n지금 스키마는 그렇지 않습니다. **tenant로 스코프되는 데이터는 workspace 컬럼을 두지 않습니다.**\n\n격리를 이렇게 설계했기 때문입니다. 두 컬럼을 다 두면 workspace만으로 조회하는 쿼리가 문법상 성립하고,\n그 쿼리는 같은 workspace의 다른 파트너사 데이터를 함께 냅니다.\n\n격리 기준에서 workspace에 직접 속하는 것은 운영자 계정입니다. 계약 소유자와 인증 방식이 하나로\n정해지는 API 경로 묶음인 운영자 표면([자세히](/start/authentication))의 격리 키가\nworkspace이기 때문입니다.\n\n다만 그 저장소는 지갑이 아니라 [정책 엔진](/policy) 쪽입니다. 지갑은 어드민·세션 테이블을 두지\n않습니다. 계층의 자세한 것은 [계정 계층](/accounts-wallets/accounts)에 있습니다.\n\n## 자금 이동 레코드\n\n자금 이동은 지갑이 아니라 별도 레코드에 남습니다. 지갑은 잔고를 갖고 이동은 기록을 갖습니다.\n**일곱 이동이 각자 자기 테이블을 갖고, 어느 지갑에서 출발했는지로 지갑과 연결됩니다.**\n\n```mermaid\nflowchart LR\n    AW[\"AccountWallet\"]\n    WW[\"WorkspaceWallet\"]\n    WV[\"WorkspaceVault\"]\n\n    subgraph inflow[\"입금\"]\n        direction TB\n        AWD[\"AccountWalletDeposit\u003cbr/>\u003ci>awd-\u003c/i>\"]\n        WWD[\"WorkspaceWalletDeposit\u003cbr/>\u003ci>wwd-\u003c/i>\"]\n    end\n\n    subgraph internal[\"내부 이동\"]\n        direction TB\n        SWP[\"Sweep\u003cbr/>\u003ci>swp-\u003c/i>\"]\n        WVT[\"WorkspaceVaultTransfer\u003cbr/>\u003ci>wvt-\u003c/i>\"]\n    end\n\n    subgraph outflow[\"출금\"]\n        direction TB\n        WWAC[\"계정 귀속 출금\u003cbr/>\u003ci>wwac-\u003c/i>\"]\n        WWSF[\"자기 귀속 출금\u003cbr/>\u003ci>wwsf-\u003c/i>\"]\n        AWW[\"계정 지갑 출금\u003cbr/>\u003ci>aww-\u003c/i>\"]\n    end\n\n    subgraph book[\"주소록\"]\n        direction TB\n        AAB[\"AccountAddressBook\u003cbr/>\u003ci>aab-\u003c/i>\"]\n        WAB[\"WorkspaceAddressBook\u003cbr/>\u003ci>wab-\u003c/i>\"]\n    end\n\n    AW -->|1:N| AWD\n    WW -->|1:N| WWD\n    AW --> SWP\n    SWP --> WV\n    WV \u003c-->|N:N| WVT\n    WW --> WWAC\n    WWAC --> AAB\n    WW --> WWSF\n    WWSF --> WAB\n    AW --> AWW\n```\n\n`WorkspaceVaultTransfer`만 같은 엔티티에 두 번 연결됩니다. 출발 vault와 도착 vault가 둘 다\n`WorkspaceVault`라 한 레코드가 두 개를 참조합니다.\n\n계정 귀속 출금은 그림에서 워크스페이스 지갑에서 나가지만 Account 단위로 생성됩니다. 자금이\n어느 지갑에 있는지와 누구에게 귀속되는지가 서로 다른 기준이기 때문입니다.\n\n## 주소록의 연결 지점\n\n주소에 등재 근거를 붙이는 장부인 주소록([자세히](/fund-flows/address-book))은 출금에는 입력으로,\n입금에는 관측으로 연결됩니다.\n\n출금에서는 목적지 주소의 등재 여부가 정책 입력입니다. 입금은 다릅니다. 온체인 입금은 거부할 수\n없어서 등재 여부를 묻는 단계가 없습니다.\n\n대신 발신처가 그 계정 주소록에 있는지를 확정 통지에 `sourceRegistered`로 포함해 보냅니다. 통지는\n온체인 이벤트를 파트너사에 보내는 아웃바운드 호출입니다. 파트너사는 그 값을 해제와 집금 판단에\n쓰고, 계약은 [웹훅](/fund-flows/webhooks)에 있습니다.\n\n주소록은 둘로 갈리고 격리 기준이 다릅니다. `AccountAddressBook`은 tenant 단위이고,\n`WorkspaceAddressBook`은 workspace 단위입니다.\n\n**등재가 곧 허가는 아닙니다.** 미등재는 거절 사유가 아니라 정책 평가의 입력입니다.\n\n등재 근거와 회수, 그 반영 시점은 [주소록](/fund-flows/address-book)에 있습니다.\n\n## 지갑과 토큰의 대응 관계\n\n지갑당 토큰은 하나입니다. `AccountWallet`과 `WorkspaceWallet`은 둘 다 토큰 단위로 만들어집니다.\n유일성은 vault와 token의 조합에서 성립합니다.\n\n**그래서 \"이 계정의 USDC 지갑\"으로 지갑 하나가 유일하게 식별됩니다.** 왜 토큰 단위인지는\n[지갑 계층](/accounts-wallets/wallets)에 적었습니다.\n\n## 이 그림에 없는 것\n\n없는 것이 둘입니다.\n\n정책 판단 구간이 없습니다. 이동 레코드가 생기고 온체인으로 나가는 사이에 서명 게이트가\n있는데, 그 구조는 도메인 모델이 아니라 [정책](/policy)에 있습니다.\n\n**최종 사용자별 원장이 없습니다.** 사용자마다 얼마인지를 매기는 원장은 파트너사 것이고, Wallet\nSDK는 지갑 단위로만 잔액을 관리합니다. 입금·집금·출금이 언제 확정됐는지만 기록합니다. 어느\n이동이 무엇을 뜻하는지는 [이동 종류](/fund-flows/movements)에 있습니다.\n", "kind": "참고 문서", "path": "_reference/accounts-wallets--domain-model.html", "reference": true}, {"title": "온보딩", "text": "---\ntitle: 온보딩\ndescription: 워크스페이스 개설에서 첫 정책 활성화까지\n---\n\n_읽는 사람: 파트너사 개발자. 워크스페이스 개설에서 첫 정책 활성화까지의 순서를 다룹니다._\n\n온보딩은 워크스페이스를 열고 운영자를 들이고 카탈로그와 vault를 세우는 하나의 과정입니다. 이\n페이지는 개설과 시드 정책, 운영자 초대와 2단계 인증, 생성 액션 다섯의 승인 절차를 순서대로\n다룹니다.\n\n**여기서 만들어지는 것이 이후 모든 자금 이동의 전제입니다.** 파트너 대상 API의 격리 키인 테넌트도\nAPI 키도 토큰도 이 구간에서 나옵니다.\n\n## 개설은 시드 정책까지 함께 앉힙니다\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant PLAT as 플랫폼 운영자\n    participant SYS as Wallet SDK\n    participant POL as 정책 엔진\n\n    PLAT->>SYS: 워크스페이스 개설 요청\n    SYS->>SYS: 워크스페이스 기록 생성\n    SYS->>SYS: 지원 네트워크 프리셋 등록\n    SYS->>POL: 프리셋 역할과 시드 정책 등록 요청\n    POL->>POL: 프리셋 역할 등록\n    POL->>POL: 시드 정책 등록 (온보딩 액션의 명시적 allow)\n    POL-->>SYS: 완료\n    SYS-->>PLAT: 워크스페이스와 지원 네트워크\n```\n\n개설은 플랫폼 운영자가 한 번 수행합니다. **워크스페이스만 만드는 것이 아니라 그 안에서 처음\n움직일 수 있게 하는 최소 구성까지 함께 앉힙니다.**\n\n앉는 것은 셋입니다. 지원 네트워크 프리셋, 프리셋 역할, 그리고 온보딩 액션을 열어 주는 시드\n정책입니다. 시드 정책은 워크스페이스 등록이 심는 첫 번들이고, 저작의 출발점이지 결과가 아닙니다.\n\n## 시드 정책이 없으면 첫 액션이 막힙니다\n\n정책 엔진의 기본값은 거부입니다. 어떤 룰도 매칭되지 않으면 그 요청은 거부로 끝납니다.\n\n**그래서 시드 정책은 예외가 아니라 명시적 allow 룰입니다.** 온보딩 액션을 이름으로 허용하는\n룰을 개설 시점에 심어 두는 것이고, 기본 거부 자체는 그대로 남습니다.\n\n워크스페이스가 자기 정책을 활성화한 뒤부터는 그 정책이 기준이 됩니다. 그때부터 같은 액션에\n승인이 성립하는 데 필요한 최소 승인자 수인 정족수가 적용됩니다.\n\n## 운영자는 초대로 들어오고 2단계 인증을 마쳐야 활성이 됩니다\n\n다이어그램의 배역은 다섯입니다.\n\n- **플랫폼 운영자**: Workspace 생성과 시드 정책의 권한 뿌리인 합작 법인 쪽 운영자입니다\n- **워크스페이스 운영자**: 계약 소유자와 인증 방식이 하나로 정해지는 API 경로 묶음인 운영자 표면([자세히](/start/authentication))을 부르는 사람 주체입니다. API 키와 달리 사람을 식별합니다\n- **Wallet SDK**: 파트너 대상 API를 받아 정책 엔진에 판단을 묻고 서명 인프라에 제출하는 서버 컴포넌트입니다\n- **정책 엔진**: 자금을 움직이는 요청이 서명 인프라로 가기 전에 그 요청을 심사하는 별도 시스템입니다\n- **메일**: 초대 메일을 운영자에게 나르는 채널입니다\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant PLAT as 플랫폼 운영자\n    participant OPS as 워크스페이스 운영자\n    participant SYS as Wallet SDK\n    participant POL as 정책 엔진\n    participant MAIL as 메일\n\n    PLAT->>SYS: 워크스페이스 운영자 초대\n    SYS->>POL: 초대 등록 (워크스페이스와 역할)\n    POL->>POL: 역할 조회\n    POL->>POL: 어드민 기록 생성 (가입 대기)\n    POL-->>SYS: 어드민과 가입 코드\n    SYS->>MAIL: 초대 메일 발송 (가입 코드)\n    SYS-->>PLAT: 어드민\n    MAIL->>OPS: 메일 수신 (가입 코드)\n    OPS->>SYS: 가입 요청 (가입 코드)\n    SYS->>POL: 가입 검증 요청\n    POL->>POL: 가입 코드 검증 후 2단계 인증 대기로 전이\n    POL->>POL: 2단계 인증 등록 항목 생성\n    POL-->>SYS: 등록 URI와 요청 식별자\n    SYS-->>OPS: 등록 URI와 요청 식별자\n    Note over OPS: 인증 앱으로 QR을 스캔하고 코드를 입력합니다\n    OPS->>SYS: 2단계 인증 등록 (요청 식별자와 코드)\n    SYS->>POL: 등록 코드 검증\n    POL->>POL: 코드 검증 후 어드민 활성화\n    POL-->>SYS: 어드민\n    SYS-->>OPS: 어드민\n    OPS->>SYS: 로그인 (비밀번호)\n    SYS->>POL: 인증 요청\n    POL->>POL: 비밀번호 검증\n    POL->>POL: 접속기록 적재 (주체와 결과)\n    POL-->>SYS: 2단계 인증 필요 (요청 식별자)\n    SYS-->>OPS: 2단계 인증 필요 (요청 식별자)\n    OPS->>SYS: 2단계 인증 (요청 식별자와 코드)\n    SYS->>POL: 코드 검증\n    POL->>POL: 코드 검증\n    POL-->>SYS: 로그인 허용\n    SYS-->>OPS: 로그인 완료\n    opt 역할별 운영자 초대\n        OPS->>SYS: 운영자 초대 (역할 지정)\n        SYS->>POL: 초대 등록 (워크스페이스와 역할)\n        POL->>POL: 어드민 기록 생성 (가입 대기)\n        POL-->>SYS: 어드민과 가입 코드\n        SYS->>MAIL: 초대 메일 발송 (가입 코드)\n        SYS-->>OPS: 어드민\n    end\n```\n\n**가입 대기 상태로는 로그인할 수 없습니다.** 2단계 인증 등록을 마쳐야 어드민이 활성이 되고,\n그 순서를 뒤집는 경로는 없습니다.\n\n등록 URI와 요청 식별자가 두 단계를 잇습니다. 등록에서 받은 요청 식별자를 코드와 함께 되돌려\n줘야 검증이 성립합니다.\n\n첫 운영자가 활성이 되면 그 뒤로는 자기가 다른 운영자를 초대합니다. 역할을 지정해 초대하고,\n초대받은 쪽은 같은 가입 절차를 거칩니다.\n\n## 어드민 신원은 정책 엔진이 소유합니다\n\n역할·어드민·2단계 인증 자격증명은 전부 정책 엔진 쪽 저장소에 있습니다. **Wallet SDK는 그\n저장소를 직접 만지지 않고 정책 엔진을 거쳐서만 접근합니다.**\n\n그래서 위 다이어그램의 초대·가입·2단계 인증은 전부 정책 엔진 안에서 일어납니다. Wallet SDK가\n하는 일은 요청을 넘기고 결과를 되돌려 주는 것뿐이고, 자격증명을 저장하지 않습니다.\n\n로그인 시도는 **접속기록**으로 남습니다. 주체와 결과를 함께 적재하며, 이것이 인증 통제를\n증명하는 근거입니다.\n\n## 로그인은 정책 판단이 아니라 인증입니다\n\n로그인과 2단계 인증은 정책 엔진의 판단 요청 계약을 따르지 않습니다. **정책 엔진이 어드민 저장소\n소유자로서 제공하는 별도 동기 API입니다.**\n\n정책 체크는 로그인 이후의 액션에 적용됩니다. 역할이 그 액션을 할 수 있는지, 승인이 몇 표\n필요한지가 그때 평가됩니다.\n\n두 자격이 같은 표면에 공존하는 방식은 [표면과 인증](/start/authentication)에 있습니다.\n\n## 생성 액션 다섯은 콘솔이 자기 승인 절차로 처리합니다\n\n테넌트·API 키·토큰·워크스페이스 vault·워크스페이스 지갑입니다. 다섯이 거치는 절차는 같고\n갈리는 것은 승인 완료 이후의 실행 로직뿐입니다.\n\n**이 다섯은 정책 엔진의 어드민 액션 카탈로그에 없습니다.** 어드민 액션은 어드민 권한과 정책\n자체를 바꾸는 연산들입니다. 카탈로그에 등재된 여덟은 룰 커널이 판정하지만, 이 다섯의 승인은 어드민\n콘솔 현행 구현이 담당합니다.\n\n카탈로그 밖이라는 것이 통제 밖이라는 뜻은 아닙니다. 역할별 허용 액션과 정족수와 승인 역할은\n워크스페이스 정책으로 등록되고, 그 정책이 이 다섯에 적용됩니다.\n\n앞 다이어그램에 없던 배역은 둘입니다.\n\n- **승인자**: 승인 역할을 가진 운영자입니다. 대기 중인 요청에 표를 던집니다\n- **이벤트 스트림**: 승인 완료와 거부 이벤트를 구독자에게 나르는 경로입니다\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant OPS as 워크스페이스 운영자\n    participant APR as 승인자\n    participant SYS as Wallet SDK\n    participant POL as 정책 엔진\n    participant EVT as 이벤트 스트림\n\n    Note over SYS,POL: 이 절차는 어드민 콘솔 현행 구현입니다. 정책 엔진의 어드민 액션 카탈로그를 지나지 않습니다\n    OPS->>SYS: 생성 액션 요청\n    SYS->>SYS: 승인 요청 기록 (대상 식별자는 요청 스냅샷 안에)\n    SYS->>POL: 승인 요청 등록 (업무 식별자와 인증된 요청자)\n    POL->>POL: 승인 요청 기록\n    POL-->>SYS: 접수\n    SYS-->>OPS: 승인 요청 (승인 식별자와 대기 상태)\n    POL->>POL: 역할 허용 여부와 승인 규칙 평가\n    alt 승인 불요 (시드 정책의 명시적 allow)\n        POL->>EVT: 승인 완료 이벤트\n        EVT->>SYS: 구독 수신\n        SYS->>SYS: 액션별 실행\n        SYS->>SYS: 대상 기록 생성 (ACTIVE)\n    else 정족수 승인 필요\n        POL->>POL: 승인 대기 저장\n        Note over APR: 승인 역할 운영자가 대기 요청을 확인하고 표를 던집니다\n        APR->>SYS: 승인 표 제출\n        SYS->>POL: 표 접수 (인증된 승인자)\n        POL->>POL: 표 기록과 정족수 집계\n        POL-->>SYS: 집계 반영\n        SYS-->>APR: 접수\n        opt 정족수 충족\n            POL->>POL: 전체 표 자격 재검증 + 오래된 스냅샷 재조회 후 전체 재평가\n            alt 재평가 allow\n                POL->>POL: 승인 완료 저장 (1회 소비)\n                POL->>EVT: 승인 완료 이벤트\n                EVT->>SYS: 구독 수신\n                SYS->>SYS: 액션별 실행\n                SYS->>SYS: 대상 기록 생성 (ACTIVE)\n            else 재평가 deny\n                POL->>EVT: 거부 이벤트\n                EVT->>SYS: 구독 수신\n                SYS->>SYS: 승인 요청 종결 (대상 기록 없음)\n            end\n        end\n    end\n```\n\n## 요청 시점에는 대상 기록을 만들지 않습니다\n\n요청을 받으면 **승인 요청만 쌓고 대상 테이블은 건드리지 않습니다.** 테넌트도 토큰도 vault도\n승인이 끝난 뒤에야 행이 생깁니다.\n\n그래서 거부로 끝나도 지울 것이 없습니다. 접수 때 대기 상태 행을 만들어 두면 거부·만료마다\n되돌리는 경로가 필요하고, 그 되돌리기가 실패하는 경우를 또 다뤄야 합니다.\n\n대기 상태는 승인 요청의 것이지 대상 엔티티의 것이 아닙니다. 대상 엔티티의 상태는\n활성·비활성 둘뿐이고 그 사이에 중간값을 두지 않습니다.\n\n## 정족수가 차면 그때 다시 봅니다\n\n표가 다 모여도 바로 통과가 아닙니다. 표를 던진 승인자의 자격을 전부 다시 검증합니다. 그다음\n오래된 스냅샷을 다시 읽고 전체를 재평가한 뒤에야 승인이 완료됩니다.\n\n정족수는 며칠씩 걸릴 수 있습니다. **재개 시점의 활성 정책으로 평가하며**, 대기 중에 정책이\n바뀌었어도 옛 정책을 물려주지 않습니다.\n\n자세한 규율은 [승인 게이트](/policy/sequences/approval-gate)에 있습니다.\n\n## 승인 뒤의 실행이 액션마다 다릅니다\n\n앞 다이어그램에 없던 배역은 하나입니다.\n\n- **뒷단 플랫폼**: 지갑과 키를 보관하고 자산을 등록하는 외부 플랫폼입니다\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant OPS as 워크스페이스 운영자\n    participant SYS as Wallet SDK\n    participant POL as 정책 엔진\n    participant EVT as 이벤트 스트림\n    participant PROV as 뒷단 플랫폼\n\n    OPS->>SYS: 워크스페이스 정책 등록 (역할별 허용 액션과 정족수와 승인 역할)\n    SYS->>POL: 정책 등록 요청\n    POL->>POL: 정책 기록\n    POL-->>SYS: 정책\n    SYS-->>OPS: 정책\n    Note over OPS,SYS: 아래 다섯은 앞의 콘솔 승인 절차를 그대로 탑니다. 여기서는 승인 완료 이벤트 이후만 그립니다\n    OPS->>SYS: 테넌트 생성 요청\n    SYS->>SYS: 승인 요청 기록\n    SYS->>POL: 승인 요청 등록\n    SYS-->>OPS: 승인 요청 (대기)\n    POL->>EVT: 승인 완료 이벤트\n    EVT->>SYS: 구독 수신\n    SYS->>SYS: 테넌트 기록 생성 (ACTIVE) — 별도 실행 없음\n    OPS->>SYS: API 키 생성 요청\n    SYS->>SYS: 승인 요청 기록\n    SYS->>POL: 승인 요청 등록\n    SYS-->>OPS: 승인 요청 (대기)\n    POL->>EVT: 승인 완료 이벤트\n    EVT->>SYS: 구독 수신\n    SYS->>SYS: API 키 발급\n    SYS->>SYS: API 키 기록 생성 (ACTIVE)\n    OPS->>SYS: 지원 네트워크 조회\n    SYS-->>OPS: 네트워크\n    OPS->>SYS: 토큰 등록 요청 (네트워크와 심볼과 컨트랙트 주소)\n    SYS->>SYS: 승인 요청 기록\n    SYS->>POL: 승인 요청 등록\n    SYS-->>OPS: 승인 요청 (대기)\n    POL->>EVT: 승인 완료 이벤트\n    EVT->>SYS: 구독 수신\n    SYS->>PROV: 자산 조회 (체인과 심볼과 컨트랙트 주소)\n    opt 뒷단 플랫폼에 미등록 토큰\n        SYS->>PROV: 자산 신규 등록\n    end\n    SYS->>SYS: 토큰 기록 생성 (ACTIVE) — 뒷단 식별자와 decimals 확정\n    OPS->>SYS: 워크스페이스 vault 생성 요청\n    SYS->>SYS: 승인 요청 기록\n    SYS->>POL: 승인 요청 등록\n    SYS-->>OPS: 승인 요청 (대기)\n    POL->>EVT: 승인 완료 이벤트\n    EVT->>SYS: 구독 수신\n    SYS->>+PROV: vault 계정 생성\n    PROV-->>-SYS: vault 계정\n    SYS->>SYS: vault 기록 생성 (ACTIVE) — 뒷단 식별자 확정\n    OPS->>SYS: 워크스페이스 지갑 생성 요청 (토큰 지정)\n    SYS->>SYS: 승인 요청 기록\n    SYS->>POL: 승인 요청 등록\n    SYS-->>OPS: 승인 요청 (대기)\n    POL->>EVT: 승인 완료 이벤트\n    EVT->>SYS: 구독 수신\n    SYS->>SYS: vault와 토큰 조회\n    SYS->>+PROV: vault에 자산 활성화 (vault 식별자와 자산 식별자)\n    PROV-->>-SYS: 완료\n    SYS->>SYS: 지갑 기록 생성 (ACTIVE)\n```\n\n- **테넌트**: 실행 로직이 없습니다. 승인이 곧 활성입니다.\n- **API 키**: 승인 뒤에 키를 발급합니다. 발급 응답에는 마스킹된 값만 실리고, 원문은 별도 조회가 한 번만 내줍니다.\n- **토큰**: 뒷단 플랫폼에서 자산을 조회하고, 미등록이면 먼저 등록한 뒤 `decimals`를 확정합니다.\n- **워크스페이스 vault**: 뒷단 플랫폼에 vault 계정을 만들고 그 식별자를 채웁니다.\n- **워크스페이스 지갑**: vault와 토큰을 조회해 그 vault에 해당 자산을 활성화합니다.\n\n## `decimals`는 뒷단 플랫폼이 정합니다\n\n토큰 등록 요청에는 `decimals`가 없습니다. **승인 뒤 자산 조회 응답에서 채워집니다.**\n\n이 값이 금액 표기의 기준입니다. 사람이 읽는 `amount`와 온체인 최소 단위 `amountRaw`를 변환하는\n로직이 전부 이 값을 씁니다. 카탈로그 쪽 서술은 [토큰과 네트워크](/accounts-wallets/catalog)에 있습니다.\n\n## 워크스페이스 지갑은 식별자를 조합해 얻습니다\n\n워크스페이스 지갑은 뒷단 플랫폼 식별자를 자기가 갖지 않습니다. **vault의 식별자와 토큰의\n식별자를 조합해 자산을 활성화합니다.**\n\n그래서 지갑 생성은 vault와 토큰이 둘 다 활성인 뒤에만 성립합니다. 지갑 계층이 왜 이 모양인지는\n[지갑 계층](/accounts-wallets/wallets)에 있습니다.\n\n## 정족수 승인이 필요하면 이벤트가 늦게 옵니다\n\n위 다섯을 이어서 읽으면 연속으로 보이지만 그렇지 않습니다. **승인 완료 이벤트는 정족수\n승인에서 시간 간격을 두고 도착합니다.**\n\n요청과 활성화 사이가 며칠일 수 있습니다. 요청 응답으로 받은 승인 식별자로 진행 상태를 조회하는\n것이 그 사이의 유일한 확인 수단입니다.\n\n## 이 다섯은 산출물을 누가 적용하느냐로 갈립니다\n\n정책 엔진이 룰로 판정하는 어드민 액션은 여덟이고 그 여덟은 **산출물의 소유자가 정책 엔진\n자신**입니다. 어드민 권한이든 번들이든 승인된 레코드를 정책 엔진이 직접 적용합니다.\n\n다섯의 산출물은 전부 Wallet SDK 쪽에 있습니다. 그래서 편입하려면 적용하는 쪽이 정책 엔진 밖인\n액션 형태가 필요하고, 그 형태는 아직 없습니다.\n\n**편입 여부는 어드민 콘솔을 정책 엔진 표면으로 옮기는 작업과 한 묶음입니다.** 그 작업은\n로드맵의 마지막 구간이고, 그때까지 승인은 위에 그린 콘솔 현행 구현이 담당합니다.\n\n카탈로그와 미등재 값 처리는 [룰 명세](/policy/rule/reference)에 있습니다. 여덟을 정책 엔진이\n적용하는 구조는 [승인 게이트](/policy/sequences/approval-gate)에 있습니다.\n\n## 다음으로\n\n- [Admin API](/reference/admin) — 위 요청들의 계약 기준 문서\n- [표면과 인증](/start/authentication) — 어느 자격이 무엇을 확정하나\n- [승인 게이트](/policy/sequences/approval-gate) — 정족수와 재평가의 규율\n- [토큰과 네트워크](/accounts-wallets/catalog) — 카탈로그가 무엇을 담나\n- [자금 이동 지도](/fund-flows/movements) — 여기서 만든 것 위에서 도는 이동들\n", "kind": "참고 문서", "path": "_reference/accounts-wallets--onboarding.html", "reference": true}, {"title": "지갑 계층", "text": "---\ntitle: 지갑 계층\ndescription: Vault · Wallet과 발급 단위 둘\n---\n\n_읽는 사람: 파트너사 개발자. 자산이 어디에 담기고 온체인 주소가 어디에 연결되는지를 다룹니다._\n\n지갑 계층은 자산을 어디에 담는지 정하는 기준입니다. Vault가 Wallet을 묶고 Wallet 하나가 토큰\n하나를 담습니다. 발급 단위는 Workspace 귀속과 Account 귀속 둘로 갈리고, 그 귀속이 데이터를\n가르는 기준을 정합니다.\n\n## Vault와 Wallet\n\nWallet은 토큰 하나를 담는 단위입니다. 온체인 주소가 여기에 연결되고, 어느 토큰을 담는지가 Wallet에\n기록됩니다.\n\nVault는 그 Wallet을 묶는 그룹입니다. Vault는 키 체계마다 키를 하나만 갖습니다. 키 체계란 체인 계열이\n쓰는 서명 키의 종류이고, 지금 지원하는 것은 EVM 하나입니다.\n\n온체인 주소는 키에서 유도되므로 키 하나에서 주소도 하나입니다. 따라서 한 Vault 안의 EVM Wallet은\n몇 개가 있어도 전부 같은 주소를 씁니다. 예를 들어 한 Vault에 Ethereum의 USDC Wallet과 USDT Wallet을\n만들면 두 Wallet의 주소는 같습니다.\n\n이 때문에 서로 다른 EVM 주소를 한 Vault 아래에 둘 수는 없습니다. 주소가 다른 지갑이 필요하면 그것은\n다른 Vault입니다. 키 체계가 다른 체인이 추가되면 그 체계의 키와 주소가 같은 Vault 안에 따로 생깁니다.\n\n## 발급 단위\n\n발급 단위가 둘입니다. 아래 「API」는 **파트너사가 부르는 Wallet API**입니다. 계약 소유자와 인증\n방식이 하나로 정해지는 API 경로 묶음인 운영자 표면([자세히](/start/authentication))은\n워크스페이스 지갑도 식별자로 받습니다.\n\n| 발급 단위 | 격리 기준 | Vault | Wallet |\n|---|---|---|---|\n| Workspace | workspace | `WorkspaceVault` — **API가 지갑 식별자로 받는 단위** | `WorkspaceWallet` — 식별자로 받지 않습니다 |\n| Account | tenant | `AccountVault` — **API 표면이 없습니다** | `AccountWallet` — **식별자로 받습니다** |\n\n`AccountVault`는 직접 만들지 않습니다. 첫 `AccountWallet`을 만들 때 함께 생깁니다.\n\n워크스페이스 자산을 움직이는 API는 `WorkspaceVault`의 식별자(`wv-`)를 받습니다. 출금은 출발\nvault를, Vault 이체는 출발과 도착 vault를 지정합니다.\n\n계정 쪽은 다릅니다. 집금은 대상 입금(`awd-`)과 도착 vault를 지정하고, 계정 지갑은 계정 식별자와\n토큰으로 만듭니다.\n\n## vault 태그와 용도\n\n용도는 Wallet SDK가 정의하지 않습니다. 집금용이냐 재무용이냐 같은 구분을 앱이 미리 정해 두지\n않습니다.\n\n**파트너사가 태그로 정의하고 앱은 그 태그를 해석하지 않습니다.** 표시와 정책 판단에 쓰려고 두는\n값입니다.\n\n다만 정책이 태그를 읽는 경로는 아직 없습니다. 태그를 판단 입력으로 가져오는 수집 경로의\n신설이 정해졌습니다. 상세는 판단에 필요한 사실을 평가 시점에 읽어 오는 수집 경로인\nPIP([자세히](/policy/runtime/pip))에 있습니다.\n\n그래서 vault 이름은 표시용 라벨이라 유일성이 없습니다. 같은 workspace에 같은 이름이 여럿 있을 수\n있습니다.\n\n## 토큰 단위로 두는 이유\n\nEVM만 보면 과한 정규화로 보입니다. 한 주소가 그 체인의 ERC-20을 전부 받기 때문입니다.\n\n그럼에도 토큰 단위로 두는 이유가 둘입니다.\n\n**EVM 밖으로 확장할 때 주소 단위가 토큰입니다.** Solana는 토큰마다 주소가 다릅니다. 지갑이\n토큰 단위면 그 체인을 추가할 때 모델이 바뀌지 않습니다.\n\n차단을 토큰 상태로 두는 것도 같은 이유입니다. 지갑에는 상태가 없고 상태는 Vault와 Token에\n있습니다. 특정 토큰의 입출금을 막아야 하면 그 토큰을 비활성으로 두고, 토큰 단위 지갑이 그 차단을\n그대로 따릅니다.\n\n## 미등록 토큰의 입금\n\n주소를 소유한다는 것은 결국 키로 증명됩니다. Wallet SDK 지갑의 주소는 모두 그 지갑의 키에서\n유도되므로, **`Wallet` 행이 없는 토큰이 들어와도 그 자금은 그 키로 처리할 수 있는 것**입니다.\n\n그래서 입금 경로가 그 행을 만듭니다. 여기서 생기는 것은 새 주소가 아니라 이미 건넨 vault\n주소를 적은 장부 한 줄입니다. 뒷단 플랫폼이 미활성 자산을 입금 시 자동 활성화하므로, 행의\n부재는 그 계정이 그 토큰을 한 번도 안 가졌다는 뜻일 뿐입니다.\n\n계정 상태와 무관하게 만듭니다. 막으면 그 자금이 Wallet SDK 기록에 존재하지 않게 되어, 오입금\n반환의 출발지도 보관 의무 대상 기록도 사라집니다.\n", "kind": "참고 문서", "path": "_reference/accounts-wallets--wallets.html", "reference": true}, {"title": "v0.1.0", "text": "---\ntitle: v0.1.0\ndate: \"2026-08-26T09:00:00+09:00\"\ntype: changelog\nchangelog:\n  category: 계약 변경 포함\n  version: \"0.1.0\"\n---\n\n### 계약 변경\n\n- **API 레퍼런스 주소가 바뀝니다.** OpenAPI 태그를 영문 전용으로 바꾸고 한글은 태그 설명으로\n  옮겼습니다. 예전 주소를 북마크해 두셨다면 다시 잡아 주십시오 — 엔드포인트 경로와 요청·응답\n  스키마는 그대로입니다.\n- **낼 수 없는 에러 코드를 지웠습니다.** 집금 생성(`POST /api/v1/sweeps`) 문서의\n  `IDEMPOTENCY_KEY_TOO_LONG`을 걷었습니다. 서버가 그 코드를 내지 않으므로 그것으로 분기하는\n  코드가 있다면 도달하지 않는 분기입니다.\n- **정책의 자산 좌표가 토큰 식별자가 됐습니다.** 판단 요청의 정규화 결과에서 `asset` 객체가\n  `token`으로 바뀌었습니다. 요청 스키마는 그대로지만 **룰에서 `asset.id`를 참조했다면\n  `token.id`로 고쳐야 합니다.** 대신 체인 무관 그룹 룰(\"전 체인 USDC 하루 한도\")은 지금\n  표현할 수 없어 체인마다 따로 걸어야 합니다.\n- **회수한 주소를 다시 등재하면 식별자가 새로 붙습니다.** 동작이 바뀐 것이 아니라 계약으로\n  적혀 있지 않던 것인데, 옛 식별자를 보관하는 연동이 깨지므로 계약 변경으로 다룹니다.\n  **닫힌 항목의 식별자는 다시 쓰이지 않습니다.** 출금 요청은 목적지 주소로 매칭하므로\n  영향받지 않습니다. → [주소록](/fund-flows/address-book)\n- **vault 사이 이체의 잔액 부족은 요청 응답이 아니라 이체 상태로 드러납니다.** 접수할 때 금액을\n  예약하고 결과로 확정하거나 풉니다. 온체인 잔액은 요청 시점에 조회하지 않으므로 **접수됐다고\n  이체가 나간 것이 아닙니다** — 상태를 끝까지 따라가셔야 합니다.\n  → [자금 동결](/fund-flows/release)\n- **토큰 카탈로그 응답에서 `assetId`가 빠졌습니다.** 내부 표면\n  `GET /internal/v1/token-catalog`이고 파트너사 연동에는 영향이 없습니다. 체인 무관 자산 키를\n  채울 기준이 없어 비어 있던 필드입니다.\n\n### 문서\n\n- **이 사이트가 서술 문서의 기준이 됐습니다.** 어느 서술이 맞는지 갈릴 때는 여기가 우선합니다.\n  **API 계약의 기준 문서는 그대로 TypeSpec입니다** — 엔드포인트·스키마·에러 코드는 이 승격의\n  대상이 아니었습니다.\n- **[제품](/)·설계 기록 두 섹션이 생겼습니다.** 무엇을 대상으로 하는 제품이고 어디까지\n  제공하는지, 그리고 무엇을 왜 그렇게 정했는지의 이력입니다. 설계 기록은 범위를 줄이지 않고\n  벤더 실명·내부 컴포넌트 이름·폐기된 결정까지 그대로 싣습니다.\n- **[첫 요청](/start/first-request)과 [규제 대응](/concepts/compliance)이 생겼습니다.** 계정을\n  만들고 입금 주소를 받기까지를 순서대로 밟습니다. 종전에는 표면 목록만 있고 처음부터 끝까지\n  이어 가는 길이 없었습니다.\n- **원본 22편을 동결했습니다.** `docs/wallet-system/` 아래 원본은 이력으로 남고 **거기서 한\n  수정은 이 사이트에 반영되지 않습니다.** 어느 절이 어디로 갔는지는\n  이동 기록에 파일 단위로 있습니다.\n- **제품 이름을 Wallet SDK로 통일하고 본문 폰트를 SUIT로 바꿨습니다.** 코드 블록의 서체는\n  그대로입니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v0-1-0.html", "reference": true}, {"title": "v0.10.0", "text": "---\ntitle: v0.10.0\ndate: \"2026-09-01T12:00:00+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.10.0\"\n---\n\n### 문서\n\n- **정책 엔진 탭에 [전체 지도](/policy/map)를 새로 냈습니다.** 저작 산출물이 가는 경로(번들 탑재 ·\n  빌드 전용 · 런타임 조립)과 평가 입력 문서의 조립을 다이어그램 두 장과 표 하나로 요약했습니다.\n  각 조각의 정의는 기존 소유 페이지가 그대로 들고, 지도는 첫 진입점입니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v0-10-0.html", "reference": true}, {"title": "v0.10.1", "text": "---\ntitle: v0.10.1\ndate: \"2026-09-02T12:00:00+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.10.1\"\n---\n\n### 문서\n\n- **처음 온 사람이 읽을 수 있게 서술 페이지 60편을 다시 썼습니다.** 페이지마다 첫 줄에 읽는 사람을\n  적고, 첫 문단은 이 페이지가 무엇을 다루는지를 말한 뒤 주장이 따라옵니다. 개념·계약 페이지의\n  소제목은 명사 라벨로 바꿔 찾아보기가 되게 했고, 흐름·설계 페이지는 주장 소제목을 유지했습니다.\n- **용어는 처음 나오는 자리에서 한 줄로 풉니다.** 그 한 줄은 [용어](/concepts/terminology)의 문구를\n  그대로 복사한 것이라 페이지마다 정의가 갈리지 않습니다. 용어 페이지에 정책 엔진의 역할\n  (Orchestrator·평가기·PIP·PAP·PEP)과 시퀀스 다이어그램의 배역(최종 사용자·뒷단 플랫폼·이벤트\n  스트림 등)을 새로 실었습니다. 배역이 넷을 넘는 다이어그램 앞에는 배역 리스트가 붙습니다.\n- **호칭을 하나로 고정했습니다.** 시스템은 Wallet SDK, 그것을 도입한 회사는 파트너사입니다.\n  「정본」이라는 말은 「기준 문서」로 바꿨습니다. 결정 기록과 동결된 검토 보고는 날짜가 박힌 기록이라\n  본문을 고치지 않았습니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v0-10-1.html", "reference": true}, {"title": "v0.11.0", "text": "---\ntitle: v0.11.0\ndate: \"2026-09-02T18:00:00+09:00\"\ntype: changelog\nchangelog:\n  category: 계약 변경 포함\n  version: \"0.11.0\"\n---\n\n### 계약 변경\n\n- **초안 검증 응답의 위반 항목에 `why` 칸이 생겼습니다.** `message`는 무엇이 어긋났고 어느 방향으로\n  고치는지만 100자 이내로 말하고, 그대로 두면 무슨 일이 나는지는 `why`로 갈라 실립니다. 컴파일 검사가\n  낸 위반에만 값이 있고 그 밖은 `null`입니다. `target`은 `key=value`를 공백으로 이은 형태로 통일됩니다.\n  기존 세 필드는 그대로라 응답을 읽는 쪽에서 조치할 것은 없습니다. → [내부 API](/policy/ops/internal-api)\n\n### 문서\n\n- **정책 엔진이 심사하는 세 영역을 이름으로 부릅니다.** 설계 초안의 표 행 번호 「도메인 ①②③」 대신\n  서명 연산·어드민 액션·정책 변경 액션입니다. 세 용어를 [용어](/concepts/terminology)에 실었고, 결정 색인·\n  로드맵·API 계약 주석에서 번호 표기를 없앴습니다. 날짜가 박힌 결정 이력과 동결 문서는 그대로입니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v0-11-0.html", "reference": true}, {"title": "v0.12.0", "text": "---\ntitle: v0.12.0\ndate: \"2026-09-07T18:00:00+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.12.0\"\n---\n\n### 문서\n\n- **API 레퍼런스의 엔드포인트 페이지 주소가 단어 단위로 끊깁니다.** 문서 사이트 엔진이 1.6으로 오르며\n  `operationId`의 낙타 표기를 하이픈으로 자릅니다. `/reference/wallet/sweeps/sweeps-getbyreferenceid`가\n  `/reference/wallet/sweeps/sweeps-get-by-reference-id`가 되는 식으로 79개 주소가 옮겨졌고, 옛 주소는\n  모두 새 주소로 넘어갑니다. 저장해 둔 링크를 고치실 필요는 없습니다. → [API 레퍼런스](/reference)\n- **에이전트용 읽기 표면이 늘었습니다.** 페이지 목록·본문·탐색 트리를 JSON으로 주는 `/api/docs/`와\n  그 명세인 `/openapi.json`이 생겼습니다. `/openapi.json`은 Wallet API가 아니라 이 문서 사이트 자체의\n  명세입니다. Wallet API 명세는 지금처럼 각 레퍼런스 페이지에서 받으십시오.\n", "kind": "참고 문서", "path": "_reference/changelog--v0-12-0.html", "reference": true}, {"title": "v0.13.0", "text": "---\ntitle: v0.13.0\ndate: \"2026-09-08T10:06:58+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.13.0\"\n---\n\n### 문서\n\n- **OpenAPI 명세 파일을 내려받을 수 있습니다.** API 레퍼런스 첫 화면의 표면마다 내려받기 버튼이\n  생겼고, `/openapi/\u003c파일>` 주소로 직접 받을 수도 있습니다. 파일은 레퍼런스 페이지를 만든 것과 같은\n  빌드에서 나온 OpenAPI 3.1 문서입니다. → [API 레퍼런스](/reference)\n", "kind": "참고 문서", "path": "_reference/changelog--v0-13-0.html", "reference": true}, {"title": "v0.13.1", "text": "---\ntitle: v0.13.1\ndate: \"2026-09-08T10:26:32+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.13.1\"\n---\n\n### 문서\n\n- **OpenAPI 명세 파일이 브라우저에서 바로 열립니다.** `/openapi/\u003c파일>` 주소를 직접 열면 파일로\n  저장되던 것이 텍스트로 표시됩니다. 내려받기 버튼은 그대로 파일로 저장합니다. → [API 레퍼런스](/reference)\n", "kind": "참고 문서", "path": "_reference/changelog--v0-13-1.html", "reference": true}, {"title": "v0.14.0", "text": "---\ntitle: v0.14.0\ndate: \"2026-09-08T13:18:54+09:00\"\ntype: changelog\nchangelog:\n  category: 계약 변경 포함\n  version: \"0.14.0\"\n---\n\n### 계약 변경\n\n- **입금 갱신 통지 `DEPOSIT_UPDATED`가 생깁니다.** 확정 뒤에 트래블룰 매핑이나 KYT 결과가 붙을 때마다\n  그 순간까지의 정보를 전부 실어 다시 보냅니다. 한 건에 여러 번 올 수 있으니 수신 핸들러가 같은\n  `depositId`의 통지를 여러 번 받는 것을 전제로 하십시오. → [웹훅](/fund-flows/webhooks)\n- **입금 통지 본문에 `travelRule`과 `kyt`가 붙습니다.** 아직 확인되지 않았으면 `null`입니다. 확정\n  통지에 `null`로 왔다가 갱신 통지에서 채워지는 것이 보통입니다. 두 필드를 필수로 파싱하지 마십시오.\n- **갱신 통지의 중복 제거 키는 `{depositId}:DEPOSIT_UPDATED:{순번}`입니다.** 관측·확정 통지의 키\n  형태는 그대로입니다. 순번이 큰 통지가 최신 상태입니다.\n- 위 셋은 계약이 먼저 정해진 것이고 구현은 뒤따릅니다. 지금 나가는 통지는 바뀌지 않습니다.\n\n### 문서\n\n- **입금 페이지를 다시 썼습니다.** 동결을 풀어도 되는지 판단하는 재료를 온체인 확정 이전(트래블룰·\n  주소록)과 이후(AML·FDS·KYT)로 나눠 담고, 트래블룰 정보가 확정보다 늦게 오는 현실에서 통지가 어떤\n  순서로 나가는지를 설명합니다. 주소는 그대로입니다. 워크스페이스 지갑 입금은 이 페이지에서 빠졌고\n  [자금 동결](/fund-flows/release)이 다룹니다. → [입금](/fund-flows/deposit)\n- 트래블룰 1차 주소 확인에서 Wallet SDK 소유 주소면 파트너사에 허용 VASP 여부를 동기로 묻습니다.\n  1초 응답 제한 안에 들어가는 호출이고, 제한 시간 안에 답이 없으면 허용으로 간주합니다. 인터페이스와\n  제한 시간 값은 파트너사와 함께 정합니다.\n- KYT 결과가 BLOCKED여도 Wallet SDK는 갱신 통지에 결과만 싣습니다. 차단 조치는 파트너사 몫입니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v0-14-0.html", "reference": true}, {"title": "v0.14.1", "text": "---\ntitle: v0.14.1\ndate: \"2026-09-08T13:32:00+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.14.1\"\n---\n\n### 문서\n\n- **동결이 어디의 상태인지 적었습니다.** 동결은 온체인이나 컨트랙트 위의 동결이 아니라 Wallet SDK\n  오프체인 DB의 상태입니다. → [입금](/fund-flows/deposit) · [자금 동결](/fund-flows/release)\n", "kind": "참고 문서", "path": "_reference/changelog--v0-14-1.html", "reference": true}, {"title": "v0.15.0", "text": "---\ntitle: v0.15.0\ndate: \"2026-09-08T14:48:11+09:00\"\ntype: changelog\nchangelog:\n  category: 계약 변경 포함\n  version: \"0.15.0\"\n---\n\n### 계약 변경\n\n- **Wallet API의 인증이 레퍼런스에 API 키로 표시됩니다.** 그동안 레퍼런스가 이 표면을 bearer\n  토큰으로 광고했지만, 실제로 받는 것은 `X-API-KEY` 헤더에 실린 파트너사 API 키입니다. 서버\n  동작은 처음부터 API 키였으므로 부르시던 방식은 바뀌지 않습니다. 레퍼런스의 「Authorize」와\n  생성되는 클라이언트 코드만 이제 실제 동작과 같아집니다. → [인증과 스코프](/start/authentication)\n", "kind": "참고 문서", "path": "_reference/changelog--v0-15-0.html", "reference": true}, {"title": "v0.16.0", "text": "---\ntitle: v0.16.0\ndate: \"2026-09-09T10:38:14+09:00\"\ntype: changelog\nchangelog:\n  category: 계약 변경 포함\n  version: \"0.16.0\"\n---\n\n### 계약 변경\n\n- **Policy API의 오류 응답이 policy 코드 집합으로 바뀝니다.** 그동안 레퍼런스가 Wallet 도메인\n  오류 코드 48개를 policy 응답의 `error.code`로 광고했지만, 서버가 실제로 내는 것은 policy 표면의\n  코드입니다. 이제 `PolicyApiErrorResponse`가 표면별 enum과 프레임워크 폴백 코드의 합집합을 답니다.\n  Wallet 코드로 분기하던 클라이언트는 그 분기가 닿지 않던 것이니 지워도 됩니다. → [내부 API](/policy/ops/internal-api)\n- **미등재였던 오류 코드가 전부 레퍼런스에 오릅니다.** 승인·초안·발행 표면의 코드와 접수 거부\n  `DRAINING`·`INTAKE_SATURATED`(503), 역할 거부 `FORBIDDEN_ROLE`(403)입니다. 서버 동작은 그대로입니다.\n- **어드민 표면의 문 접두가 계약에 드러납니다.** platform 전용 표면(부트스트랩·번들 활성화·워크스페이스\n  등록)은 경로가 `/platform`으로 시작합니다. 양쪽 문에서 열리는 표면은 접두 없는 경로를 유지하고\n  `/platform` 사본이 함께 열립니다. → [내부 API](/policy/ops/internal-api)\n- **워크스페이스 등록·매니저 관리 표면 7개와 번들 서빙 표면 2개가 레퍼런스에 오릅니다.** 등록 표면은\n  platform 어드민 세션과 건별 스텝업을 요구합니다. → [인계 계약](/policy/ops/handoff)\n- **어드민 세션을 쿠키로도 받고 로그아웃 표면이 생깁니다.** `POST /auth/2fa`가 `policy_admin_session`\n  쿠키를 내리고, `POST /auth/logout`이 그것을 지웁니다. 요청 하나에 자격 출처는 하나입니다.\n- **응답 필드가 셋 늘고 하나가 nullable이 됩니다.** 세션 신원에 `homeScope`·`permissions`, 초안 검증에\n  `warnings`가 실립니다. 승인 대기 항목의 `expiresAt`은 대기 구간에 `null`입니다.\n\n### 문서\n\n- **정책 엔진 페이지 23편을 코드와 대조해 고쳤습니다.** 인계 계약의 등록 표면 자격이 반대로 적혀\n  있던 것, 인가 TTL 기본값(10분 → 20분), 룰 구조의 예시 룰, 저장·정규화·PIP 도착 검사의 서술이\n  대상입니다. 설계가 코드보다 앞선 자리(승인 게이트·obligation 이행)는 설계를 남기고 구현 상태를\n  적었습니다. → [승인 게이트](/policy/sequences/approval-gate)\n- **워크스페이스 온보딩 결정이 `D-227`로 올랐습니다.** `D-205`는 부분, `D-208`은 폐기로 내렸습니다.\n  → 결정 색인\n- **구현 대기 표가 정책 표면을 제대로 셉니다.** 파서가 여러 줄 어노테이션과 상수 경로를 못 읽어\n  Policy API 33개 중 27개를 「계약만」으로 세던 것을 고쳤습니다. → 구현 대기\n- 용어집에 소속 스코프·문·릴레이·introspection·스텝업을 올렸습니다. → [용어](/concepts/terminology)\n", "kind": "참고 문서", "path": "_reference/changelog--v0-16-0.html", "reference": true}, {"title": "v0.2.0", "text": "---\ntitle: v0.2.0\ndate: \"2026-08-26T18:00:00+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.2.0\"\n---\n\n### 문서\n\n- **변경 이력·알려진 제약·구현 대기를 갈랐습니다.** 한 페이지에 섞여 있던 셋이 각자 답하는\n  질문이 다르고 갱신하는 주체가 다릅니다 — 변경 이력은 *무엇이 언제 바뀌었나*,\n  [알려진 제약](/start/known-limits)은 *그래서 지금 무엇이 막히나*,\n  구현 대기는 *계약 중 무엇이 아직 없나*입니다.\n- **구현 대기가 생겼습니다.** 계약에 있는데 아직 동작하지 않는 것의\n  전수입니다. 손으로 적은 목록이 아니라 **빌드마다 계약과 코드를 대조해 다시 셉니다.** 지금\n  **계약 118개 중 73개**가 동작하지 않고, 그중 29개는 경로가 살아 있고 값이 가짜인 「모형\n  응답」이라 연동이 통과하지만 값을 믿으면 안 됩니다.\n- **변경 이력이 버전 단위가 됐습니다.** 항목 하나가 릴리즈 하나이고, 그 버전이 곧 발행 태그\n  입니다. [`/changelog/rss.xml`](/changelog/rss.xml)로 구독하실 수 있습니다. 헤더에 지금 보고\n  계신 문서의 버전이 뜹니다 — **지금은 `v0`이고, 계약 118개 중 73개가 아직 동작하지 않는 동안\n  0점대를 유지합니다.**\n- **본문이 한 단계 커졌습니다.** 기준 16px → 17px. 단 폭이 같은 비율로 넓어져 **줄당 글자 수는\n  그대로입니다.** 탭 아이콘도 지갑 모양으로 바꿨습니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v0-2-0.html", "reference": true}, {"title": "v0.3.0", "text": "---\ntitle: v0.3.0\ndate: \"2026-08-27T12:00:00+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.3.0\"\n---\n\n### 문서\n\n- **제품 탭이 없어졌습니다.** 제품 소개·이용 대상·두 자격은 [홈](/)이, 제공 범위는\n  [시작하기](/start)가, 에코시스템은 [시작하기 아래](/start/ecosystem)가 맡습니다. 같은 주장이\n  홈·제품·시작하기 세 자리에 되풀이돼 있어 하나로 모았습니다 — 대신해 주는 셋, 수탁 두 층,\n  스코프는 인증이 정한다, 부르는 표면은 하나.\n- **「표면 다섯 개」가 [표면과 인증](/start/authentication)으로 합쳐졌습니다.** 누가 무엇을 부르는지와\n  무엇이 인증에서 나오는지가 한 페이지입니다.\n- **옛 주소는 그대로 열립니다.** `/product`·`/product/audience`·`/product/boundary`·\n  `/product/ecosystem`·`/start/surfaces`가 새 자리로 넘어갑니다. 북마크를 고치실 필요는 없고,\n  새로 거는 링크는 새 주소로 걸어 주십시오.\n- **구현 대기가 열린 PR도 읽습니다.** `main`만 보면 아직 머지되지 않은\n  구현이 전부 「계약만」으로 나왔습니다. 이제 상태가 넷입니다 — 동작 · 모형 응답 · **구현 PR\n  열림** · 계약만. 「구현 PR 열림」은 그 PR이 머지되기 전까지 부르면 여전히 `404`입니다.\n- **태그마다 `main` 반입 PR이 자동으로 열립니다.** 머지는 사람이 합니다. 그 PR 본문이 판정 재료를\n  링크합니다.\n- **`docs/site/AGENTS.md`가 생겼습니다.** 문서를 고칠 때의 규율이 README에 섞여 있던 것을 떼어\n  기준으로 세웠습니다 — 한 주장은 한 페이지가 소유한다는 규칙이 여기서 시작합니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v0-3-0.html", "reference": true}, {"title": "v0.4.0", "text": "---\ntitle: v0.4.0\ndate: \"2026-08-27T14:45:11+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.4.0\"\n---\n\n### 문서\n\n- **사이트가 둘로 나갑니다.** 이 주소는 그중 하나이고, 설계 기록은 다른 쪽에 실립니다.\n- **자금 이동 탭의 제목이 전부 명사가 됐습니다.** 「입금이 도착하는 길」은 [입금](/fund-flows/deposit),\n  「이동 일곱 가지」는 [이동 종류](/fund-flows/movements), 「동결과 해제」는 [자금 동결](/fund-flows/release),\n  「통지」는 [웹훅](/fund-flows/webhooks)입니다. 주장은 각 페이지의 설명과 소제목이 맡습니다.\n- **입금·집금·출금·Vault 이체가 「이동 종류」 바로 아래에 순서대로 놓였습니다.** 제목에 영문을\n  붙였습니다 — 입금 (Deposit) · 집금 (Sweep) · 출금 (Withdrawal) · Vault 이체 (Vault Transfer).\n  주소는 그대로입니다.\n- **일곱 이동 중 둘이 자기 자리를 얻었습니다.** 워크스페이스 지갑 입금(`wwd-`)은\n  [입금](/fund-flows/deposit)에, 계정 지갑 출금(`aww-`, 오입금 반환)은\n  [출금](/fund-flows/withdrawal)에 절이 생겼습니다. 이전에는 표의 한 행이 전부였습니다.\n- **동결 서술이 한 곳으로 모였습니다.** 탭 첫 페이지와 [자금 동결](/fund-flows/release)이 같은 말을\n  두 번 하던 것을 후자로 몰았습니다.\n- **주소록이 화이트리스트라는 것을 적었습니다.** 제목은 [주소록 (Address Book · Whitelist)](/fund-flows/address-book)이고,\n  정책 문서가 화이트리스트라고 부르는 것이 같은 장부임을 본문과 [용어](/concepts/terminology)에 밝혔습니다.\n- **웹훅과 통지를 갈랐습니다.** 채널이 웹훅이고 실리는 것이 통지입니다 — [용어](/concepts/terminology)에\n  두 항목이 따로 있습니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v0-4-0.html", "reference": true}, {"title": "v0.4.1", "text": "---\ntitle: v0.4.1\ndate: \"2026-08-27T14:58:34+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.4.1\"\n---\n\n### 문서\n\n- **v0.4.0 항목의 사이트 분리 문구를 줄였습니다.** 무엇이 어디에 실리는지의 기준은 문서 규율에서\n  정하고, 변경 이력은 이 주소에서 무엇이 바뀌었는지만 말합니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v0-4-1.html", "reference": true}, {"title": "v0.5.0", "text": "---\ntitle: v0.5.0\ndate: \"2026-08-28T10:00:00+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.5.0\"\n---\n\n### 문서\n\n- **계정 계층의 정의를 바로잡았습니다.** Workspace는 Wallet SDK를 도입한 회사 하나, Tenant는 그 회사가\n  운영하는 서비스 하나입니다. 카카오페이와 발행 시스템 두 예시 표를 [계정 계층](/concepts/accounts)에\n  넣었고, 「고객사와 파트너사는 같은 것」 절은 그 표로 요약했습니다.\n- **첫 요청 전에 생기는 층을 셋으로 갈랐습니다.** 플랫폼이 여는 것(워크스페이스·네트워크), 운영자가\n  등록하는 것(테넌트·API 키·토큰·vault), 파트너사가 받는 것(API 키 원문) —\n  [첫 요청](/start/first-request).\n- **토큰 단위 지갑의 이유를 고쳤습니다.** 비EVM 확장과 토큰 상태 차단 둘이고, \"토큰마다 다른\n  주소\" 수요는 뺐습니다. 같은 페이지의 「미등록 토큰의 입금」 절 제목을 바꿨습니다 —\n  [지갑 계층](/concepts/wallets).\n- **주소록이 입금에도 붙습니다.** 입력이 아니라 관측으로 — 입금 확정 통지의 `sourceRegistered`가\n  그것입니다. [도메인 모델](/concepts/domain-model)의 옛 서술을 고쳤습니다.\n- **카탈로그는 Network·Token 정의만 남겼습니다.** Asset 미도입 절을 뺐습니다 —\n  [카탈로그](/concepts/catalog).\n- **홈의 「같은 법인」 절과 인증 페이지의 서비스 간 인증 절을 뺐습니다.** 운영자 인증은 세션과\n  2단계 인증으로 다시 썼고, 콘솔이 Wallet 서버를 거친다는 것을 명시했습니다 —\n  [표면과 인증](/start/authentication).\n- **\"유입\"을 \"입금\"으로 통일했습니다.** 출금과 짝이 되는 말이고 이동 종류의 이름과도 같아서, 사이트\n  본문 80곳을 바꿨습니다. 용어 표의 항목도 입금으로 옮겼습니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v0-5-0.html", "reference": true}, {"title": "v0.5.1", "text": "---\ntitle: v0.5.1\ndate: \"2026-08-30T23:30:00+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.5.1\"\n---\n\n### 문서\n\n- **정책 엔진 다이어그램 여덟 장을 상호작용 뷰어로 실었습니다.** 배포 토폴로지·서명 게이트 두 단계·판단\n  요청 상태 머신·번들 발행 워크플로우 다섯 장과, 판단 요청·콜백·번들/PIP의 코드 레벨 호출 경로\n  세 장입니다. 본문 칸에서는 축소 미리보기이고 전체 화면·새 탭에서 확대·검색·관계 추적이 됩니다 —\n  → [다이어그램](/policy/diagrams)\n- **protected 본은 private 자산도 뺍니다.** 페이지만 가리던 빌드가 이제 `public/` 아래 private 자산\n  디렉토리까지 산출물에서 지우고, 검사가 그 부재를 확인합니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v0-5-1.html", "reference": true}, {"title": "v0.5.2", "text": "---\ntitle: v0.5.2\ndate: \"2026-08-31T12:00:00+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.5.2\"\n---\n\n### 문서\n\n- **정책 엔진 다이어그램에 소스 구성 두 장을 더했습니다.** rego·JSON 소스가 컴파일·채점을 지나\n  번들이 되기까지의 계층 한 장과, 저작 세트·채점 입력·골든 스위트의 파일 수준 구성 한 장입니다 —\n  → [다이어그램](/policy/diagrams)\n", "kind": "참고 문서", "path": "_reference/changelog--v0-5-2.html", "reference": true}, {"title": "v0.6.0", "text": "---\ntitle: v0.6.0\ndate: \"2026-08-31T15:27:08+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.6.0\"\n---\n\n### 문서\n\n- **정책 엔진 탭에 페이지 둘을 더했습니다.** 저작 세트가 어떤 JSON 파일로 이루어지고 각 파일이\n  무엇을 드는지, 그리고 그 세트가 검증·정규화·채점을 지나 번들로 증명되는 과정입니다. 두 페이지\n  모두 상호작용 다이어그램을 싣습니다 — → [저작 세트](/policy/authoring/sources) ·\n  [컴파일과 채점](/policy/authoring/compilation)\n- **다이어그램 페이지가 이 본에도 실립니다.** 배포 토폴로지·서명 게이트·상태 머신·발행\n  워크플로우·코드 호출 경로·소스 구성까지 상호작용 뷰어 열두 장입니다 —\n  → [다이어그램](/policy/diagrams)\n", "kind": "참고 문서", "path": "_reference/changelog--v0-6-0.html", "reference": true}, {"title": "v0.7.0", "text": "---\ntitle: v0.7.0\ndate: \"2026-08-31T17:17:18+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.7.0\"\n---\n\n### 문서\n\n- **정책 엔진 탭에 「룰의 일생」 네 페이지가 생겼습니다.** 한 룰이 저작에서 평가까지 지나는 길의\n  상세 서사입니다 — [저작과 발행](/policy/authoring/workflow),\n  [산출물 해부](/policy/authoring/artifacts), [평가의 순간](/policy/runtime/evaluation),\n  [저장과 이동](/policy/runtime/storage). 실물 JSON 예시와 상호작용 다이어그램 네 장을 함께\n  실었습니다.\n- 저작 세트·컴파일과 채점·다이어그램·정책 엔진 개요 페이지에 새 페이지로 가는 길을 이었습니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v0-7-0.html", "reference": true}, {"title": "v0.8.0", "text": "---\ntitle: v0.8.0\ndate: \"2026-08-31T21:00:00+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.8.0\"\n---\n\n### 문서\n\n- **정책 엔진 탭을 질문 축의 네 섹션으로 재편했습니다** — 룰(`/policy/rule/*`) ·\n  저작과 발행(`/policy/authoring/*`) · 평가 런타임(`/policy/runtime/*`) ·\n  계약과 운영(`/policy/ops/*`). 열여섯 페이지의 URL이 움직였고 옛 주소는 전부 새 주소로\n  이동합니다. 「룰의 일생」 그룹은 해체되어 각 섹션에 들어갔습니다.\n- **모듈 결합(AND/OR)은 [결정과 결합](/policy/rule/decision)으로, 금액 리터럴 비교 규칙은\n  [룰 명세](/policy/rule/reference)로 옮겼습니다.** 번들 페이지는 번들과 발행 경로만 남습니다.\n- [평가의 순간](/policy/runtime/evaluation)의 조건 3치 서술을 기준 문서에 맞춰 정정했습니다 —\n  미지는 입력에 없는 PIP 소스를 가리켰을 때만 나오고, 요청의 빈 필드 비교는 거짓입니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v0-8-0.html", "reference": true}, {"title": "v0.8.1", "text": "---\ntitle: v0.8.1\ndate: \"2026-08-31T22:00:00+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.8.1\"\n---\n\n### 문서\n\n- 본문 기준 폰트를 한 단계 더 키웠습니다(17px → 18px). 단 폭이 같은 비율로 넓어져 줄당 글자\n  수는 그대로입니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v0-8-1.html", "reference": true}, {"title": "v0.9.0", "text": "---\ntitle: v0.9.0\ndate: \"2026-08-31T23:00:00+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"0.9.0\"\n---\n\n### 문서\n\n- **정책 탭에 유즈케이스 그룹을 새로 열었습니다.** 룰·스탬프의 형태가 어떤 런타임 흐름을\n  발동하는지를 다섯 편이 다룹니다 — 각 편에 상호작용 다이어그램이 붙습니다.\n  → [출금 화이트리스트](/policy/use-cases/whitelist-loop)\n  · [권한 상승 게이트](/policy/use-cases/escalation-pending)\n  · [금지선](/policy/use-cases/deny-override)\n  · [룰 변경 게이트](/policy/use-cases/rule-change)\n  · [서명 상한 대조](/policy/use-cases/callback-limit)\n", "kind": "참고 문서", "path": "_reference/changelog--v0-9-0.html", "reference": true}, {"title": "v1.0.0", "text": "---\ntitle: v1.0.0\ndate: \"2026-09-10T13:18:01+09:00\"\ntype: changelog\nchangelog:\n  category: 문서만\n  version: \"1.0.0\"\n---\n\n### 문서\n\n- **탭을 파트너사가 붙이는 기능 영역으로 다시 잘랐습니다.** 시작하기 · 계정과 지갑 · 자금 이동 · 정책 ·\n  API 레퍼런스 · 변경 이력 여섯입니다. 「핵심 개념」 탭은 「계정과 지갑」이 되었고, 시작하기의 제공\n  범위·에코시스템은 [홈](/)의 두 절로 들어갔습니다. 내부용 서술은 설계 기록 탭 하나로 모였고 그 탭은\n  private 본에만 실립니다.\n- **URL 이 전부 바뀌었고 리다이렉트는 두지 않습니다.** 옛 주소는 더 이상 응답하지 않습니다. 아래 대응표로\n  새 주소를 잡고, 옛 서술이 필요하면 헤더의 버전 스위처에서 v0 를 고릅니다. 이 표 밖의 라우트(자금 이동\n  각론·정책 룰·평가·유즈케이스·API 레퍼런스)는 그대로입니다.\n- **모든 서술 페이지를 설명형 문체로 다시 쓰고 tsp·DDL·코드와 대조해 정정했습니다.** 정정 내역과\n  대조에서 드러난 구현 결함은 이 항목의 아래 절과 설계 기록의 드리프트에 있습니다.\n- **Tenant 의 정의를 정정했습니다.** 「그 회사가 운영하는 서비스 하나」가 아니라 **Workspace 아래에서\n  Account 를 묶는 계정 체계 하나**입니다. 카카오페이의 유저 월렛과 비즈 월렛이 계정 체계 둘입니다.\n  [계정 계층](/accounts-wallets/accounts), [용어](/start/terminology), [표면과 인증](/start/authentication),\n  [첫 요청](/start/first-request) 네 페이지가 v0.5.0 부터 옛 정의를 적고 있었습니다.\n- **계정과 지갑 개요는 두 계층이 왜 있고 무슨 역할인지만 서술합니다.** 정의와 API 계약은 계층별 페이지가\n  갖습니다. 개요와 하위 페이지가 같은 정의를 각자 적던 자리를 정리했습니다. 홈의 「먼저 알아 둘 것」과\n  시작하기 개요도 소유 페이지 문장을 되풀이하지 않게 줄였습니다.\n- **함축 표현을 쓰지 않는 규칙을 문체 규칙에 넣고 58장을 다시 훑었습니다.** 「자산의 좌표」「격리 축」처럼\n  낱말 하나에 문장을 접어 넣은 말, 「담습니다」「걸립니다」「닫힙니다」 같은 은유 동사, 풀지 않은 한자어를\n  뜻 그대로 쓴 말로 바꿨습니다. 전수 조사에서 446건이 나왔고 그중 뜻이 하나인 낱말은 검사기가 잡습니다.\n  용어 페이지에 정족수, 값 이동, 저작 세트, 채점을 등재했습니다.\n- **사이드바를 절로 묶었습니다.** 자금 이동 탭은 이동 종류 아래에 「이동」(입금 · 집금 · 출금 · Vault 이체)과\n  「제어와 통지」(자금 동결 · 웹훅 · 주소록) 두 절로 나뉩니다. 정책 탭의 룰·평가와 설계 기록의 그룹 셋은\n  접이식에서 펼친 절로 바뀌어 열지 않고도 안이 보입니다. 주소는 하나도 바뀌지 않았습니다.\n- **드리프트 페이지를 색인과 상세 둘로 나눴습니다.** `/internal/status/drift` 는 항목 표가 되고 상세는\n  `/internal/status/drift-wallet` 과 `/internal/status/drift-policy` 에 있습니다. 셋 다 private 본에만 있습니다.\n- **문서 버전이 v1 입니다.** URL 계약이 통째로 바뀌어 major 를 올렸습니다. 문서 버전은 구현 성숙도가\n  아닙니다 — 계약 130개 중 34개가 아직 동작하지 않고, 어디까지 동작하는지는 설계 기록의 구현 대기와\n  알려진 제약이 답합니다.\n\n### 옛 라우트 → 새 라우트\n\n| 옛 | 새 |\n|---|---|\n| `/concepts` | [/accounts-wallets](/accounts-wallets) |\n| `/concepts/domain-model` | [/accounts-wallets/domain-model](/accounts-wallets/domain-model) |\n| `/concepts/accounts` | [/accounts-wallets/accounts](/accounts-wallets/accounts) |\n| `/concepts/wallets` | [/accounts-wallets/wallets](/accounts-wallets/wallets) |\n| `/concepts/catalog` | [/accounts-wallets/catalog](/accounts-wallets/catalog) |\n| `/fund-flows/onboarding` | [/accounts-wallets/onboarding](/accounts-wallets/onboarding) |\n| `/concepts/terminology` | [/start/terminology](/start/terminology) |\n| `/concepts/compliance` | [/start/compliance](/start/compliance) |\n| `/start/ecosystem` | [/ 「함께 제공하는 모듈」](/#함께-제공하는-모듈) |\n| `/start` 의 제공 범위 절 | [/ 「무엇을 맡고 무엇을 맡지 않나」](/#무엇을-맡고-무엇을-맡지-않나) |\n| `/policy/authoring/workflow` | [/policy/workflow](/policy/workflow) |\n| `/policy/ops/operations` | [/policy/operations](/policy/operations) |\n\n### private 로 이동해 protected 본에서 사라진 라우트\n\n설계 기록 탭(`/internal/*`)은 private 본에만 있습니다. 아래 아홉은 옛 주소가 protected 본에 있었거나\nprotected 본에서 읽을 수 있던 페이지입니다. 그중 앞의 넷은 이전부터 private 이었고, 뒤의 다섯은 이번에\n내부용으로 판정해 옮겼습니다 — 정책 엔진을 만드는 쪽의 서술이라 파트너사 통합에는 필요하지 않고,\n그 파이프라인은 [구조](/policy/architecture)와 [룰 저작과 발행](/policy/workflow)이 한 문단으로\n서술합니다.\n\n| 옛 | 새 (private) |\n|---|---|\n| `/concepts/identifiers` | `/internal/identifiers` |\n| `/start/known-limits` | `/internal/known-limits` |\n| `/policy/ops/internal-api` | `/internal/policy-internals/internal-api` |\n| `/policy/ops/handoff` | `/internal/policy-internals/handoff` |\n| `/policy/authoring/sources` | `/internal/policy-internals/sources` |\n| `/policy/authoring/artifacts` | `/internal/policy-internals/artifacts` |\n| `/policy/authoring/compilation` | `/internal/policy-internals/compilation` |\n| `/policy/authoring/bundles` | `/internal/policy-internals/bundles` |\n| `/policy/runtime/persistence` | `/internal/policy-internals/persistence` |\n\n설계 기록 안에서도 넷이 움직였습니다 — `/internal/{drift,conflicts,roadmap,implementation-review}` 와\n생성물 `/internal/pending` 은 `/internal/status/` 아래로 갔습니다.\n\n### v0 스냅샷\n\n재편 직전의 서술 88장이 `/v0/` 아래에 그대로 있습니다. 헤더의 버전 스위처에서 v0 를 고르면 옛 주소\n체계로 읽을 수 있습니다. API 레퍼런스는 스냅샷에 들어가지 않아 최신 버전만 있고, 스냅샷 안의\n레퍼런스 링크는 최신 레퍼런스로 나갑니다. 스냅샷은 한동안 유지하다 후속 릴리즈에서 지웁니다.\n\n### 옛 주소는 더 이상 응답하지 않습니다\n\n이전 발행분의 변경 이력 안에 옛 라우트로 가는 링크가 24건 있습니다. 발행된 기록은 소급해 고치지 않으므로\n그 링크는 404 로 남습니다. 필요한 페이지는 위 대응표로 찾습니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v1-0-0.html", "reference": true}, {"title": "v1.1.0", "text": "---\ntitle: v1.1.0\ndate: \"2026-09-11T13:54:41+09:00\"\ntype: changelog\nchangelog:\n  category: 계약 변경 포함\n  version: \"1.1.0\"\n---\n\n### 계약 변경\n\n- **자금 이동 상태에 `SETTLING`(정산 중)이 생겼습니다.** 온체인 완료가 확인됐고 Wallet SDK 안의 잔액\n  반영이 남은 구간입니다. vault 이체 조회 응답의 `status`에 `ON_CHAIN`과 `COMPLETED` 사이에 나타납니다.\n  상태 값을 열거로 엄격히 파싱하면 이 값을 더해야 합니다. 스윕·출금의 상태 목록에도 같은 값이\n  있지만 그 두 이동은 이 값을 내지 않습니다. → [Vault 이체](/fund-flows/vault-transfer)\n- **vault 이체의 완료 통지는 양쪽 vault 잔액이 반영된 뒤에 나갑니다.** 전에는 온체인 확정을 관측한\n  시점에 나갔습니다. 통지가 도착하면 목적지 vault의 가용 잔액은 이미 올라 있습니다.\n\n이 둘은 2026-09-10에 구현 브랜치 쪽에 먼저 들어가 v1.0.0 문서에 실리지 못했습니다. 이 릴리즈가\n문서로 나가는 첫 자리입니다.\n\n### 문서\n\n- **정책 탭을 「정책 쓰기」와 「엔진 내부 동작」 두 절로 갈랐습니다.** 위 절은 파트너사가 순서대로\n  읽는 다섯 쪽입니다. [서명 게이트](/policy/signing-gate) · [룰 쓰기](/policy/rules) ·\n  [예시 정책](/policy/examples) · [룰 저작과 발행](/policy/workflow) · [결과 읽기](/policy/results)입니다.\n  아래 절은 엔진을 만드는 사람의 페이지이고 룰·평가 그룹이 그 안에 들어갔습니다. 주소는 아래 한 건\n  말고 바뀐 것이 없습니다.\n- **룰이 참조할 수 있는 필드 표를 실었습니다.** [룰 쓰기](/policy/rules)의 요청 필드 표와 수집 필드\n  표는 손으로 쓴 것이 아니라 정책 컴파일러의 필드 카탈로그와 PIP 소스 등재에서 빌드마다 생성합니다.\n  그래서 카탈로그가 바뀌면 표가 함께 바뀝니다.\n- **예시 정책과 결과 읽기 페이지가 생겼습니다.** [예시 정책](/policy/examples)은 워크스페이스 시드의\n  실물 룰 셋을 원문 그대로 싣고 통과하는 요청과 거절되는 요청을 대조합니다. 지금 표현할 수 없는\n  것도 이유와 함께 적었습니다. [결과 읽기](/policy/results)는 정책 결정이 Wallet API의 출금 상태와\n  세부 상태, 집금·vault 이체의 에러 코드, Admin API의 승인 상태에 어떻게 나타나는지를 씁니다.\n- **룰 저작과 발행은 사람이 거치는 절차만 담습니다.** 해시 대조와 활성 포인터 전환 같은 발행 기제는\n  [저장과 이동](/policy/runtime/storage)으로 옮겼습니다.\n- **용어에 draft · revision · 기준선 · 내용 해시 · 정책 콘솔을 등재했습니다.**\n\n### 옛 라우트 → 새 라우트\n\n| 옛 | 새 |\n|---|---|\n| `/policy/rule/structure` | [/policy/rules](/policy/rules) |\n\n옛 주소는 응답하지 않습니다. 옛 서술은 헤더의 버전 스위처에서 v0를 고르면 볼 수 있습니다.\n", "kind": "참고 문서", "path": "_reference/changelog--v1-1-0.html", "reference": true}, {"title": "자금 이동", "text": "---\ntitle: 자금 이동\ndescription: 온보딩에서 주소록까지, 자금이 흐르는 경로\n---\n\n_읽는 사람: 파트너사 개발자. 자금이 들어오고 나가는 일곱 이동을 흐름마다 한 페이지씩 설명합니다._\n\n이 탭은 Wallet SDK 안에서 자금이 흐르는 경로를 다룹니다. 워크스페이스를 여는 온보딩에서 시작해\n입금과 집금, 출금, vault 이체가 어떻게 처리되는지를 흐름마다 한 페이지로 설명합니다. 목적지와\n발신처의 근거를 적어 두는 주소록이 마지막입니다.\n\n## 들어오는 자금과 나가는 자금은 다루는 방법이 갈립니다\n\n**입금은 동결로 도착합니다.** 주소를 공개하는 순간 누구든 그 주소로 보낼 수 있고, 받을지\n말지를 Wallet SDK가 고를 수 없기 때문입니다.\n\n동결은 입금을 확정 시 fail-closed로 잡아 두는 상태입니다. 그래서 모든 입금이 같은 문을 지나고,\n확정되면 기본 동결입니다.\n\n출금은 반대입니다. Wallet SDK가 서명하므로 실제로 막을 수 있고, 정책이 서명 앞에서 판단합니다.\n아래 페이지는 그 두 사실 위에 놓여 있습니다.\n\n## 다음으로\n\n- [온보딩](/accounts-wallets/onboarding) — 워크스페이스 개설에서 첫 정책 활성화까지\n- [이동 종류](/fund-flows/movements) — 대상 여섯과 그 사이에서 가능한 일곱 이동\n  - [입금](/fund-flows/deposit)
