<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Wallet SDK">
  <!-- 탭 아이콘은 16px 로 그려진다. 획을 얇게 두면 뭉개지므로 면으로만 구성하고,
       타일 여백을 좁혀 지갑이 차지하는 픽셀을 늘린다. -->
  <rect width="32" height="32" rx="6.5" fill="#0A0A0A"/>
  <!-- 지갑 몸통 -->
  <rect x="3.5" y="7.5" width="25" height="17" rx="4" fill="#FFCE31"/>
  <!-- 카드 주머니 — 오른쪽 변에 붙여 실루엣이 지갑으로 읽히게 한다 -->
  <path d="M18.5 12H28.5v8H18.5a4 4 0 0 1 0-8Z" fill="#0A0A0A"/>
  <!-- 잠금 단추 -->
  <circle cx="23.2" cy="16" r="2.1" fill="#FFCE31"/>
</svg>
