# gitleaks 설정 — 기본 룰 전체 유지 + 표적 allowlist 만 추가 (전역 [[allowlists]] + targetRules 방식).
# allowlist 는 "왜 오탐인지"가 파일 안에 설명된 경우에만, 파일 단위로 좁게 등재한다.
# 설정 변경 시 canary 로 양방향 검증한다 — 오탐 파일은 통과 + 실제 형태의 키(본문 64자 이상)는 검출.

[extend]
useDefault = true

# 테스트 전용 일회용 RSA 키 픽스처 — 매 실행 KeyPairGenerator 로 새로 생성하며 키 자료를 담지 않는다.
# PEM 경계 리터럴("-----BEGIN PRIVATE KEY-----")이 private-key 룰에 걸리는 오탐만 허용한다.
[[allowlists]]
targetRules = ["private-key"]
paths = [
    '''blockchain-manager-infra/client/src/test/kotlin/com/whatto/bcm/infra/client/fireblocks/fixture/TestRsaKeyFixture\.kt''',
]

# 공개 Wallet SDK 문서의 토큰 카탈로그 식별자 예제다. 인증용 API 키가 아니다.
# 원문과 아래에 명시한 참고 화면의 동일 예제만 허용해 문서 내용을 보존한다.
# 경로 AND 필드명·예제 값이 모두 일치해야 하며, 다른 값이나 인증키 필드는 계속 검사한다.
[[allowlists]]
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^tokenId"\s*:\s*"tok-1234567890abcdef"$''']
paths = [
    '''^docs/wallet-sdk/start/first-request\.md$''',
    '''^docs/wallet-sdk/reference/wallet/account-wallets/account-wallets-create/index\.html$''',
    '''^docs/wallet-sdk/llms-full\.txt$''',
    '''^docs/wallet-sdk/_reference/reference--wallet--account-wallets--account-wallets-create\.html$''',
    '''^docs/wallet-sdk/_reference/reference--wallet--account-wallets--account-wallets-get\.html$''',
    '''^docs/wallet-sdk/_reference/reference--wallet--account-wallets--account-wallets-list\.html$''',
    '''^docs/wallet-sdk/_reference/reference--wallet--deposits--deposits-get\.html$''',
    '''^docs/wallet-sdk/_reference/reference--wallet--deposits--deposits-list\.html$''',
    '''^docs/wallet-sdk/_reference/reference--wallet--sweeps--sweeps-create\.html$''',
    '''^docs/wallet-sdk/_reference/reference--wallet--sweeps--sweeps-get-by-reference-id\.html$''',
    '''^docs/wallet-sdk/_reference/reference--wallet--sweeps--sweeps-get\.html$''',
    '''^docs/wallet-sdk/_reference/reference--wallet--workspace-vault-transfers--workspace-vault-transfers-create\.html$''',
    '''^docs/wallet-sdk/_reference/reference--wallet--workspace-vault-transfers--workspace-vault-transfers-get-by-reference-id\.html$''',
    '''^docs/wallet-sdk/_reference/reference--wallet--workspace-vault-transfers--workspace-vault-transfers-get\.html$''',
    '''^docs/wallet-sdk/_reference/start--first-request\.html$''',
]

# 새 참고 화면의 curl 예제는 사용자가 교체할 YOUR_TOKEN/YOUR_API_KEY 자리표시자다.
# 탐지된 값 전체가 해당 문자열이고 아래 파일에 있을 때만 curl-auth-header 오탐을 허용한다.
# 실제 토큰·키와 다른 경로는 계속 검사한다.
[[allowlists]]
targetRules = ["curl-auth-header"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^(YOUR_TOKEN|YOUR_API_KEY)$''']
paths = [
    '''^docs/wallet-sdk/_reference/reference--admin--api-keys--api-keys-change-status\.html$''',
    '''^docs/wallet-sdk/_reference/reference--admin--api-keys--api-keys-create\.html$''',
